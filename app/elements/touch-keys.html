<!-- An on-screen keyboard for the kiosk, where no hardware keyboard is near.

     It types into the input or textarea named by `for` (an id): each key adds
     to the end of the value and sends `input`, as typing does. Enter submits
     an input's form, and starts a new line in a textarea. `enter` is the
     label of that key. Done sends `keys-done` (bubbling), and the owner hides
     the keyboard.

     The keys need no focus: a key is handled on pointerdown, and its default
     is prevented, so the input keeps the caret and the browser opens no
     keyboard of its own. -->

<script element>
  export const properties = {
    /** The id of the input or textarea to type into. */
    for: '',
    /** The label of the Enter key. */
    enter: 'Search',
  };

  export const state = {
    shift: false,
  };

  export const prototype = {
    connected({ signal }) {
      this.addEventListener('pointerdown', (event) => this.press(event), { signal });
    },

    /** @param {PointerEvent} event */
    press(event) {
      const key = event.target instanceof Element ? event.target.closest('[data-key]') : null;
      if (!(key instanceof HTMLElement)) return;
      event.preventDefault();
      const input = /** @type {HTMLInputElement | HTMLTextAreaElement | null} */ (document.getElementById(String(this.for)));
      if (!input) return;

      const name = key.dataset.key ?? '';
      if (name === 'shift') {
        this.shift = !this.shift;
        return;
      }
      if (name === 'done') {
        this.dispatchEvent(new Event('keys-done', { bubbles: true }));
        return;
      }
      if (name === 'enter' && !(input instanceof HTMLTextAreaElement)) {
        input.form?.requestSubmit();
        return;
      }
      if (name === 'back') input.value = input.value.slice(0, -1);
      else if (name === 'clear') input.value = '';
      else if (name === 'space') input.value += ' ';
      else if (name === 'enter') input.value += '\n';
      else input.value += this.shift ? name.toUpperCase() : name;
      if (this.shift && name.length === 1) this.shift = false;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    },
  };
</script>

<style>

    display: grid;
    gap: 0.25rem;
    padding: 0.5rem;
    border-top: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .keys__row {
    display: flex;
    gap: 0.25rem;
  }
  button {
    flex: 1;
    min-width: 0;
    min-height: 2.6rem;
    padding: 0;
    font: 0.9rem var(--sans);
  }
  :scope:state(shift) .keys__letters button {
    text-transform: uppercase;
  }
  .keys__wide {
    flex: 2;
  }
  .keys__space {
    flex: 4;
  }
</style>
