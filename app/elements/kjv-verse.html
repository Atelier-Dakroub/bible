<!-- One verse, from the records in app/data/kjv.

     Each run keeps its marks as classes: `add` for the words the translators
     supplied, `nd` for the divine name, `wj` for the words of Jesus. The page
     stylesheet draws them, so a card and a reading view can draw them
     differently.

     The runs carry tokens (data/bible.js withWords, which passage() applies), and each word is a span
     with data-w, its number in the verse, data-s, its Strong's number when it has one,
     data-e, the person, place or group it names, when it names one, and data-d
     in the parallel view, when the other translation does not share it.
     A dated event whose passage begins at the verse is a small purple mark
     after its number (data-entity, which the table opens). With the verse id in data-ref on
     the element, that is the word's address. The template is on one line
     inside each run, because a line break there would be a space in the text. -->

<script element>
  /** @typedef {{ text: string, marks: string[], tokens: { text: string, w: number, s: string | null, e: string | null, d: boolean }[] }} Run */
  /** @typedef {{ style: string, numbered?: boolean, runs: Run[] }} Block */

  // The page puts the verse id on the element as `data-ref`, so a selection
  // inside it can be traced back to its address.
  export const properties = {
    /** The number to print: the verse, or chapter and verse (`2:1`). */
    n: '',
    /** @type {Block[]} */
    blocks: [],
    /**
     * The dated events whose passages begin here, each a mark after the
     * verse number that opens the event and its tick on the timeline.
     *
     * @type {{ id: string, title: string, label: string }[]}
     */
    events: [],
    /**
     * Where a quotation begins here (data/quotations.js): `quotes` in the
     * New Testament, `quoted` in the Old, `both`, or ''. A mark in the
     * right margin lists the other side.
     */
    quotes: '',
  };
</script>

<style>
  :scope {
    display: block;
  }
</style>

<p each="block of blocks" class="verse__block verse__block--${block.style}">
  <sup if="block.numbered" class="verse__number">${n}</sup><template if="block.numbered && quotes"><button type="button" class="verse__quote" data-quotes="${quotes}" aria-label="${quotes === 'quoted' ? 'Quoted in the New Testament: where' : quotes === 'quotes' ? 'Quotes the Old Testament: what' : 'Quotes, and is quoted: where'}" title="${quotes === 'quoted' ? 'Quoted in the New Testament' : 'Quotes the Old Testament'}">“</button></template><template if="block.numbered"><button each="event of events" type="button" class="verse__event" data-entity="${event.id}" aria-label="${event.title}, ${event.label}: show it on the timeline" title="${event.title}, ${event.label}"></button></template>
  <span each="run of block.runs" class="${run.marks.join(' ')}"><template each="token of run.tokens"><span if="token.w" class="w" data-w="${token.w}" data-s="${token.s}" data-e="${token.e}" data-d="${token.d}">${token.text}</span><span else>${token.text}</span></template></span>
</p>
