<!-- An object on the table. One finger moves it. A second finger hands both
     to the table, which zooms (card-pinch), unless it marks words.

     Marking takes two hands. One finger holds the card still for a moment
     (HOLD_MS, within STILL_PX), and a second finger that then lands on a word
     marks words instead of turning the card: it runs from the word it landed
     on to the word it lifts from. Two fingers that land together, or a second
     finger that lands off the words, zoom the table. The card itself never
     turns or scales: it is always upright, at its own size.

     A marking finger that leaves the card draws a link instead: the marked
     words are one end, and wherever the finger lifts is the other. The table
     decides what the other end is.

     A group: Shift and a drag (a mouse or a pen), or one finger held still
     for GROUP_MS and then moved, moves the card and the cards linked to it.
     The card sends `card-group` as the group starts, moves and ends, and the
     table moves the others by as much (detail { phase, dx, dy }, the move in
     the parent's coordinates). A second finger ends the group, and zooms
     the table. A group does not snap.

     The link button in the card's header ([data-action="link"]) links the
     whole card: one finger or the mouse drags a line from it, and the card
     under the lift is the other end. A press that does not move is a click,
     and the table offers a list of the cards to link to.

     The card's position is a matrix in the coordinates of its offset parent,
     written as one CSS transform. The parent is the table's world, which the
     table scales by its zoom (its inline style scale), so a point on the
     screen is divided by the zoom on its way in. Nothing else about the card
     changes during a gesture, so a move costs a composite and no layout.

     The short form (data-form="short"), which the table sets from the card's
     Short form button: the heading, the opening words and the count of
     verses, in place of the verses. The content decides what each form
     shows; see .passage__short in global.css.

     Text mode: a double tap or a double-click on the words (READABLE) lets
     them select, as on a page, so that Copy copies them. In text mode a
     press on the words is the browser's, and the card moves from its header
     and its edges. A press off the card, or Escape, ends it. The first tap
     of the two does what a tap does.

     A mouse, a trackpad and a keyboard do the same. One button moves the card.
     A pinch on the trackpad, or Control and the wheel, zooms the table.
     Option (Alt) and a drag on the words marks them, the way the second hand
     does. A card takes the focus with Tab or a click, and then:
       arrow keys          move it (with Shift, further)
       Delete, Backspace   take it off the table (Undo brings it back)
       Enter               the same as a tap on its heading

     Snapping (app/lib/snap.js): while a hand or a mouse holds the card, it
     lines up with the other cards near their edges. It sends `card-guides` with
     { guides } in the parent's coordinates, so the table can draw where it
     lines up, and an empty list when it lets go. Command or Control held
     during a drag moves the card freely, and data-snap="off" on an ancestor
     turns snapping off. The wheel and the keys do not snap.

     Events, all bubbling:
       card-change  a gesture ended, so the position is worth keeping
       card-mark    a marking ended: detail { from, to }, two word addresses
       card-link-move  a link is being drawn: detail { span, x, y } from
                    words, { card, x, y } from the link button
       card-link    a link was drawn: the same detail, x and y on screen
                    (NaN when the browser cancelled it)
       card-group   a group drag: detail { phase: 'start' | 'move' | 'end',
                    dx, dy }, the card's move since the start
       card-paint   the card moved or changed form, so lines to it move too
       card-pinch   a second finger came down, and the table takes both:
                    detail { pointers: [{ id, x, y }, …] } (on the screen)
       card-tap     one finger touched and lifted without moving: detail
                    { target, x, y } (x and y on the screen; none from Enter)
       card-remove  the close button was pressed; the card removes itself next -->

<script element>
  import { multiply, toCSS, translation } from '../lib/affine.js';
  import { dropLost, step } from '../lib/gesture.js';
  import { inBsb, paintWords, span, wordAt } from '../lib/words.js';
  import { REACH, boxOf, snapBox } from '../lib/snap.js';

  /** @typedef {import('../lib/affine.js').Matrix} Matrix */
  /** @typedef {import('../lib/affine.js').Point} Point */

  export const properties = {
    /** Where the card starts, as a fraction of the parent's width. */
    x: 0.5,
    /** Where the card starts, as a fraction of the parent's height. */
    y: 0.5,
  };

  // How long, and how still, a finger holds a card before a second finger marks.
  const HOLD_MS = 200;
  const STILL_PX = 10;
  // How long one finger holds a card still before a drag moves its group.
  const GROUP_MS = 500;
  // A tap is short and still. Anything longer or further is a move.
  const TAP_MS = 350;
  // A second tap this soon after the first, and this near it, on the words
  // is a double tap: the card goes into text mode.
  const DOUBLE_MS = 400;
  const DOUBLE_PX = 24;
  // The words of a card that select in text mode. A note selects while it
  // is written, so it has no text mode.
  const READABLE = '.passage__text, .passage__original, .passage__interlinear, .passage__reverse, .passage__syntax, .passage__parallel, .commentary, .entity-card';
  // The keyboard's steps.
  const KEY_STEP = 20;
  const KEY_STEP_LONG = 100;
  // How long after the last wheel, gesture or key the change counts as done.
  const SETTLE_MS = 400;

  // Where a finger holds a card that it pulled out of a list: near the top left,
  // on the heading, so the card hangs from the finger like a sheet of paper.
  const GRIP = { x: 48, y: 32 };

  /**
   * A card with its grip on the point (x, y).
   *
   * @param {number} x
   * @param {number} y
   * @returns {Matrix}
   */
  const gripAt = (x, y) => translation(x - GRIP.x, y - GRIP.y);

  // The card touched last goes on top. One counter for every card on the page.
  let top = 1;

  /** @param {EventTarget | null} target the target, if it is an element */
  const elementOf = (target) => (target instanceof Element ? target : null);

  /**
   * Whether a press is a control's: a button on the card is pressed, not
   * dragged; in a note being written, a press places the caret or selects
   * words.
   *
   * @param {Element | null} target
   */
  const ownPress = (target) => Boolean(target?.closest('button, label, input, select, textarea, [contenteditable]:not([contenteditable="false"])'));

  /**
   * The word a marking moves on to, or null if it stays: no word, the same
   * one, or one of the other translation (beside the KJV, the BSB), as a
   * span stays in the one it began in.
   *
   * @param {{ anchor: string, current: string }} marking
   * @param {Element} under
   */
  function nextWord(marking, under) {
    const word = wordAt(under);
    return word && word !== marking.current && inBsb(word) === inBsb(marking.anchor) ? word : null;
  }

  /** @param {PointerEvent} event a mouse's other buttons do not move the card */
  const otherButton = (event) => event.pointerType === 'mouse' && event.button !== 0;

  /** @param {PointerEvent} event a mouse or a pen that moves with no button down is not holding the card */
  const heldUp = (event) => event.pointerType !== 'touch' && event.buttons === 0;

  /**
   * Whether a lift ends a tap: the same pointer, short and still.
   *
   * @param {{ id: number, t: number } | null} tap
   * @param {PointerEvent} event
   */
  const isTap = (tap, event) => tap?.id === event.pointerId && event.type === 'pointerup' && event.timeStamp - tap.t < TAP_MS;

  /**
   * Whether a point has moved from another by more than a still finger does.
   *
   * @param {{ x: number, y: number }} from
   * @param {PointerEvent} event
   */
  const movedFrom = (from, event) => Math.hypot(event.clientX - from.x, event.clientY - from.y) > STILL_PX;

  // A card that a finger holds goes above everything else on the page,
  // including a panel at the edge of the table, and comes down when it is let
  // go. A panel sits between the two levels.
  const HELD = 2000000;

  export const prototype = {
    /** @type {Matrix | null} */
    matrix: null,
    /** @type {Map<number, Point> | null} pointer id to position, in parent coordinates */
    points: null,
    /** @type {Point | null} the parent's corner on screen, read when a gesture starts */
    origin: null,
    /** the table's zoom, read when a gesture starts */
    factor: 1,
    frame: 0,
    /** @type {{ x: number, y: number, t: number } | null} where the holding finger last settled */
    still: null,
    /** @type {{ id: number, anchor: string, current: string, linking: boolean } | null} */
    marking: null,
    /** @type {{ id: number, x: number, y: number, t: number, target: EventTarget | null } | null} */
    tap: null,
    /** @type {{ x: number, y: number, t: number } | null} the last tap on the words, which a second may make a double tap */
    lastTap: null,
    /** @type {AbortController | null} text mode: its listeners on the page, which end it */
    reading: null,
    /** @type {{ id: number, x: number, y: number, dragging: boolean } | null} a line drawn from the link button */
    handle: null,
    /** whether the last press on the link button drew a line, so its click is not a click */
    dragged: false,
    /** @type {{ from: Matrix } | null} a group drag, from where the card was */
    group: null,
    groupTimer: 0,
    settleTimer: 0,
    /** @type {Matrix | null} what the fingers ask for, before the snap */
    raw: null,
    /** @type {import('../lib/snap.js').Box[] | null} the other cards, measured once per gesture */
    others: null,
    /** whether guides are on show */
    guiding: false,

    connected({ signal }) {
      signal.addEventListener('abort', () => {
        clearTimeout(this.groupTimer);
        this.stopReading();
      });
      const parent = this.parent();
      this.matrix = translation(
        Number(this.x) * parent.clientWidth - this.offsetWidth / 2,
        Number(this.y) * parent.clientHeight - this.offsetHeight / 2,
      );
      this.points = new Map();
      this.paint();

      this.addEventListener('pointerdown', (event) => this.press(event), { signal });
      this.addEventListener('pointermove', (event) => this.drag(event), { signal });
      this.addEventListener('pointerup', (event) => this.release(event), { signal });
      this.addEventListener('pointercancel', (event) => this.release(event), { signal });
      // A pointer the card lost (the browser took it, or the card moved in
      // the page) ends as if cancelled; one that lifted has gone already.
      this.addEventListener('lostpointercapture', (event) => this.release(event), { signal });
      this.addEventListener('click', (event) => this.act(event), { signal });
      this.addEventListener('click', (event) => this.swallow(event), { signal, capture: true });
      this.addEventListener('keydown', (event) => this.key(event), { signal });
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      // For a screen reader: a card, named by its heading, and the keys it
      // takes (the page's #card-keys, where it has one).
      if (!this.hasAttribute('role')) this.setAttribute('role', 'group');
      this.setAttribute('aria-roledescription', 'card');
      const heading = this.querySelector('.passage__heading, .rr-card__title, h2');
      if (heading) {
        heading.id ||= `card-heading-${Math.random().toString(36).slice(2, 9)}`;
        this.setAttribute('aria-labelledby', heading.id);
      }
      if (document.getElementById('card-keys')) this.setAttribute('aria-describedby', 'card-keys');
    },

    disconnected() {
      cancelAnimationFrame(this.frame);
      clearTimeout(this.settleTimer);
    },

    /**
     * Moves the card by `change`, a matrix in the parent's coordinates.
     *
     * @param {Matrix} change
     */
    transformBy(change) {
      this.matrix = multiply(change, /** @type {Matrix} */ (this.matrix));
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
      this.settle();
    },

    /** @param {Point} at screen coordinates */
    parentPoint(at) {
      const box = this.parent().getBoundingClientRect();
      const zoom = this.zoomOf();
      return { x: (at.x - box.left) / zoom, y: (at.y - box.top) / zoom };
    },

    /** The table's zoom: the scale of the parent, 1 where it has none. */
    zoomOf() {
      return Number.parseFloat(this.parent().style.scale) || 1;
    },

    /**
     * @param {number} dx
     * @param {number} dy
     */
    moveBy(dx, dy) {
      // A step of the keys is the same on the screen at any zoom.
      const zoom = this.zoomOf();
      this.transformBy(translation(dx / zoom, dy / zoom));
    },

    /** The middle of the card on the screen. */
    middle() {
      const box = this.getBoundingClientRect();
      return { x: box.left + box.width / 2, y: box.top + box.height / 2 };
    },

    /**
     * A change from a wheel, a trackpad or a key is done when nothing more
     * comes for a moment. Then the card rises and the table keeps it.
     */
    settle() {
      clearTimeout(this.settleTimer);
      this.settleTimer = setTimeout(() => {
        this.dispatchEvent(new CustomEvent('card-change', { bubbles: true }));
      }, SETTLE_MS);
    },

    /** @param {KeyboardEvent} event */
    key(event) {
      // Keys typed into a field on the card are the field's.
      if (event.target !== this || event.metaKey || event.ctrlKey) return;
      const act = this.keyActions(event.shiftKey)[event.key];
      if (!act) return;
      act();
      event.preventDefault();
    },

    /**
     * What each key does with the focus on the card: the arrows move it
     * (further with Shift), Enter opens its heading, and Delete takes it off
     * the table.
     *
     * @param {boolean} long
     * @returns {Record<string, () => void>}
     */
    keyActions(long) {
      const far = long ? KEY_STEP_LONG : KEY_STEP;
      const remove = () => {
        this.dispatchEvent(new CustomEvent('card-remove', { bubbles: true }));
        this.remove();
      };
      return {
        ArrowLeft: () => this.moveBy(-far, 0),
        ArrowRight: () => this.moveBy(far, 0),
        ArrowUp: () => this.moveBy(0, -far),
        ArrowDown: () => this.moveBy(0, far),
        Enter: () => this.dispatchEvent(new CustomEvent('card-tap', { bubbles: true, detail: { target: this.querySelector('.passage__heading') ?? this } })),
        Delete: remove,
        Backspace: remove,
      };
    },

    /** @returns {HTMLElement} */
    parent() {
      return /** @type {HTMLElement} */ (this.offsetParent ?? document.body);
    },

    /** @param {PointerEvent} event */
    press(event) {
      const target = elementOf(event.target);
      if (this.notMine(event, target) || this.reads(target)) return;
      this.forgetLost();
      if (this.marking || this.markFrom(event, target)) return;
      if (this.points?.size) {
        this.handOff(event);
        return;
      }
      this.tap = this.firstTap(event);
      this.take(event.pointerId, { x: event.clientX, y: event.clientY });
      this.armGroup(event);
    },

    /**
     * A second finger: the card lets go, and the table takes both fingers
     * to zoom. Where the first finger moved the card, it stays.
     *
     * @param {PointerEvent} event
     */
    handOff(event) {
      const points = /** @type {Map<number, Point>} */ (this.points);
      const origin = this.origin ?? { x: 0, y: 0 };
      const pointers = [...points].map(([id, at]) => ({ id, x: origin.x + at.x * this.factor, y: origin.y + at.y * this.factor }));
      pointers.push({ id: event.pointerId, x: event.clientX, y: event.clientY });
      points.clear();
      this.tap = null;
      this.still = null;
      this.letGo();
      this.dispatchEvent(new CustomEvent('card-pinch', { bubbles: true, detail: { pointers } }));
    },

    /**
     * Whether a press is not the card's to move it: the link button's, a
     * control's, or a mouse's other button.
     *
     * @param {PointerEvent} event
     * @param {Element | null} target
     */
    notMine(event, target) {
      return this.grabHandle(event, target) || ownPress(target) || otherButton(event);
    },

    /**
     * A press on the link button may draw a line from the card. The button
     * keeps the pointer, so the lift and the click come back to it.
     *
     * @param {PointerEvent} event
     * @param {Element | null} target
     */
    grabHandle(event, target) {
      const button = target?.closest('[data-action="link"]');
      if (!button || this.handle || otherButton(event)) return false;
      this.dragged = false;
      try {
        button.setPointerCapture(event.pointerId);
      } catch {
        return false;
      }
      this.handle = { id: event.pointerId, x: event.clientX, y: event.clientY, dragging: false };
      return true;
    },

    /**
     * Once the pointer leaves the place it pressed, the line follows it.
     *
     * @param {PointerEvent} event
     */
    moveHandle(event) {
      const handle = /** @type {{ x: number, y: number, dragging: boolean }} */ (this.handle);
      if (!handle.dragging && !movedFrom(handle, event)) return;
      handle.dragging = true;
      this.sendCardLink('card-link-move', event);
    },

    /**
     * @param {PointerEvent} event
     * @param {boolean} keep false when the browser cancelled the pointer
     */
    endHandle(event, keep) {
      const handle = /** @type {{ dragging: boolean }} */ (this.handle);
      this.handle = null;
      if (!handle.dragging) return;
      this.dragged = true;
      this.sendCardLink('card-link', keep ? event : null);
    },

    /**
     * @param {string} type
     * @param {PointerEvent | null} event
     */
    sendCardLink(type, event) {
      const detail = { card: this, x: event ? event.clientX : NaN, y: event ? event.clientY : NaN };
      this.dispatchEvent(new CustomEvent(type, { bubbles: true, detail }));
    },

    /**
     * The click after a line drawn from the link button is the end of the
     * drag, not a click: it does not open the list.
     *
     * @param {MouseEvent} event
     */
    swallow(event) {
      if (!this.dragged) return;
      this.dragged = false;
      if (!elementOf(event.target)?.closest('[data-action="link"]')) return;
      event.stopPropagation();
      event.preventDefault();
    },

    /**
     * A first finger with Shift starts a group; a finger (not a mouse) that
     * stays still GROUP_MS starts one too. A second finger ends it.
     *
     * @param {PointerEvent} event
     */
    armGroup(event) {
      clearTimeout(this.groupTimer);
      if (this.points?.size !== 1) this.endGroup();
      else if (event.shiftKey) this.startGroup();
      else if (event.pointerType !== 'mouse') this.groupTimer = setTimeout(() => this.holdGroup(), GROUP_MS);
    },

    /** Still held by one finger that has not moved: the group lifts. */
    holdGroup() {
      if (this.points?.size === 1 && this.tap && !this.marking) this.startGroup();
    },

    startGroup() {
      this.group = { from: /** @type {Matrix} */ (this.matrix) };
      this.sendGroup('start');
    },

    endGroup() {
      clearTimeout(this.groupTimer);
      if (!this.group) return;
      this.sendGroup('end');
      this.group = null;
    },

    /** The card moved: its group moves with it. */
    moveGroup() {
      if (this.group) this.sendGroup('move');
    },

    /** @param {'start' | 'move' | 'end'} phase */
    sendGroup(phase) {
      const from = /** @type {{ from: Matrix }} */ (this.group).from;
      const now = /** @type {Matrix} */ (this.matrix);
      this.dispatchEvent(new CustomEvent('card-group', { bubbles: true, detail: { phase, dx: now.e - from.e, dy: now.f - from.f } }));
    },

    /**
     * The first finger down might be a tap; a second finger means it is not.
     *
     * @param {PointerEvent} event
     */
    firstTap(event) {
      return this.points?.size === 0 ? { id: event.pointerId, x: event.clientX, y: event.clientY, t: event.timeStamp, target: event.target } : null;
    },

    /**
     * Starts marking words from the word pressed, when the card is held
     * (or Option is down); false if this press does not mark.
     *
     * @param {PointerEvent} event
     * @param {Element | null} target
     */
    markFrom(event, target) {
      const word = target ? wordAt(target) : null;
      if (!word || !(this.alone(event) || this.held(event.timeStamp))) return false;
      this.startMarking(event.pointerId, word);
      return true;
    },

    /**
     * A mouse or a pen has one point, so Option (Alt) stands in for the hand
     * that holds the card.
     *
     * @param {PointerEvent} event
     */
    alone(event) {
      return event.pointerType !== 'touch' && event.altKey && this.points?.size === 0;
    },

    /**
     * Forgets the pointers whose lift never reached the card (lib/gesture.js
     * dropLost), and a marking whose pointer is gone. If the card was held by
     * those alone, it is let go.
     *
     * @param {number} [keep] the pointer of the event being handled
     */
    forgetLost(keep) {
      const held = (/** @type {number} */ id) => this.holds(id);
      this.dropLostMarking(keep);
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (!dropLost(points, held, keep)) return;
      this.still = null;
      if (this.tap && !points.has(this.tap.id)) this.tap = null;
      if (points.size === 0) this.letGo();
    },

    /**
     * Whether the card still holds a pointer.
     *
     * @param {number} id
     */
    holds(id) {
      try {
        return this.hasPointerCapture(id);
      } catch {
        return false;
      }
    },

    /**
     * Forgets a marking whose pointer is gone.
     *
     * @param {number} [keep] the pointer of the event being handled
     */
    dropLostMarking(keep) {
      const marking = this.marking;
      if (!marking || marking.id === keep || this.holds(marking.id)) return;
      this.marking = null;
      this.paintMarking();
    },

    /**
     * True when exactly one finger holds the card and it has stayed still for
     * HOLD_MS. That finger is the hand that holds the page down.
     *
     * @param {number} now
     */
    held(now) {
      return this.points?.size === 1 && this.still !== null && now - this.still.t >= HOLD_MS;
    },

    /**
     * @param {number} pointerId
     * @param {string} word
     */
    startMarking(pointerId, word) {
      this.endGroup();
      try {
        this.setPointerCapture(pointerId);
      } catch {
        return;
      }
      this.marking = { id: pointerId, anchor: word, current: word, linking: false };
      this.paintMarking();
    },

    /** @param {PointerEvent} event */
    moveMarking(event) {
      const marking = /** @type {{ id: number, anchor: string, current: string, linking: boolean }} */ (this.marking);
      const under = document.elementFromPoint(event.clientX, event.clientY);
      // Once the finger leaves the card, the gesture is a link until it lifts.
      if (marking.linking || !this.contains(under)) {
        marking.linking = true;
        this.sendLink('card-link-move', event);
        return;
      }
      const word = nextWord(marking, /** @type {Element} */ (under));
      if (!word) return;
      marking.current = word;
      this.paintMarking();
    },

    /**
     * @param {PointerEvent} event
     * @param {boolean} keep false when the browser cancelled the pointer
     */
    endMarking(event, keep) {
      const marking = /** @type {{ id: number, anchor: string, current: string, linking: boolean }} */ (this.marking);
      if (marking.linking) {
        // A cancelled link ends at nowhere, which the table ignores.
        this.sendLink('card-link', keep ? event : null);
      } else if (keep) {
        const detail = span(marking.anchor, marking.current);
        this.dispatchEvent(new CustomEvent('card-mark', { bubbles: true, detail }));
      }
      this.marking = null;
      this.paintMarking();
    },

    /**
     * @param {string} type
     * @param {PointerEvent | null} event
     */
    sendLink(type, event) {
      const marking = /** @type {{ anchor: string, current: string }} */ (this.marking);
      const detail = {
        span: span(marking.anchor, marking.current),
        x: event ? event.clientX : NaN,
        y: event ? event.clientY : NaN,
      };
      this.dispatchEvent(new CustomEvent(type, { bubbles: true, detail }));
    },

    paintMarking() {
      const marking = this.marking;
      paintWords(this, marking ? [span(marking.anchor, marking.current)] : [], 'is-marking');
    },

    /**
     * Adds a pointer to the gesture. `at` is in screen coordinates.
     *
     * @param {number} pointerId
     * @param {Point} at
     */
    take(pointerId, at) {
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (points.size === 0) {
        const box = this.parent().getBoundingClientRect();
        this.origin = { x: box.left, y: box.top };
        this.factor = this.zoomOf();
        this.raw = this.matrix;
        this.others = null;
      }
      // The pointer can end before a card that was fetched for it arrives.
      try {
        this.setPointerCapture(pointerId);
      } catch {
        return;
      }
      points.set(pointerId, this.local(at));
      this.style.zIndex = String(HELD);
      this.classList.add('is-held');
      this.still = points.size === 1 ? { ...at, t: performance.now() } : null;
    },

    /**
     * Puts the card under a finger that is still down and hands the finger to
     * the card, so the drag goes on without a break.
     *
     * @param {number} pointerId
     * @param {Point} at screen coordinates
     */
    hold(pointerId, at) {
      const local = this.parentPoint(at);
      this.matrix = gripAt(local.x, local.y);
      this.paint();
      this.take(pointerId, at);
    },

    /**
     * Puts the card down with its grip on the point. The grip is near the
     * top, so a long passage hangs down from the point and its heading stays
     * on the screen.
     *
     * @param {Point} at screen coordinates
     */
    placeAt(at) {
      const local = this.parentPoint(at);
      this.matrix = gripAt(local.x, local.y);
      top += 1;
      this.style.zIndex = String(top);
      this.paint();
    },

    /** @param {Matrix} matrix */
    setMatrix(matrix) {
      this.matrix = matrix;
      this.paint();
    },

    /** @param {PointerEvent} event */
    drag(event) {
      if (this.handle?.id === event.pointerId) {
        this.moveHandle(event);
        return;
      }
      if (this.marking?.id === event.pointerId) {
        this.moveMarking(event);
        return;
      }
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (!points.has(event.pointerId)) return;
      // Whatever the card missed.
      if (heldUp(event)) {
        this.release(event);
        return;
      }
      this.forgetLost(event.pointerId);
      this.dropMovedTap(event);
      this.settleStill(event, points);
      const after = new Map(points);
      after.set(event.pointerId, this.local({ x: event.clientX, y: event.clientY }));
      this.moveTo(points, after, event);
    },

    /**
     * A tap that moves is not a tap.
     *
     * @param {PointerEvent} event
     */
    dropMovedTap(event) {
      if (!this.tap || !movedFrom(this.tap, event)) return;
      this.tap = null;
      // A finger that moves before the group lifts moves the card alone.
      clearTimeout(this.groupTimer);
    },

    /**
     * The holding finger settles again wherever it stops moving.
     *
     * @param {PointerEvent} event
     * @param {Map<number, Point>} points
     */
    settleStill(event, points) {
      const still = this.still;
      if (points.size === 1 && still && movedFrom(still, event)) this.still = { x: event.clientX, y: event.clientY, t: event.timeStamp };
    },

    /**
     * Moves the card as the finger moved, snapped unless Command or Control
     * is held.
     *
     * @param {Map<number, Point>} points
     * @param {Map<number, Point>} after
     * @param {PointerEvent} event
     */
    moveTo(points, after, event) {
      // One finger: a second hands both to the table (handOff).
      const raw = multiply(step(points, after), /** @type {Matrix} */ (this.raw ?? this.matrix));
      this.raw = raw;
      const snaps = this.snaps(event);
      this.matrix = snaps ? this.snapped(raw) : raw;
      if (!snaps) this.showGuides([]);
      this.points = after;
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
    },

    /** @param {PointerEvent} event */
    release(event) {
      if (this.handle?.id === event.pointerId) {
        this.endHandle(event, event.type === 'pointerup');
        return;
      }
      if (this.marking?.id === event.pointerId) {
        this.endMarking(event, event.type === 'pointerup');
        return;
      }
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (!points.delete(event.pointerId)) return;
      this.still = null;
      const tap = this.tap;
      this.tap = null;
      this.sendTap(tap, event);
      if (points.size > 0) return;
      this.letGo();
    },

    /**
     * Tells the table of a tap, if the lift ends one.
     *
     * @param {{ id: number, x: number, y: number, t: number, target: EventTarget | null } | null} tap
     * @param {PointerEvent} event
     */
    sendTap(tap, event) {
      if (!tap || !isTap(tap, event) || this.doubleTap(tap)) return;
      this.dispatchEvent(new CustomEvent('card-tap', { bubbles: true, detail: { target: tap.target, x: tap.x, y: tap.y } }));
    },

    /**
     * Whether a tap is the second of a double tap on the words. It puts the
     * card into text mode, and the table does not hear it: the first tap
     * did what a tap does.
     *
     * @param {{ x: number, y: number, t: number, target: EventTarget | null }} tap
     */
    doubleTap(tap) {
      const target = elementOf(tap.target);
      const onWords = Boolean(target?.closest(READABLE)) && this.dataset.kind !== 'note';
      const last = this.lastTap;
      this.lastTap = onWords ? { x: tap.x, y: tap.y, t: tap.t } : null;
      if (!onWords || !last || tap.t - last.t > DOUBLE_MS || Math.hypot(tap.x - last.x, tap.y - last.y) > DOUBLE_PX) return false;
      this.lastTap = null;
      this.startReading(/** @type {Element} */ (target));
      return true;
    },

    /**
     * Whether a press is on the words of a card in text mode: the browser
     * selects them, and the card does not move.
     *
     * @param {Element | null} target
     */
    reads(target) {
      return Boolean(this.reading && target?.closest(READABLE));
    },

    /**
     * Text mode: the words select as on a page, and Copy copies them. The
     * word tapped is selected. A press off the card, or Escape, ends it.
     *
     * @param {Element} target
     */
    startReading(target) {
      if (!this.reading) {
        this.reading = new AbortController();
        const { signal } = this.reading;
        this.dataset.reading = '';
        document.addEventListener('pointerdown', (event) => {
          if (!(event.target instanceof Node && this.contains(event.target))) this.stopReading();
        }, { signal, capture: true });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') this.stopReading();
        }, { signal });
      }
      const word = target.closest('[data-w], .inter__word');
      if (word) getSelection()?.selectAllChildren(word);
    },

    /** Ends text mode, and the selection in the card with it. */
    stopReading() {
      if (!this.reading) return;
      this.reading.abort();
      this.reading = null;
      delete this.dataset.reading;
      const selection = getSelection();
      if (selection?.anchorNode && this.contains(selection.anchorNode)) selection.removeAllRanges();
    },

    /** No pointer holds the card: it comes down, and the table keeps it. */
    letGo() {
      this.endGroup();
      this.classList.remove('is-held');
      this.raw = null;
      this.others = null;
      this.showGuides([]);
      top += 1;
      this.style.zIndex = String(top);
      this.dispatchEvent(new CustomEvent('card-change', { bubbles: true }));
    },

    /**
     * Whether this move snaps: not with Command or Control held, and not
     * where snapping is off.
     *
     * @param {PointerEvent} event
     */
    snaps(event) {
      return !this.group && !event.metaKey && !event.ctrlKey && !this.closest('[data-snap="off"]');
    },

    /**
     * The matrix to show for where the finger asks for.
     *
     * @param {Matrix} raw
     * @returns {Matrix}
     */
    snapped(raw) {
      this.others ??= this.otherBoxes();
      // The reach is on the screen: at half size, twice as far on the table.
      const { dx, dy, guides } = snapBox(boxOf(raw, this.offsetWidth, this.offsetHeight), this.others, REACH / this.factor);
      this.showGuides(guides);
      return { ...raw, e: raw.e + dx, f: raw.f + dy };
    },

    /** The boxes of the other cards beside this one. */
    otherBoxes() {
      return [...(this.parentElement?.children ?? [])].flatMap((element) => {
        const card = /** @type {HTMLElement & { matrix?: Matrix | null }} */ (element);
        if (card === this || card.localName !== 'gesture-card' || !card.matrix) return [];
        return [boxOf(card.matrix, card.offsetWidth, card.offsetHeight)];
      });
    },

    /** @param {import('../lib/snap.js').Guide[]} guides */
    showGuides(guides) {
      if (!guides.length && !this.guiding) return;
      this.guiding = guides.length > 0;
      this.dispatchEvent(new CustomEvent('card-guides', { bubbles: true, detail: { guides } }));
    },

    /** @param {MouseEvent} event */
    act(event) {
      const button = event.target instanceof Element ? event.target.closest('[data-action="close"]') : null;
      if (!button) return;
      this.dispatchEvent(new CustomEvent('card-remove', { bubbles: true }));
      this.remove();
    },

    /** @param {Point} at screen coordinates */
    local(at) {
      const origin = this.origin ?? { x: 0, y: 0 };
      return { x: (at.x - origin.x) / this.factor, y: (at.y - origin.y) / this.factor };
    },

    paint() {
      this.style.transform = toCSS(/** @type {Matrix} */ (this.matrix));
      this.moveGroup();
      this.dispatchEvent(new Event('card-paint', { bubbles: true }));
    },
  };
</script>

<style>
  :scope {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    transform-origin: 0 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  /* A card a hand or the mouse holds. */
  :scope.is-held {
    cursor: grabbing;
  }
  /* Text mode: the words select, as on a page. The header and the edges
     still move the card. A thin ring shows the mode. */
  :scope[data-reading] > .passage {
    outline: 1px dashed color-mix(in oklab, var(--lapis), transparent 40%);
    outline-offset: 3px;
  }
  :scope[data-reading] :is(.passage__text, .passage__original, .passage__interlinear, .passage__reverse, .passage__syntax, .passage__parallel, .commentary, .entity-card) {
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
    cursor: text;
  }
</style>

<slot></slot>
