<!-- The rail: one strip of tools on an edge of the screen, and the arranger
     of the panels it opens.

     The rail has, in order: Search, Timeline, Map, Books, Overview, Note,
     Undo, Redo, Tools, and Hide. Search, Timeline and Tools open and close
     their panels (passage-search, time-line, table-menu); Map and Books put
     their cards on the table or take them away; Overview shows the whole
     table, small (lib/overview.js); Note puts a new note down; Hide clears the
     screen of the rail and every panel, and leaves one small Show button on
     the rail's edge.

     The rail goes on any edge: a drag on its grip moves it to the edge
     nearest where the finger lets go, and a tap on the grip moves it to the
     next edge. The Tools panel has the same choice, and the chrome's size
     (small, medium, large), which scales the rail and the panels only, not
     the cards.

     A panel is docked beside the rail or floating (lib/chrome.js layout). A
     drag on a panel's grip pulls it off to float where the finger leaves it;
     a drag back onto the rail docks it. Each panel's float button does the
     same without a drag. The settings are kept in this browser, so each
     screen keeps its own.

     The rail arranges the panels whenever one opens, closes, or changes
     size, and when the window does. It sets each one's box as inline styles,
     with data-dock="docked" or "floating" for their own styles.

     A tap on the empty table folds the search panel to its field (fold), so
     the results do not cover the table when they are not wanted.

     It sends, bubbling: table-undo, table-redo, note-new, toggle-map,
     toggle-books, toggle-overview, and chrome-arrange when the panels have
     moved (the table draws its lines again). The table calls
     setHistory(canUndo, canRedo), setOverview(on),
     and freeBox() for the part of the screen free for cards. -->

<script element>
  import { EDGES, ZOOM, layout, loadSettings, nearestEdge, saveSettings } from '../lib/chrome.js';
  import { isPhone } from '../lib/screen.js';

  /** @typedef {import('../lib/chrome.js').Panel} Panel */
  /** @typedef {import('../lib/chrome.js').Settings} Settings */
  /** @typedef {{ search: any, strip: any, tools: any }} Panels the panels' elements, if they are there */
  /**
   * @typedef {{ width: number, height: number, gap: number, phone: boolean, edge: import('../lib/chrome.js').Edge,
   *   rail: { w: number, h: number }, safe: import('../lib/chrome.js').Insets }} Frame the screen the chrome is placed on
   */

  // The panels' widths, in rem at the chrome's medium size.
  const WIDTHS = { search: 26, tools: 30, timeline: 64 };
  const SELECTORS = { search: 'passage-search', timeline: 'time-line', tools: 'table-menu' };
  // How far a finger moves on a grip before it drags, in CSS pixels.
  const SLOP = 6;
  // A tap on the empty table: at most this far, and this long.
  const TAP_PX = 10;
  const TAP_MS = 400;
  const ROVE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End']);
  /** @type {Record<string, [number, number]>} */
  const GRIP_MOVES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  /** @param {EventTarget | null} target the target, if it is an element */
  const elementOf = (target) => (target instanceof Element ? target : null);

  /** @param {KeyboardEvent} event whether Option, Command or Control is held */
  const modified = (event) => event.altKey || event.metaKey || event.ctrlKey;

  /** @param {number} value @param {number} low @param {number} high */
  const clamp = (value, low, high) => Math.min(Math.max(low, value), high);

  /** @param {string} value a length in pixels, as a number (0 if none) */
  const px = (value) => parseFloat(value) || 0;

  /** @param {HTMLElement | null} element its height on the screen (0 if none) */
  const heightOf = (element) => element?.getBoundingClientRect().height ?? 0;

  /** @param {number} zoom a rem of the chrome, in pixels on the screen */
  const remOf = (zoom) => (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16) * zoom;

  /** @param {boolean} phone @param {string} edge the rail's edge: a phone's is the bottom */
  const railEdge = (phone, edge) => (phone ? 'bottom' : edge);

  /** @param {{ phone: boolean, edge: string }} frame whether the rail runs across the screen */
  const across = (frame) => frame.phone || frame.edge === 'top' || frame.edge === 'bottom';

  /**
   * Whether a pointer is on a box, or within a margin of it.
   *
   * @param {DOMRect} box
   * @param {PointerEvent} e
   * @param {number} margin
   */
  const near = (box, e, margin) => e.clientX >= box.left - margin && e.clientX <= box.right + margin && e.clientY >= box.top - margin && e.clientY <= box.bottom + margin;

  /**
   * The button the arrow keys move to from the one at `at`: the next or the
   * one before, around the ends; Home and End to the ends.
   *
   * @param {string} key
   * @param {number} at
   * @param {number} count
   */
  function roveIndex(key, at, count) {
    /** @type {Record<string, number>} */
    const ends = { Home: 0, End: count - 1 };
    const back = key === 'ArrowUp' || key === 'ArrowLeft';
    return ends[key] ?? (at + (back ? count - 1 : 1)) % count;
  }

  /** A hidden element padded by the safe-area insets, to read them. */
  function safeAreaProbe() {
    const probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:fixed;inset:0 auto auto 0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.append(probe);
    return probe;
  }

  /**
   * Gives a panel its width and lets its height follow its content, so that
   * height can be measured.
   *
   * @param {HTMLElement | null} element
   * @param {number} width in CSS pixels on the screen
   * @param {number} zoom
   */
  function freeHeight(element, width, zoom) {
    if (!element) return;
    element.style.width = `${width / zoom}px`;
    element.style.height = '';
  }

  /**
   * Each panel at the width of the first pass.
   *
   * @param {{ search: HTMLElement | null, strip: HTMLElement | null, tools: HTMLElement | null }} panels
   * @param {import('../lib/chrome.js').Layout} guess
   * @param {number} zoom
   */
  function sizePanels(panels, guess, zoom) {
    freeHeight(panels.search, guess.search?.w ?? 0, zoom);
    freeHeight(panels.strip, guess.timeline?.w ?? 0, zoom);
    freeHeight(panels.tools, guess.tools?.w ?? 0, zoom);
  }

  /**
   * Places a panel: docked or floating (its float button is pressed while
   * it floats), in its box.
   *
   * @param {HTMLElement} element
   * @param {import('../lib/chrome.js').Box | null} box
   * @param {boolean} floating
   * @param {number} zoom
   */
  function placePanel(element, box, floating, zoom) {
    element.dataset.dock = floating ? 'floating' : 'docked';
    element.querySelector('[data-chrome="float"]')?.setAttribute('aria-pressed', String(floating));
    if (box) putBox(element, box, zoom);
  }

  /**
   * @param {HTMLElement} element
   * @param {import('../lib/chrome.js').Box} box
   * @param {number} zoom
   */
  function putBox(element, box, zoom) {
    element.style.left = `${box.x / zoom}px`;
    element.style.top = `${box.y / zoom}px`;
    element.style.width = `${box.w / zoom}px`;
    element.style.height = box.h === null ? '' : `${box.h / zoom}px`;
  }

  export const state = {
    edge: 'left',
    size: 'm',
    cleared: false,
    canUndo: false,
    canRedo: false,
    search: false,
    timeline: false,
    tools: false,
    map: false,
    books: false,
    /** whether the table shows its overview */
    overview: false,
    /** the edge a dragged rail would go to, or '' */
    preview: '',
    /** true while a dragged panel is over the rail, where it would dock */
    docking: false,
  };

  export const prototype = {
    /** @type {Settings | null} */
    settings: null,
    frame: 0,
    /** @type {import('../lib/chrome.js').Layout | null} */
    last: null,
    /** @type {{ id: number, x: number, y: number, t: number } | null} */
    tap: null,

    connected({ signal }) {
      const settings = loadSettings();
      this.settings = settings;
      this.edge = settings.edge;
      this.size = settings.size;
      this.cleared = settings.hidden;
      const table = /** @type {HTMLElement} */ (this.parentElement);
      this.applyLook();

      this.addEventListener('click', (event) => this.act(event), { signal });
      this.addEventListener('pointerdown', (event) => this.railDown(event), { signal });
      // A toolbar is one stop for the Tab key; the arrow keys move along it
      // (focusgroup where the browser has it, else a roving tab index).
      if ('focusGroup' in HTMLElement.prototype) this.setAttribute('focusgroup', 'toolbar wrap');
      else {
        this.addEventListener('keydown', (event) => this.rove(event), { signal });
        this.addEventListener('focusin', (event) => this.roveTo(/** @type {Element} */ (event.target)), { signal });
        // The Tab key's stop: Search, or Show when the rail is hidden (its
        // other buttons are not shown then).
        queueMicrotask(() => this.roveTo(this.querySelector(this.cleared ? '[data-action="show"]' : '[data-action="search"]')));
      }
      // A panel's grip with the keys: the arrow keys move the panel.
      table.addEventListener('keydown', (event) => this.gripKey(event), { signal });

      // The panels' own buttons: grip, float and close.
      table.addEventListener('pointerdown', (event) => this.gripDown(event), { signal });
      table.addEventListener('click', (event) => this.chromeClick(event), { signal });

      // A tap on the empty table folds the search panel.
      table.addEventListener('pointerdown', (event) => {
        const world = table.querySelector('.table__world');
        if (event.target !== table && event.target !== world) return;
        this.tap = { id: event.pointerId, x: event.clientX, y: event.clientY, t: event.timeStamp };
      }, { signal });
      table.addEventListener('pointerup', (event) => {
        const tap = this.tap;
        this.tap = null;
        if (!tap || tap.id !== event.pointerId) return;
        if (Math.hypot(event.clientX - tap.x, event.clientY - tap.y) > TAP_PX || event.timeStamp - tap.t > TAP_MS) return;
        // After the table's palm guard has seen it: a palm does not fold.
        setTimeout(() => {
          if (!event.defaultPrevented) /** @type {any} */ (this.panel('search'))?.fold?.();
        });
      }, { signal });

      // Arrange whenever a panel or the window changes size.
      const watch = new ResizeObserver(() => this.arrangeSoon());
      watch.observe(this);
      customElements.whenDefined('passage-search').then(() => {
        for (const panel of /** @type {Panel[]} */ (['search', 'timeline', 'tools'])) {
          const element = this.panel(panel);
          if (element) watch.observe(element);
        }
        this.arrangeSoon();
      });
      addEventListener('resize', () => this.arrangeSoon(), { signal });
      table.addEventListener('panel-change', () => this.arrangeSoon(), { signal });

      // Map and Books are pressed while their cards are on the table.
      const world = table.querySelector('.table__world');
      const cards = new MutationObserver(() => this.markCards());
      if (world) cards.observe(world, { childList: true });
      this.markCards();

      return () => {
        watch.disconnect();
        cards.disconnect();
        cancelAnimationFrame(this.frame);
      };
    },

    /** @param {Panel} panel @returns {HTMLElement | null} */
    panel(panel) {
      return this.parentElement?.querySelector(SELECTORS[panel]) ?? null;
    },

    markCards() {
      const world = this.parentElement?.querySelector('.table__world');
      this.map = Boolean(world?.querySelector('gesture-card[data-address="map:near-east"]'));
      this.books = Boolean(world?.querySelector('gesture-card[data-address="landscape:books"]'));
    },

    /** The edge and the size on the table, for the styles. */
    applyLook() {
      const table = /** @type {HTMLElement} */ (this.parentElement);
      table.dataset.rail = isPhone() ? 'bottom' : this.edge;
      this.dataset.edge = table.dataset.rail;
      this.setAttribute('aria-orientation', table.dataset.rail === 'left' || table.dataset.rail === 'right' ? 'vertical' : 'horizontal');
      table.style.setProperty('--chrome-zoom', String(ZOOM[/** @type {keyof typeof ZOOM} */ (this.size)] ?? 1));
      table.toggleAttribute('data-chrome-hidden', this.cleared);
    },

    /** @param {MouseEvent} event */
    act(event) {
      const button = elementOf(event.target)?.closest('button');
      if (!(button instanceof HTMLButtonElement) || button.getAttribute('aria-disabled') === 'true') return;
      this.railActions()[button.dataset.action ?? '']?.();
      this.dragged = false;
    },

    /**
     * What each of the rail's buttons does. A tap on the grip moves the rail
     * to the next edge; a drag on it has moved the rail already.
     *
     * @returns {Record<string, () => void>}
     */
    railActions() {
      return {
        search: () => this.toggle('search'),
        timeline: () => this.toggle('timeline'),
        tools: () => this.toggle('tools'),
        map: () => this.send('toggle-map'),
        books: () => this.send('toggle-books'),
        overview: () => this.send('toggle-overview'),
        note: () => this.send('note-new'),
        undo: () => this.send('table-undo'),
        redo: () => this.send('table-redo'),
        hide: () => this.setHidden(true),
        show: () => this.setHidden(false),
        edge: () => {
          if (!this.dragged) this.setEdge(EDGES[(EDGES.indexOf(/** @type {any} */ (this.edge)) + 1) % EDGES.length]);
        },
      };
    },

    /**
     * A panel's own Float or Close button.
     *
     * @param {MouseEvent} event
     */
    chromeClick(event) {
      const button = elementOf(event.target)?.closest('[data-chrome]');
      if (!(button instanceof HTMLElement) || button.closest('table-rail')) return;
      const panel = /** @type {Panel} */ (button.dataset.panel);
      /** @type {Record<string, () => void>} */
      const actions = {
        float: () => this.setFloat(panel, this.settings?.float[panel] ? null : this.floatSpot(panel)),
        close: () => this.close(panel),
      };
      actions[button.dataset.chrome ?? '']?.();
    },

    /** whether the last press on the grip dragged the rail, so its click is not a tap */
    dragged: false,

    /**
     * Opens or closes a panel.
     *
     * @param {Panel} panel
     */
    toggle(panel) {
      const element = /** @type {any} */ (this.panel(panel));
      if (!element) return;
      if (panel === 'tools') element.setShown(!element.shown);
      else element.setCollapsed(!element.collapsed);
    },

    /** @param {Panel} panel */
    close(panel) {
      const element = /** @type {any} */ (this.panel(panel));
      if (!element) return;
      if (panel === 'tools') element.setShown(false);
      else element.setCollapsed(true);
      requestAnimationFrame(() => /** @type {HTMLElement | null} */ (this.querySelector(`[data-action="${panel}"]`))?.focus());
    },

    /** @param {string} type */
    send(type) {
      this.dispatchEvent(new CustomEvent(type, { bubbles: true, detail: {} }));
    },

    /** @param {boolean} canUndo @param {boolean} canRedo */
    setHistory(canUndo, canRedo) {
      this.canUndo = canUndo;
      this.canRedo = canRedo;
    },

    /** @param {boolean} on whether the table shows its overview */
    setOverview(on) {
      this.overview = on;
    },

    save() {
      if (this.settings) saveSettings(this.settings);
    },

    /** @param {string} edge */
    setEdge(edge) {
      if (!this.settings || !EDGES.includes(/** @type {any} */ (edge))) return;
      this.settings.edge = /** @type {any} */ (edge);
      this.edge = edge;
      this.save();
      this.applyLook();
      this.arrangeSoon();
      /** @type {any} */ (this.panel('tools'))?.setChrome?.(this.settings);
    },

    /** @param {string} size */
    setSize(size) {
      if (!this.settings || !(size in ZOOM)) return;
      this.settings.size = /** @type {any} */ (size);
      this.size = size;
      this.save();
      this.applyLook();
      this.arrangeSoon();
      /** @type {any} */ (this.panel('tools'))?.setChrome?.(this.settings);
    },

    /** @param {boolean} hidden */
    setHidden(hidden) {
      if (!this.settings) return;
      this.settings.hidden = hidden;
      this.cleared = hidden;
      this.save();
      this.applyLook();
      this.arrangeSoon();
      requestAnimationFrame(() => /** @type {HTMLElement | null} */ (this.querySelector(hidden ? '[data-action="show"]' : '[data-action="hide"]'))?.focus());
    },

    /**
     * Docks a panel (null) or floats it at a point.
     *
     * @param {Panel} panel
     * @param {{ x: number, y: number } | null} at
     */
    setFloat(panel, at, quiet = false) {
      if (!this.settings) return;
      const was = this.settings.float[panel];
      this.settings.float[panel] = at;
      this.save();
      this.arrangeSoon();
      // Said to a screen reader, and shown: docked, or floating.
      const name = { search: 'The search panel', timeline: 'The timeline', tools: 'The tools panel' }[panel];
      if (!quiet && Boolean(was) !== Boolean(at)) /** @type {any} */ (this.parentElement)?.toast?.(at ? `${name} floats. Drag it onto the rail to dock it.` : `${name} is docked.`);
    },

    /**
     * The arrow keys along the rail; Home and End to its ends.
     *
     * @param {KeyboardEvent} event
     */
    rove(event) {
      if (!ROVE_KEYS.has(event.key) || modified(event)) return;
      const buttons = this.visibleButtons();
      const at = buttons.indexOf(/** @type {HTMLElement} */ (document.activeElement));
      if (at < 0) return;
      event.preventDefault();
      buttons[roveIndex(event.key, at, buttons.length)].focus();
    },

    /** The rail's buttons on show. */
    visibleButtons() {
      return /** @type {HTMLElement[]} */ ([...this.querySelectorAll('button')]).filter((each) => each.checkVisibility?.() ?? each.offsetParent !== null);
    },

    /** The one button the Tab key stops at: the last one with the focus. @param {Element | null} target */
    roveTo(target) {
      const button = target?.closest?.('button');
      if (!(button instanceof HTMLButtonElement) || !this.contains(button)) return;
      for (const each of this.querySelectorAll('button')) /** @type {HTMLElement} */ (each).tabIndex = each === button ? 0 : -1;
    },

    /**
     * The arrow keys on a panel's grip move the panel, 16px a press, 64px
     * with Shift; a docked panel floats where it is first.
     *
     * @param {KeyboardEvent} event
     */
    gripKey(event) {
      const target = this.gripTarget(event);
      const settings = this.settings;
      if (!target || !settings) return;
      event.preventDefault();
      this.nudge(target.grip, target.move, event.shiftKey ? 64 : 16, settings);
    },

    /**
     * The grip an arrow key is pressed on, and the way it moves; null if it
     * is not one (or on a phone, where the panels do not float).
     *
     * @param {KeyboardEvent} event
     */
    gripTarget(event) {
      const grip = elementOf(event.target)?.closest('[data-grip]');
      const move = GRIP_MOVES[event.key];
      return grip instanceof HTMLElement && move && !isPhone() ? { grip, move } : null;
    },

    /**
     * Moves a panel by a step, kept on the screen; a docked panel floats
     * where it is first.
     *
     * @param {HTMLElement} grip
     * @param {[number, number]} move
     * @param {number} step
     * @param {Settings} settings
     */
    nudge(grip, move, step, settings) {
      const panel = /** @type {Panel} */ (grip.dataset.grip);
      const box = this.panel(panel)?.getBoundingClientRect();
      if (!box) return;
      const from = settings.float[panel] ?? { x: box.left, y: box.top };
      const to = {
        x: Math.round(clamp(from.x + move[0] * step, 0, innerWidth - box.width)),
        y: Math.round(clamp(from.y + move[1] * step, 0, innerHeight - 40)),
      };
      this.setFloat(panel, to, Boolean(settings.float[panel]));
      requestAnimationFrame(() => grip.focus());
    },

    /**
     * Where a panel floats when its float button is pressed: a little way
     * into the free part of the screen.
     *
     * @param {Panel} panel
     */
    floatSpot(panel) {
      const free = this.last?.free ?? { left: 0, top: 0 };
      const box = this.panel(panel)?.getBoundingClientRect();
      return { x: Math.round(free.left + 48), y: Math.round(panel === 'timeline' ? innerHeight - (box?.height ?? 200) - 96 : free.top + 48) };
    },

    /** The part of the screen that the rail and the docked panels leave free. */
    freeBox() {
      const free = this.last?.free ?? { left: 0, top: 0, right: innerWidth, bottom: innerHeight };
      return this.cleared ? { left: 0, top: 0, right: innerWidth, bottom: innerHeight } : free;
    },

    /** @type {HTMLElement | null} a hidden element padded by the safe-area insets */
    probe: null,

    /**
     * The screen's safe-area insets, in CSS pixels: what a phone's notch,
     * its rounded corners and its home bar take (0 elsewhere).
     *
     * @returns {import('../lib/chrome.js').Insets}
     */
    insets() {
      this.probe ??= safeAreaProbe();
      const style = getComputedStyle(this.probe);
      return { top: px(style.paddingTop), right: px(style.paddingRight), bottom: px(style.paddingBottom), left: px(style.paddingLeft) };
    },

    arrangeSoon() {
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.arrange());
    },

    /**
     * Places the rail and the open panels (lib/chrome.js layout), measuring
     * each one's own size first.
     */
    arrange() {
      const settings = this.settings;
      const table = /** @type {HTMLElement | null} */ (this.parentElement);
      if (!settings || !table) return;
      const zoom = ZOOM[settings.size] ?? 1;
      const rem = remOf(zoom);
      const panels = this.openPanels();
      const frame = this.frameOf(table, settings, rem);
      // A first pass at the widths, so the heights can be measured at them.
      const guess = layout(this.request(frame, settings, panels, rem, () => 0, { x: 0, y: 0 }));
      sizePanels(panels, guess, zoom);
      const placed = layout(this.request(frame, settings, panels, rem, heightOf, this.toolsAnchor()));
      this.last = placed;
      this.placeRail(table, frame, placed, zoom);
      this.placePanels(panels, placed, settings, zoom);
      this.dispatchEvent(new Event('chrome-arrange', { bubbles: true }));
    },

    /**
     * The panels, and which of them are open.
     *
     * @returns {Panels}
     */
    openPanels() {
      const search = /** @type {any} */ (this.panel('search'));
      const strip = /** @type {any} */ (this.panel('timeline'));
      const tools = /** @type {any} */ (this.panel('tools'));
      this.search = Boolean(search && !search.collapsed);
      this.timeline = Boolean(strip && !strip.collapsed);
      this.tools = Boolean(tools?.shown);
      return { search, strip, tools };
    },

    /**
     * The screen the chrome is placed on: its size, the gap, the safe area,
     * and the rail's own size. The table's own height (100lvh): on a phone
     * it runs down behind the browser's bottom bar, which the chrome treats
     * as an inset. Hidden, the rail is its Show button alone, as large as the
     * button.
     *
     * @param {HTMLElement} table
     * @param {Settings} settings
     * @param {number} rem
     * @returns {Frame}
     */
    frameOf(table, settings, rem) {
      const height = Math.max(innerHeight, Math.round(table.getBoundingClientRect().height));
      const safe = this.insets();
      // A phone's rail runs on down behind the browser's bottom bar and the
      // home bar to the screen's edge, and pads itself clear of them
      // (--below): its height is measured without that.
      const phone = isPhone();
      const below = height - innerHeight;
      this.style.setProperty('--below', `${phone ? below : 0}px`);
      const home = phone ? safe.bottom + below : 0;
      safe.bottom += below;
      if (this.cleared) this.style.width = '';
      const railBox = this.getBoundingClientRect();
      return { width: innerWidth, height, gap: Math.round(0.5 * rem), phone, edge: settings.edge, rail: { w: railBox.width, h: railBox.height - home }, safe };
    },

    /**
     * What lib/chrome.js layout is asked: the screen, and each panel's
     * width and height.
     *
     * @param {Frame} frame
     * @param {Settings} settings
     * @param {Panels} panels
     * @param {number} rem
     * @param {(element: HTMLElement | null) => number} height
     * @param {{ x: number, y: number }} anchor where the Tools panel points
     */
    request(frame, settings, panels, rem, height, anchor) {
      const { float } = settings;
      return {
        ...frame,
        search: { open: this.search, float: float.search, expanded: Boolean(panels.search?.expanded), w: WIDTHS.search * rem, h: height(panels.search) },
        timeline: { open: this.timeline, float: float.timeline, w: Math.min(WIDTHS.timeline * rem, frame.width * 0.9), h: height(panels.strip) },
        tools: { open: this.tools, float: float.tools, w: WIDTHS.tools * rem, h: height(panels.tools), anchor },
      };
    },

    /** Where the Tools panel points: the middle of the top of its button. */
    toolsAnchor() {
      const box = this.querySelector('[data-action="tools"]')?.getBoundingClientRect();
      return box ? { x: box.left + box.width / 2, y: box.top } : { x: 0, y: 0 };
    },

    /**
     * Places the rail. Hidden: the Show button in the end corner of a rail
     * across the top or the bottom (a phone's too), where a thumb finds it;
     * at the top of a rail on the left or the right, where the rail began.
     *
     * @param {HTMLElement} table
     * @param {Frame} frame
     * @param {import('../lib/chrome.js').Layout} placed
     * @param {number} zoom
     */
    placeRail(table, frame, placed, zoom) {
      table.dataset.rail = railEdge(frame.phone, frame.edge);
      this.dataset.edge = table.dataset.rail;
      const x = this.cleared && across(frame) ? frame.width - frame.safe.right - frame.gap - frame.rail.w : placed.rail.x;
      this.style.left = `${x / zoom}px`;
      this.style.top = `${placed.rail.y / zoom}px`;
      this.style.width = frame.phone && !this.cleared ? `${placed.rail.w / zoom}px` : '';
    },

    /**
     * Places each panel, docked or floating.
     *
     * @param {Panels} panels
     * @param {import('../lib/chrome.js').Layout} placed
     * @param {Settings} settings
     * @param {number} zoom
     */
    placePanels(panels, placed, settings, zoom) {
      const phone = isPhone();
      /** @type {[Panel, HTMLElement | null, import('../lib/chrome.js').Box | null][]} */
      const parts = [['search', panels.search, placed.search], ['timeline', panels.strip, placed.timeline], ['tools', panels.tools, placed.tools]];
      for (const [panel, element, box] of parts) {
        if (element) placePanel(element, box, !phone && Boolean(settings.float[panel]), zoom);
      }
    },

    /**
     * A press on the rail's grip: a drag moves the rail to the edge nearest
     * where it ends.
     *
     * @param {PointerEvent} event
     */
    railDown(event) {
      const grip = event.target instanceof Element ? event.target.closest('[data-action="edge"]') : null;
      // The main button only: a right click opens no drag.
      if (!(grip instanceof HTMLElement) || isPhone() || event.button !== 0) return;
      const start = { x: event.clientX, y: event.clientY };
      grip.setPointerCapture(event.pointerId);
      let moving = false;
      this.dragged = false;
      const move = (/** @type {PointerEvent} */ e) => {
        if (!moving && Math.hypot(e.clientX - start.x, e.clientY - start.y) < SLOP) return;
        moving = true;
        this.dragged = true;
        this.preview = nearestEdge({ x: e.clientX, y: e.clientY }, innerWidth, innerHeight);
      };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        if (moving && this.preview) this.setEdge(this.preview);
        this.preview = '';
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    },

    /**
     * A press on a panel's grip: a drag pulls the panel off to float, and
     * over the rail docks it again.
     *
     * @param {PointerEvent} event
     */
    gripDown(event) {
      const pressed = this.pressedGrip(event);
      const settings = this.settings;
      if (!pressed || !settings) return;
      event.preventDefault();
      event.stopPropagation();
      this.dragPanel(pressed, event, ZOOM[settings.size] ?? 1);
    },

    /**
     * The grip a main-button press is on, its panel and the panel's
     * element; null if it is not one (or on a phone, where the panels do not
     * float).
     *
     * @param {PointerEvent} event
     */
    pressedGrip(event) {
      const grip = elementOf(event.target)?.closest('[data-grip]');
      if (!(grip instanceof HTMLElement) || isPhone() || event.button !== 0) return null;
      const panel = /** @type {Panel} */ (grip.dataset.grip);
      const element = this.panel(panel);
      return element ? { grip, panel, element } : null;
    },

    /**
     * Drags a panel by its grip: it floats where the pointer leaves it, and
     * docks again over the rail.
     *
     * @param {{ grip: HTMLElement, panel: Panel, element: HTMLElement }} pressed
     * @param {PointerEvent} event
     * @param {number} zoom
     */
    dragPanel({ grip, panel, element }, event, zoom) {
      const box = element.getBoundingClientRect();
      const start = { x: event.clientX, y: event.clientY };
      const offset = { x: event.clientX - box.left, y: event.clientY - box.top };
      grip.setPointerCapture(event.pointerId);
      let moving = false;
      // The rail does not move during the drag: its box is read once.
      const railBox = this.getBoundingClientRect();
      const overRail = (/** @type {PointerEvent} */ e) => near(railBox, e, 24);
      const move = (/** @type {PointerEvent} */ e) => {
        if (!moving && Math.hypot(e.clientX - start.x, e.clientY - start.y) < SLOP) return;
        moving = true;
        element.dataset.dock = 'floating';
        element.classList.add('is-dragged');
        element.style.left = `${(e.clientX - offset.x) / zoom}px`;
        element.style.top = `${(e.clientY - offset.y) / zoom}px`;
        this.docking = overRail(e);
      };
      const up = (/** @type {PointerEvent} */ e) => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        element.classList.remove('is-dragged');
        this.docking = false;
        if (!moving) return;
        this.setFloat(panel, overRail(e) ? null : { x: Math.round(e.clientX - offset.x), y: Math.round(e.clientY - offset.y) });
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    },
  };
</script>

<style>
  :scope {
    position: absolute;
    /* With the panels: over the cards at rest and the lines, under a held
       card. */
    z-index: 1000001;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.3rem;
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 2px 12px var(--shade-far);
    zoom: var(--chrome-zoom, 1);
    font: var(--control-font);
  }
  :scope:is([data-edge='top'], [data-edge='bottom']) {
    flex-direction: row;
  }
  .rail__button {
    display: grid;
    justify-items: center;
    gap: 0.1rem;
    min-width: 3.4rem;
    min-height: 3.1rem;
    padding: 0.3rem 0.2rem 0.25rem;
    border: 0;
    border-radius: var(--radius-small);
    background: transparent;
    color: var(--ink);
    font: 500 max(0.5rem, 10px)/1.1 var(--sans);
    cursor: pointer;
  }
  .rail__button svg-icon {
    font-size: 1.35rem;
  }
  @media (hover: hover) {
    .rail__button:hover {
      background: var(--tint);
    }
  }
  /* Undo and Redo with nothing to undo: dim, but still in the arrow keys'
     order (aria-disabled, not disabled). */
  .rail__button[aria-disabled='true'] {
    color: var(--muted);
    opacity: 0.55;
    cursor: default;
  }
  @media (hover: hover) {
    .rail__button[aria-disabled='true']:hover {
      background: transparent;
    }
  }
  /* An open panel's button, and a card that is on the table: lapis. */
  .rail__button:is([aria-expanded='true'], [aria-pressed='true']) {
    background: var(--lapis);
    color: var(--on-pigment);
  }
  .rail__rule {
    flex: none;
    align-self: stretch;
    margin: 0.2rem 0.4rem;
    border: 0;
    border-top: 1px solid var(--line);
  }
  :scope:is([data-edge='top'], [data-edge='bottom']) .rail__rule {
    margin: 0.4rem 0.2rem;
    border-top: 0;
    border-left: 1px solid var(--line);
  }
  /* At least 24px after the S size's zoom (0.8). */
  .rail__grip {
    min-height: max(1.6rem, calc(1.5rem / var(--chrome-zoom, 1)));
    color: var(--muted);
    cursor: grab;
    touch-action: none;
  }
  :scope:is([data-edge='top'], [data-edge='bottom']) .rail__grip {
    min-width: max(1.6rem, calc(1.5rem / var(--chrome-zoom, 1)));
  }
  /* A panel dragged over the rail would dock: the rail says so. */
  :scope:state(docking) {
    outline: 3px solid var(--lapis);
    outline-offset: 2px;
  }
  /* The edge a dragged rail would go to. */
  .rail__preview {
    position: fixed;
    z-index: -1;
    background: color-mix(in srgb, var(--lapis) 18%, transparent);
    pointer-events: none;
  }
  .rail__preview[hidden] {
    display: none;
  }
  .rail__preview[data-edge='left'] { inset: 0 auto 0 0; width: 6rem; }
  .rail__preview[data-edge='right'] { inset: 0 0 0 auto; width: 6rem; }
  .rail__preview[data-edge='top'] { inset: 0 0 auto 0; height: 6rem; }
  .rail__preview[data-edge='bottom'] { inset: auto 0 0 0; height: 6rem; }
  /* Hidden: the rail is one Show button. */
  :scope:state(cleared) > :not(.rail__show),
  :scope:not(:state(cleared)) .rail__show {
    display: none;
  }
  :scope:state(cleared) {
    padding: 0.15rem;
    opacity: 0.85;
  }
  /* The Show button: a round button of its own, not a bar. */
  :scope:state(cleared) .rail__show {
    flex: none;
    place-content: center;
    min-width: 3rem;
    min-height: 3rem;
    padding: 0;
    border-radius: 50%;
  }
  :scope:state(cleared) {
    border-radius: 999px;
  }
  /* On a phone: the rail is the width of the screen at the bottom, its
     buttons share it, and they show their icons only. */
  @media (max-width: 700px), (max-height: 500px) {
    /* On the screen's bottom edge, its whole width, as a phone's own tab
       bar (lib/chrome.js places it). It runs on behind the browser's bottom
       bar, so no table shows around that bar; its padding keeps the buttons
       clear of the bar, of the home bar and, in landscape, of the notch. */
    :scope {
      flex-direction: row;
      justify-content: space-between;
      box-sizing: border-box;
      padding-bottom: calc(0.3rem + (env(safe-area-inset-bottom, 0px) + var(--below, 0px)) / var(--chrome-zoom, 1));
      padding-left: calc(0.3rem + env(safe-area-inset-left, 0px) / var(--chrome-zoom, 1));
      padding-right: calc(0.3rem + env(safe-area-inset-right, 0px) / var(--chrome-zoom, 1));
      border-width: 1px 0 0;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -2px 12px var(--shade-far);
    }
    /* Icons only: each in the middle of its button's height. */
    .rail__button {
      min-width: 0;
      flex: 1;
      align-content: center;
    }
    .rail__grip,
    .rail__rule {
      display: none;
    }
    /* The names stay for a screen reader (as .visually-hidden). */
    .rail__label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  }
</style>

<div class="rail__preview" data-edge="${preview}" hidden="${!preview}"></div>
<button type="button" class="rail__button rail__grip" data-action="edge" aria-label="Move the tools to the next edge of the screen" title="Drag to an edge of the screen, or tap for the next edge"><svg-icon library="ui" name="grip"></svg-icon></button>
<button type="button" class="rail__button" data-action="search" aria-expanded="${search ? 'true' : 'false'}" aria-keyshortcuts="/"><svg-icon library="ui" name="search"></svg-icon><span class="rail__label">Search</span></button>
<button type="button" class="rail__button" data-action="timeline" aria-expanded="${timeline ? 'true' : 'false'}"><svg-icon library="ui" name="timeline"></svg-icon><span class="rail__label">Timeline</span></button>
<button type="button" class="rail__button" data-action="map" aria-pressed="${map ? 'true' : 'false'}"><svg-icon library="ui" name="map"></svg-icon><span class="rail__label">Map</span></button>
<button type="button" class="rail__button" data-action="books" aria-pressed="${books ? 'true' : 'false'}" title="The books compared"><svg-icon library="ui" name="books"></svg-icon><span class="rail__label">Books</span></button>
<button type="button" class="rail__button" data-action="overview" aria-pressed="${overview ? 'true' : 'false'}" aria-keyshortcuts="O" title="The whole table, small"><svg-icon library="ui" name="overview"></svg-icon><span class="rail__label">Overview</span></button>
<hr class="rail__rule" />
<button type="button" class="rail__button" data-action="note"><svg-icon library="ui" name="note"></svg-icon><span class="rail__label">Note</span></button>
<button type="button" class="rail__button" data-action="undo" aria-disabled="${canUndo ? 'false' : 'true'}" aria-keyshortcuts="Control+Z Meta+Z"><svg-icon library="ui" name="undo"></svg-icon><span class="rail__label">Undo</span></button>
<button type="button" class="rail__button" data-action="redo" aria-disabled="${canRedo ? 'false' : 'true'}" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"><svg-icon library="ui" name="redo"></svg-icon><span class="rail__label">Redo</span></button>
<hr class="rail__rule" />
<button type="button" class="rail__button" data-action="tools" aria-expanded="${tools ? 'true' : 'false'}"><svg-icon library="ui" name="tools"></svg-icon><span class="rail__label">Tools</span></button>
<button type="button" class="rail__button" data-action="hide" title="Clear the screen of the tools and panels"><svg-icon library="ui" name="hide"></svg-icon><span class="rail__label">Hide</span></button>
<button type="button" class="rail__button rail__show" data-action="show" aria-label="Show the tools" title="Show the tools"><svg-icon library="ui" name="rail"></svg-icon></button>
