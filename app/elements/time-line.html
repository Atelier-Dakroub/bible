<!-- The timeline strip at the bottom of the table.

     One tick per event, on an axis of equal-width eras (app/lib/timeline.js).
     The page renders the axis into the slot: a light element that re-renders
     for its own state cannot also repeat over a list it was given.
     A tap on a tick sends `show-entity` (bubbling) with { id }, and the table
     shows the event in the search panel. The table marks the ticks of the
     events that the cards on it tell, and draws a line from each card to them.

     The dates are Theographic's, which follow Floyd Nolen Jones's chronology;
     the strip says so. It collapses to one box, like the search panel, and
     remembers its state in this browser.

     The World button shows the world-history lanes under the events: polities
     and periods from Wikidata (data/world), with conventional scholarly dates
     on the same axis. A tap on a span sends `show-entity` too, with a world:
     id, and the panel lists the biblical events inside it.

     The Map button sends `toggle-map` (bubbling): the table puts the map card
     down, or takes it away. The Books button sends `toggle-books`, for the
     card that compares the books (the landscape, data/study.js).

     It keeps --timeline-height on its parent up to date, so the search panel
     can stop above it. On a phone it starts closed, and sends `panel-open`
     (bubbling) when it opens, as the other panels do. -->

<script element>
  import { isPhone } from '../lib/screen.js';
  import { slideIn, slideOut } from '../lib/motion.js';

  export const state = {
    collapsed: false,
    world: true,
  };

  const COLLAPSED_KEY = 'bible.timeline.collapsed';
  const WORLD_KEY = 'bible.timeline.world';

  /**
   * @param {string} key
   * @param {boolean} value
   */
  function remember(key, value) {
    try {
      localStorage.setItem(key, String(value));
    } catch {
      // No storage: the state lasts until the page closes.
    }
  }

  export const prototype = {
    /** a count of the openings and closings, so a late slide knows it is late */
    moves: 0,

    connected({ signal }) {
      try {
        // On a phone the strip starts closed, as it would cover half the
        // screen.
        const stored = localStorage.getItem(COLLAPSED_KEY);
        this.collapsed = stored === null ? isPhone() : stored === 'true';
        this.world = localStorage.getItem(WORLD_KEY) !== 'false';
      } catch {
        // No storage: the strip starts open, with the world lanes.
      }

      // The search panel stops above the strip, however tall the strip is.
      const parent = /** @type {HTMLElement | null} */ (this.parentElement);
      const measure = new ResizeObserver(() => {
        parent?.style.setProperty('--timeline-height', `${this.offsetHeight}px`);
        this.dispatchEvent(new Event('timeline-toggle', { bubbles: true }));
      });
      measure.observe(this);

      this.addEventListener('click', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        if (target?.closest('[data-action="toggle"]')) {
          this.setCollapsed(!this.collapsed);
          return;
        }
        if (target?.closest('[data-action="map"]')) {
          this.dispatchEvent(new Event('toggle-map', { bubbles: true }));
          return;
        }
        if (target?.closest('[data-action="books"]')) {
          this.dispatchEvent(new Event('toggle-books', { bubbles: true }));
          return;
        }
        if (target?.closest('[data-action="world"]')) {
          this.world = !this.world;
          remember(WORLD_KEY, this.world);
          return;
        }
        const tick = target?.closest('[data-entity]');
        if (tick instanceof HTMLElement) {
          this.dispatchEvent(new CustomEvent('show-entity', { bubbles: true, detail: { id: tick.dataset.entity } }));
        }
      }, { signal });

      return () => measure.disconnect();
    },

    /**
     * Opens or closes the strip, with a short slide from the bottom edge.
     *
     * @param {boolean} collapsed
     */
    async setCollapsed(collapsed) {
      // A call during a closing slide cancels it: the closing sees the count
      // has moved on.
      const step = ++this.moves;
      if (collapsed === this.collapsed) return;
      if (collapsed) {
        await slideOut(this, { y: 16 });
        if (step !== this.moves) return;
      }
      this.collapsed = collapsed;
      slideIn(this, collapsed ? {} : { y: 16 });
      remember(COLLAPSED_KEY, collapsed);
      // On a phone, one panel is open at a time (bible-table closes the
      // others).
      if (!collapsed && isPhone()) this.dispatchEvent(new CustomEvent('panel-open', { bubbles: true, detail: { panel: 'timeline' } }));
    },

    /**
     * The tick of an event, or null.
     *
     * @param {string} id
     * @returns {HTMLElement | null}
     */
    tickFor(id) {
      return this.querySelector(`[data-entity="${CSS.escape(id)}"]`);
    },
  };
</script>

<style>
  :scope {
    position: absolute;
    left: 1rem;
    right: 1rem;
    bottom: 1rem;
    z-index: 1000000;
    display: block;
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 2px 12px var(--shade-far);
  }
  :scope:state(collapsed) {
    right: auto;
  }
  /* On a phone: the width of the screen, and the strip and the world lanes
     at a width they can be read at, moved sideways with a finger; the
     buttons stay put. The note goes under the buttons. */
  @media (max-width: 700px), (max-height: 500px) {
    :scope {
      right: 0.5rem;
      bottom: 0.5rem;
      left: 0.5rem;
      max-height: 55vh;
      overflow: auto;
      overscroll-behavior: contain;
    }
    :scope:state(collapsed) {
      right: auto;
      overflow: visible;
    }
    :scope:not(:state(collapsed)) .timeline__bar {
      position: sticky;
      left: 0;
      flex-wrap: wrap;
      box-sizing: border-box;
      width: calc(100vw - 1rem - 2px);
    }
    .timeline__note {
      flex-basis: 100%;
      font-size: 0.65rem;
    }
    :scope .timeline__axis,
    :scope .timeline__world {
      min-width: 60rem;
    }
  }
  .timeline__bar {
    display: flex;
    align-items: center;
    gap: var(--bar-gap);
    padding: var(--bar-padding);
  }
  .timeline__toggle {
    min-height: var(--control-height);
    padding: var(--control-padding);
    font: var(--control-font);
  }
  .timeline__note {
    margin: 0;
    color: var(--muted);
    font-size: 0.75rem;
  }
  :scope:state(collapsed) .timeline__note,
  :scope:state(collapsed) .timeline__axis,
  :scope:state(collapsed) .timeline__world,
  :scope:state(collapsed) .timeline__world-toggle,
  :scope:not(:state(world)) .timeline__world {
    display: none;
  }
  /* The world lanes share the events' axis: the padding puts their left edge
     where the axis starts, and the region names sit in that padding. The
     small kingdoms of the Levant alone need eight lanes, so the band has a
     fixed height and scrolls. */
  .timeline__world {
    max-height: 9rem;
    margin: 0 1rem 0.75rem 1rem;
    /* Room after the last lane, so it does not end on the panel's edge. */
    padding-bottom: 0.5rem;
    padding-left: 8rem;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  .world__region {
    position: relative;
    padding: 0.15rem 0;
    border-top: 1px solid color-mix(in srgb, var(--edge) 50%, transparent);
  }
  .world__name {
    position: absolute;
    left: -8rem;
    top: 0.2rem;
    color: var(--muted);
    font-size: 0.65rem;
    white-space: nowrap;
  }
  .world__lane {
    position: relative;
    height: 1.1rem;
  }
  .world__span {
    position: absolute;
    top: 0.1rem;
    left: calc(var(--at) * 100%);
    width: calc(var(--width) * 100%);
    min-width: 4px;
    height: 0.9rem;
    padding: 0 0.3rem;
    overflow: hidden;
    border: 0;
    border-radius: 3px;
    /* A thin paper edge on the right parts two spans that touch. */
    box-shadow: inset -1px 0 0 var(--paper);
    background: color-mix(in srgb, var(--purple) 14%, var(--paper));
    color: var(--ink);
    font: 0.6rem/0.9rem var(--sans);
    text-align: start;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  /* A span too short for its name: the name goes just after it, where the
     lanes keep room for it (lib/timeline.js packLanes). */
  .world__span.is-outside {
    overflow: visible;
  }
  .world__span.is-outside::after {
    content: attr(data-name);
    position: absolute;
    top: 0;
    left: calc(100% + 0.25rem);
    color: var(--ink-soft);
    line-height: 0.9rem;
  }
  .world__span:hover {
    background: color-mix(in srgb, var(--purple) 24%, var(--paper));
  }
  .world__span.is-shown {
    background: var(--lapis);
    color: var(--on-pigment);
  }
  .timeline__axis {
    position: relative;
    height: 4.5rem;
    margin: 0 1rem 0.75rem 9rem;
  }
  .timeline__axis::before {
    content: 'Bible';
    position: absolute;
    right: calc(100% + 0.5rem);
    bottom: 0;
    color: var(--muted);
    font-size: 0.65rem;
  }
  .timeline__era {
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(var(--at) * 100%);
    padding-left: 0.3rem;
    border-left: 1px solid var(--edge);
    color: var(--ink-soft);
    font-size: 0.7rem;
    line-height: 1.25;
    /* Each era is an eighth of the strip: a long name wraps inside it. */
    width: calc(100% / 8 - 0.6rem);
  }
  .timeline__era span {
    display: block;
  }
  /* The hit area is wider than the mark, so a finger can find a tick. */
  .timeline__tick {
    position: absolute;
    bottom: 0;
    left: calc(var(--at) * 100%);
    width: 14px;
    height: 1.8rem;
    margin-left: -7px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .timeline__tick::before {
    content: '';
    position: absolute;
    left: 6px;
    bottom: 0;
    width: 2px;
    height: 0.8rem;
    background: var(--purple);
  }
  .timeline__tick.is-on-table::before,
  .timeline__tick.is-shown::before {
    height: 1.8rem;
    background: var(--lapis);
  }
</style>

<div class="timeline__bar">
  <button
    type="button"
    class="timeline__toggle"
    data-action="toggle"
    aria-expanded="${collapsed ? 'false' : 'true'}"
  >${collapsed ? 'Timeline' : 'Hide'}</button>
  <button
    type="button"
    class="timeline__world-toggle timeline__toggle"
    data-action="world"
    aria-pressed="${world ? 'true' : 'false'}"
  >World</button>
  <button type="button" class="timeline__toggle timeline__world-toggle" data-action="map">Map</button>
  <button type="button" class="timeline__toggle timeline__world-toggle" data-action="books">Books</button>
  <p class="timeline__note">
    Bible: Theographic's dates, after Floyd Nolen Jones's chronology in the tradition of Ussher. World: Wikidata's conventional scholarly dates. The two can disagree. Each era has the same width.
  </p>
</div>
<slot></slot>
