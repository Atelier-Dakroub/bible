<!-- The sheet that writes a note's text, with the on-screen keyboard.

     edit(id, text) opens it on a note. Each change sends `note-text` (bubbling)
     with { id, text }, so the note card shows the words as they come. Done,
     the keyboard's Done, or Escape closes it and sends `note-done` with { id }.

     A real keyboard types into the field as usual. -->

<script element>
  export const state = {
    open: false,
  };

  export const prototype = {
    /** the note being written */
    note: '',

    connected({ signal }) {
      const field = /** @type {HTMLTextAreaElement} */ (this.querySelector('textarea'));
      field.addEventListener('input', () => {
        this.dispatchEvent(new CustomEvent('note-text', { bubbles: true, detail: { id: this.note, text: field.value } }));
      }, { signal });
      field.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') this.close();
      }, { signal });
      this.addEventListener('keys-done', () => this.close(), { signal });
      this.addEventListener('click', (event) => {
        if (event.target instanceof Element && event.target.closest('[data-action="done"]')) this.close();
      }, { signal });
    },

    /**
     * @param {string} id
     * @param {string} text
     */
    edit(id, text) {
      if (this.open && this.note !== id) this.close();
      this.note = id;
      const field = /** @type {HTMLTextAreaElement} */ (this.querySelector('textarea'));
      field.value = text;
      this.open = true;
      requestAnimationFrame(() => {
        field.focus({ preventScroll: true });
        field.setSelectionRange(field.value.length, field.value.length);
      });
    },

    close() {
      if (!this.open) return;
      this.open = false;
      /** @type {HTMLTextAreaElement} */ (this.querySelector('textarea')).blur();
      this.dispatchEvent(new CustomEvent('note-done', { bubbles: true, detail: { id: this.note } }));
      this.note = '';
    },
  };
</script>

<style>
  :scope {
    position: absolute;
    left: 50%;
    bottom: calc(var(--timeline-height, 0px) + 1rem);
    z-index: 2000001;
    display: none;
    width: 40rem;
    margin-left: -20rem;
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 8px 30px var(--shade-held);
    font: var(--control-font);
  }
  :scope:state(open) {
    display: block;
  }
  .editor__bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--bar-padding);
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
    color: var(--ink-soft);
  }
  .editor__bar button {
    min-height: var(--control-height);
    padding: var(--control-padding);
    font: var(--control-font);
  }
  textarea {
    display: block;
    box-sizing: border-box;
    width: 100%;
    height: 7rem;
    padding: 0.75rem;
    border: 0;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--paper);
    color: var(--ink);
    font: 1rem/1.5 var(--serif);
    resize: none;
    user-select: text;
    -webkit-user-select: text;
  }
</style>

<div class="editor__bar">
  <span>Note</span>
  <button type="button" data-action="done">Done</button>
</div>
<textarea id="note-field" aria-label="Text of the note"></textarea>
<touch-keys for="note-field" enter="New line"></touch-keys>
