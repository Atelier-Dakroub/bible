<!-- The dock of the app's own keyboard, for writing a note where it lies
     (bible-table writeNote, lib/note-editing.js).

     The words are written on the note's card itself; this only holds the
     keys, and only where the screen has no keyboard of its own
     (lib/keyboard.js): a finger opened the note on a touch screen that is
     not a phone or a tablet, and no real key has been pressed. Elsewhere it
     never shows. Its Hide key hides it and leaves the note open; Done ends
     the writing (`note-done`, bubbling). A resting palm does not close it
     (see table-menu). -->

<script element>
  import { wantKeys } from '../lib/keyboard.js';

  export const state = {
    /** whether the keys show */
    open: false,
  };

  export const prototype = {
    /** the note being written */
    note: '',

    connected({ signal }) {
      this.addEventListener('keys-done', () => {
        this.open = false;
      }, { signal });
      this.addEventListener('click', (event) => {
        if (event.target instanceof Element && event.target.closest('[data-action="done"]')) {
          this.dispatchEvent(new CustomEvent('note-done', { bubbles: true, detail: { id: this.note } }));
        }
      }, { signal });
      // A press on the bar keeps the caret in the note.
      this.addEventListener('pointerdown', (event) => {
        if (!(event.target instanceof Element && event.target.closest('button'))) event.preventDefault();
      }, { signal });
    },

    /**
     * Shows the keys for a note being written, if this screen wants them.
     *
     * @param {string} id
     */
    dock(id) {
      this.note = id;
      this.open = wantKeys();
    },

    undock() {
      this.open = false;
      this.note = '';
    },
  };
</script>

<style>
  :scope {
    position: absolute;
    right: 0;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    left: 0;
    z-index: 2000001;
    display: none;
    box-sizing: border-box;
    width: min(40rem, calc(100% - 1rem));
    margin: 0 auto;
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 8px 30px var(--shade-held);
    font: var(--control-font);
  }
  :scope:state(open) {
    display: block;
  }
  /* On a phone: at the top, clear of the phone's keyboard, which rises
     from the bottom. */
  @media (max-width: 700px), (max-height: 500px) {
    :scope {
      top: calc(0.5rem + env(safe-area-inset-top, 0px));
      bottom: auto;
    }
  }
  .editor__bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--bar-padding);
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
    color: var(--ink-soft);
  }
  .editor__bar button {
    min-height: var(--control-height);
    padding: var(--control-padding);
    font: var(--control-font);
  }
</style>

<div class="editor__bar">
  <span>Writing a note</span>
  <button type="button" data-action="done">Done</button>
</div>
<touch-keys for="note-field" enter="New line"></touch-keys>
