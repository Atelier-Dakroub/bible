<!-- The table: an infinite surface that holds the cards.

     The table never turns, and neither does a card: every card is upright at
     its own size, and only the table zooms. One finger on an empty part of it pans
     everything on it together, and there is no edge. Two fingers anywhere,
     on the table or on a card, zoom it (lib/zoom.js), from a quarter of full
     size to twice it, about the place between them; a card hands its two
     fingers to the table (card-pinch). A pinch on past the least zoom shows
     the overview. Below TILE_ZOOM, each card shows its name on a chip, as in
     the overview, and still moves (is-far). The zoom is kept with the table,
     and is not a step to undo.
     The zoom buttons in the corner of the free part, and + - and 0 with no
     card in focus, do the same in steps.

     A card is a server fragment, /card/<address>?fragment=card, fetched when a
     passage is placed. A card's version buttons (KJV, BSB, Both) fetch the
     card again in that version and put it where the old one was. What is on the table is kept in this browser as
     addresses and positions (app/lib/workspace.js), and the cards are fetched
     again on the next visit.

     Highlights are kept with the workspace as word spans (app/lib/words.js).
     A card sends `card-mark` when a hand marks words, and the table adds or
     removes the span and paints every card again.

     Lines (app/lib/links.js, app/lib/link-lines.js): curves from each
     card's edge, at the height of the words they join, drawn in an SVG
     layer under the cards, so that no line covers the text. A dot over the
     card marks where a line leaves it. The lines to the map and to the
     timeline show again over the map and the strip, where they end:
       solid ink     a link the reader drew between two spans
       dashed        the same highlighted words, shown on more than one card
       dotted        a cross-reference (OpenBible.info) from a verse on one
                     card to a verse on another
     (the colors of every kind of line are in the style below)

     A tap on a word studies it in the search panel: its Strong's entry and
     the verses that use the same original word. A tap on a word with no
     Strong's number lists the verse's cross-references instead. Either list
     can be pulled out like any result. While a study is on show, every word
     on the table with the same Strong's number is underlined.

     A word that names a person, place or group shows that entity first (see
     data/bible.js wordResults). Its relations are buttons, and its heading
     pulls out as a card. While an entity is on show, every word on the table
     that names it is underlined.

     The timeline strip (time-line) marks the events that the cards on the
     table tell, from Theographic's verse links, and a thin line joins each
     card to its events. A tap on a tick shows the event.

     A palm guard (app/lib/palm.js) sits in front of everything on the table:
     a group of touches that land together and close together is a resting
     hand. Its touches are stopped before any card or panel sees them, and
     any of them that a card had already taken is cancelled.

     With ?perf in the address, a readout in the corner shows the time
     between frames and the time the line layer takes, for measuring on the
     panel.

     The map is a card too (map:near-east). Its places that the cards on the
     table name are labelled, with a thin line to each card that names them,
     and the place on show in the panel is marked. A tap on a place shows it.
     The map moves and zooms inside its frame (map-view); a line goes only to
     a place inside the view, and Show on the map zooms to fit the places.
     A card sends `card-link` when a marking finger leaves it and lifts. The
     other end is the highlight under the finger, or, on words with no
     highlight, the whole passage of that card. Drawing a link again removes
     it, and removing a highlight removes its links.

     The workspace is a document (app/lib/workspace.js). The menu (table-menu)
     saves it under a name, opens a saved one, starts a new one, and sends it
     to a file or takes one in. Every change is a step in the undo history
     (app/lib/history.js), except a pan.

     Highlights come in three styles (words.js STYLES); the menu picks the
     style of the next one. Marking a highlight again in another style
     restyles it.

     A marking finger that leaves its card and lifts:
       on another card   draws a link to it (as above)
       on a note card    quotes the words in the note
       on the empty table  pulls the words out as a phrase card of their own
     In each case the words become a highlight, so a dashed line joins them
     to every other card that shows them.

     A note card (note:<id>) holds the reader's own text and the spans it
     quotes. A tap on its text writes there, with the caret where it touched
     (lib/note-editing.js); a tap anywhere off the note, Escape, or Done
     ends it. On a touch screen with no keyboard of its own, the app's
     keyboard docks below (note-editor). The verses a note quotes carry a
     mark on every other card.

     A link's label, at the middle of its line, says what the link is (links.js
     TYPES). A tap on the label changes it, and a typed link has an arrow.

     A passage card's ‹ and ›, beside its heading, step it through the text. Cards with Sync
     on step together: when one steps, the others go to the same passage.
     Copy puts the card's words and reference on the clipboard. Paste on the
     table puts down a card for each reference in the pasted text (pasted).

     A mouse, a trackpad and a keyboard work too:
       wheel, or two fingers on a trackpad   pan the table
       pinch on a trackpad, or Control (or Command) and the wheel
                                             zoom the table about the pointer
       arrow keys, with no card in focus     pan the table
       + - and 0, with no card in focus      zoom in, out, and to full size

     The overview (lib/overview.js): the whole table, small, to see where
     everything is on a large table and to go to any part of it at once. The
     rail's Overview, O, or a pinch on past the least zoom shows it: the
     table scales down until every card
     is on the screen, and each card is a tile of its kind's pigment with its
     title. The lines stay. A tap on a tile comes back to that card at full
     size, in the middle; a tap on the table comes back to that place. A
     spread of two fingers, Escape, O or Overview again comes back to the
     middle. In the overview a finger pans, and the cards take no touches;
     whatever changes the cards or brings one (FULL_SIZE) comes back to full
     size first. The overview is not kept: the table is kept at the zoom it
     had before the overview, which a spread, Escape, O or Overview brings
     back; a tap on a tile comes to full size.

     Far (the Interface setting, for a wall seen from across the room): the
     arrow keys move the focus from card to card and to the panels' controls
     instead, as a remote's do (remoteKey).

     Snapping (gesture-card): a held card snaps into line with the other
     cards, and the table draws the guides it sends.
     The menu's Snap button turns it off and on, as data-snap="off" here.
     The wheel is left alone over the panels, which scroll their own lists.
     The cards have their own keys (gesture-card).

     Study (data/study.js):
       a tap on a passage's heading (or Enter on the card)  the passage guide
                     in the search panel; its notes are added here
       Put them beside the card   the guide's parallels, in a row to the right
                     of the card
       Mark it on every card      a rule mark (app/lib/rules.js): every word
                     on the table that renders a Strong's number, names an
                     entity, or is in a marked run is marked, live. The menu
                     lists the rules, and they are kept with the workspace.
       Compare       on a card in Both: the words one translation has and the
                     other does not are bold (app/lib/compare.js)
       a landscape card (landscape:...)   a tap on a chapter puts the chapter
                     beside it; a tap on its heading shows its subject
       Books, on the strip   puts the landscape of the books down, or takes it away

     It listens for `place` from a search panel inside it:
       detail.address  the passage
       detail.pointer  { id, x, y, down } when a finger is pulling it out, else null -->

<script element>
  import { ARROWS, inset, nearestIn, nearestTo, shiftInto, viewportBox } from '../lib/spatial.js';
  import { isPhone } from '../lib/screen.js';
  import { typing } from '../lib/keyboard.js';
  import { pan } from '../lib/gesture.js';
  import { WIDTH } from '../lib/map.js';
  import { nextStyle, sameRule, stylesFor, toggleRule } from '../lib/rules.js';
  import { createHistory } from '../lib/history.js';
  import { lessMotion } from '../lib/motion.js';
  import { around, centre, centring, keeping, keyAsks, labelled, middle as middleOf, onTable, overviewOf, pinchAsks, shifted, spread, spreadOut, tappedIn } from '../lib/overview.js';
  import { createPalmGuard } from '../lib/palm.js';
  import { LEAST_ZOOM, MOST_ZOOM, TILE_ZOOM, clampZoom, nextStep, offsetFor, percent, pinchZoom, tablePoint } from '../lib/zoom.js';
  import { TYPES, cluster, dropLinksTo, firstCovered, isWhole, linked, nextType, referencePairs, removed, sameEnd, setLink, toggleLink, unlink } from '../lib/links.js';
  import { covers, inBsb, paintHighlights, parseSpanAddress, spanAddress, STYLES, toggle, wordAt, wordKey } from '../lib/words.js';
  import { diffCards, empty, fromFile, listNamed, load, loadNamed, newId, parse, save, saveNamed, snapshot, toFile } from '../lib/workspace.js';
  import { keepStorage } from '../lib/persist.js';
  import { footnoteTitle } from '../lib/footnotes.js';
  import { pastedReferences } from '../lib/citations.js';
  import { syncedAddress } from '../lib/commentary-address.js';
  import { inAList, listHolding, listName, listText, moved, withItems } from '../lib/lists.js';
  import { notesMatching } from '../lib/note-search.js';
  import { emptyTrail } from '../lib/trail.js';
  import { docOf, fromOutline, quotesIn, toText } from '../lib/note-doc.js';
  import { columnsOf, layOut, linksOf, studyDoc } from '../lib/study.js';
  import { edit as editNoteText, show as showNoteText } from '../lib/note-editing.js';
  import { foldedIn, foldQuote, quoteAt } from '../lib/note-quotes.js';
  import { toMarkdown } from '../lib/note-markdown.js';
  import { KINDS, isKind, labelOf, nextKind } from '../lib/note-kinds.js';
  import { LANGUAGE_NAMES, Reader, Recording, joinText, namedVoice, readerChoice, sayWord } from '../lib/speech.js';
  import { besidePort, clearOf, curvePath, dotPort, labelSpot, marginBar, port, tickPath, tickPoint, wholeCard, within } from '../lib/link-lines.js';

  /** @typedef {import('../lib/affine.js').Matrix} Matrix */
  /** @typedef {import('../lib/affine.js').Point} Point */
  /** @typedef {{ id: number, x: number, y: number, down: boolean }} Pull */
  /** @typedef {HTMLElement & { view: import('../lib/map.js').View | null, setView(view: import('../lib/map.js').View): void, fit(ids: string[], more?: { x: number, y: number }[]): Promise<void>, shows(id: string): boolean, relabel(): void }} MapView */
  /** @typedef {HTMLElement & { matrix: Matrix, hold(id: number, at: Point): void, placeAt(at: Point): void, setMatrix(m: Matrix): void }} Card */
  /** @typedef {import('../lib/workspace.js').StoredCard} StoredCard */
  /** @typedef {{ element: Element, x?: number, y?: number }} Tap a tap on a card: what it touched, and where on the screen */

  /**
   * A point, if both its numbers are known.
   *
   * @param {number | undefined} x
   * @param {number | undefined} y
   */
  const pointOf = (x, y) => (x === undefined || y === undefined ? null : { x, y });

  /** The recorded versions' names, for the lock screen. */
  /** @type {Record<string, string>} */
  const VERSION_NAMES = { kjv: 'King James Version', bsb: 'Berean Standard Bible' };

  /**
   * What the phone's lock screen shows while a card's recording plays: the
   * passage, its reader and its version.
   *
   * @param {HTMLElement} card
   * @param {string} reader
   */
  function lockScreen(card, reader) {
    const title = card.querySelector('.passage__heading')?.textContent?.trim() ?? '';
    return { title, artist: reader, album: VERSION_NAMES[card.dataset.version ?? ''] ?? '' };
  }

  /**
   * The recording a card's speaker lists (data/audio.js): the app's voice,
   * where it has the passage; none when the device's voice is chosen in
   * Tools, or none is listed.
   *
   * @param {HTMLElement} button the card's speaker button, whose data-listen lists them
   * @returns {{ kind: string, reader: string, chapters: import('../lib/speech.js').RecordedChapter[] } | null}
   */
  function recordingOf(button) {
    const choice = readerChoice();
    const recordings = choice === 'device' ? [] : listedRecordings(button);
    return recordings[0] ?? null;
  }

  /**
   * The recordings a card's speaker lists, or none if its list is not JSON.
   *
   * @param {HTMLElement} button
   * @returns {{ kind: string, reader: string, chapters: import('../lib/speech.js').RecordedChapter[] }[]}
   */
  function listedRecordings(button) {
    try {
      return JSON.parse(button.dataset.listen || '[]');
    } catch {
      return [];
    }
  }

  /**
   * A card as the table's state tells an assistant: its address, title,
   * version and kind.
   *
   * @param {HTMLElement} card
   */
  function cardState(card) {
    const title = card.querySelector('.passage__heading, .rr-card__title, h2')?.textContent?.trim() ?? '';
    return { address: card.dataset.address ?? '', title, version: card.dataset.version ?? 'kjv', kind: card.dataset.kind ?? '' };
  }

  /**
   * The way a remote's arrow key moves, unless a modifier is held, or the
   * key is the map's (it pans) or a field's.
   *
   * @param {KeyboardEvent} event
   * @param {HTMLElement | null} target
   * @returns {'left' | 'right' | 'up' | 'down' | null}
   */
  function remoteDirection(event, target) {
    const direction = /** @type {any} */ (ARROWS)[event.key];
    if (!direction || modified(event) || target?.closest('map-view') || typing(target)) return null;
    return direction;
  }

  /** @param {EventTarget | null} target the target, if it is an element */
  const elementOf = (target) => (target instanceof Element ? target : null);

  /** @param {EventTarget | null} target the target, if it is an HTML element */
  const htmlOf = (target) => (target instanceof HTMLElement ? target : null);

  /** @param {EventTarget | null} target whether it is in the words selected */
  const onSelection = (target) => {
    const selection = getSelection();
    return Boolean(selection && !selection.isCollapsed && target instanceof Node && selection.containsNode(target, true));
  };

  /**
   * Where a card's reading begins: the verse asked for, else where it last
   * stopped, else its start ('').
   *
   * @param {HTMLElement} card
   * @param {string} from
   */
  const startOf = (card, from) => from || card.dataset.readAt || '';

  /** For each version: the verses to copy, and the words in each ('' = the verse's own words). */
  const COPY_AS = /** @type {Record<string, [string, string]>} */ ({
    original: ['.original__verse, .inter__verse', '.orig, .inter__text'],
    interlinear: ['.original__verse, .inter__verse', '.orig, .inter__text'],
    syntax: ['.syntax__row', '.syntax__text'],
    reverse: ['.rev__verse', '.rev__en'],
    bsb: ['.bsb-verse', ''],
    kjv: ['kjv-verse', ''],
  });

  /**
   * A passage as it is copied: its words in the card's version, and its
   * reference and version under them. The Hebrew and the Greek copy the words
   * of each verse as they read; the reverse interlinear its KJV, in order;
   * the syntax its clauses.
   *
   * @param {HTMLElement} card
   */
  function passageForCopy(card) {
    const version = card.dataset.version ?? 'kjv';
    const [verses, words] = COPY_AS[version] ?? COPY_AS.kjv;
    const parts = [...card.querySelectorAll(verses)].map((verse) => (words ? [...verse.querySelectorAll(words)].map((word) => word.textContent?.trim()).join(' ') : wordsOf(verse)));
    const title = wordsOf(card.querySelector('.passage__heading') ?? card);
    return `${parts.join(' ')}\n— ${title} (${versionName(card, version)})`;
  }

  /**
   * The name a copy gives its version: Hebrew or Greek for the original.
   *
   * @param {HTMLElement} card
   * @param {string} version
   */
  function versionName(card, version) {
    if (version === 'bsb') return 'BSB';
    if (!['original', 'interlinear', 'syntax'].includes(version)) return 'KJV';
    return card.querySelector('[lang="hbo"], [lang="grc"]')?.getAttribute('lang') === 'hbo' ? 'Hebrew' : 'Greek';
  }

  /**
   * A card from the server, as an element not yet on the table: a note's
   * card with the words of its quotes. Null if it does not load.
   *
   * @param {string} address
   * @param {string} version
   * @param {{ from: string, to: string }[]} quotes
   * @returns {Promise<HTMLElement | null>}
   */
  async function loadCard(address, version, quotes) {
    const query = new URLSearchParams({ version, fragment: 'card' });
    if (quotes.length) query.set('quotes', quotes.map(spanAddress).join(','));
    const response = await fetch(`/card/${encodeURIComponent(address)}?${query}`).catch(() => null);
    const text = response?.ok ? await response.text().catch(() => null) : null;
    if (text === null) return null;
    const holder = document.createElement('template');
    holder.setHTMLUnsafe(text);
    return /** @type {HTMLElement | null} */ (holder.content.querySelector('gesture-card'));
  }

  /**
   * The events that the cards on the table tell.
   *
   * @param {Element[]} cards
   */
  function toldEvents(cards) {
    /** @type {Set<string>} */
    const told = new Set();
    for (const card of cards) for (const id of cardNamed.get(card) ?? []) if (id.startsWith('event:')) told.add(id);
    return told;
  }

  /**
   * Marks the timeline's ticks of the events on the table, and only those.
   *
   * @param {any} strip
   * @param {Set<string>} told
   */
  function markTicks(strip, told) {
    for (const tick of strip.querySelectorAll('.is-on-table')) if (!told.has(tick.dataset.entity)) tick.classList.remove('is-on-table');
    for (const id of told) strip.tickFor(id)?.classList.add('is-on-table');
  }

  /**
   * Where each told event's tick is on the screen, for the ticks that show.
   *
   * @param {any} strip
   * @param {Set<string>} told
   */
  function tickBoxes(strip, told) {
    /** @type {Map<string, DOMRect>} */
    const ticks = new Map();
    for (const id of told) {
      const box = strip.tickFor(id)?.getBoundingClientRect();
      if (box?.width > 0) ticks.set(id, box);
    }
    return ticks;
  }

  /**
   * A curve from a card to each tick of the events it tells
   * (lib/link-lines.js): out from the card's edge, under the cards, and into
   * the tick from above.
   *
   * @param {Element} card
   * @param {Map<string, DOMRect>} ticks
   */
  function eventLines(card, ticks) {
    const events = (cardNamed.get(card) ?? []).filter((id) => ticks.has(id));
    if (!events.length) return [];
    const box = card.getBoundingClientRect();
    return events.map((id) => {
      const tick = /** @type {DOMRect} */ (ticks.get(id));
      return curveOf(tickPath(port(box, tick, tick), tickPoint(tick, box)), 'time');
    });
  }

  /**
   * A curve from a card to each place it names that the map shows: out from
   * the card's edge, under the cards, and into the place's dot from the side.
   *
   * @param {Element} card
   * @param {Element} map the map's card
   * @param {any} frame its map-view
   */
  function placeLinesOf(card, map, frame) {
    const places = (cardNamed.get(card) ?? []).filter((id) => id.startsWith('place:'));
    if (!places.length) return [];
    const box = card.getBoundingClientRect();
    return places.flatMap((id) => {
      if (frame && !frame.shows(id)) return [];
      const dot = map.querySelector(`[data-place="${CSS.escape(id)}"] circle`)?.getBoundingClientRect();
      if (!dot?.width) return [];
      const a = port(box, dot, dot);
      return [curveOf(curvePath(a, dotPort(dot, a)), 'place')];
    });
  }

  /**
   * A curve, as an SVG path of a kind (its class).
   *
   * @param {string} d
   * @param {string} kind
   */
  function curveOf(d, kind) {
    const path = document.createElementNS(SVG, 'path');
    path.setAttribute('class', kind);
    path.setAttribute('d', d);
    return path;
  }

  /**
   * A clip to a box on the screen.
   *
   * @param {string} id
   * @param {DOMRect} box
   */
  function clipTo(id, box) {
    const clip = document.createElementNS(SVG, 'clipPath');
    clip.id = id;
    const rect = document.createElementNS(SVG, 'rect');
    for (const [name, value] of Object.entries({ x: box.left, y: box.top, width: box.width, height: box.height })) rect.setAttribute(name, String(value));
    clip.append(rect);
    return clip;
  }

  /**
   * A mask that hides what lies under some cards' boxes.
   *
   * @param {string} id
   * @param {DOMRect[]} boxes
   */
  function coverMask(id, boxes) {
    const mask = document.createElementNS(SVG, 'mask');
    mask.id = id;
    const far = { x: -1e5, y: -1e5, width: 2e5, height: 2e5 };
    for (const [name, value] of Object.entries(far)) mask.setAttribute(name, String(value));
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    const rect = (/** @type {{ x: number, y: number, width: number, height: number }} */ box, /** @type {string} */ fill) => {
      const shape = document.createElementNS(SVG, 'rect');
      for (const name of /** @type {const} */ (['x', 'y', 'width', 'height'])) shape.setAttribute(name, String(box[name]));
      shape.setAttribute('fill', fill);
      return shape;
    };
    mask.append(rect(far, 'white'), ...boxes.map((box) => rect(box, 'black')));
    return mask;
  }

  /**
   * The curves that end on a card or a panel, again over it: the part of
   * each over its box shows (the clip); the rest stays under the cards. The
   * cards above it cover that part (the mask, when there is one).
   *
   * @param {Element[]} lines
   * @param {string} id
   * @param {DOMRect} box the map card's or the timeline strip's
   * @param {DOMRect[]} [above] the cards above it
   */
  function overBox(lines, id, box, above = []) {
    if (!lines.length) return [];
    const masked = above.length ? [coverMask(`${id}-cover`, above)] : [];
    const copies = lines.map((line) => {
      const copy = /** @type {Element} */ (line.cloneNode());
      copy.setAttribute('clip-path', `url(#${id})`);
      if (masked.length) copy.setAttribute('mask', `url(#${id}-cover)`);
      return copy;
    });
    return [clipTo(id, box), ...masked, ...copies];
  }

  /**
   * @typedef {{ start: Place, end: Place, from: DOMRect, to: DOMRect, a: Port, b: Port }} LinkEnds
   *   one curve of a link: its two places, their cards' boxes, and its ports
   */

  /**
   * The ends of one curve of a link (lib/link-lines.js): where it leaves each
   * card.
   *
   * @param {Place} start
   * @param {Place} end
   * @returns {LinkEnds}
   */
  function linkEnds(start, end) {
    const from = start.card.getBoundingClientRect();
    const to = end.card.getBoundingClientRect();
    return { start, end, from, to, a: port(from, start.box, to), b: port(to, end.box, from) };
  }

  /**
   * A link's curve from port to port, drawn under the cards, with an arrow
   * at its far end if the link has a type.
   *
   * @param {Port} a
   * @param {Port} b
   * @param {string | undefined} type
   */
  function linkCurve(a, b, type) {
    const path = curveOf(curvePath(a, b), type ? 'link link--typed' : 'link');
    if (type) path.setAttribute('marker-end', 'url(#link-arrow)');
    return path;
  }

  /**
   * The mark of a cross-reference or of the same words where the curve
   * leaves a card: a small, soft dot at the port.
   *
   * @param {Port} at
   * @returns {Element[]}
   */
  function softDot(at) {
    const dot = document.createElementNS(SVG, 'circle');
    dot.setAttribute('class', 'port port--soft');
    dot.setAttribute('cx', String(at.x));
    dot.setAttribute('cy', String(at.y));
    dot.setAttribute('r', '2.5');
    return [dot];
  }

  /**
   * The curves between places on cards (a chain, or pairs), of a kind, with
   * a soft dot at each port.
   *
   * @param {LinkEnds[]} ends
   * @param {string} kind
   * @param {Element[]} cards
   * @param {DOMRect[]} panels the panels on show
   */
  function softCurves(ends, kind, cards, panels) {
    return { lines: ends.map((each) => curveOf(curvePath(each.a, each.b), kind)), marks: ends.flatMap((each) => endMarks(each, cards, softDot, panels)) };
  }

  /**
   * The marks of a link on its card, drawn over the card: a dot at the port,
   * and a bar in the margin beside the linked words (none for a link to the
   * whole card).
   *
   * @param {Port} at
   * @param {DOMRect} card
   * @param {DOMRect} words
   */
  function portMarks(at, card, words) {
    const dot = document.createElementNS(SVG, 'circle');
    dot.setAttribute('class', 'port');
    dot.setAttribute('cx', String(at.x));
    dot.setAttribute('cy', String(at.y));
    dot.setAttribute('r', '4');
    if (wholeCard(words, card)) return [dot];
    const bar = document.createElementNS(SVG, 'rect');
    const { x, y, width, height } = marginBar(at, card, words);
    bar.setAttribute('class', 'port-bar');
    Object.entries({ x, y, width, height, rx: 1.5 }).forEach(([name, value]) => bar.setAttribute(name, String(value)));
    return [bar, dot];
  }

  /** @param {Element} card */
  function levelOf(card) {
    return Number(/** @type {HTMLElement} */ (card).style.zIndex) || 0;
  }

  /**
   * The card on top: the one touched last.
   *
   * @param {Element[]} cards
   * @returns {Element | undefined}
   */
  function topCard(cards) {
    return cards.reduce((top, card) => (levelOf(card) > levelOf(top) ? card : top), cards[0]);
  }

  /**
   * The marks of both ends of a curve, but not one that a card above its own
   * lies over, or a panel.
   *
   * @param {LinkEnds} ends
   * @param {Element[]} cards
   * @param {(at: Port, card: DOMRect, words: DOMRect) => Element[]} marker a link's marks, or soft dots
   * @param {DOMRect[]} panels the panels on show
   */
  function endMarks(ends, cards, marker, panels) {
    const sides = [
      { place: ends.start, at: ends.a, box: ends.from },
      { place: ends.end, at: ends.b, box: ends.to },
    ];
    /** @param {Element} card the cards above it, and the panels */
    const over = (card) => [...cards.filter((each) => levelOf(each) > levelOf(card)).map((each) => each.getBoundingClientRect()), ...panels];
    return sides.filter(({ place, at }) => !within(at, over(place.card))).flatMap(({ place, at, box }) => marker(at, box, place.box));
  }

  /**
   * @typedef {{ boxes: DOMRect[], panels: DOMRect[], top: Element | undefined }} LabelRoom
   *   what a label keeps off: the cards' and the panels' boxes, the panels
   *   alone, and the card touched last
   */

  /**
   * Where a link's label stands: where no card or panel is
   * (lib/link-lines.js); else, while one of its cards is the one touched
   * last, beside the start, so its type can still be changed, but never on a
   * panel; else nowhere.
   *
   * @param {LinkEnds} first the link's first curve
   * @param {string} text
   * @param {LabelRoom} room
   */
  function spotFor(first, text, room) {
    const open = labelSpot(first.a, first.b, text, room.boxes);
    if (open) return open;
    const beside = besidePort(first.a, text);
    const touched = first.start.card === room.top || first.end.card === room.top;
    return touched && clearOf(beside, text, room.panels) ? beside : null;
  }

  /**
   * A link's label, with no place where it has no curve or no room.
   *
   * @param {{ type?: string }} link
   * @param {LinkEnds | undefined} first
   * @param {LabelRoom} room
   */
  function linkLabel(link, first, room) {
    const text = link.type || 'link';
    const spot = first ? spotFor(first, text, room) : null;
    return { at: spot ?? { x: NaN, y: NaN }, text, typed: Boolean(link.type) };
  }

  /**
   * Whether a card may go into a list: not a list, and not the map, which
   * the rail puts down and takes away.
   *
   * @param {HTMLElement} card
   */
  const gatherable = (card) => card.dataset.kind !== 'list' && card.dataset.address !== 'map:near-east';

  /**
   * Whether a point is inside a box.
   *
   * @param {{ x: number, y: number }} point
   * @param {DOMRect} box
   */
  const inside = (point, box) => point.x >= box.left && point.x <= box.right && point.y >= box.top && point.y <= box.bottom;

  /**
   * A card's first words, for its row in a list.
   *
   * @param {HTMLElement} card
   */
  function firstWordsOf(card) {
    const text = (card.querySelector('.passage__text, .passage__parallel, .commentary__text, .entity__summary, .note__body, figcaption')?.textContent ?? '')
      .replace(/\s+/g, ' ')
      .trim()
      // The first verse's number, which the row's title says.
      .replace(/^\d+\s+/, '');
    return text.length > 140 ? `${text.slice(0, text.lastIndexOf(' ', 140))}…` : text;
  }

  /**
   * A list card's heading, name, rows and hint, from its list.
   *
   * @param {HTMLElement} card
   * @param {import('../lib/workspace.js').List} list
   */
  function paintListCard(card, list) {
    const heading = card.querySelector('.passage__heading');
    if (heading) heading.textContent = listName(list);
    const name = /** @type {HTMLInputElement | null} */ (card.querySelector('.list__name'));
    if (name && document.activeElement !== name) name.value = list.title ?? '';
    card.querySelector('.list__rows')?.replaceChildren(...list.items.map((item, i) => listRow(item, i, list.items.length)));
    card.querySelector('.list__empty')?.toggleAttribute('hidden', list.items.length > 0);
    card.querySelector('.list__spread')?.toggleAttribute('disabled', !list.items.length);
  }

  /**
   * A row of a list card: its card's title and first words, a tap to take
   * it out, and buttons to move it up or down.
   *
   * @param {import('../lib/workspace.js').ListItem} item
   * @param {number} at
   * @param {number} count
   */
  function listRow(item, at, count) {
    const row = document.createElement('li');
    row.className = 'list__row';
    const open = Object.assign(document.createElement('button'), { type: 'button', className: 'list__open', title: `Take ${item.title} out of the list` });
    open.dataset.listOpen = item.id;
    open.append(Object.assign(document.createElement('span'), { className: 'list__title', textContent: item.title }));
    if (item.text) open.append(Object.assign(document.createElement('span'), { className: 'list__text', textContent: item.text }));
    /** @param {'up' | 'down'} way */
    const mover = (way) => {
      const button = Object.assign(document.createElement('button'), { type: 'button', className: 'list__move', textContent: way === 'up' ? '↑' : '↓', disabled: way === 'up' ? at === 0 : at === count - 1 });
      button.setAttribute('aria-label', `Move ${item.title} ${way}`);
      button.dataset[way === 'up' ? 'listUp' : 'listDown'] = item.id;
      return button;
    };
    row.append(open, mover('up'), mover('down'));
    return row;
  }

  /** The most cards one paste puts down. */
  const PASTE_LIMIT = 12;

  /**
   * The text of a paste on the table; none for a paste in a field, which is
   * the field's.
   *
   * @param {ClipboardEvent} event
   */
  function pastedText(event) {
    const inField = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]');
    return inField ? '' : (event.clipboardData?.getData('text/plain').trim() ?? '');
  }

  /**
   * What the table says after a paste.
   *
   * @param {number} found references found, one more than the limit when there are more
   * @param {boolean} books whether the list of books came
   */
  function pastedMessage(found, books) {
    if (!books) return 'The pasted text could not be read: check the connection.';
    if (!found) return 'No Bible reference in the pasted text.';
    if (found > PASTE_LIMIT) return `The first ${PASTE_LIMIT} references are on the table.`;
    return found === 1 ? 'One reference is on the table.' : `${found} references are on the table.`;
  }

  /**
   * Puts a popover under a box on the screen, its right edge at the box's,
   * or over the box when there is no room under it, and on the screen.
   * (CSS anchors follow a card's layout box, not its transform.)
   *
   * @param {HTMLElement} element
   * @param {DOMRect} box
   */
  function placeBelow(element, box) {
    const gap = 6;
    const width = element.offsetWidth;
    const height = element.offsetHeight;
    const left = Math.max(gap, Math.min(box.right - width, innerWidth - width - gap));
    const top = box.bottom + gap + height <= innerHeight - gap ? box.bottom + gap : Math.max(gap, box.top - gap - height);
    element.style.left = `${left}px`;
    element.style.top = `${top}px`;
  }

  /**
   * A guide line, from the table's coordinates to the screen's.
   *
   * @param {{ x1: number, y1: number, x2: number, y2: number }} guide
   * @param {DOMRect} world where the table's world is on the screen
   */
  function guideLine(guide, world, zoom) {
    const element = document.createElementNS(SVG, 'line');
    element.setAttribute('class', 'guide');
    element.setAttribute('x1', String(world.left + guide.x1 * zoom));
    element.setAttribute('y1', String(world.top + guide.y1 * zoom));
    element.setAttribute('x2', String(world.left + guide.x2 * zoom));
    element.setAttribute('y2', String(world.top + guide.y2 * zoom));
    return element;
  }

  /**
   * Whether a note quotes these words already.
   *
   * @param {{ quotes: Span[] }} note
   * @param {string} address a span address
   */
  const hasQuote = (note, address) => note.quotes.some((each) => spanAddress(each) === address);

  /**
   * Puts a quote in a note being written, after the caret's line.
   *
   * @param {any} view the note's editor (ProseMirror's EditorView)
   * @param {object} quote the quote node, as JSON
   */
  function quoteAtCaret(view, quote) {
    const { state } = view;
    const at = state.selection.$from.depth ? state.selection.$from.after(1) : state.doc.content.size;
    view.dispatch(state.tr.insert(at, state.schema.nodeFromJSON(quote)));
  }

  /**
   * Where a quote dropped on a note goes among its blocks: before the first
   * block under the drop.
   *
   * @param {Element | null} host the note's words
   * @param {{ x: number, y: number } | null} point
   * @param {number} end the place at the end
   */
  function dropIndex(host, point, end) {
    if (!point || !host) return end;
    const below = [...host.children].findIndex((block) => {
      const box = block.getBoundingClientRect();
      return point.y < box.top + box.height / 2;
    });
    return below >= 0 ? below : end;
  }

  /**
   * A verse's words in the order of word keys: its KJV words and its BSB
   * words, so a quote of it in either translation is found.
   *
   * @param {string} verse such as JHN.3.16
   * @returns {[number, number][]}
   */
  function verseRanges(verse) {
    return [`${verse}.w1`, `${verse}.b1`].map((address) => {
      const first = wordKey(address);
      return [first, first + 999];
    });
  }

  /**
   * A link's type from an assistant: one of TYPES, none ("") if not given.
   *
   * @param {unknown} type
   */
  function linkType(type) {
    const kind = typeof type === 'string' ? type : '';
    if (!TYPES.includes(kind)) throw new Error(`A link's type is one of: ${TYPES.filter(Boolean).join(', ')}; or none.`);
    return kind;
  }

  /**
   * An assistant's note, as the table keeps it: its words as a document, a
   * title and a kind if given, and the cards to link it to.
   *
   * @param {{ title?: unknown, text?: unknown, kind?: unknown, link?: unknown }} command
   */
  function noteFields({ title, text, kind, link }) {
    return {
      doc: fromOutline(typeof text === 'string' ? text : ''),
      title: typeof title === 'string' ? title.trim() : '',
      kind: isKind(kind) ? kind : undefined,
      link: /** @type {unknown[]} */ (Array.isArray(link) ? link : []),
    };
  }

  /**
   * A whole card as a link's end. A passage is its address, so the link
   * shows on every card of it in any translation; a note, the map or a
   * person is its own address too. A card of words (a phrase) is the words,
   * so its link shows wherever they do.
   *
   * @param {HTMLElement} card
   * @returns {End}
   */
  function wholeOf(card) {
    const address = card.dataset.address ?? '';
    return (card.dataset.kind === 'phrase' && parseSpanAddress(address)) || { address };
  }

  /**
   * A landscape's subject, in the search panel: the words, the Strong's
   * number, or the person, place or event.
   *
   * @param {any} panel
   * @param {string} subject
   */
  function showSubject(panel, subject) {
    if (subject.startsWith('text:')) panel?.searchFor(subject.slice(5));
    else if (/^[HG]\d/.test(subject)) panel?.searchFor(subject);
    else if (subject.includes(':')) panel?.showEntity(subject);
  }

  /**
   * The places the cards on the table name.
   *
   * @param {Element[]} cards
   */
  function namedPlaces(cards) {
    return new Set(cards.flatMap((card) => (cardNamed.get(card) ?? []).filter((id) => id.startsWith('place:'))));
  }

  /**
   * Marks the map's places: on the table, and shown.
   *
   * @param {Element} map
   * @param {Set<string>} named
   * @param {Set<string>} shown
   */
  function markPlaces(map, named, shown) {
    for (const marker of map.querySelectorAll('[data-place]')) {
      const id = marker.getAttribute('data-place') ?? '';
      marker.classList.toggle('is-on-table', named.has(id));
      marker.classList.toggle('is-shown', shown.has(id));
    }
  }

  /** @param {HTMLElement} card its id, or a new one */
  const idOf = (card) => card.dataset.id ?? newId('c');

  /** @param {HTMLElement} card its version, the KJV by default */
  const versionOf = (card) => card.dataset.version ?? 'kjv';

  /**
   * Whether a card is synced, or compared (only in the both view).
   *
   * @param {HTMLElement} card
   */
  function cardFlags(card) {
    const sync = card.dataset.sync !== undefined;
    const compare = card.dataset.compare !== undefined && versionOf(card) === 'both';
    const short = card.dataset.form === 'short';
    return { ...(sync ? { sync } : {}), ...(compare ? { compare } : {}), ...(short ? { short } : {}) };
  }

  /**
   * A note's title on its card: the reader's own, else the kind's name. Not
   * while it is being written.
   *
   * @param {HTMLElement} card
   * @param {{ title?: string }} note
   * @param {string} label
   */
  function paintTitle(card, note, label) {
    const heading = card.querySelector('.passage__heading');
    if (!(heading instanceof HTMLElement) || heading.isContentEditable) return;
    heading.textContent = note.title || label;
    heading.classList.toggle('is-kind', !note.title);
  }

  /**
   * The label that changes a note's kind.
   *
   * @param {HTMLElement} card
   * @param {string} label
   */
  function paintKindButton(card, label) {
    const button = card.querySelector('.note__kind');
    if (!button) return;
    button.textContent = label;
    button.setAttribute('aria-label', `${label}: change the kind of note`);
    button.setAttribute('title', 'Change the kind: Note, Observation, Question, Interpretation, Application, Prayer');
  }

  /**
   * A question's Answered box, and the card's mark when it is ticked.
   *
   * @param {HTMLElement} card
   * @param {{ kind?: string, answered?: boolean }} note
   */
  function paintAnswered(card, note) {
    const question = note.kind === 'question';
    card.toggleAttribute('data-answered', question && Boolean(note.answered));
    const answered = card.querySelector('.note__answered');
    if (answered instanceof HTMLElement) answered.hidden = !question;
    const box = card.querySelector('[data-action="note-answered"]');
    if (box instanceof HTMLInputElement) box.checked = Boolean(note.answered);
  }

  /**
   * Makes a note's title editable, its words selected so typing replaces them.
   *
   * @param {HTMLElement} heading
   */
  function openTitle(heading) {
    heading.contentEditable = 'plaintext-only';
    heading.id = 'note-field';
    heading.setAttribute('aria-label', 'Title of the note');
    heading.spellcheck = true;
    heading.focus({ preventScroll: true });
    const range = document.createRange();
    range.selectNodeContents(heading);
    getSelection()?.removeAllRanges();
    getSelection()?.addRange(range);
  }

  /** @param {HTMLElement} heading the title, no longer editable */
  function closeTitleField(heading) {
    heading.removeAttribute('contenteditable');
    heading.removeAttribute('id');
    heading.removeAttribute('aria-label');
  }

  /** @param {string | null} text a title as typed: one line, at most 120 characters */
  const cleanTitle = (text) => (text ?? '').replace(/\s+/g, ' ').trim().slice(0, 120);

  /**
   * A title kept: none if empty or the kind's own name.
   *
   * @param {string} text
   * @param {string | undefined} kind
   */
  const titleFrom = (text, kind) => (text && text !== labelOf(kind) ? text : '');

  /**
   * @param {{ title?: string }} note
   * @param {string} title
   */
  function setTitle(note, title) {
    if (title) note.title = title;
    else delete note.title;
  }

  /**
   * The keys of a note's title being written: Enter keeps it, Escape leaves
   * it as it was, a press elsewhere keeps it; the app's own keys type at the
   * caret.
   *
   * @param {HTMLElement} heading
   * @param {(keep: boolean) => void} finish
   * @param {AbortSignal} signal
   */
  function listenTitle(heading, finish, signal) {
    heading.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== 'Escape') return;
      event.preventDefault();
      if (event.key === 'Escape') finish(false);
      heading.blur();
    }, { signal });
    heading.addEventListener('blur', () => finish(true), { signal });
    heading.addEventListener('keys-type', (event) => titleKey(heading, /** @type {CustomEvent} */ (event).detail.key), { signal });
  }

  /**
   * One key of the app's keyboard in a title: Enter keeps it, Back deletes,
   * Clear empties it, and the rest type at the caret.
   *
   * @param {HTMLElement} heading
   * @param {string} key
   */
  function titleKey(heading, key) {
    if (key === 'enter') {
      heading.blur();
      return;
    }
    const at = caretIn(heading);
    if (!at) return;
    /** @type {Record<string, () => void>} */
    const keys = { back: () => deleteBack(at), clear: () => (heading.textContent = '') };
    (keys[key] ?? (() => insertAt(at, key === 'space' ? ' ' : key)))();
  }

  /**
   * The caret's range, if it is in an element.
   *
   * @param {HTMLElement} element
   */
  function caretIn(element) {
    const selection = getSelection();
    const at = selection?.rangeCount ? selection.getRangeAt(0) : null;
    return at && element.contains(at.startContainer) ? at : null;
  }

  /** @param {Range} at the selection, or the character before the caret, deleted */
  function deleteBack(at) {
    if (at.collapsed && at.startOffset === 0) return;
    if (at.collapsed) at.setStart(at.startContainer, at.startOffset - 1);
    at.deleteContents();
  }

  /**
   * Text typed at a range, in place of what it selects; the caret after it.
   *
   * @param {Range} at
   * @param {string} typed
   */
  function insertAt(at, typed) {
    at.deleteContents();
    const text = document.createTextNode(typed);
    at.insertNode(text);
    at.setStartAfter(text);
    at.collapse(true);
    getSelection()?.removeAllRanges();
    getSelection()?.addRange(at);
  }

  /**
   * A quote node, as JSON: its span, and the passage's title the server gave.
   *
   * @param {string} address
   * @param {HTMLElement | null} drawn
   */
  const quoteNode = (address, drawn) => ({ type: 'quote', attrs: { span: address, title: drawn?.dataset.title ?? '' } });

  /** @param {KeyboardEvent} event a key the page has taken: no default, no one else */
  function stopKey(event) {
    event.preventDefault();
    event.stopPropagation();
  }

  /**
   * @param {{ answered?: boolean }} note
   * @param {boolean} answered
   */
  function setAnswered(note, answered) {
    if (answered) note.answered = true;
    else delete note.answered;
  }

  /** @param {Element | null} panel a panel, folded if it is open */
  function collapse(panel) {
    const open = /** @type {any} */ (panel);
    if (open && !open.collapsed) open.setCollapsed(true);
  }

  /**
   * The touches of a palm that something already took: taken back.
   *
   * @param {number[]} rejected
   * @param {number} current the touch going down now
   * @param {Map<number, EventTarget>} targets where each touch went down
   */
  function takeBack(rejected, current, targets) {
    for (const id of rejected) {
      if (id !== current) targets.get(id)?.dispatchEvent(new PointerEvent('pointercancel', { pointerId: id, pointerType: 'touch', bubbles: true }));
    }
  }

  /**
   * Whether a key is the table's to pan with: pressed with nothing in focus,
   * and no modifier but Shift.
   *
   * @param {KeyboardEvent} event
   * @param {Element} table
   */
  const freeKey = (event, table) => (event.target === document.body || event.target === table) && !(event.metaKey || event.ctrlKey || event.altKey);

  /**
   * How far an arrow key pans the table: 80 pixels, 400 with Shift.
   *
   * @param {KeyboardEvent} event
   * @returns {[number, number] | null}
   */
  function keyPan(event) {
    const step = event.shiftKey ? 400 : 80;
    return /** @type {Record<string, [number, number]>} */ ({ ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] })[event.key] ?? null;
  }

  /** @param {number} mode a wheel's unit, in pixels: lines, pages and pixels (a mouse wheel can count in lines) */
  const wheelUnit = (mode) => (mode === 1 ? 16 : mode === 2 ? innerHeight : 1);

  /**
   * The rule marks a word has, as its data-rule.
   *
   * @param {HTMLElement} word
   * @param {import('../lib/rules.js').Rule[]} rules
   */
  function ruleOf(word, rules) {
    if (!rules.length) return '';
    return stylesFor(rules, { s: word.dataset.s, e: word.dataset.e, marks: [...(word.parentElement?.classList ?? [])] }).join(' ');
  }

  /**
   * @param {HTMLElement} word
   * @param {string} value its rule marks, set only when they change
   */
  function setRule(word, value) {
    if (value && word.dataset.rule !== value) word.dataset.rule = value;
    else if (!value && word.dataset.rule !== undefined) delete word.dataset.rule;
  }

  /**
   * Whether a word is the one studied (its Strong's number) or shown (its
   * person or place).
   *
   * @param {HTMLElement} word
   * @param {string | null | undefined} studied
   * @param {string | null | undefined} shown
   */
  const studiedWord = (word, studied, shown) => Boolean((studied && word.dataset.s === studied) || (shown && word.dataset.e === shown));

  /**
   * What a card's speaker button says.
   *
   * @param {boolean} mode in the listening mode
   * @param {boolean} playing
   * @param {string} rest the verse the reading stopped in, if any
   */
  function listenLabel(mode, playing, rest) {
    if (mode) return playing ? 'Pause: or tap the verse being read' : 'Stop listening; a tap on a verse plays it';
    return rest ? `Listen from verse ${rest.split('.').slice(1).join(':')}` : 'Listen';
  }

  /** @param {{ doc?: any, text: string }} note its words, to tell whether they changed */
  const noteSnapshot = (note) => JSON.stringify(note.doc ?? null) + note.text;

  /**
   * @param {Element} card
   * @param {string} fallback
   */
  const cardTitle = (card, fallback) => card.querySelector('.passage__heading, .rr-card__title, h2')?.textContent?.trim() ?? fallback;

  /** @param {Element} card its address, if it is a card element */
  const addressOf = (card) => (card instanceof HTMLElement ? card.dataset.address : null);

  /**
   * Takes a quote out of a note being written.
   *
   * @param {any} view the note's editor
   * @param {string} address the quote's span address
   */
  function unquoteIn(view, address) {
    const at = quoteAt(view.state.doc, address);
    const node = at >= 0 ? view.state.doc.nodeAt(at) : null;
    if (node) view.dispatch(view.state.tr.delete(at, at + node.nodeSize));
  }

  /** @param {KeyboardEvent} event whether a modifier key is held */
  const modified = (event) => event.metaKey || event.ctrlKey || event.altKey || event.shiftKey;

  /** For each version of a card: its verses, the words in each, and their language ('' = the original's own). */
  const READ_AS = /** @type {Record<string, [string, string, string]>} */ ({
    original: ['.original__verse', '.orig', ''],
    interlinear: ['.inter__verse', '.inter__word', ''],
    syntax: ['.syntax__row', '.syntax__text', ''],
    reverse: ['.rev__verse', '.rev__en', 'en'],

  function edge(box, toward) {

  function line(from, to, kind) {

  function nearest(from, places) {
    const others = places.filter((place) => place.card !== from.card);

    const at = middle(from.box);
    /** @type {Place | null} */
    let best = null;
    let distance = Infinity;
    for (const place of pool) {

      const d = Math.hypot(there.x - at.x, there.y - at.y);
      if (d < distance) {

      this.addEventListener('reading-change', () => this.drawSoon(), options);
      this.addEventListener('toggle-map', () => this.toggleCard(MAP), options);
      this.addEventListener('toggle-books', () => this.toggleCard(BOOKS), options);
      this.addEventListener('show-on-map', (event) => this.showOnMap(/** @type {CustomEvent} */ (event).detail.ids), options);
      this.addEventListener('show-journey', (event) => this.showJourney(/** @type {CustomEvent} */ (event).detail.journey), options);
      this.addEventListener('journey-off', () => {
        this.shownPlaces = new Set();
        this.paintMap();
      }, options);
      this.addEventListener('rule-add', (event) => this.setRules(toggleRule(this.rules, /** @type {CustomEvent} */ (event).detail)), options);
      this.addEventListener('rule-remove', (event) => {
        const index = /** @type {CustomEvent} */ (event).detail.index;
        this.setRules(this.rules.filter((_, i) => i !== index));
      }, options);
      this.addEventListener('rule-style', (event) => this.setRules(nextStyle(this.rules, /** @type {CustomEvent} */ (event).detail.index)), options);
      this.addEventListener('place-beside', (event) => this.placeBeside(/** @type {CustomEvent} */ (event).detail.addresses), options);
      this.addEventListener('start-study', (event) => this.startStudy(/** @type {CustomEvent} */ (event).detail.address), options);
      this.addEventListener('show-note', (event) => this.showNote(/** @type {CustomEvent} */ (event).detail.id), options);
      this.addEventListener('note-open', (event) => this.openNoteIn(/** @type {CustomEvent} */ (event).detail), options);
      // The card removes itself after the event, so keep what is left a moment
      // later. A note goes with its card; undo brings both back.
      this.addEventListener('card-remove', (event) => {
        const card = /** @type {HTMLElement} */ (event.target);
        if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
        // A note being written ends first, so Undo brings back its words.
        if (this.writing?.card === card) this.writing.end();
        const note = card.dataset.kind === 'note' ? card.dataset.note : '';
        // The focus, if it was on the card, goes to the nearest card left,
        // not to the top of the page.
        const box = card.getBoundingClientRect();
        const focused = card.contains(document.activeElement);
        queueMicrotask(() => {
          if (focused) {
            const others = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]);
            const next = others[nearestTo({ x: (box.left + box.right) / 2, y: (box.top + box.bottom) / 2 }, others.map((each) => each.getBoundingClientRect()))];
            next?.focus({ preventScroll: true });
          }
          if (note) {
            this.notes = this.notes.filter((each) => each.id !== note);
            this.paintQuoted(this.world());
          }
          this.dropLinksOfGone(card);
          this.keep();
          this.paintMap();
          this.drawSoon();
        });
      }, options);
    },

    disconnected() {
      cancelAnimationFrame(this.frame);
      cancelAnimationFrame(this.lineFrame);
    },

    /**
     * The frame-time readout. It shows, for the last second, the mean and the
     * worst time between frames, and the mean time draw() took.
     *
     * @param {AbortSignal} signal
     */
    measure(signal) {
      const readout = document.createElement('output');
      readout.className = 'table__perf';
      this.append(readout);
      /** @type {number[]} */
      const gaps = [];
      /** @type {number[]} */
      const draws = [];
      const draw = this.draw.bind(this);
      this.draw = () => {
        const start = performance.now();
        draw();
        draws.push(performance.now() - start);
      };
      let last = performance.now();
      const tick = (/** @type {number} */ now) => {
        gaps.push(now - last);
        last = now;
        if (!signal.aborted) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      const mean = (/** @type {number[]} */ list) => (list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0);
      const timer = setInterval(() => {
        readout.textContent = `frame ${mean(gaps).toFixed(1)} ms, worst ${Math.max(0, ...gaps).toFixed(1)} ms · lines ${mean(draws).toFixed(1)} ms × ${draws.length}`;
        gaps.length = 0;
        draws.length = 0;
      }, 1000);
      signal.addEventListener('abort', () => clearInterval(timer));
    },

    /**
     * Stops a resting palm's touches in the capture phase, before any card or
     * panel inside the table hears them.
     *
     * @param {AbortSignal} signal
     */
    guardPalms(signal) {
      const guard = createPalmGuard();
      /** @type {Map<number, EventTarget>} where each touch went down */
      const targets = new Map();
      const capture = { signal, capture: true };

      this.addEventListener('pointerdown', (event) => {
        if (event.pointerType !== 'touch' || !event.isTrusted) return;
        if (event.target) targets.set(event.pointerId, event.target);
        const rejected = guard.down({ id: event.pointerId, x: event.clientX, y: event.clientY, t: event.timeStamp });
        takeBack(rejected, event.pointerId, targets);
        if (!rejected.includes(event.pointerId)) return;
        event.stopPropagation();
        event.preventDefault();
      }, capture);

      /** @param {PointerEvent} event */
      const follow = (event) => {
        if (event.pointerType !== 'touch' || !event.isTrusted) return;
        const palm = guard.isRejected(event.pointerId);
        if (event.type !== 'pointermove') {
          guard.up(event.pointerId);
          targets.delete(event.pointerId);
        }
        if (palm) event.stopPropagation();
      };
      for (const type of ['pointermove', 'pointerup', 'pointercancel']) {
        this.addEventListener(type, (event) => follow(/** @type {PointerEvent} */ (event)), capture);
      }
    },

    /**
     * The card under the pointer, or null over the empty table or a panel.
     *
     * @param {EventTarget | null} target
     * @returns {Card | null}
     */
    cardAt(target) {
      const card = target instanceof Element ? target.closest('gesture-card') : null;
      return card && this.world().contains(card) ? /** @type {Card} */ (/** @type {unknown} */ (card)) : null;
    },

    /**
     * True over a panel at the edge of the table, which scrolls by itself.
     *
     * @param {EventTarget | null} target
     */
    overPanel(target) {
      return target instanceof Element && Boolean(target.closest('passage-search, table-menu, note-editor, time-line, table-rail'));
    },

    /** @param {WheelEvent} event */
    wheel(event) {
      if (this.overPanel(event.target)) return;
      event.preventDefault();
      this.stopGlide();
      const unit = wheelUnit(event.deltaMode);
      // A pinch on a trackpad comes as a wheel with Control held.
      if (this.wheelZoom(event, unit)) return;
      this.offset = { x: this.offset.x - event.deltaX * unit, y: this.offset.y - event.deltaY * unit };
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
      this.keepSoon();
    },

    /**
     * A pinch on a trackpad (a wheel with Control or Command): the table
     * zooms about the pointer. Past the least zoom, the overview shows; in
     * the overview, the overview's pinch.
     *
     * @param {WheelEvent} event
     * @param {number} unit
     */
    wheelZoom(event, unit) {
      if (!event.ctrlKey && !event.metaKey) return false;
      if (this.overview) {
        this.wheelOverview(event, unit);
        return true;
      }
      const point = { x: event.clientX, y: event.clientY };
      const factor = Math.exp((-event.deltaY * unit) / 200);
      // At the least zoom, a pinch in goes on, and once far enough the
      // overview shows; a pinch out starts again from here.
      const least = clampZoom(this.zoom * factor) === this.zoom && factor < 1;
      this.wheelPinch = least ? this.wheelPinch + Math.log(factor) : 0;
      clearTimeout(this.wheelPinchTimer);
      this.wheelPinchTimer = setTimeout(() => {
        this.wheelPinch = 0;
      }, 300);
      if (pinchZoom(this.zoom, Math.exp(this.wheelPinch)).overview) {
        this.wheelPinch = 0;
        this.enterOverview();
        return true;
      }
      this.zoomAbout(point, this.zoom * factor);
      return true;
    },

    /**
     * Zooms the table about a point on the screen, which stays where it is.
     *
     * @param {Point} point
     * @param {number} zoom
     */
    zoomAbout(point, zoom) {
      const next = clampZoom(zoom);
      this.setView(keeping(point, this.offset, this.zoom, next), next);
    },

    /**
     * Shows the table at an offset and a zoom at once, for a gesture: the
     * lines hide while it changes, and are drawn again where it rests.
     *
     * @param {Point} offset
     * @param {number} zoom
     */
    setView(offset, zoom) {
      this.stopGlide();
      this.offset = offset;
      this.zoom = zoom;
      this.scaleWorld();
      this.classList.add('is-scaling');
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => {
        const world = this.world();
        world.style.left = `${this.offset.x}px`;
        world.style.top = `${this.offset.y}px`;
      });
      // Its own timer: a pan's (paint) must not cancel the lines' return.
      clearTimeout(this.scaleTimer);
      this.scaleTimer = setTimeout(() => {
        this.classList.remove('is-scaling');
        this.drawSoon();
      }, 120);
      this.keepSoon();
    },

    /**
     * The world at the table's zoom, and the buttons say it. Far out, the
     * cards show their names (farOut).
     */
    scaleWorld() {
      this.world().style.scale = this.zoom === 1 ? '' : String(this.zoom);
      this.style.setProperty('--table-zoom', String(this.zoom));
      this.farOut();
      this.showZoom();
    },

    /**
     * Below TILE_ZOOM, each card shows its name on a chip, as in the
     * overview, and still moves (is-far). The overview names its own tiles.
     */
    farOut() {
      const far = !this.overview && this.zoom < TILE_ZOOM;
      if (far === this.classList.contains('is-far')) return;
      this.classList.toggle('is-far', far);
      if (!this.overview) this.tiles(this.tableCards(), far);
    },

    /** The zoom buttons: the zoom now, and which way it can go. */
    showZoom() {
      const group = this.querySelector('.table__zoom');
      if (!group) return;
      const zoom = this.overview ? this.zoomBefore : this.zoom;
      const reset = group.querySelector('[data-zoom="reset"]');
      if (reset) reset.textContent = this.overview ? 'All' : percent(zoom);
      group.querySelector('[data-zoom="in"]')?.toggleAttribute('disabled', !this.overview && zoom >= MOST_ZOOM - 0.001);
      group.querySelector('[data-zoom="out"]')?.toggleAttribute('disabled', this.overview);
    },

    /**
     * The zoom buttons: out and in a step, and back to full size. Past the
     * least zoom, out shows the overview; in the overview, in leaves it.
     *
     * @param {Event} event
     */
    zoomButton(event) {
      const button = event.target instanceof Element ? event.target.closest('[data-zoom]') : null;
      if (!(button instanceof HTMLElement)) return;
      this.zoomStep(/** @type {'in' | 'out' | 'reset'} */ (button.dataset.zoom));
    },

    /**
     * + and - zoom a step, and 0 comes to full size, when nothing has the
     * focus, as for the arrow keys.
     *
     * @param {KeyboardEvent} event
     */
    zoomKey(event) {
      /** @type {Record<string, 'in' | 'out' | 'reset'>} */
      const keys = { '+': 'in', '=': 'in', '-': 'out', _: 'out', 0: 'reset' };
      const asks = keys[event.key];
      if (!asks || !freeKey(event, this)) return;
      event.preventDefault();
      this.zoomStep(asks);
    },

    /**
     * A step of the zoom about the middle of the free part, in a short zoom.
     *
     * @param {'in' | 'out' | 'reset'} asks
     */
    zoomStep(asks) {
      if (this.overview) {
        if (asks !== 'out') this.leaveOverview(null, null);
        return;
      }
      if (asks === 'out' && this.zoom <= LEAST_ZOOM + 0.001) {
        this.enterOverview();
        return;
      }
      const next = asks === 'reset' ? 1 : nextStep(this.zoom, asks === 'in' ? 1 : -1);
      this.zoomTo(keeping(middleOf(this.free()), this.offset, this.zoom, next), next);
      this.keepSoon();
    },

    /**
     * The zoom buttons keep to the lower right corner of the free part, and
     * clear of the rail where it really is: on a phone, the rail grows below
     * the free part, clear of the browser's bar and the home bar.
     */
    placeZoomButtons() {
      const free = this.free();
      // From the table's own edges: on a phone it runs on under the browser's bar.
      const table = this.getBoundingClientRect();
      let right = free.right;
      let bottom = free.bottom;
      const rail = this.querySelector('table-rail');
      const box = rail?.getClientRects().length ? rail.getBoundingClientRect() : null;
      if (box && box.width > box.height && box.top > table.top + table.height / 2) bottom = Math.min(bottom, box.top);
      if (box && box.height > box.width && box.left > table.left + table.width / 2) right = Math.min(right, box.left);
      this.style.setProperty('--free-right', `${Math.round(table.right - right)}px`);
      this.style.setProperty('--free-bottom', `${Math.round(table.bottom - bottom)}px`);
    },

    /**
     * A trackpad pinch over the empty table, or anywhere in the overview:
     * in, to the overview; out, back to full size there.
     *
     * @param {WheelEvent} event
     * @param {number} unit
     */
    wheelOverview(event, unit) {
      // It counts only the way that can change the view: in, at full size;
      // out, in the overview.
      const pinch = this.wheelPinch - event.deltaY * unit;
      this.wheelPinch = this.overview ? Math.max(0, pinch) : Math.min(0, pinch);
      clearTimeout(this.wheelPinchTimer);
      this.wheelPinchTimer = setTimeout(() => {
        this.wheelPinch = 0;
      }, 300);
      const asks = pinchAsks(1, Math.exp(this.wheelPinch / 200), this.overview);
      if (!asks) return;
      this.wheelPinch = 0;
      this.zoomAsked(asks, { x: event.clientX, y: event.clientY });
    },

    /**
     * @param {'in' | 'out'} asks in, to the overview; out, to full size
     * @param {Point} point where, on the way out
     */
    zoomAsked(asks, point) {
      if (asks === 'in') this.enterOverview();
      else this.leaveOverview(point, null);
    },

    /**
     * Safari sends a pinch on the trackpad as gesture events, with the
     * scale since the gesture began: it zooms the table. Its turn is not used.
     *
     * @param {AbortSignal} signal
     */
    trackpad(signal) {
      /** @type {{ zoom: number } | null} */
      let gesture = null;
      /** @param {any} event */
      const start = (event) => {
        event.preventDefault();
        gesture = this.overview ? null : { zoom: this.zoom };
        this.pinchFrom = 1;
      };
      /** @param {any} event */
      const change = (event) => {
        event.preventDefault();
        const point = { x: event.clientX, y: event.clientY };
        // In the overview: the overview's pinch.
        if (!gesture) return this.pinchTo(event.scale, point);
        const { zoom, overview } = pinchZoom(gesture.zoom, event.scale);
        if (overview) {
          gesture = null;
          this.pinchFrom = 0;
          this.enterOverview();
          return;
        }
        this.zoomAbout(point, zoom);
      };
      /** @param {any} event */
      const end = (event) => {
        event.preventDefault();
        gesture = null;
      };
      this.addEventListener('gesturestart', start, { signal });
      this.addEventListener('gesturechange', change, { signal });
      this.addEventListener('gestureend', end, { signal });
    },

    /**
     * Listens for an assistant's commands (app/server.js, the table relay,
     * which tools/mcp-server.js sends to), and answers each. Where the app
     * has no relay, as on Cloudflare, the stream is not there, and the table
     * stops listening after the first try.
     *
     * @param {AbortSignal} signal
     */
    listen(signal) {
      if (typeof EventSource !== 'function') return;
      const stream = new EventSource('/api/table/events');
      let opened = false;
      stream.addEventListener('ready', () => {
        opened = true;
      });
      stream.addEventListener('error', () => {
        if (!opened) stream.close();
      });
      stream.addEventListener('command', async (event) => {
        /** @type {any} */
        let command;
        try {
          command = JSON.parse(/** @type {MessageEvent} */ (event).data);
        } catch {
          return;
        }
        /** @type {any} */
        let reply;
        try {
          reply = { ok: true, result: await this.obey(command) };
        } catch (error) {
          reply = { ok: false, error: error instanceof Error ? error.message : String(error) };
        }
        // The key of this table's stream shows the reply is from a table the
        // command went to.
        fetch('/api/table/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...reply, id: command.id, key: command.key }) }).catch(() => {});
      });
      signal.addEventListener('abort', () => stream.close());
    },

    /**
     * Does what an assistant asks (tools/mcp-server.js). Each change goes
     * through the table's own methods, so it is a step that Undo takes back,
     * as a hand's would be.
     *
     *   state         what is on the table: its cards, links and marks
     *   link          link two cards, or take the link away: { from, to, type, off }
     *   place         put passages down in a row: { addresses, version }
     *   guide         open a passage's guide in the search panel: { address }
     *   search        search, in the search panel: { query }
     *   show_entity   a person, place, group or event in the panel: { id }
     *   show_places   mark places on the map: { places }
     *   show_journey  draw a journey's route on the map: { journey }
     *   mark          mark words on every card, or unmark: { kind, value, label, off }
     *   study         lay out a study of a passage, a word, a topic or a person: { address }
     *   note          write a note, beside the cards it links to: { title, text, kind, link }
     *   clear         a new, empty table (Undo brings the old one back)
     *   undo          take back the last change
     *
     * @param {{ action: string, [key: string]: any }} command
     */
    async obey(command) {
      const run = this.commands()[command.action];
      if (!run) throw new Error(`The table does not know the command ${command.action}.`);
      if (command.action !== 'state') this.leaveOverview(null, null, false);
      return run(command);
    },

    /**
     * What the table does for each command of an assistant (tools/mcp-server.js),
     * and what it answers.
     *
     * @returns {Record<string, (command: any) => unknown>}
     */
    commands() {
      const panel = this.panel();
      const rules = () => this.rules.map(({ kind, value, label }) => ({ kind, value, label }));
      return {
        state: () => ({ name: this.name ?? '', cards: [...this.world().querySelectorAll('gesture-card')].map((card) => cardState(/** @type {HTMLElement} */ (card))), links: this.linkStates(), rules: rules() }),
        link: (command) => this.linkFor(command),
        place: async (command) => ({ placed: await this.placeRow(/** @type {string[]} */ (command.addresses ?? []).filter((each) => typeof each === 'string').slice(0, 12), String(command.version ?? '')) }),
        guide: async (command) => {
          await panel?.showGuide(String(command.address), []);
          return { shown: command.address };
        },
        search: (command) => {
          panel?.searchFor(String(command.query));
          return { searched: command.query };
        },
        show_entity: (command) => {
          panel?.showEntity(String(command.id));
          return { shown: command.id };
        },
        show_places: async (command) => {
          await this.showOnMap(/** @type {string[]} */ (command.places ?? []).join(','));
          return { shown: command.places };
        },
        show_journey: async (command) => {
          await this.showJourney(command.journey);
          return { shown: command.journey?.title ?? '' };
        },
        mark: (command) => {
          const rule = { kind: String(command.kind), value: String(command.value), label: String(command.label || command.value) };
          const on = this.rules.some((each) => sameRule(each, rule));
          if (Boolean(command.off) === on) this.setRules(toggleRule(this.rules, rule));
          return { rules: rules() };
        },
        study: async (command) => {
          const plan = await this.startStudy(String(command.address ?? ''));
          if (!plan) throw new Error('There is no study for that passage.');
          return { plan };
        },
        note: (command) => this.noteFor(command),
        clear: async () => {
          await this.openWorkspace(empty(), '', 'A new, empty table. Undo brings the old one back.');
          return { cleared: true };
        },
        undo: () => {
          this.undo();
          return { undone: true };
        },
      };
    },

    /**
     * An assistant's link between two cards on the table, named by their
     * addresses: set, with its type, from `from` to `to`; or taken away.
     *
     * @param {{ from?: unknown, to?: unknown, type?: unknown, off?: unknown }} command
     */
    linkFor({ from, to, type, off }) {
      const a = this.cardEnd(from);
      const b = this.cardEnd(to);
      if (sameEnd(a, b)) throw new Error('A card cannot be linked to itself.');
      this.changeLinks(off ? unlink(this.links, a, b) : setLink(this.links, a, b, linkType(type)));
      return { links: this.linkStates() };
    },

    /**
     * Keeps the links, if they changed, as a step that Undo takes back.
     *
     * @param {Link[]} links
     */
    changeLinks(links) {
      if (links === this.links) return;
      this.links = links;
      this.keep();
      this.drawSoon();
    },

    /**
     * The whole-card end of the card on the table with an address.
     *
     * @param {unknown} address
     * @returns {End}
     */
    cardEnd(address) {
      const card = typeof address === 'string' ? this.cardsAt(address)[0] : undefined;
      if (!card) throw new Error(`No card ${String(address)} is on the table. Put it down first, or see what is there.`);
      return wholeOf(card);
    },

    /** The links, each end by its name, for an assistant. */
    linkStates() {
      /** @param {End} end */
      const name = (end) => {
        if (!isWhole(end)) return { address: spanAddress(end), title: 'words' };
        const card = this.cardsAt(end.address)[0];
        return { address: end.address, title: card ? tileName(card) : '' };
      };
      return this.links.map(({ a, b, type }) => ({ from: name(a), to: name(b), type: type ?? '' }));
    },

    /**
     * Lays out a study (lib/study.js) of a passage, a word of the original
     * (G26), a topic (topic:PRAYER) or a person (person:paul_2479): its card,
     * its study note, and what the data finds, in columns in the open table
     * to the right of the cards there, every card linked to the middle. The
     * table glides to it. One step, which Undo takes back. Returns the plan,
     * or null when there is none.
     *
     * @param {string} address the subject
     * @returns {Promise<import('../lib/study.js').Plan | null>}
     */
    async startStudy(address) {
      const response = await fetch(`/study/${encodeURIComponent(address)}`).catch(() => null);
      /** @type {import('../lib/study.js').Plan | null} */
      const plan = response?.ok ? await response.json() : null;
      if (!plan) {
        this.toast('There is no study for this.');
        return null;
      }
      this.applying += 1;
      try {
        await this.putStudy(plan);
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
      this.drawSoon();
      return plan;
    },

    /**
     * The cards of a study, its note and its links, put on the table.
     *
     * @param {import('../lib/study.js').Plan} plan
     */
    async putStudy(plan) {
      const note = `note:${this.addNote({ doc: studyDoc(plan), title: `Study: ${plan.short}` })}`;
      const before = new Set(this.world().querySelectorAll('gesture-card'));
      // The map, when it is not on the table, is the study's last column.
      const map = (plan.mapIds || plan.journey) && !this.mapCard() ? [[MAP]] : [];
      const cards = await Promise.all([...columnsOf(plan, note), ...map].map((column) => Promise.all(column.map((each) => this.fetchCard(each, {})))));
      const laid = cards.map((column) => /** @type {Card[]} */ (column.filter(Boolean))).filter((column) => column.length);
      this.layStudy(laid, before);
      this.linkStudy(plan, note, laid);
      await this.markStudy(plan);
    },

    /**
     * A study's links, between the cards that came: a card that did not load
     * has none.
     *
     * @param {import('../lib/study.js').Plan} plan
     * @param {string} note the note's address
     * @param {Card[][]} laid
     */
    linkStudy(plan, note, laid) {
      const loaded = new Set(laid.flat().map((card) => card.dataset.address ?? ''));
      for (const { a, b, type } of linksOf(plan, note).filter((link) => [link.a, link.b].every((end) => isWhole(end) && loaded.has(end.address)))) {
        this.links = setLink(this.links, a, b, type);
      }
    },

    /**
     * A study's marks: its places or journey on the map, and a word's mark
     * on every card.
     *
     * @param {import('../lib/study.js').Plan} plan
     */
    async markStudy(plan) {
      if (plan.mapIds) await this.markPlaces(plan.mapIds);
      if (plan.journey) await this.drawJourney(plan.journey);
      const rule = /** @type {Rule | null} */ (plan.rule);
      if (rule && !this.rules.some((each) => sameRule(each, rule))) this.setRules(toggleRule(this.rules, rule));
    },

    /**
     * Draws a journey on the map, without moving the table (showJourney
     * moves it to the map).
     *
     * @param {import('../data/journeys.js').JourneyView} journey
     */
    async drawJourney(journey) {
      await this.openMap();
      await customElements.whenDefined('map-view');
      /** @type {any} */ (this.mapView())?.showJourney(journey);
      const proposed = journey.stops.filter((stop) => stop.proposed).map(({ x, y }) => ({ x, y }));
      await this.markPlaces(journey.stops.map((stop) => stop.place).filter(Boolean).join(','), proposed);
    },

    /**
     * Puts a study's cards down in their columns, to the right of the cards
     * already on the table, and zooms the table out, if it must, until the
     * study fits the free part of the screen across.
     *
     * @param {Card[][]} columns
     * @param {Set<Element>} before the cards on the table before the study
     */
    layStudy(columns, before) {
      const free = this.free();
      const margin = 48;
      const rights = [...before].filter((each) => each.isConnected).map((each) => each.getBoundingClientRect().right);
      const corner = { x: Math.max(free.left + margin, ...rights.map((right) => right + 4 * ROW_GAP)), y: free.top + margin };
      const sizes = columns.map((column) => column.map((card) => ({ width: card.offsetWidth, height: card.offsetHeight })));
      // The cards go on the table at their own size, from the corner.
      const start = tablePoint(corner, this.offset, this.zoom);
      const { at } = layOut(sizes, start, Infinity, ROW_GAP);
      columns.forEach((column, i) =>
        column.forEach((card, j) => {
          card.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: at[i][j].x, f: at[i][j].y });
          this.raise(card);
        }),
      );
      // The table zooms out until the study fits across, and shows it.
      const widths = sizes.map((column) => Math.max(0, ...column.map((size) => size.width)));
      const across = widths.reduce((sum, width) => sum + width, 0) + ROW_GAP * Math.max(0, widths.length - 1);
      const zoom = clampZoom(Math.min(this.zoom, across > 0 ? (free.right - free.left - 2 * margin) / across : this.zoom));
      this.zoomTo(offsetFor(start, { x: free.left + margin, y: free.top + margin }, zoom), zoom);
      this.keepSoon();
    },

    /**
     * Marks places on the map, without moving the table: the map comes onto
     * the table if it is not there.
     *
     * @param {string} ids place ids, with commas between
     * @param {{ x: number, y: number }[]} [more] other points the view takes in, in map units
     */
    async markPlaces(ids, more = []) {
      const list = ids.split(',').filter(Boolean);
      await this.openMap();
      this.shownPlaces = new Set(list);
      this.paintMap();
      await customElements.whenDefined('map-view');
      await this.mapView()?.fit(list, more);
    },

    /**
     * A new note in the workspace, with its words; its address is `note:` and
     * the id returned. The card comes when it is fetched.
     *
