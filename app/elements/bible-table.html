          this.setShort(card, card.dataset.form !== 'short');
          this.keep();
          this.drawSoon();
        },
        link: () => this.chooseLink(card, button),
        listen: () => this.readAloud(card, button),
        'note-kind': () => this.changeKind(card),
        spread: () => this.spreadList(card),
      };
      const name = Object.keys(named).find((each) => button.dataset[each]);
      if (name) named[name](button.dataset[name] ?? '');
      else actions[button.dataset.action ?? '']?.();
    },

    /**
     * @param {HTMLElement} card
     * @param {boolean} on
     */
    setSync(card, on) {
      if (on) card.dataset.sync = '';
      else delete card.dataset.sync;
      card.querySelector('[data-action="sync"]')?.setAttribute('aria-pressed', String(on));
    },

    /**
     * The card's short form: its heading, its opening words and the count of
     * its verses, in place of the verses (gesture-card, global.css).
     *
     * @param {HTMLElement} card
     * @param {boolean} on
     */
    setShort(card, on) {
      if (on) card.dataset.form = 'short';
      else delete card.dataset.form;
      card.querySelector('[data-action="short"]')?.setAttribute('aria-pressed', String(on));
    },

    /**
     * @param {HTMLElement} card
     * @param {boolean} on
     */
    setCompare(card, on) {
      if (on) card.dataset.compare = '';
      else delete card.dataset.compare;
      card.querySelector('[data-action="compare"]')?.setAttribute('aria-pressed', String(on));
    },

    /**
     * Reads a card aloud, verse by verse, in its version. The KJV and the
     * BSB play the app's own recording where it has the passage
     * (data/audio.js, routes/listen); otherwise, and for the Hebrew and the
     * Greek (Original, Word by word, Syntax), the device's voice reads it. A second press stops it,
     * and the card keeps the verse it stopped in (data-read-at): the next
     * press goes on from there. A reading that ends begins again next time.
     *
     * @param {HTMLElement} card
     * @param {HTMLButtonElement} button
     * @param {string} [from] a verse to read from (a tap on its number, or on
     *   a verse while the card reads)
     */
    async readAloud(card, button, from = '') {
      // The button turns the mode off: the reading stops, and its place is
      // kept for the next time.
      if (!from && card.dataset.listening !== undefined) {
        this.stopListening(card);
        return;
      }
      this.startListening(card);
      const start = startOf(card, from);
      const ended = this.readingEnded(card);
      const recording = recordingOf(button);
      if (recording?.chapters.length) this.playRecording(card, button, recording, start, ended);
      else await this.readWithDevice(card, start, ended);
    },

    /**
     * Ends a card's listening mode, and the reading on it.
     *
     * @param {HTMLElement} card
     */
    stopListening(card) {
      delete card.dataset.listening;
      if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
      this.listenLook(card);
    },

    /**
     * Puts a card in the listening mode: one card at a time, so any other
     * leaves it, and a reading on this card stops to begin again.
     *
     * @param {HTMLElement} card
     */
    startListening(card) {
      for (const other of this.world().querySelectorAll('gesture-card[data-listening]')) {
        if (other !== card) this.stopListening(/** @type {HTMLElement} */ (other));
      }
      card.dataset.listening = '';
      if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
    },

    /**
     * What happens when a card's reading ends or stops: it keeps the verse it
     * stopped in, for the next time; a reading that ends leaves the mode, and
     * begins again next time.
     *
     * @param {HTMLElement} card
     * @returns {(at: Element | null) => void}
     */
    readingEnded(card) {
      return (at) => {
        const id = at?.closest('[data-ref]')?.getAttribute('data-ref') ?? '';
        if (id) card.dataset.readAt = id;
        else {
          delete card.dataset.readAt;
          delete card.dataset.listening;
        }
        this.listenLook(card, false);
      };
    },

    /**
     * Plays a card's recording (data/audio.js). Its file begins now, muted,
     * in the tap: a phone plays sound only from one.
     *
     * @param {HTMLElement} card
     * @param {HTMLButtonElement} button
     * @param {{ reader: string, chapters: import('../lib/speech.js').RecordedChapter[] }} recording
     * @param {string} start the verse to begin with
     * @param {(at: Element | null) => void} ended
     */
    playRecording(card, button, { reader, chapters }, start, ended) {
      const opening = chapters.find((chapter) => chapter.verses.some((verse) => verse.id === start)) ?? chapters[0];
      const audio = new Audio(opening.file);
      audio.muted = true;
      audio.play().catch(() => null);
      this.listenLook(card, true);
      if (reader) this.toast("Read in the app's own voice.");

      // The lock screen's Play goes on from where the reading paused.
      const resume = () => {
        if (card.isConnected) this.readAloud(card, button, card.dataset.readAt ?? '');
      };
      const failed = () => this.toast('The recording could not be played. Check the connection and try again.');
      new Recording(audio, { ...lockScreen(card, reader), resume, failed }).play(chapters, (id) => card.querySelector(`[data-ref="${CSS.escape(id)}"]`), ended, start);
    },

    /**
     * Reads a card in the device's voice: the BSB, the Hebrew and the Greek,
     * and the KJV where no recording is listed.
     *
     * @param {HTMLElement} card
     * @param {string} start the verse to begin with
     * @param {(at: Element | null) => void} ended
     */
    async readWithDevice(card, start, ended) {
      const items = itemsOf(card).filter((item) => item.text.trim());
      if (!items.length) return;
      this.listenLook(card, true);
      const first = Math.max(0, items.findIndex((item) => item.element.closest('[data-ref]')?.getAttribute('data-ref') === start));
      const missing = await new Reader().read(items, ended, first);
      if (!missing) return this.sayVoice(items[first].lang);
      delete card.dataset.listening;
      this.listenLook(card, false);
      this.toast(`This device has no ${LANGUAGE_NAMES[missing]} voice.`);
    },

    /**
     * Says which of the device's voices reads, as a recording says who reads
     * it: "Read by Ava, this device's voice.", or "Read in this device's own
     * voice." where the app names none (lib/speech.js ownVoiceFits). The
     * name comes without the quality that Chrome adds to it.
     *
     * @param {import('../lib/speech.js').Lang} lang
     */
    async sayVoice(lang) {
      const voice = await namedVoice(lang);
      const name = voice?.name.replace(/\s*\((premium|enhanced)\)/i, '');
      this.toast(name ? `Read by ${name}, this device's voice.` : "Read in this device's own voice.");
    },

    /**
     * How a card's speaker button looks: pressed (lapis) while the card is
     * in the listening mode, and a stop square while it plays.
     *
     * @param {HTMLElement} card
     * @param {boolean} [playing]
     */
    listenLook(card, playing = false) {
      const button = card.querySelector('[data-action="listen"]');
      if (!(button instanceof HTMLElement)) return;
      const mode = card.dataset.listening !== undefined;
      const label = listenLabel(mode, playing, card.dataset.readAt ?? '');
      button.setAttribute('aria-pressed', String(mode));
      button.setAttribute('aria-label', label);
      button.title = label;
      // The icon's drawing, directly: svg-icon draws once, from the page.
      button.querySelector('svg-icon use')?.setAttribute('href', `/ui.svg#${playing ? 'stop' : 'listen'}`);
    },

    /**
     * Says something for a few seconds at the foot of the screen, and to a
     * screen reader.
     *
     * @param {string} message
     */
    toast(message) {
      const toast = this.querySelector('.table__toast');
      if (!(toast instanceof HTMLElement)) return;
      toast.textContent = '';
      requestAnimationFrame(() => {
        toast.textContent = message;
        toast.classList.add('is-on');
      });
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => {
        toast.classList.remove('is-on');
        toast.textContent = '';
      }, 4000);
    },

    toastTimer: 0,

    /**
     * Copies the words on a card with the reference after them.
     *
     * @param {HTMLElement} card
     * @param {HTMLButtonElement} button
     */
    async copyCard(card, button) {
      const note = card.dataset.kind === 'note' ? this.notes.find((each) => each.id === card.dataset.note) : null;
      this.writing?.end();
      const done = await copyText(this.textToCopy(card, note));
      // The button is an icon: a small label beside it says what happened.
      button.dataset.done = done ? 'Copied' : 'Copy failed';
      setTimeout(() => {
        delete button.dataset.done;
      }, 1500);
    },

    /**
     * What Copy puts on the clipboard: a note as Markdown, a list as text, a
     * passage as its words and reference.
     *
     * @param {HTMLElement} card
     * @param {any} note the card's note, if it is a note's card
     */
    textToCopy(card, note) {
      if (note) return this.noteForCopy(card, note);
      const list = this.listAt(card.dataset.address ?? '');
      return list ? listText(list) : passageForCopy(card);
    },

    /**
     * A note as it is copied: Markdown, its own title on top.
     *
     * @param {HTMLElement} card
     * @param {{ doc?: any, text: string, quotes: Span[], title?: string }} note
     */
    noteForCopy(card, note) {
      if (!note.title) return this.markdownOf(card, note, 2);
      return `## ${note.title}\n\n${this.markdownOf(card, note, 3)}`;
    },

    /**
     * @param {HTMLElement} card a note card
     * @param {string} address the span address of the quote
     */
    async unquote(card, address) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      if (!note) return;
      if (this.writing?.id === note.id) {
        unquoteIn(this.writing.view, address);
        return;
      }
      note.quotes = note.quotes.filter((each) => spanAddress(each) !== address);
      note.doc = docOf(note).toJSON();
      this.redrawNote(card, note);
      this.paintQuoted(this.world());
      this.keep();
    },

    /**
     * Shows a note's kind on its card: its label, the colour of its band, and
     * a question's Answered box.
     *
     * @param {HTMLElement} card
     * @param {{ kind?: string, answered?: boolean, title?: string }} note
     */
    paintKind(card, note) {
      const label = labelOf(note.kind);
      paintTitle(card, note, label);
      if (note.kind) card.dataset.noteKind = note.kind;
      else delete card.dataset.noteKind;
      paintKindButton(card, label);
      paintAnswered(card, note);
    },

    /**
     * Writes a note's title in place: one line of plain text. Enter, or a
     * press anywhere else, keeps it; Escape leaves it as it was. A title left
     * empty, or the kind's own name, is no title: the kind's name shows.
     *
     * @param {HTMLElement} card
     */
    writeTitle(card) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      const heading = card.querySelector('.passage__heading');
      if (!note || !(heading instanceof HTMLElement) || heading.isContentEditable) return;
      this.writing?.end();
      const dock = /** @type {any} */ (this.querySelector('note-editor'));
      const done = new AbortController();
      const writing = { card, note, heading, dock, done, before: note.title ?? '' };
      openTitle(heading);
      card.classList.add('is-writing');
      dock?.dock(note.id);
      listenTitle(heading, (keep) => this.closeTitle(writing, keep), done.signal);
      heading.addEventListener('keys-type', () => this.drawSoon(), { signal: done.signal });
    },

    /**
     * Ends the writing of a note's title: kept (Enter, a press elsewhere), or
     * as it was (Escape). A title left empty, or the kind's own name, is no
     * title: the kind's name shows.
     *
     * @param {{ card: HTMLElement, note: { kind?: string, title?: string }, heading: HTMLElement, dock: any, done: AbortController, before: string }} writing
     * @param {boolean} keep
     */
    closeTitle({ card, note, heading, dock, done, before }, keep) {
      if (done.signal.aborted) return;
      done.abort();
      const text = cleanTitle(heading.textContent);
      closeTitleField(heading);
      card.classList.remove('is-writing');
      dock?.undock();
      setTitle(note, keep ? titleFrom(text, note.kind) : before);
      this.paintKind(card, note);
      this.drawSoon();
      if ((note.title ?? '') !== before) this.keep();
    },

    /**
     * A question's Answered box was ticked or unticked.
     *
     * @param {Event} event
     */
    answeredChanged(event) {
      const box = event.target;
      if (!(box instanceof HTMLInputElement) || box.dataset.action !== 'note-answered') return;
      const found = this.noteOn(box);
      if (!found) return;
      setAnswered(found.note, box.checked);
      this.paintKind(found.card, found.note);
      this.keep();
    },

    /**
     * The note card an element is on, and its note.
     *
     * @param {Element} element
     */
    noteOn(element) {
      const card = element.closest('gesture-card[data-kind="note"]');
      const note = card instanceof HTMLElement ? this.notes.find((each) => each.id === card.dataset.note) : undefined;
      return note ? { card: /** @type {HTMLElement} */ (card), note } : null;
    },

    /**
     * On a phone, one panel is open at a time: the one that opens closes the
     * others (each sends panel-open only on a phone).
     *
     * @param {string} opened
     */
    onePanel(opened) {
      /** @type {Record<string, () => void>} */
      const close = {
        search: () => collapse(this.querySelector('passage-search')),
        timeline: () => collapse(this.querySelector('time-line')),
        menu: () => /** @type {any} */ (this.querySelector('table-menu'))?.setShown?.(false),
      };
      for (const [name, closeIt] of Object.entries(close)) if (name !== opened) closeIt();
    },

    /**
     * The next kind for a note: Note, Observation, Question, Interpretation,
     * Application, Prayer, and Note again.
     *
     * @param {HTMLElement} card
     */
    changeKind(card) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      if (!note) return;
      const kind = nextKind(note.kind);
      if (kind) note.kind = kind;
      else delete note.kind;
      this.paintKind(card, note);
      this.keep();
    },

    /** The table's questions, for the search panel: the open ones first. */
    questions() {
      return this.notes
        .filter((note) => note.kind === 'question')
        .map((note) => ({ id: note.id, title: note.title ?? '', text: note.text, answered: Boolean(note.answered) }))
        .sort((a, b) => Number(a.answered) - Number(b.answered));
    },

    /**
     * Closes a note's quote into a reference to its verses.
     *
     * @param {HTMLElement} card a note card
     * @param {string} address the span address of the quote
     */
    fold(card, address) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      if (!note) return;
      const writing = this.writing?.id === note.id ? this.writing : null;
      if (writing) {
        foldQuote(writing.view.state, quoteAt(writing.view.state.doc, address), writing.view.dispatch);
        return;
      }
      const next = foldedIn(docOf(note), address);
      if (!next) return;
      note.doc = next.toJSON();
      note.quotes = note.quotes.filter((each) => spanAddress(each) !== address);
      this.redrawNote(card, note);
      this.paintQuoted(this.world());
      this.keep();
    },

    async newNote() {
      const id = newId('n');
      this.notes = [...this.notes, { id, text: '', quotes: [] }];
      const card = await this.fetchCard(`note:${id}`, {});
      // A note whose card did not come is not kept.
      if (!card) {
        this.notes = this.notes.filter((each) => each.id !== id);
        return;
      }
      card.placeAt(this.openSpot());
      this.keep();
      this.writeNote(card, null);
    },

    /** @type {{ id: string, card: HTMLElement, view: any, end: () => void } | null} the note being written (view: ProseMirror's EditorView) */
    writing: null,

    /**
     * Writes in a note where it lies: its words become the editor.
     *
     * @param {HTMLElement} card a note card
     * @param {{ x: number, y: number } | null} at where the caret goes, else at the end
     */
    writeNote(card, at) {
      if (this.writing?.card === card) return;
      this.writing?.end();
      const note = this.notes.find((each) => each.id === card.dataset.note);
      const host = card.querySelector('.note__text');
      if (!note || !(host instanceof HTMLElement)) return;
      const dock = /** @type {any} */ (this.querySelector('note-editor'));
      const before = noteSnapshot(note);
      const { view, end } = editNoteText(host, docOf(note), {
        at,
        quotes: this.quotesOf(card),
        load: (span) => this.loadQuote(span),
        change: (doc) => this.noteChanged(card, note, doc),
        done: () => this.noteDone(card, note, dock, before),
      });
      view.dom.id = 'note-field';
      card.classList.add('is-writing');
      this.writing = { id: note.id, card, view, end };
      this.raise(/** @type {any} */ (card));
      dock?.dock(note.id);
      requestAnimationFrame(() => this.showCaret());
    },

    /**
     * A note being written changed: its words are kept as they come (the
     * undo step comes at the end), and its quotes are the document's.
     *
     * @param {HTMLElement} card
     * @param {{ doc?: any, text: string, quotes: Span[] }} note
     * @param {any} doc the note's document (ProseMirror)
     */
    noteChanged(card, note, doc) {
      note.doc = doc.toJSON();
      note.text = toText(doc);
      // A quote deleted, opened or folded changes the note's list, and the
      // marks on the verses.
      const spans = quotesIn(doc);
      if (spans.join() !== note.quotes.map(spanAddress).join()) {
        note.quotes = spans.flatMap((each) => parseSpanAddress(each) ?? []);
        card.querySelector('.note__hint')?.toggleAttribute('hidden', note.quotes.length > 0);
        this.paintQuoted(this.world());
      }
      this.drawSoon();
      this.showCaret();
      // Kept as it goes, in case the page closes.
      clearTimeout(this.noteTimer);
      this.noteTimer = setTimeout(() => save(this.current()), 600);
    },

    /**
     * A note's writing ended: one undo step, if its words changed.
     *
     * @param {HTMLElement} card
     * @param {{ doc?: any, text: string }} note
     * @param {any} dock
     * @param {string} before
     */
    noteDone(card, note, dock, before) {
      clearTimeout(this.noteTimer);
      this.writing = null;
      card.classList.remove('is-writing');
      dock?.undock();
      this.drawSoon();
      if (noteSnapshot(note) !== before) this.keep();
    },

    /**
     * Pans the table so the caret of the note being written is in sight:
     * above a phone's keyboard (the visual viewport) and the app's dock.
     */
    showCaret() {
      const view = this.writing?.view;
      if (!view || view.isDestroyed) return;
      let caret;
      try {
        caret = view.coordsAtPos(view.state.selection.head);
      } catch {
        return;
      }
      const { dx, dy } = shiftInto(caret, this.writingArea());
      if (Math.abs(dx) + Math.abs(dy) === 0) return;
      this.offset = { x: this.offset.x + dx, y: this.offset.y + dy };
      this.paint();
      this.keepSoon();
    },

    /**
     * The part of the screen a caret must stay in while a note is written:
     * inside the visual viewport (above a phone's keyboard) and above the
     * app's keyboard dock, with a margin.
     */
    writingArea() {
      const port = visualViewport;
      const dock = this.querySelector('note-editor');
      const dockTop = dock?.getClientRects().length ? dock.getBoundingClientRect().top : Infinity;
      return inset(viewportBox(port), { top: 16, left: 16, right: 16, bottom: 24 }, dockTop);
    },

    /**
     * Marks the verses that a note quotes, on every card but the notes.
     *
     * @param {Element} root
     */
    paintQuoted(root) {
      const ranges = this.notes.flatMap((note) => note.quotes).map((each) => [wordKey(each.from), wordKey(each.to)]);
      for (const verse of root.querySelectorAll('kjv-verse[data-ref], .bsb-verse[data-ref]')) {
        const element = /** @type {HTMLElement} */ (verse);
        if (element.closest('gesture-card[data-kind="note"]')) continue;
        const quoted = verseRanges(element.dataset.ref ?? '').some(([first, last]) => ranges.some(([from, to]) => from <= last && to >= first));
        element.classList.toggle('is-quoted', quoted);
      }
    },

    /**
     * @param {string} address
     * @param {FetchOptions} options
     * @returns {Promise<Card | null>}
     */
    async fetchCard(address, { version = 'kjv', replacing = null, id, sync = false, compare = false, short = false }) {
      if (this.contentGone(address)) return null;
      const note = this.noteAt(address);
      const card = await loadCard(address, version, note ? note.quotes : []);
      if (!card) {
        this.toast('This card could not load. Check the connection and try again.');
        return null;
      }
      if (!this.putCard(card, replacing, id)) return null;
      this.markCard(card, { sync, compare, short, version, note });
      // Far out, or in the overview, a new card shows its name too.
      if (this.overview || this.classList.contains('is-far')) this.tiles([/** @type {Card} */ (/** @type {unknown} */ (card))], true);
      this.paintList(card);
      await customElements.whenDefined('gesture-card');
      this.drawSoon();
      this.loadReferences(card);
      return /** @type {Card} */ (/** @type {unknown} */ (card));
    },

    /**
     * The whole-card links of a card that went, when it was the last card of
     * its address and no list holds one. A list takes its cards with it, and
     * their links; Undo brings them back.
     *
     * @param {HTMLElement} card
     */
    dropLinksOfGone(card) {
      const gone = [String(card.dataset.address), ...this.dropList(card)];
      const lost = gone.filter((address) => !this.cardsAt(address).length && !inAList(this.lists, address));
      this.links = dropLinksTo(this.links, lost.map((address) => ({ address })));
    },

    /**
     * Whether a card's address names a note or a list that is gone, so the
     * card has nothing to show.
     *
     * @param {string} address
     */
    contentGone(address) {
      return this.noteAt(address) === false || this.listAt(address) === false;
    },

    /**
     * The list a list card's address names: null for any other card, false
     * when the list is gone.
     *
     * @param {string} address
     */
    listAt(address) {
      if (!address.startsWith('list:')) return null;
      return this.lists.find((each) => `list:${each.id}` === address) ?? false;
    },

    /**
     * A list card's rows, name and hint, from its list.
     *
     * @param {HTMLElement} card
     */
    paintList(card) {
      const list = this.listAt(card.dataset.address ?? '');
      if (list) paintListCard(card, list);
    },

    /** Every list card, painted again (after an undo, say). */
    paintLists() {
      for (const card of this.world().querySelectorAll('gesture-card[data-kind="list"]')) this.paintList(/** @type {HTMLElement} */ (card));
    },

    /**
     * Changes one list, and paints its card.
     *
     * @param {string} id
     * @param {(list: import('../lib/workspace.js').List) => import('../lib/workspace.js').List} change
     */
    changeList(id, change) {
      this.lists = this.lists.map((list) => (list.id === id ? change(list) : list));
      const card = this.cardsAt(`list:${id}`)[0];
      if (card) this.paintList(card);
    },

    /**
     * A list's name as it is typed.
     *
     * @param {EventTarget | null} field
     */
    nameList(field) {
      if (!(field instanceof HTMLInputElement) || !field.matches('.list__name')) return;
      const id = /** @type {HTMLElement | null} */ (field.closest('gesture-card'))?.dataset.address?.slice(5) ?? '';
      const title = field.value.trim().slice(0, 120);
      this.changeList(id, ({ title: _, ...list }) => (title ? { ...list, title } : list));
    },

    /**
     * @param {HTMLElement} card a list card
     * @param {string} id a row's
     * @param {-1 | 1} by
     */
    moveRow(card, id, by) {
      this.changeList(card.dataset.address?.slice(5) ?? '', (list) => moved(list, id, by));
      this.keep();
    },

    /**
     * Cards into a list: each leaves the table and becomes a row, kept as it
     * was. Its links stay, drawn to the list card. Not a list or the map.
     *
     * @param {HTMLElement} listCard
     * @param {Card[]} cards
     */
    gather(listCard, cards) {
      const taken = cards.filter((card) => card !== listCard && gatherable(card));
      const items = taken.flatMap((card) => {
        const stored = this.storedOf(card);
        return stored ? [{ ...stored, title: cardTitle(card, stored.address), text: firstWordsOf(card) }] : [];
      });
      if (!items.length) return false;
      this.changeList(listCard.dataset.address?.slice(5) ?? '', (list) => withItems(list, items));
      for (const card of taken) card.remove();
      this.keep();
      this.paintMap();
      this.drawSoon();
      return true;
    },

    /**
     * A card let go on a list card: it joins the list, when its middle is
     * over the list.
     *
     * @param {Card} card
     */
    dropOnList(card) {
      const under = this.listUnder(card);
      this.clearListMarks();
      return under ? this.gather(under, [card]) : false;
    },

    /**
     * The list card under a card's middle, if any; never the card itself.
     *
     * @param {Card} card
     * @returns {HTMLElement | null}
     */
    listUnder(card) {
      if (!(card instanceof HTMLElement) || !gatherable(card)) return null;
      const box = card.getBoundingClientRect();
      const middle = { x: (box.left + box.right) / 2, y: (box.top + box.bottom) / 2 };
      const lists = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card[data-kind="list"]')]);
      return lists.find((list) => list !== card && inside(middle, list.getBoundingClientRect())) ?? null;
    },

    /**
     * While a card moves, the list it would join shows it.
     *
     * @param {Card} card
     */
    markListUnder(card) {
      const under = this.listUnder(card);
      for (const list of this.world().querySelectorAll('gesture-card[data-kind="list"]')) list.classList.toggle('is-drop-target', list === under);
    },

    clearListMarks() {
      for (const list of this.world().querySelectorAll('.is-drop-target')) list.classList.remove('is-drop-target');
    },

    /**
     * Takes cards out of a list, in a column beside it: all of them, or those
     * named. One step that undo takes back.
     *
     * @param {HTMLElement} listCard
     * @param {string[]} [ids]
     */
    async spreadList(listCard, ids) {
      const list = this.listAt(listCard.dataset.address ?? '');
      if (!list) return;
      const taking = list.items.filter((item) => !ids || ids.includes(item.id));
      if (!taking.length) return;
      this.changeList(list.id, (each) => ({ ...each, items: each.items.filter((item) => !taking.includes(item)) }));
      const matrix = /** @type {Card} */ (/** @type {unknown} */ (listCard)).matrix;
      await this.putColumn(taking, matrix.e + listCard.offsetWidth + ROW_GAP, matrix.f);
      this.keep();
      this.drawSoon();
    },

    /**
     * Cards that were kept, put down one under another from a point.
     *
     * @param {import('../lib/workspace.js').ListItem[]} items
     * @param {number} x
     * @param {number} top
     */
    async putColumn(items, x, top) {
      let y = top;
      for (const item of items) {
        await this.restore({ ...item, matrix: { a: 1, b: 0, c: 0, d: 1, e: x, f: y } });
        const card = this.cardsAt(item.address).find((each) => idOf(each) === item.id);
        y += (card?.offsetHeight ?? 200) + ROW_GAP / 2;
      }
    },

    /**
     * A list card closed: its list goes, and the addresses of its cards are
     * given back, so their links can go too.
     *
     * @param {HTMLElement} card
     * @returns {string[]}
     */
    dropList(card) {
      const list = this.listAt(card.dataset.address ?? '');
      if (!list) return [];
      this.lists = this.lists.filter((each) => each !== list);
      if (list.items.length) this.toast(`The list went with its ${list.items.length === 1 ? 'card' : `${list.items.length} cards`}. Undo brings it back.`);
      return list.items.map((item) => item.address);
    },

    /**
     * The link chooser's offer to gather the card, and every card linked to
     * it step by step, into a new list in its place.
     *
     * @param {HTMLElement} chooser
     * @param {Card} card
     */
    offerGather(chooser, card) {
      const button = /** @type {HTMLButtonElement} */ (chooser.querySelector('.chooser__gather'));
      button.hidden = !gatherable(card);
      button.onclick = () => {
        chooser.hidePopover();
        this.gatherGroup(card);
      };
    },

    /**
     * A new list in a card's place, with the card and its group in it.
     *
     * @param {Card} card
     */
    async gatherGroup(card) {
      const joins = this.links.map(({ a, b }) => /** @type {[Element[], Element[]]} */ ([this.placesOf(a).map((place) => place.card), this.placesOf(b).map((place) => place.card)]));
      const group = /** @type {Card[]} */ ([...cluster(/** @type {Element} */ (card), joins)]);
      const id = newId('l');
      this.lists = [...this.lists, { id, items: [] }];
      const listCard = await this.fetchCard(`list:${id}`, {});
      if (!listCard) return;
      listCard.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: card.matrix.e, f: card.matrix.f });
      this.raise(listCard);
      this.gather(listCard, group);
    },

    /**
     * The note a note card's address names: null for any other card, false
     * when the note is gone.
     *
     * @param {string} address
     */
    noteAt(address) {
      if (!address.startsWith('note:')) return null;
      return this.notes.find((each) => `note:${each.id}` === address) ?? false;
    },

    /**
     * Puts a card that loaded on the table, in the place of the one it
     * replaces. Not if that one went while it loaded (removed, or replaced by
     * another change): it must not come back as a second card.
     *
     * @param {HTMLElement} card
     * @param {Element | null} replacing
     * @param {string | undefined} id
     */
    putCard(card, replacing, id) {
      if (replacing && !replacing.isConnected) return false;
      card.dataset.id = id ?? newId('c');
      if (replacing) replacing.replaceWith(card);
      else this.world().append(card);
      return true;
    },

    /**
     * A new card's state and marks: synced, compared, a note's words, and the
     * marks every card has.
     *
     * @param {HTMLElement} card
     * @param {{ sync: boolean, compare: boolean, short: boolean, version: string, note: any }} state
     */
    markCard(card, { sync, compare, short, version, note }) {
      if (sync) this.setSync(card, true);
      if (short) this.setShort(card, true);
      if (compare) this.setCompare(card, version === 'both');
      if (note) this.fillNote(card, note);
      this.paintCard(card);
    },

    /**
     * A note's words on its card, with each quote's words (as the server drew
     * them) in its place among them, and its kind.
     *
     * @param {HTMLElement} card
     * @param {{ doc?: any, text: string, quotes: Span[], kind?: string, answered?: boolean, title?: string }} note
     */
    fillNote(card, note) {
      const quotes = this.quotesOf(card);
      for (const section of card.querySelectorAll('.note > .note__quote[data-quote]')) {
        quotes.set(/** @type {HTMLElement} */ (section).dataset.quote ?? '', /** @type {HTMLElement} */ (section));
        section.remove();
      }
      const text = card.querySelector('.note__text');
      if (text instanceof HTMLElement) showNoteText(text, docOf(note), quotes);
      this.paintKind(card, note);
    },

    /**
     * Marks a new card as the table marks every card: highlights, the word
     * studied, quoted verses, rules, and its events on the timeline.
     *
     * @param {HTMLElement} card
     */
    paintCard(card) {
      paintHighlights(card, this.highlights);
      this.paintStudy(card);
      this.paintQuoted(card);
      this.paintRules(card);
      this.loadEvents(card);
    },

    /**
     * Where a tapped result goes: near the top of the free part of the screen, and
     * a step lower and further right each time, so cards placed one after
     * another do not cover each other's headings.
     *
     * @returns {Point}
     */
    openSpot() {
      const free = this.free();
      const step = (this.world().querySelectorAll('gesture-card').length - 1) % 6;
      return { x: free.left + 96 + step * 72, y: free.top + 96 + step * 72 };
    },

    /**
     * The part of the screen that the rail and its docked panels leave free
     * for the cards (table-rail).
     *
     * @returns {{ left: number, top: number, right: number, bottom: number }}
     */
    free() {
      const rail = /** @type {any} */ (this.querySelector('table-rail'));
      return rail?.freeBox?.() ?? { left: 0, top: 0, right: innerWidth, bottom: innerHeight };
    },

    /** @returns {Workspace} what is on the table now */
    current() {
      const cards = [...this.world().querySelectorAll('gesture-card')].flatMap((card) => this.storedOf(/** @type {Card} */ (/** @type {unknown} */ (card))) ?? []);
      // The cards that did not load stay in the table that is kept.
      const kept = this.unloaded.filter((stored) => !cards.some((card) => card.id === stored.id));
      // In the overview, the table is kept as it will be when it leaves.
      const zoom = this.overview ? this.zoomBefore : this.zoom;
      const offset = this.overview ? keeping(middleOf(this.free()), this.offset, this.zoom, zoom) : this.offset;
      return { offset, zoom, cards: [...cards, ...kept], highlights: this.highlights, links: this.links, notes: this.notes, rules: this.rules, lists: this.lists, trail: this.trailNow() };
    },

    /** The search panel's trail, or the one a table brought that the panel has not taken yet. */
    trailNow() {
      const panel = this.panel();
      return this.pendingTrail ?? (typeof panel?.trail === 'function' ? panel.trail() : emptyTrail());
    },

    /**
     * A card as the table keeps it: its id, address, place and version, and
     * whether it is synced or compared; the map's card, its view.
     *
     * @param {Card} card
     * @returns {StoredCard | null}
     */
    storedOf(card) {
      const address = card.dataset.address ?? '';
      if (!address || !card.matrix) return null;
      return { id: idOf(card), address, matrix: card.matrix, version: versionOf(card), ...cardFlags(card), ...this.mapViewOf(card) };
    },

    /**
     * The map card's view, if it is zoomed in.
     *
     * @param {Card} card
     */
    mapViewOf(card) {
      const view = card.dataset.address === MAP ? this.mapView(card)?.view : null;
      return view && view.w < WIDTH ? { view: { x: round(view.x), y: round(view.y), w: round(view.w) } } : {};
    },

    /**
     * Keeps the table in this browser, and records a step in the undo history.
     * While a change is under way, it waits for the change to finish.
     *
     * @param {boolean} [record] false for a change that is itself an undo or a redo
     */
    keep(record = true) {
      if (this.applying > 0) {
        this.later = Boolean(this.later) || record;
        return;
      }
      const workspace = this.current();
      this.saved(save(workspace));
      if (record) this.history?.record(snapshot(workspace));
      this.showHistory();
      /** @type {any} */ (this.querySelector('passage-search'))?.setQuestions?.(this.questions());
    },

    /** A keep() that waited for a change. */
    finish() {
      if (this.applying > 0) return;
      /** @type {any} */ (this.querySelector('passage-search'))?.setQuestions?.(this.questions());
      const later = this.later;
      this.later = null;
      if (later !== null) this.keep(later);
      else this.saved(save(this.current()));
    },

    /** whether the last save to this browser failed */
    unsaved: false,

    /**
     * Says once, when the browser stops keeping the table (its storage is
     * full or off), that the table is not kept; and again if it fails after
     * working.
     *
     * @param {boolean} ok
     */
    saved(ok) {
      if (!ok && !this.unsaved) this.toast('This browser cannot keep the table now. Save it to a file in Tools, Saved.');
      this.unsaved = !ok;
    },

    showHistory() {
      /** @type {any} */ (this.querySelector('table-rail'))?.setHistory?.(this.history?.canUndo(), this.history?.canRedo());
    },

    undo() {
      // A note being written ends first, so its words are in the step.
      this.writing?.end();
      const state = this.history?.undo();
      if (state) this.apply({ ...parse(state), offset: this.offset }, false);
    },

    redo() {
      // A note being written ends first, so its words are in the step.
      this.writing?.end();
      const state = this.history?.redo();
      if (state) this.apply({ ...parse(state), offset: this.offset }, false);
    },

    /**
     * Makes the table show a workspace: moves the cards that stay, fetches
     * the ones that are new or changed, and takes away the rest.
     *
     * @param {Workspace} target
     * @param {boolean} record whether this is a new step in the history
     */
    /** @type {Promise<unknown>} the table change under way, so the next waits for it */
    changing: Promise.resolve(),

    /**
     * Puts a table state on the table. Changes run one after another: two that
     * overlap (Undo pressed twice fast) would each add the same card.
     *
     * @param {Workspace} target
     * @param {boolean} record
     */
    apply(target, record) {
      this.leaveOverview(null, null, false);
      const run = () => this.applyNow(target, record);
      this.changing = this.changing.then(run, run);
      return this.changing;
    },

    /**
     * @param {Workspace} target
     * @param {boolean} record
     */
    async applyNow(target, record) {
      // A note being written ends first, so its words are kept.
      this.writing?.end();
      this.applying += 1;
      try {
        const byId = new Map([...this.world().querySelectorAll('gesture-card')].map((card) => [idOf(/** @type {HTMLElement} */ (card)), /** @type {Card} */ (/** @type {unknown} */ (card))]));
        const { move, add, remove } = diffCards(this.current().cards, target.cards);
        this.adopt(target, record);
        for (const id of remove) byId.get(id)?.remove();
        const waits = [...add.map((stored) => this.restore(stored)), ...move.map((stored) => this.moveCard(byId.get(stored.id), stored, record))];
        await Promise.all(waits);
        this.paintLists();
        this.repaint();
        this.later = Boolean(this.later) || record;
      } finally {
        this.applying -= 1;
        this.finish();
      }
    },

    /**
     * Takes a table state's marks, notes, rules and pan. An opened table
     * brings its trail, and shows its step; an undo leaves the trail as it is,
     * as it leaves the pan of the table.
     *
     * @param {Workspace} target
     * @param {boolean} record
     */
    adopt(target, record) {
      // A card that did not load and is not in the new state is gone.
      this.unloaded = this.unloaded.filter((stored) => target.cards.some((card) => card.id === stored.id));
      this.highlights = target.highlights;
      this.links = target.links;
      this.notes = target.notes;
      this.lists = target.lists;
      this.rules = target.rules;
      if (record) this.panel()?.setTrail?.(target.trail, true);
      // An opened table brings its zoom; an undo leaves the zoom, as the pan.
      if (record && target.zoom !== this.zoom) {
        this.zoom = target.zoom;
        this.scaleWorld();
      }
      if (target.offset.x === this.offset.x && target.offset.y === this.offset.y) return;
      this.offset = target.offset;
      this.paint();
    },

    /**
     * Moves a card to where a table state has it, with its sync and compare;
     * an opened table also brings the map's view. A note's card loads again,
     * as its quotes can differ between the two states.
     *
     * @param {Card | undefined} card none: a card that did not load, kept as it is
     * @param {StoredCard} stored
     * @param {boolean} record
     */
    moveCard(card, stored, record) {
      if (!card) return null;
      card.setMatrix(stored.matrix);
      this.setSync(card, Boolean(stored.sync));
      this.setCompare(card, Boolean(stored.compare));
      if (record) this.mapView(card)?.setView(stored.view ?? { x: 0, y: 0, w: WIDTH });
      return card.dataset.kind === 'note' ? this.replaceCard(card, stored.address, 'kjv') : null;
    },

    /** Marks every card again, after the table changed. */
    repaint() {
      paintHighlights(this.world(), this.highlights);
      this.paintQuoted(this.world());
      this.paintRules(this.world());
      this.showRules();
      this.paintMap();
      this.drawSoon();
    },

    /**
     * Puts a whole workspace on the table, as one step that undo takes back.
     *
     * @param {Workspace} workspace
     * @param {string} name
     * @param {string} message
     */
    async openWorkspace(workspace, name, message) {
      await this.apply(workspace, true);
      this.setName(name);
      /** @type {any} */ (this.querySelector('table-menu'))?.refresh(message);
    },

    /** @param {string} name */
    setName(name) {
      this.name = name;
      try {
        localStorage.setItem(NAME_KEY, name);
      } catch {
        // No storage: the name lasts until the page closes.
      }
      /** @type {any} */ (this.querySelector('table-menu'))?.setName(name);
    },

    /** @param {string} name */
    saveAs(name) {
      const menu = /** @type {any} */ (this.querySelector('table-menu'));
      if (!saveNamed(name, this.current())) {
        menu?.refresh('This browser could not save it: its storage is off or full. Save to a file instead.');
        return;
      }
      this.setName(name);
      menu?.refresh(`Saved “${name}”.`);
      // The reader wants to keep it: ask the browser not to clear it
      // (lib/persist.js). Said only when the browser refuses.
      keepStorage().then((kept) => {
        if (kept === 'refused') menu?.refresh(`Saved “${name}”. This browser can still clear it to make space, so save to a file to keep a copy.`);
      });
    },

    /** @param {string} name */
    async openNamed(name) {
      const workspace = loadNamed(name);
      if (!workspace) return;
      await this.openWorkspace(workspace, name, `Opened “${name}”. Undo goes back to the table before it.`);
    },

    /**
     * The reader's notes that match a search (lib/note-search.js): on the
     * table, and in each saved table but the one on show.
     *
     * @param {string} query
     */
    notesFound(query) {
      const here = notesMatching(query, this.notes);
      const saved = listNamed()
        .filter(({ name }) => name !== this.name)
        .map(({ name }) => ({ name, notes: notesMatching(query, loadNamed(name)?.notes ?? [], 5) }))
        .filter((table) => table.notes.length);
      return { here, saved };
    },

    /**
     * A note in a saved table, from a search: the table opens (undo takes it
     * back), and the note comes into view.
     *
     * @param {{ name: string, id: string }} detail
     */
    async openNoteIn({ name, id }) {
      await this.openNamed(name);
      this.showNote(id);
    },

    exportFile() {
      const name = this.name || 'Table';
      const blob = new Blob([toFile(name, this.current())], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${name.replace(/[^\w .-]+/g, '-')}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
      /** @type {any} */ (this.querySelector('table-menu'))?.refresh(`Saved “${link.download}” to the downloads folder.`);
    },

    /**
     * A note as Markdown, its quotes in the words its card shows.
     *
     * @param {Element} card
     * @param {{ doc?: any, text: string, quotes: Span[] }} note
     * @param {number} [heading] the level of the note's own headings
     */
    markdownOf(card, note, heading = 2) {
      const quotes = this.quotesOf(card);
      return toMarkdown(docOf(note), {
        origin: location.origin,
        heading,
        quote: (span) => {
          const drawn = quotes.get(span);
          const words = drawn?.querySelector('.note__words')?.cloneNode(true);
          if (!drawn || !(words instanceof Element)) return null;
          // The words alone, without their verse numbers.
          for (const number of words.querySelectorAll('.verse__number')) number.remove();
          return { text: wordsOf(words), title: drawn.dataset.title ?? '' };
        },
      });
    },

    /** Saves the table's notes as one Markdown file, grouped by kind. */
    exportNotes() {
      this.writing?.end();
      const name = /** @type {any} */ (this.querySelector('table-menu'))?.name || 'Table';
      // By kind, in the order of a study (see, ask, explain, apply, pray),
      // then the plain notes; a question says whether it is answered.
      const groups = [...KINDS.map((kind) => ({ key: kind.key, title: kind.plural, label: kind.label })), { key: undefined, title: 'Notes', label: 'Note' }];
      const parts = groups.flatMap((group) => {
        const notes = this.notes.filter((note) => note.kind === group.key);
        const written = notes.flatMap((note, index) => {
          const card = this.world().querySelector(`gesture-card[data-note="${CSS.escape(note.id)}"]`);
          if (!card) return [];
          const state = note.kind === 'question' ? (note.answered ? ' (answered)' : ' (open)') : '';
          return [`### ${note.title || `${group.label} ${index + 1}`}${state}\n\n${this.markdownOf(card, note, 4)}`];
        });
        return written.length ? [`## ${group.title}\n\n${written.join('\n\n')}`] : [];
      });
      const menu = /** @type {any} */ (this.querySelector('table-menu'));
      if (!parts.length) {
        menu?.refresh('There are no notes on this table.');
        return;
      }
      const text = `# ${name}: notes\n\n${parts.join('\n\n')}\n`;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      link.download = `${name.replace(/[^\w .-]+/g, '-')} notes.md`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
      menu?.refresh(`Saved “${link.download}” to the downloads folder.`);
    },

    /** @param {{ name: string, text: string }} detail */
    importFile({ name, text }) {
      const found = fromFile(text);
      if (!found) {
        /** @type {any} */ (this.querySelector('table-menu'))?.refresh('That file is not a saved table.');
        return;
      }
      const title = found.name || name;
      this.openWorkspace(found.workspace, title, `Opened “${title}” from the file. Undo goes back to the table before it.`);
    },
  };
</script>
