<!-- The table: an infinite surface that holds the cards.

     The table never turns or scales. Fingers on an empty part of it pan
     everything on it together, and there is no edge.

     A card is a server fragment, /card/<address>?fragment=card, fetched when a
     passage is placed. A card's version buttons (KJV, BSB, Both) fetch the
     card again in that version and put it where the old one was. What is on the table is kept in this browser as
     addresses and positions (app/lib/workspace.js), and the cards are fetched
     again on the next visit.

     Highlights are kept with the workspace as word spans (app/lib/words.js).
     A card sends `card-mark` when a hand marks words, and the table adds or
     removes the span and paints every card again.

     Lines (app/lib/links.js), drawn in one SVG layer over the resting cards:
       solid ink     a link the reader drew between two spans
       dashed        the same highlighted words, shown on more than one card
       dotted        a cross-reference (OpenBible.info) from a verse on one
                     card to a verse on another
     (the colors of every kind of line are in the style below)

     A tap on a word studies it in the search panel: its Strong's entry and
     the verses that use the same original word. A tap on a word with no
     Strong's number lists the verse's cross-references instead. Either list
     can be pulled out like any result. While a study is on show, every word
     on the table with the same Strong's number is underlined.

     A word that names a person, place or group shows that entity first (see
     data/bible.js wordResults). Its relations are buttons, and its heading
     pulls out as a card. While an entity is on show, every word on the table
     that names it is underlined.

     The timeline strip (time-line) marks the events that the cards on the
     table tell, from Theographic's verse links, and a thin line joins each
     card to its events. A tap on a tick shows the event.

     A palm guard (app/lib/palm.js) sits in front of everything on the table:
     a group of touches that land together and close together is a resting
     hand. Its touches are stopped before any card or panel sees them, and
     any of them that a card had already taken is cancelled.

     With ?perf in the address, a readout in the corner shows the time
     between frames and the time the line layer takes, for measuring on the
     panel.

     The map is a card too (map:near-east). Its places that the cards on the
     table name are labelled, with a thin line to each card that names them,
     and the place on show in the panel is marked. A tap on a place shows it.
     The map moves and zooms inside its frame (map-view); a line goes only to
     a place inside the view, and Show on the map zooms to fit the places.
     A card sends `card-link` when a marking finger leaves it and lifts. The
     other end is the highlight under the finger, or, on words with no
     highlight, the whole passage of that card. Drawing a link again removes
     it, and removing a highlight removes its links.

     The workspace is a document (app/lib/workspace.js). The menu (table-menu)
     saves it under a name, opens a saved one, starts a new one, and sends it
     to a file or takes one in. Every change is a step in the undo history
     (app/lib/history.js), except a pan.

     Highlights come in three styles (words.js STYLES); the menu picks the
     style of the next one. Marking a highlight again in another style
     restyles it.

     A marking finger that leaves its card and lifts:
       on another card   draws a link to it (as above)
       on a note card    quotes the words in the note
       on the empty table  pulls the words out as a phrase card of their own
     In each case the words become a highlight, so a dashed line joins them
     to every other card that shows them.

     A note card (note:<id>) holds the reader's own text and the spans it
     quotes. A tap on it opens the note editor. The verses a note quotes
     carry a mark on every other card.

     A link's label, at the middle of its line, says what the link is (links.js
     TYPES). A tap on the label changes it, and a typed link has an arrow.

     A passage card's ‹ and ›, beside its heading, step it through the text. Cards with Sync
     on step together: when one steps, the others go to the same passage.
     Copy puts the card's words and reference on the clipboard.

     A mouse, a trackpad and a keyboard work too:
       wheel, or two fingers on a trackpad   pan the table
       pinch on a trackpad, or Control (or Command) and the wheel
                                             scale the card under the pointer
       turn two fingers on the trackpad      turn the card (Safari only)
       arrow keys, with no card in focus     pan the table

     Far (the Interface setting, for a wall seen from across the room): the
     arrow keys move the focus from card to card and to the panels' controls
     instead, as a remote's do (remoteKey).

     Snapping (gesture-card): a held card snaps upright, to full size, and
     into line with the other cards, and the table draws the guides it sends.
     The menu's Snap button turns it off and on, as data-snap="off" here.
     The wheel is left alone over the panels, which scroll their own lists.
     The cards have their own keys (gesture-card).

     Study (data/study.js):
       a tap on a passage's heading (or Enter on the card)  the passage guide
                     in the search panel; its notes are added here
       Put them beside the card   the guide's parallels, in a row to the right
                     of the card, at its size
       Mark it on every card      a rule mark (app/lib/rules.js): every word
                     on the table that renders a Strong's number, names an
                     entity, or is in a marked run is marked, live. The menu
                     lists the rules, and they are kept with the workspace.
       Compare       on a card in Both: the words one translation has and the
                     other does not are bold (app/lib/compare.js)
       a landscape card (landscape:...)   a tap on a chapter puts the chapter
                     beside it; a tap on its heading shows its subject
       Books, on the strip   puts the landscape of the books down, or takes it away

     It listens for `place` from a search panel inside it:
       detail.address  the passage
       detail.pointer  { id, x, y, down } when a finger is pulling it out, else null -->

<script element>
  import { ARROWS, nearestIn, nearestTo } from '../lib/spatial.js';
  import { isPhone } from '../lib/screen.js';
  import { scaleOf } from '../lib/affine.js';
  import { pan } from '../lib/gesture.js';
  import { WIDTH } from '../lib/map.js';
  import { nextStyle, sameRule, stylesFor, toggleRule } from '../lib/rules.js';
  import { createHistory } from '../lib/history.js';
  import { createPalmGuard } from '../lib/palm.js';
  import { dropLinksTo, firstCovered, nextType, removed, toggleLink, versesOf } from '../lib/links.js';
  import { covers, paintHighlights, spanAddress, STYLES, toggle, wordAt, wordKey } from '../lib/words.js';
  import { diffCards, empty, fromFile, load, loadNamed, newId, parse, save, saveNamed, snapshot, toFile } from '../lib/workspace.js';
  import { emptyTrail } from '../lib/trail.js';
  import { LANGUAGE_NAMES, Reader, Recording, sayWord } from '../lib/speech.js';

  /** @typedef {import('../lib/affine.js').Matrix} Matrix */
  /** @typedef {import('../lib/affine.js').Point} Point */
  /** @typedef {{ id: number, x: number, y: number, down: boolean }} Pull */
  /** @typedef {HTMLElement & { view: import('../lib/map.js').View | null, setView(view: import('../lib/map.js').View): void, fit(ids: string[], more?: { x: number, y: number }[]): Promise<void>, shows(id: string): boolean, relabel(): void }} MapView */
  /** @typedef {HTMLElement & { matrix: Matrix, hold(id: number, at: Point, scale?: number): void, placeAt(at: Point, scale?: number): void, setMatrix(m: Matrix): void, zoomAt(at: Point, factor: number): void, turnAt(at: Point, radians: number): void }} Card */
  /** @typedef {import('../lib/workspace.js').StoredCard} StoredCard */
  /** @typedef {import('../lib/workspace.js').Workspace} Workspace */
  /** @typedef {import('../lib/workspace.js').Note} Note */
  /** @typedef {{ version?: string, replacing?: Element | null, id?: string, sync?: boolean, compare?: boolean }} FetchOptions */
  /** @typedef {import('../lib/rules.js').Rule} Rule */

  const NAME_KEY = 'bible.workspace.name';

  /**
   * Puts text on the clipboard. The async clipboard needs a secure page, and
   * the panel opens the app over plain http on the network, so the old way is
   * the fallback.
   *
   * @param {string} text
   */
  async function copyText(text) {
    try {
      // A browser can hold the promise while it asks for permission. After a
      // second, the old way is tried as well.
      if (window.isSecureContext && navigator.clipboard) {
        const written = navigator.clipboard.writeText(text).then(() => true, () => false);
        const late = new Promise((resolve) => setTimeout(() => resolve(false), 1000));
        if (await Promise.race([written, late])) return true;
      }
    } catch {
      // Fall through to the old way.
    }
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.append(area);
    area.select();
    let done = false;
    try {
      done = document.execCommand('copy');
    } catch {
      done = false;
    }
    area.remove();
    return done;
  }

  /**
   * The words of an element, as one line of plain text.
   *
   * @param {Element} element
   */
  function wordsOf(element) {
    return (element.textContent ?? '').replace(/¶\s*/g, '').replace(/\s+/g, ' ').trim();
  }

  /**
   * A verse of a card as the reader reads it: its text, and where each word
   * (each element that `words` matches) is in that text. The verse number,
   * the paragraph mark and the buttons are left out.
   *
   * @param {Element} verse
   * @param {string} words a selector for its words
   * @param {'en' | 'he' | 'el'} lang
   * @returns {import('../lib/speech.js').Item}
   */
  function readable(verse, words, lang) {
    let text = '';
    /** @type {{ start: number, end: number, element: Element }[]} */
    const found = [];
    const walker = document.createTreeWalker(verse, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const parent = node.parentElement;
      if (!parent || parent.closest('sup, button, .syntax__role, .syntax__gloss, .inter__translit, .inter__gloss, .inter__grammar, .inter__code, .inter__ref, .syntax__where')) continue;
      const piece = (node.textContent ?? '').replace(/¶/g, '');
      const word = parent.closest(words);
      const start = text.length;
      text += piece;
      if (word && verse.contains(word)) {
        const last = found[found.length - 1];
        if (last && last.element === word) last.end = text.length;
        else found.push({ start, end: text.length, element: word });
      }
      // Words in separate elements with no space between them in the page.
      if (words !== '.w' && word && !/\s$/.test(text)) text += ' ';
    }
    return { text: text.replace(/\s+/g, ' '), lang, element: verse, words: found };
  }

  // A passage longer than this arrives small, in its short form, so a whole
  // chapter does not cover the table. Two fingers make it large.
  const LONG = 24;
  const LONG_SCALE = 0.5;

  const SVG = 'http://www.w3.org/2000/svg';

  /** @typedef {import('../lib/links.js').Span} Span */
  /** @typedef {import('../lib/links.js').Link} Link */
  /** @typedef {{ card: Element, box: DOMRect }} Place */

  // A card's words in reading order, with their sort keys, built the first
  // time a line needs them. The text of a card never changes, so neither does
  // its index.
  /** @type {WeakMap<Element, { key: number, item: Element }[]>} */
  const indexes = new WeakMap();

  // The entities each card's verses name (people, places, groups, events),
  // fetched once per card.
  /** @type {WeakMap<Element, string[]>} */
  const cardNamed = new WeakMap();

  const MAP = 'map:near-east';
  /** @param {number} n a map unit, kept to a tenth */
  const round = (n) => Math.round(n * 10) / 10;
  const BOOKS = 'landscape:books';
  // The space between cards that are put down in a row.
  const ROW_GAP = 24;

  // A card's verses by id. A card's text never changes, so this is built once.
  /** @type {WeakMap<Element, Map<string, Element>>} */
  const verseIndexes = new WeakMap();

  /** @param {Element} card */
  function versesOfCard(card) {
    let found = verseIndexes.get(card);
    if (!found) {
      found = new Map(
        [...card.querySelectorAll('kjv-verse[data-ref]')].map((verse) => [/** @type {HTMLElement} */ (verse).dataset.ref ?? '', verse]),
      );
      verseIndexes.set(card, found);
    }
    return found;
  }

  // The cross-references of each card's verses, fetched once per card.
  /** @type {WeakMap<Element, Record<string, [string, number][]>>} */
  const references = new WeakMap();


  /** @param {Element} card */
  function indexOf(card) {
    let index = indexes.get(card);
    if (!index) {
      index = [...card.querySelectorAll('[data-w]')].map((item) => ({ key: wordKey(wordAt(item) ?? ''), item }));
      indexes.set(card, index);
    }
    return index;
  }

  /**
   * The point on the edge of a box that faces another point.
   *
   * @param {DOMRect} box
   * @param {Point} toward
   * @returns {Point}
   */
  function edge(box, toward) {
    const x = Math.min(Math.max(toward.x, box.left), box.right);
    const y = Math.min(Math.max(toward.y, box.top), box.bottom);
    return { x, y };
  }

  /** @param {DOMRect} box */
  function middle(box) {
    return { x: box.left + box.width / 2, y: box.top + box.height / 2 };
  }

  /**
   * A line between the facing edges of two boxes.
   *
   * @param {DOMRect} from
   * @param {DOMRect} to
   * @param {string} kind the class: `link` or `same`
   */
  function line(from, to, kind) {
    const start = edge(from, middle(to));
    const end = edge(to, middle(from));
    const element = document.createElementNS(SVG, 'line');
    element.setAttribute('class', kind);
    element.setAttribute('x1', String(start.x));
    element.setAttribute('y1', String(start.y));
    element.setAttribute('x2', String(end.x));
    element.setAttribute('y2', String(end.y));
    return element;
  }

  /**
   * A line from the edge of a box to a dot: aimed at the dot's middle, and
   * ending at its rim, so that it points at the dot and the name beside it.
   * (A line to the facing edge of the dot's box ends at a corner of the box
   * when it comes in at a slant, beside the dot.)
   *
   * @param {DOMRect} from
   * @param {DOMRect} dot the dot's box
   * @param {string} kind the class
   */
  function lineToDot(from, dot, kind) {
    const centre = middle(dot);
    const start = edge(from, centre);
    const length = Math.hypot(centre.x - start.x, centre.y - start.y);
    // A little clear of the rim, so the line does not run into the dot.
    const rim = Math.min(dot.width / 2 + 2, length);
    const end = length ? { x: centre.x - ((centre.x - start.x) * rim) / length, y: centre.y - ((centre.y - start.y) * rim) / length } : centre;
    const element = document.createElementNS(SVG, 'line');
    element.setAttribute('class', kind);
    element.setAttribute('x1', String(start.x));
    element.setAttribute('y1', String(start.y));
    element.setAttribute('x2', String(end.x));
    element.setAttribute('y2', String(end.y));
    return element;
  }

  /**
   * The place in `places` nearest to `from`, on another card when there is one.
   *
   * @param {Place} from
   * @param {Place[]} places
   */
  function nearest(from, places) {
    const others = places.filter((place) => place.card !== from.card);
    const pool = others.length ? others : places;
    const at = middle(from.box);
    /** @type {Place | null} */
    let best = null;
    let distance = Infinity;
    for (const place of pool) {
      const there = middle(place.box);
      const d = Math.hypot(there.x - at.x, there.y - at.y);
      if (d < distance) {
        distance = d;
        best = place;
      }
    }
    return best;
  }

  export const prototype = {
    /** @type {Point} */
    offset: { x: 0, y: 0 },
    /** @type {Map<number, Point> | null} */
    fingers: null,
    /** @type {import('../lib/words.js').Highlight[]} */
    highlights: [],
    /** @type {Link[]} */
    links: [],
    /** @type {{ span: Span, x: number, y: number } | null} a link being drawn */
    pending: null,
    /** the Strong's number the search panel is studying, or "" */
    studied: '',
    /** the entity the search panel is showing, or "" */
    shown: '',
    frame: 0,
    lineFrame: 0,
    /** @type {Note[]} */
    notes: [],
    /** the style of the next highlight */
    pen: STYLES[0],
    /** @type {ReturnType<typeof createHistory> | null} */
    history: null,
    /** how many changes to the table are under way; keep() waits for them */
    applying: 0,
    /** a keep() asked for while a change was under way: false, or whether to record it */
    later: /** @type {boolean | null} */ (null),
    /** the name of the saved workspace on the table, or "" */
    name: '',
    /** @type {HTMLButtonElement[]} the link labels, kept and moved, not made again each frame */
    labels: [],
    keepTimer: 0,
    /** @type {import('../lib/snap.js').Guide[]} where a held card lines up, in the world's coordinates */
    guides: [],
    /** @type {Rule[]} */
    rules: [],
    /** @type {import('../lib/trail.js').Trail | null} a workspace's trail, until the search panel can take it */
    pendingTrail: null,
    /** @type {Set<string>} the places the map marks for the panel, besides the one on show */
    shownPlaces: new Set(),
    /** @type {HTMLElement | null} the card whose guide is in the panel */
    guideCard: null,

    connected({ signal }) {
      this.fingers = new Map();
      this.history = createHistory();
      try {
        this.name = localStorage.getItem(NAME_KEY) ?? '';
      } catch {
        this.name = '';
      }
      const workspace = load();
      // The search panel takes the trail once it is defined: until then the
      // table keeps it, so a save does not lose it.
      this.pendingTrail = workspace.trail;
      customElements.whenDefined('passage-search').then(() => {
        const panel = /** @type {any} */ (this.querySelector('passage-search'));
        if (!panel) return;
        panel.notesFor = (/** @type {string} */ address) => this.notesAt(address);
        panel.setTrail(this.pendingTrail ?? emptyTrail(), true);
        this.pendingTrail = null;
      });
      this.offset = workspace.offset;
      this.highlights = workspace.highlights;
      this.links = workspace.links;
      this.notes = workspace.notes;
      this.rules = workspace.rules;
      this.shownPlaces = new Set();
      this.paint();
      this.applying += 1;
      Promise.all(workspace.cards.map((stored) => this.restore(stored))).finally(() => {
        this.applying -= 1;
        this.history?.reset(snapshot(this.current()));
        this.finish();
      });
      customElements.whenDefined('table-menu').then(() => {
        /** @type {any} */ (this.querySelector('table-menu'))?.setName(this.name);
        this.showHistory();
        this.showRules();
      });

      const options = { signal };
      this.guardPalms(signal);
      if (new URL(location.href).searchParams.has('perf')) this.measure(signal);
      this.addEventListener('pointerdown', (event) => this.press(event), options);
      this.addEventListener('pointermove', (event) => this.drag(event), options);
      this.addEventListener('pointerup', (event) => this.release(event), options);
      this.addEventListener('pointercancel', (event) => this.release(event), options);
      this.addEventListener('contextmenu', (event) => event.preventDefault(), options);
      // Not passive: a pinch must not zoom the whole page.
      this.addEventListener('wheel', (event) => this.wheel(event), { signal, passive: false });
      this.trackpad(signal);
      document.addEventListener('keydown', (event) => this.panKey(event), options);
      document.addEventListener('keydown', (event) => this.remoteKey(event), { ...options, capture: true });
      this.listen(options.signal);
      // The cursor shows for a mouse or a trackpad and hides after a touch,
      // so the panel shows no arrow under the fingers. global.css reads it.
      /** @param {PointerEvent} event */
      const input = (event) => {
        const kind = event.pointerType === 'touch' || event.pointerType === 'pen' ? 'touch' : 'mouse';
        if (document.documentElement.dataset.input !== kind) document.documentElement.dataset.input = kind;
      };
      document.addEventListener('pointerdown', input, { signal, capture: true });
      document.addEventListener('pointermove', input, { signal, capture: true, passive: true });
      this.addEventListener('click', (event) => this.clicked(event), options);
      this.addEventListener('table-undo', () => this.undo(), options);
      this.addEventListener('table-redo', () => this.redo(), options);
      this.addEventListener('pen-change', (event) => {
        this.pen = /** @type {CustomEvent} */ (event).detail.style;
      }, options);
      this.addEventListener('note-new', () => this.newNote(), options);
      this.addEventListener('card-guides', (event) => {
        this.guides = /** @type {CustomEvent} */ (event).detail.guides;
        this.drawSoon();
      }, options);
      this.addEventListener('snap-change', (event) => {
        if (/** @type {CustomEvent} */ (event).detail.on) delete this.dataset.snap;
        else this.dataset.snap = 'off';
      }, options);
      this.addEventListener('note-text', (event) => this.noteText(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('note-done', () => this.keep(), options);
      this.addEventListener('workspace-save', (event) => this.saveAs(/** @type {CustomEvent} */ (event).detail.name), options);
      this.addEventListener('workspace-open', (event) => this.openNamed(/** @type {CustomEvent} */ (event).detail.name), options);
      this.addEventListener('workspace-new', () => this.openWorkspace(empty(), '', 'A new, empty table. Undo brings the old one back.'), options);
      this.addEventListener('workspace-export', () => this.exportFile(), options);
      this.addEventListener('workspace-import', (event) => this.importFile(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('place', (event) => this.place(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('card-change', () => this.keep(), options);
      // A move of the map inside its frame is kept, but is not a step to undo,
      // as a pan of the table is not.
      this.addEventListener('map-change', () => this.keep(false), options);
      // A step on the search panel's trail is kept too, and is not a step to
      // undo either.
      this.addEventListener('trail-change', () => this.keep(false), options);
      this.addEventListener('card-mark', (event) => this.mark(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('card-link-move', (event) => this.linking(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('card-link', (event) => this.link(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('card-paint', () => this.drawSoon(), options);
      this.addEventListener('card-tap', (event) => this.tapped(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('study', (event) => this.study(/** @type {CustomEvent} */ (event).detail), options);
      this.addEventListener('show-entity', (event) => {
        const panel = /** @type {any} */ (this.querySelector('passage-search'));
        panel?.showEntity(/** @type {CustomEvent} */ (event).detail.id);
      }, options);
      this.addEventListener('timeline-toggle', () => this.drawSoon(), options);
      // The rail has moved the panels: the lines to the timeline follow.
      this.addEventListener('chrome-arrange', () => this.drawSoon(), options);
      // On a phone, one panel is open at a time: the one that opens closes
      // the others (each sends panel-open only on a phone).
      this.addEventListener('panel-open', (event) => {
        const opened = /** @type {CustomEvent} */ (event).detail.panel;
        const search = /** @type {any} */ (this.querySelector('passage-search'));
        const strip = /** @type {any} */ (this.querySelector('time-line'));
        const menu = /** @type {any} */ (this.querySelector('table-menu'));
        if (opened !== 'search' && search && !search.collapsed) search.setCollapsed(true);
        if (opened !== 'timeline' && strip && !strip.collapsed) strip.setCollapsed(true);
        if (opened !== 'menu') menu?.setShown?.(false);
      }, options);
      // A new text size or line spacing changes the size of the cards, so the
      // lines between them move.
      this.addEventListener('reading-change', () => this.drawSoon(), options);
      this.addEventListener('toggle-map', () => this.toggleCard(MAP), options);
      this.addEventListener('toggle-books', () => this.toggleCard(BOOKS), options);
      this.addEventListener('show-on-map', (event) => this.showOnMap(/** @type {CustomEvent} */ (event).detail.ids), options);
      this.addEventListener('show-journey', (event) => this.showJourney(/** @type {CustomEvent} */ (event).detail.journey), options);
      this.addEventListener('journey-off', () => {
        this.shownPlaces = new Set();
        this.paintMap();
      }, options);
      this.addEventListener('rule-add', (event) => this.setRules(toggleRule(this.rules, /** @type {CustomEvent} */ (event).detail)), options);
      this.addEventListener('rule-remove', (event) => {
        const index = /** @type {CustomEvent} */ (event).detail.index;
        this.setRules(this.rules.filter((_, i) => i !== index));
      }, options);
      this.addEventListener('rule-style', (event) => this.setRules(nextStyle(this.rules, /** @type {CustomEvent} */ (event).detail.index)), options);
      this.addEventListener('place-beside', (event) => this.placeBeside(/** @type {CustomEvent} */ (event).detail.addresses), options);
      this.addEventListener('show-note', (event) => this.showNote(/** @type {CustomEvent} */ (event).detail.id), options);
      // The card removes itself after the event, so keep what is left a moment
      // later. A note goes with its card; undo brings both back.
      this.addEventListener('card-remove', (event) => {
        const card = /** @type {HTMLElement} */ (event.target);
        if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
        const note = card.dataset.kind === 'note' ? card.dataset.note : '';
        queueMicrotask(() => {
          if (note) {
            this.notes = this.notes.filter((each) => each.id !== note);
            this.paintQuoted(this.world());
          }
          this.keep();
          this.paintMap();
          this.drawSoon();
        });
      }, options);
    },

    disconnected() {
      cancelAnimationFrame(this.frame);
      cancelAnimationFrame(this.lineFrame);
    },

    /**
     * The frame-time readout. It shows, for the last second, the mean and the
     * worst time between frames, and the mean time draw() took.
     *
     * @param {AbortSignal} signal
     */
    measure(signal) {
      const readout = document.createElement('output');
      readout.className = 'table__perf';
      this.append(readout);
      /** @type {number[]} */
      const gaps = [];
      /** @type {number[]} */
      const draws = [];
      const draw = this.draw.bind(this);
      this.draw = () => {
        const start = performance.now();
        draw();
        draws.push(performance.now() - start);
      };
      let last = performance.now();
      const tick = (/** @type {number} */ now) => {
        gaps.push(now - last);
        last = now;
        if (!signal.aborted) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      const mean = (/** @type {number[]} */ list) => (list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0);
      const timer = setInterval(() => {
        readout.textContent = `frame ${mean(gaps).toFixed(1)} ms, worst ${Math.max(0, ...gaps).toFixed(1)} ms · lines ${mean(draws).toFixed(1)} ms × ${draws.length}`;
        gaps.length = 0;
        draws.length = 0;
      }, 1000);
      signal.addEventListener('abort', () => clearInterval(timer));
    },

    /**
     * Stops a resting palm's touches in the capture phase, before any card or
     * panel inside the table hears them.
     *
     * @param {AbortSignal} signal
     */
    guardPalms(signal) {
      const guard = createPalmGuard();
      /** @type {Map<number, EventTarget>} where each touch went down */
      const targets = new Map();
      const capture = { signal, capture: true };

      this.addEventListener('pointerdown', (event) => {
        if (event.pointerType !== 'touch' || !event.isTrusted) return;
        if (event.target) targets.set(event.pointerId, event.target);
        const rejected = guard.down({ id: event.pointerId, x: event.clientX, y: event.clientY, t: event.timeStamp });
        for (const id of rejected) {
          if (id === event.pointerId) continue;
          // A touch of the palm that something already took: take it back.
          targets.get(id)?.dispatchEvent(new PointerEvent('pointercancel', { pointerId: id, pointerType: 'touch', bubbles: true }));
        }
        if (rejected.includes(event.pointerId)) {
          event.stopPropagation();
          event.preventDefault();
        }
      }, capture);

      /** @param {PointerEvent} event */
      const follow = (event) => {
        if (event.pointerType !== 'touch' || !event.isTrusted) return;
        const palm = guard.isRejected(event.pointerId);
        if (event.type !== 'pointermove') {
          guard.up(event.pointerId);
          targets.delete(event.pointerId);
        }
        if (palm) event.stopPropagation();
      };
      for (const type of ['pointermove', 'pointerup', 'pointercancel']) {
        this.addEventListener(type, (event) => follow(/** @type {PointerEvent} */ (event)), capture);
      }
    },

    /**
     * The card under the pointer, or null over the empty table or a panel.
     *
     * @param {EventTarget | null} target
     * @returns {Card | null}
     */
    cardAt(target) {
      const card = target instanceof Element ? target.closest('gesture-card') : null;
      return card && this.world().contains(card) ? /** @type {Card} */ (/** @type {unknown} */ (card)) : null;
    },

    /**
     * True over a panel at the edge of the table, which scrolls by itself.
     *
     * @param {EventTarget | null} target
     */
    overPanel(target) {
      return target instanceof Element && Boolean(target.closest('passage-search, table-menu, note-editor, time-line, table-rail'));
    },

    /** @param {WheelEvent} event */
    wheel(event) {
      if (this.overPanel(event.target)) return;
      event.preventDefault();
      // Lines, pages and pixels: a mouse wheel can count in lines.
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
      const dx = event.deltaX * unit;
      const dy = event.deltaY * unit;
      const card = this.cardAt(event.target);

      // A pinch on a trackpad comes as a wheel with Control held.
      if (event.ctrlKey || event.metaKey) {
        if (card) card.zoomAt({ x: event.clientX, y: event.clientY }, Math.exp(-dy / 200));
        return;
      }
      this.offset = { x: this.offset.x - dx, y: this.offset.y - dy };
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
      this.keepSoon();
    },

    /**
     * Safari sends a pinch and a turn on the trackpad as gesture events,
     * with the scale and the turn since the gesture began.
     *
     * @param {AbortSignal} signal
     */
    trackpad(signal) {
      /** @type {{ card: Card, at: Point, scale: number, rotation: number } | null} */
      let gesture = null;
      /** @param {any} event */
      const start = (event) => {
        event.preventDefault();
        const card = this.cardAt(event.target);
        gesture = card ? { card, at: { x: event.clientX, y: event.clientY }, scale: 1, rotation: 0 } : null;
      };
      /** @param {any} event */
      const change = (event) => {
        event.preventDefault();
        if (!gesture) return;
        gesture.card.zoomAt(gesture.at, event.scale / gesture.scale);
        gesture.card.turnAt(gesture.at, ((event.rotation - gesture.rotation) * Math.PI) / 180);
        gesture.scale = event.scale;
        gesture.rotation = event.rotation;
      };
      /** @param {any} event */
      const end = (event) => {
        event.preventDefault();
        gesture = null;
      };
      this.addEventListener('gesturestart', start, { signal });
      this.addEventListener('gesturechange', change, { signal });
      this.addEventListener('gestureend', end, { signal });
    },

    /**
     * Listens for an assistant's commands (app/server.js, the table relay,
     * which tools/mcp-server.js sends to), and answers each. Where the app
     * has no relay, as on Cloudflare, the stream is not there, and the table
     * stops listening after the first try.
     *
     * @param {AbortSignal} signal
     */
    listen(signal) {
      if (typeof EventSource !== 'function') return;
      const stream = new EventSource('/api/table/events');
      let opened = false;
      stream.addEventListener('ready', () => {
        opened = true;
      });
      stream.addEventListener('error', () => {
        if (!opened) stream.close();
      });
      stream.addEventListener('command', async (event) => {
        /** @type {any} */
        let command;
        try {
          command = JSON.parse(/** @type {MessageEvent} */ (event).data);
        } catch {
          return;
        }
        /** @type {any} */
        let reply;
        try {
          reply = { ok: true, result: await this.obey(command) };
        } catch (error) {
          reply = { ok: false, error: error instanceof Error ? error.message : String(error) };
        }
        fetch('/api/table/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: command.id, ...reply }) }).catch(() => {});
      });
      signal.addEventListener('abort', () => stream.close());
    },

    /**
     * Does what an assistant asks (tools/mcp-server.js). Each change goes
     * through the table's own methods, so it is a step that Undo takes back,
     * as a hand's would be.
     *
     *   state         what is on the table
     *   place         put passages down in a row: { addresses, version }
     *   guide         open a passage's guide in the search panel: { address }
     *   search        search, in the search panel: { query }
     *   show_entity   a person, place, group or event in the panel: { id }
     *   show_places   mark places on the map: { places }
     *   show_journey  draw a journey's route on the map: { journey }
     *   mark          mark words on every card, or unmark: { kind, value, label, off }
     *   clear         a new, empty table (Undo brings the old one back)
     *   undo          take back the last change
     *
     * @param {{ action: string, [key: string]: any }} command
     */
    async obey(command) {
      const panel = /** @type {any} */ (this.querySelector('passage-search'));
      switch (command.action) {
        case 'state': {
          const cards = [...this.world().querySelectorAll('gesture-card')].map((each) => {
            const card = /** @type {HTMLElement} */ (each);
            const title = card.querySelector('.passage__heading, .rr-card__title, h2')?.textContent?.trim() ?? '';
            return { address: card.dataset.address ?? '', title, version: card.dataset.version ?? 'kjv', kind: card.dataset.kind ?? '' };
          });
          return { name: this.name ?? '', cards, rules: this.rules.map(({ kind, value, label }) => ({ kind, value, label })) };
        }
        case 'place': {
          const addresses = /** @type {string[]} */ (command.addresses ?? []).filter((each) => typeof each === 'string').slice(0, 12);
          const placed = await this.placeRow(addresses, String(command.version ?? ''));
          return { placed };
        }
        case 'guide':
          await panel?.showGuide(String(command.address), []);
          return { shown: command.address };
        case 'search':
          panel?.searchFor(String(command.query));
          return { searched: command.query };
        case 'show_entity':
          panel?.showEntity(String(command.id));
          return { shown: command.id };
        case 'show_places':
          await this.showOnMap(/** @type {string[]} */ (command.places ?? []).join(','));
          return { shown: command.places };
        case 'show_journey':
          await this.showJourney(command.journey);
          return { shown: command.journey?.title ?? '' };
        case 'mark': {
          const rule = { kind: String(command.kind), value: String(command.value), label: String(command.label || command.value) };
          const on = this.rules.some((each) => sameRule(each, rule));
          if (Boolean(command.off) === on) this.setRules(toggleRule(this.rules, rule));
          return { rules: this.rules.map(({ kind, value, label }) => ({ kind, value, label })) };
        }
        case 'clear':
          await this.openWorkspace(empty(), '', 'A new, empty table. Undo brings the old one back.');
          return { cleared: true };
        case 'undo':
          this.undo();
          return { undone: true };
        default:
          throw new Error(`The table does not know the command ${command.action}.`);
      }
    },

    /**
     * Puts passages down in a row in the open part of the table, at their
     * own size, as one step that Undo takes back; returns what it put down.
     *
     * @param {string[]} addresses
     * @param {string} version kjv, bsb, both, original, interlinear, reverse or syntax; '' for the KJV
     */
    async placeRow(addresses, version) {
      const start = this.openSpot();
      const world = this.world().getBoundingClientRect();
      let x = start.x - world.left;
      const y = start.y - world.top;
      /** @type {{ address: string, title: string }[]} */
      const placed = [];
      this.applying += 1;
      try {
        for (const address of addresses) {
          const card = await this.fetchCard(address, version ? { version } : {});
          if (!card) continue;
          card.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: x, f: y });
          this.raise(card);
          x += card.offsetWidth + ROW_GAP;
          placed.push({ address, title: card.querySelector('.passage__heading, .rr-card__title, h2')?.textContent?.trim() ?? address });
        }
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
      // The new row in view.
      if (placed.length) this.drawSoon();
      return placed;
    },

    /**
     * Far (the Interface setting, for a wall seen from across the room): the
     * keys of a remote. The arrow keys move the focus to the nearest card or
     * panel control that way (lib/spatial.js), and the table pans to show a
     * card that is off the screen; with nothing in focus, they go to the card
     * nearest the middle. Enter on the map steps into it, where the arrow
     * keys move the map, and Escape steps back out to the card. Fields keep
     * their arrow keys. In the other sizes the arrow keys move a card, as
     * gesture-card says.
     *
     * @param {KeyboardEvent} event
     */
    remoteKey(event) {
      if (document.documentElement.dataset.ui !== 'far') return;
      const target = event.target instanceof HTMLElement ? event.target : null;
      const frame = target?.closest('map-view');
      if (event.key === 'Escape' && frame) {
        /** @type {HTMLElement | null} */ (frame.closest('gesture-card'))?.focus();
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (event.key === 'Enter' && target?.matches('gesture-card') && target.dataset.address === MAP) {
        /** @type {HTMLElement | null} */ (target.querySelector('map-view'))?.focus();
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      const direction = ARROWS[event.key];
      if (!direction || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
      if (frame || target?.matches('input, textarea, select, [contenteditable]')) return;
      const from = target && target !== document.body && target !== this ? target.getBoundingClientRect() : null;
      // With nothing in focus, the card nearest the middle comes first.
      const cards = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]);
      const targets = from || !cards.length ? this.navigable() : cards;
      const boxes = targets.map((each) => each.getBoundingClientRect());
      const index = from ? nearestIn(from, boxes, direction) : nearestTo({ x: innerWidth / 2, y: innerHeight / 2 }, boxes);
      event.preventDefault();
      event.stopPropagation();
      const next = targets[index];
      if (!next) return;
      next.focus({ preventScroll: true });
      if (next.matches('gesture-card')) this.reveal(next);
    },

    /**
     * What the remote's arrow keys go to: the cards, and the controls of the
     * panels that show.
     *
     * @returns {HTMLElement[]}
     */
    navigable() {
      const cards = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]);
      const controls = /** @type {HTMLElement[]} */ (
        [...this.querySelectorAll(':is(table-rail, passage-search, table-menu, time-line, note-editor) :is(button, input, textarea, select)')]
      ).filter((each) => !(/** @type {HTMLButtonElement} */ (each).disabled) && (each.checkVisibility?.() ?? each.getClientRects().length > 0));
      return [...cards, ...controls];
    },

    /**
     * Pans the table so a card that is not wholly on the screen is in its
     * middle.
     *
     * @param {Element} card
     */
    reveal(card) {
      const box = card.getBoundingClientRect();
      const inside = box.left >= 0 && box.top >= 0 && box.right <= innerWidth && box.bottom <= innerHeight;
      if (inside) return;
      this.offset = {
        x: this.offset.x + innerWidth / 2 - (box.left + box.right) / 2,
        y: this.offset.y + innerHeight / 2 - (box.top + box.bottom) / 2,
      };
      this.paint();
      this.keepSoon();
    },

    /**
     * Arrow keys pan the table when nothing has the focus.
     *
     * @param {KeyboardEvent} event
     */
    panKey(event) {
      if (event.target !== document.body && event.target !== this) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const step = event.shiftKey ? 400 : 80;
      const moves = /** @type {Record<string, [number, number]>} */ ({
        ArrowLeft: [step, 0],
        ArrowRight: [-step, 0],
        ArrowUp: [0, step],
        ArrowDown: [0, -step],
      });
      const move = moves[event.key];
      if (!move) return;
      event.preventDefault();
      this.offset = { x: this.offset.x + move[0], y: this.offset.y + move[1] };
      this.paint();
      this.keepSoon();
    },

    /** Keeps the table once a run of wheel or key pans stops. */
    keepSoon() {
      clearTimeout(this.keepTimer);
      this.keepTimer = setTimeout(() => this.keep(), 400);
    },

    /** @returns {HTMLElement} */
    world() {
      return /** @type {HTMLElement} */ (this.querySelector('.table__world'));
    },

    /** @param {PointerEvent} event */
    press(event) {
      // Only the empty table pans. A card or the search panel has its own gestures.
      if (event.target !== this && event.target !== this.world()) return;
      this.setPointerCapture(event.pointerId);
      this.fingers?.set(event.pointerId, { x: event.clientX, y: event.clientY });
      this.classList.add('is-panning');
    },

    /** @param {PointerEvent} event */
    drag(event) {
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      if (!fingers.has(event.pointerId)) return;
      const after = new Map(fingers);
      after.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const moved = pan(fingers, after);
      this.offset = { x: this.offset.x + moved.x, y: this.offset.y + moved.y };
      this.fingers = after;
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
    },

    /** @param {PointerEvent} event */
    release(event) {
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      if (fingers.delete(event.pointerId) && fingers.size === 0) {
        this.classList.remove('is-panning');
        this.keep();
      }
    },

    paint() {
      const { x, y } = this.offset;
      const world = this.world();
      world.style.left = `${x}px`;
      world.style.top = `${y}px`;
      this.drawSoon();
    },

    /**
     * @param {{ address: string, pointer: Pull | null, version?: string }} detail
     */
    async place({ address, pointer, version }) {
      const card = await this.fetchCard(address, version ? { version } : {});
      if (!card) return;
      const scale = Number(card.dataset.verses) > LONG ? LONG_SCALE : 1;
      if (pointer?.down) card.hold(pointer.id, pointer, scale);
      else if (pointer) card.placeAt(pointer, scale);
      else if (isPhone()) {
        const spot = this.phoneSpot(card, scale);
        card.placeAt(spot.at, spot.scale);
      } else card.placeAt(this.openSpot(), scale);
      this.keep();
    },

    /**
     * Where a new card goes on a phone, and at what size: the width of the
     * screen at most, at the left edge, near the top, and a little lower
     * for each card after it.
     *
     * @param {Element} card
     * @param {number} scale the size the card would have elsewhere
     */
    phoneSpot(card, scale) {
      const EDGE = 8;
      const width = card instanceof HTMLElement ? card.offsetWidth : 0;
      const fit = width ? Math.min(scale, (innerWidth - 2 * EDGE) / width) : scale;
      const step = (this.world().querySelectorAll('gesture-card').length - 1) % 6;
      const top = EDGE + step * 24;
      // The grip is GRIP (gesture-card) from the card's corner, at its scale.
      return { at: { x: EDGE + 48 * fit, y: top + 32 * fit }, scale: fit };
    },

    /** @param {{ from: string, to: string }} detail */
    mark({ from, to }) {
      const before = this.highlights;
      this.highlights = toggle(before, from, to, this.pen);
      this.links = dropLinksTo(this.links, removed(before, this.highlights));
      paintHighlights(this.world(), this.highlights);
      this.keep();
      this.drawSoon();
    },

    /** @param {{ span: Span, x: number, y: number }} detail */
    linking(detail) {
      this.pending = detail;
      this.drawSoon();
    },

    /** @param {{ span: Span, x: number, y: number }} detail */
    link({ span, x, y }) {
      this.pending = null;
      this.drawSoon();
      if (!Number.isFinite(x)) return;
      const source = this.sourceOf(span);
      const under = document.elementFromPoint(x, y);
      const card = under?.closest('gesture-card');

      if (card instanceof HTMLElement && this.world().contains(card) && card.dataset.kind === 'note') {
        this.highlight(source);
        this.quote(card, source);
        return;
      }
      if (card && this.world().contains(card)) {
        const target = this.endAt(x, y);
        if (!target) return;
        this.highlight(source);
        this.links = toggleLink(this.links, source, target);
        this.keep();
        return;
      }
      // Lifted on the empty table: the words become a card of their own.
      if (under === this || under === this.world()) {
        this.highlight(source);
        this.place({ address: spanAddress(source), pointer: { id: -1, x, y, down: false } });
      }
    },

    /**
     * Makes a span a highlight, in the current style, unless it is one.
     *
     * @param {Span} span
     */
    highlight(span) {
      if (this.highlights.some((each) => each.from === span.from && each.to === span.to)) return;
      this.highlights = [...this.highlights, this.pen === STYLES[0] ? span : { ...span, style: this.pen }];
      paintHighlights(this.world(), this.highlights);
    },

    /**
     * Adds a span to a note's quotes, and fetches the note again to show it.
     *
     * @param {HTMLElement} card
     * @param {Span} span
     */
    async quote(card, span) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      if (!note) return;
      if (!note.quotes.some((each) => each.from === span.from && each.to === span.to)) {
        note.quotes = [...note.quotes, { from: span.from, to: span.to }];
      }
      await this.replaceCard(/** @type {Card} */ (card), card.dataset.address ?? '', 'kjv');
      this.paintQuoted(this.world());
      this.keep();
    },

    /**
     * The words a link starts from. A finger that left the card from a single
     * highlighted word takes the whole highlight with it.
     *
     * @param {Span} span
     * @returns {Span}
     */
    sourceOf(span) {
      if (span.from !== span.to) return span;
      return this.highlights.find((each) => covers(each, span.from)) ?? span;
    },

    /**
     * What a link lands on at a point on the screen: the highlight under the
     * finger, or else the whole passage of the card under it, or nothing.
     *
     * @param {number} x
     * @param {number} y
     * @returns {Span | null}
     */
    endAt(x, y) {
      const under = document.elementFromPoint(x, y);
      const card = under?.closest('gesture-card');
      if (!under || !card || !this.world().contains(card)) return null;
      const word = wordAt(under);
      const highlight = word ? this.highlights.find((each) => covers(each, word)) : null;
      if (highlight) return highlight;
      const index = indexOf(card);
      if (!index.length) return null;
      const first = wordAt(index[0].item);
      const last = wordAt(index[index.length - 1].item);
      return first && last ? { from: first, to: last } : null;
    },

    /** @param {{ target: EventTarget | null }} detail */
    tapped({ target }) {
      const element = target instanceof Element ? target : null;
      const panel = /** @type {any} */ (this.querySelector('passage-search'));
      // The transliteration of a word of the Hebrew or the Greek: say it.
      const said = element?.closest('.inter__translit');
      if (said) {
        const word = said.closest('.inter__word')?.querySelector('.inter__text')?.textContent ?? '';
        const lang = said.closest('[lang="hbo"]') ? 'he' : 'el';
        sayWord(word, lang).then((ok) => {
          if (!ok) this.toast(`This device has no ${LANGUAGE_NAMES[lang]} voice.`);
        });
        return;
      }
      // In the listening mode (the speaker button pressed), a tap on a verse
      // plays from it, and a tap on the verse being read pauses. Out of the
      // mode, a tap does what it always does.
      const tappedVerse = element?.closest('[data-ref]');
      const reader = element?.closest('gesture-card');
      const listen = reader?.querySelector('[data-action="listen"]');
      if (tappedVerse && reader instanceof HTMLElement && reader.dataset.listening !== undefined && listen instanceof HTMLButtonElement) {
        const reading = Reader.current?.items.some((item) => reader.contains(item.element));
        const now = reading ? reader.querySelector('.is-read')?.closest('[data-ref]') : null;
        if (now && now.getAttribute('data-ref') === tappedVerse.getAttribute('data-ref')) Reader.current?.stop();
        else this.readAloud(reader, listen, tappedVerse.getAttribute('data-ref') ?? '');
        return;
      }
      // Read more on an entry's card: the card holds the press, so the
      // details do not open by themselves.
      const more = element?.closest('.entity__more > summary')?.parentElement;
      if (more instanceof HTMLDetailsElement) {
        more.open = !more.open;
        return;
      }
      // A tap on a note, anywhere but on the words it quotes, writes in it.
      const note = element?.closest('gesture-card[data-kind="note"]');
      if (note instanceof HTMLElement && !wordAt(element) && !element?.closest('button')) {
        this.editNote(note.dataset.note ?? '');
        return;
      }
      // The grammar of a word of the Hebrew or the Greek: find every word in
      // the same form (lib/grammar.js).
      const form = element?.closest('[data-grammar]');
      if (form instanceof HTMLElement && form.dataset.grammar) {
        panel?.searchFor(form.dataset.grammar);
        return;
      }
      // A word of the Hebrew or the Greek: study its Strong's number. The
      // study underlines the KJV words that render it on every card.
      const orig = element?.closest('[data-orig-s]');
      if (orig instanceof HTMLElement && orig.dataset.origS) {
        panel?.searchFor(orig.dataset.origS);
        return;
      }
      const place = element?.closest('[data-place]');
      if (place instanceof Element) {
        panel?.showEntity(place.getAttribute('data-place'));
        return;
      }
      // A chapter on a landscape: the chapter goes down beside it.
      const chapter = element?.closest('[data-chapter]');
      if (chapter instanceof Element) {
        const box = chapter.getBoundingClientRect();
        const address = chapter.getAttribute('data-chapter') ?? '';
        this.place({ address, pointer: { id: -1, x: box.right + ROW_GAP, y: box.top, down: false } });
        return;
      }
      const heading = element?.closest('.passage__heading');
      const card = heading?.closest('gesture-card');
      if (heading && card instanceof HTMLElement) {
        this.headingTapped(card);
        return;
      }
      const word = wordAt(element);
      if (word) {
        panel?.showWord(word);
        return;
      }
      const verse = element?.closest('kjv-verse[data-ref]');
      if (verse instanceof HTMLElement && verse.dataset.ref) panel?.showReferences(verse.dataset.ref);
    },

    /**
     * A tap on a card's heading: a passage or a phrase shows its guide, an
     * entity shows itself, and a landscape shows its subject.
     *
     * @param {HTMLElement} card
     */
    headingTapped(card) {
      const panel = /** @type {any} */ (this.querySelector('passage-search'));
      const address = card.dataset.address ?? '';
      const kind = card.dataset.kind;
      if (kind === 'passage' || kind === 'phrase') {
        this.guideCard = card;
        panel?.showGuide(address, this.notesOn(card));
      } else if (kind === 'entity') {
        panel?.showEntity(address);
      } else if (kind === 'landscape') {
        const subject = card.dataset.subject ?? '';
        if (subject.startsWith('text:')) panel?.searchFor(subject.slice(5));
        else if (/^[HG]\d/.test(subject)) panel?.searchFor(subject);
        else if (subject.includes(':')) panel?.showEntity(subject);
      }
    },

    /**
     * The notes on a passage of a card on the table, by the card's address.
     *
     * @param {string} address
     */
    notesAt(address) {
      const card = this.world().querySelector(`gesture-card[data-address="${CSS.escape(address)}"]`);
      return card instanceof HTMLElement ? this.notesOn(card) : [];
    },

    /**
     * The notes that quote any verse of a card.
     *
     * @param {HTMLElement} card
     * @returns {{ id: string, text: string }[]}
     */
    notesOn(card) {
      const ranges = [...card.querySelectorAll('kjv-verse[data-ref], .bsb-verse[data-ref]')].map((verse) => {
        const first = wordKey(`${/** @type {HTMLElement} */ (verse).dataset.ref}.w1`);
        return [first, first + 999];
      });
      return this.notes
        .filter((note) => note.quotes.some((quote) => {
          const from = wordKey(quote.from);
          const to = wordKey(quote.to);
          return ranges.some(([first, last]) => from <= last && to >= first);
        }))
        .map((note) => ({ id: note.id, text: note.text }));
    },

    /**
     * Brings a note's card into view and opens it.
     *
     * @param {string} id
     */
    showNote(id) {
      const card = this.world().querySelector(`gesture-card[data-note="${CSS.escape(id)}"]`);
      if (!(card instanceof HTMLElement)) return;
      this.raise(card);
      this.glideTo(card.getBoundingClientRect());
    },

    /**
     * Puts cards down in a row to the right of the card whose guide is on
     * show, at its size, as one step that undo takes back.
     *
     * @param {string[]} addresses
     */
    async placeBeside(addresses) {
      const anchor = this.guideCard?.isConnected ? /** @type {Card} */ (/** @type {unknown} */ (this.guideCard)) : null;
      if (!anchor) {
        for (const address of addresses) await this.place({ address, pointer: null });
        return;
      }
      const world = this.world().getBoundingClientRect();
      const box = anchor.getBoundingClientRect();
      const scale = scaleOf(anchor.matrix);
      let x = box.right - world.left + ROW_GAP;
      const y = box.top - world.top;
      this.applying += 1;
      try {
        for (const address of addresses) {
          const card = await this.fetchCard(address, {});
          if (!card) continue;
          card.setMatrix({ a: scale, b: 0, c: 0, d: scale, e: x, f: y });
          this.raise(card);
          x += card.offsetWidth * scale + ROW_GAP;
        }
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
    },

    /**
     * Puts a card above the other cards at rest.
     *
     * @param {HTMLElement} card
     */
    raise(card) {
      const levels = [...this.world().querySelectorAll('gesture-card')]
        .filter((each) => each !== card)
        .map((each) => Number(/** @type {HTMLElement} */ (each).style.zIndex) || 0);
      card.style.zIndex = String(Math.max(0, ...levels.filter((level) => level < 1000000)) + 1);
    },

    /**
     * Pans the table so a box on the screen is in the middle of its open
     * part: the part the rail and its docked panels leave free.
     *
     * @param {DOMRect} box
     */
    glideTo(box) {
      const free = this.free();
      const target = { x: (free.left + free.right) / 2, y: (free.top + free.bottom) / 2 };
      this.glide(target.x - (box.left + box.width / 2), target.y - (box.top + box.height / 2));
    },

    /** @param {Rule[]} rules */
    setRules(rules) {
      this.rules = rules;
      this.paintRules(this.world());
      this.showRules();
      this.keep();
    },

    /** Tells the menu and the panel which rules are on. */
    showRules() {
      /** @type {any} */ (this.querySelector('table-menu'))?.setRules?.(this.rules);
      /** @type {any} */ (this.querySelector('passage-search'))?.showRules?.(this.rules);
    },

    /**
     * Marks every word under `root` that a rule marks: data-rule holds the
     * styles, which global.css draws.
     *
     * @param {Element} root
     */
    paintRules(root) {
      const rules = this.rules;
      for (const element of root.querySelectorAll('.w')) {
        const word = /** @type {HTMLElement} */ (element);
        const styles = rules.length
          ? stylesFor(rules, { s: word.dataset.s, e: word.dataset.e, marks: [...(word.parentElement?.classList ?? [])] })
          : [];
        const value = styles.join(' ');
        if (value) {
          if (word.dataset.rule !== value) word.dataset.rule = value;
        } else if (word.dataset.rule !== undefined) {
          delete word.dataset.rule;
        }
      }
    },

    /** @param {{ code: string, entity: string }} detail */
    study({ code, entity }) {
      this.studied = code;
      this.shown = entity;
      this.shownPlaces = new Set();
      this.showRules();
      this.paintStudy(this.world());
      const strip = this.querySelector('time-line');
      for (const tick of strip?.querySelectorAll('.is-shown') ?? []) tick.classList.remove('is-shown');
      if (entity.startsWith('event:')) /** @type {any} */ (strip)?.tickFor(entity)?.classList.add('is-shown');
      if (entity.startsWith('world:')) /** @type {any} */ (strip)?.tickFor(entity)?.classList.add('is-shown');
      this.paintMap();
    },

    /** The map card on the table, or null. */
    mapCard() {
      return this.world().querySelector(`gesture-card[data-address="${MAP}"]`);
    },

    /**
     * The frame of the map card, or null.
     *
     * @param {Element | null} [card]
     * @returns {MapView | null}
     */
    mapView(card = this.mapCard()) {
      const view = card?.querySelector('map-view');
      return view && typeof (/** @type {any} */ (view).fit) === 'function' ? /** @type {MapView} */ (view) : null;
    },

    /**
     * Puts a card down, or takes it away when it is on the table: the map,
     * or the landscape of the books.
     *
     * @param {string} address
     */
    async toggleCard(address) {
      const card = this.world().querySelector(`gesture-card[data-address="${CSS.escape(address)}"]`);
      if (card) {
        card.remove();
        this.keep();
        this.drawSoon();
        return;
      }
      if (address === MAP) {
        await this.openMap();
        return;
      }
      const placed = await this.fetchCard(address, {});
      if (!placed) return;
      placed.placeAt(this.openSpot());
      this.keep();
    },

    /** Puts the map on the table, unless it is there already. */
    async openMap() {
      if (this.mapCard()) {
        this.paintMap();
        return;
      }
      const card = await this.fetchCard(MAP, {});
      if (!card) return;
      const free = this.free();
      card.placeAt({ x: free.left + 80, y: free.top + 80 });
      this.keep();
    },

    /**
     * Puts the map on the table if it is not there, brings it to the top,
     * marks the places, and pans the table so they are in the open part of
     * the screen: the part the rail and its docked panels leave free.
     *
     * @param {string} ids place ids, with commas between, such as place:damascus_310
     * @param {{ x: number, y: number }[]} [more] other points the map's view takes in, in map units
     */
    async showOnMap(ids, more = []) {
      const list = String(ids).split(',').filter(Boolean);
      await this.openMap();
      const map = this.mapCard();
      if (!(map instanceof HTMLElement)) return;
      this.shownPlaces = new Set(list);
      this.paintMap();
      this.raise(map);
      await customElements.whenDefined('map-view');
      await this.mapView()?.fit(list, more);

      const boxes = list
        .map((id) => map.querySelector(`[data-place="${CSS.escape(id)}"] circle`)?.getBoundingClientRect())
        .filter((box) => box && box.width > 0);
      if (!boxes.length) {
        this.glideTo(map.getBoundingClientRect());
        return;
      }
      const left = Math.min(...boxes.map((box) => /** @type {DOMRect} */ (box).left));
      const top = Math.min(...boxes.map((box) => /** @type {DOMRect} */ (box).top));
      const right = Math.max(...boxes.map((box) => /** @type {DOMRect} */ (box).right));
      const bottom = Math.max(...boxes.map((box) => /** @type {DOMRect} */ (box).bottom));
      this.glideTo(new DOMRect(left, top, right - left, bottom - top));
    },

    /**
     * Draws a journey on the map: the map comes onto the table if it is not
     * there, its stops are named, and the view fits the route.
     *
     * @param {import('../data/journeys.js').JourneyView} journey
     */
    async showJourney(journey) {
      await this.openMap();
      const map = this.mapCard();
      if (!(map instanceof HTMLElement)) return;
      await customElements.whenDefined('map-view');
      const frame = /** @type {any} */ (this.mapView(map));
      frame?.showJourney(journey);
      // The stops that are places are marked; a proposed site has none, so
      // map-view draws it with the route, and the view takes it in too.
      const proposed = journey.stops.filter((stop) => stop.proposed).map(({ x, y }) => ({ x, y }));
      await this.showOnMap(journey.stops.map((stop) => stop.place).filter(Boolean).join(','), proposed);
    },

    /**
     * Pans the table by (dx, dy) over a third of a second, easing out.
     *
     * @param {number} dx
     * @param {number} dy
     */
    glide(dx, dy) {
      const from = { ...this.offset };
      const start = performance.now();
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const length = reduced ? 0 : 320;
      const frame = (/** @type {number} */ now) => {
        const t = length ? Math.min(1, (now - start) / length) : 1;
        const eased = 1 - (1 - t) ** 3;
        this.offset = { x: from.x + dx * eased, y: from.y + dy * eased };
        this.paint();
        if (t < 1) requestAnimationFrame(frame);
        else this.keep(false);
      };
      requestAnimationFrame(frame);
    },

    /**
     * Labels the map's places that the cards on the table name, and marks the
     * place on show.
     */
    paintMap() {
      const map = this.mapCard();
      if (!map) return;
      const named = new Set();
      for (const card of this.world().querySelectorAll('gesture-card')) {
        for (const id of cardNamed.get(card) ?? []) if (id.startsWith('place:')) named.add(id);
      }
      for (const marker of map.querySelectorAll('[data-place]')) {
        const id = marker.getAttribute('data-place');
        marker.classList.toggle('is-on-table', named.has(id));
        marker.classList.toggle('is-shown', id === this.shown || this.shownPlaces.has(id ?? ''));
      }
      this.mapView(map)?.relabel();
      this.drawSoon();
    },

    /**
     * A line from each card to the places on the map that it names.
     *
     * @returns {Element[]}
     */
    placeLines() {
      const map = this.mapCard();
      if (!map) return [];
      /** @type {Element[]} */
      const lines = [];
      for (const card of this.world().querySelectorAll('gesture-card')) {
        if (card === map) continue;
        const places = (cardNamed.get(card) ?? []).filter((id) => id.startsWith('place:'));
        if (!places.length) continue;
        const edgeBox = card.getBoundingClientRect();
        const frame = this.mapView(map);
        for (const id of places) {
          if (frame && !frame.shows(id)) continue;
          const dot = map.querySelector(`[data-place="${CSS.escape(id)}"] circle`);
          if (!dot) continue;
          const box = dot.getBoundingClientRect();
          if (box.width > 0) lines.push(lineToDot(edgeBox, box, 'place'));
        }
      }
      return lines;
    },

    /** @param {Element} root */
    paintStudy(root) {
      for (const element of root.querySelectorAll('.w')) {
        const word = /** @type {HTMLElement} */ (element);
        const same = (this.studied && word.dataset.s === this.studied) || (this.shown && word.dataset.e === this.shown);
        word.classList.toggle('is-studied', Boolean(same));
      }
      // The Hebrew and Greek words with the Strong's number being studied.
      for (const element of root.querySelectorAll('[data-orig-s]')) {
        const word = /** @type {HTMLElement} */ (element);
        word.classList.toggle('is-studied', Boolean(this.studied) && word.dataset.origS === this.studied);
      }
    },

    /** @param {Element} card */
    async loadEvents(card) {
      const address = card instanceof HTMLElement ? card.dataset.address : null;
      if (!address) return;
      if (address === MAP) {
        this.paintMap();
        return;
      }
      if (address.includes(':')) return;
      const response = await fetch(`/entities/${encodeURIComponent(address)}`).catch(() => null);
      if (!response?.ok) return;
      /** @type {Record<string, string[]>} */
      const named = await response.json();
      cardNamed.set(card, [...new Set(Object.values(named).flat())]);
      this.paintMap();
      this.drawSoon();
    },

    /**
     * A line from each card to the ticks of the events it tells, and the
     * ticks marked. Nothing while the strip is collapsed.
     *
     * @returns {Element[]}
     */
    timeLines() {
      const strip = /** @type {any} */ (this.querySelector('time-line'));
      if (!strip) return [];
      const cards = [...this.world().querySelectorAll('gesture-card')];

      // Every class change first, then every measurement: a measurement after
      // a change forces the browser to work out the styles again.
      /** @type {Set<string>} */
      const told = new Set();
      for (const card of cards) {
        for (const id of cardNamed.get(card) ?? []) if (id.startsWith('event:')) told.add(id);
      }
      for (const tick of strip.querySelectorAll('.is-on-table')) {
        if (!told.has(tick.dataset.entity)) tick.classList.remove('is-on-table');
      }
      for (const id of told) strip.tickFor(id)?.classList.add('is-on-table');

      /** @type {Map<string, DOMRect>} */
      const ticks = new Map();
      for (const id of told) {
        const box = strip.tickFor(id)?.getBoundingClientRect();
        if (box && box.width > 0) ticks.set(id, box);
      }
      /** @type {Element[]} */
      const lines = [];
      for (const card of cards) {
        const events = (cardNamed.get(card) ?? []).filter((id) => ticks.has(id));
        if (!events.length) continue;
        // From the card's edge, so the line does not cross its text.
        const edgeBox = card.getBoundingClientRect();
        for (const id of events) lines.push(line(edgeBox, /** @type {DOMRect} */ (ticks.get(id)), 'time'));
      }
      return lines;
    },

    /** @param {Element} card */
    async loadReferences(card) {
      const address = card instanceof HTMLElement ? card.dataset.address : null;
      if (!address) return;
      const response = await fetch(`/xrefs/${encodeURIComponent(address)}`).catch(() => null);
      if (!response?.ok) return;
      references.set(card, await response.json());
      this.drawSoon();
    },

    /**
     * The box a line to a verse on a card starts from: the verse, or the
     * card's heading when the card is in its short form.
     *
     * @param {Element} card
     * @param {Element} verse
     */
    verseBox(card, verse) {
      const box = verse.getBoundingClientRect();
      if (box.width > 0) return box;
      return (card.querySelector('.passage__heading') ?? card).getBoundingClientRect();
    },

    /**
     * A line for each cross-reference from a verse on one card to a verse on
     * another, once per pair of verses whichever way the reference runs.
     *
     * @returns {Element[]}
     */
    referenceLines() {
      const cards = [...this.world().querySelectorAll('gesture-card')];

      // Where each verse is on the table: one index for the whole frame, so a
      // reference finds its target cards in one lookup.
      /** @type {Map<string, { card: Element, verse: Element }[]>} */
      const where = new Map();
      for (const card of cards) {
        for (const [id, verse] of versesOfCard(card)) {
          const list = where.get(id);
          if (list) list.push({ card, verse });
          else where.set(id, [{ card, verse }]);
        }
      }

      // Each verse is measured once per frame, however many lines it has.
      /** @type {Map<Element, DOMRect>} */
      const boxes = new Map();
      /** @param {Element} card @param {Element} verse */
      const boxOf = (card, verse) => {
        let box = boxes.get(verse);
        if (!box) {
          box = this.verseBox(card, verse);
          boxes.set(verse, box);
        }
        return box;
      };

      const seen = new Set();
      /** @type {Element[]} */
      const lines = [];
      for (const card of cards) {
        const refs = references.get(card);
        if (!refs) continue;
        const own = versesOfCard(card);
        for (const [fromId, list] of Object.entries(refs)) {
          const from = own.get(fromId);
          if (!from) continue;
          for (const [target] of list) {
            for (const toId of versesOf(target)) {
              for (const { card: other, verse: to } of where.get(toId) ?? []) {
                if (other === card) continue;
                const key = fromId < toId ? `${fromId}|${toId}` : `${toId}|${fromId}`;
                if (seen.has(key)) continue;
                seen.add(key);
                lines.push(line(boxOf(card, from), boxOf(other, to), 'ref'));
              }
            }
          }
        }
      }
      return lines;
    },

    drawSoon() {
      if (this.lineFrame) return;
      this.lineFrame = requestAnimationFrame(() => {
        this.lineFrame = 0;
        this.draw();
      });
    },

    /**
     * Where a span shows: one box per card that holds any of its words. The
     * box is the first word of the span on that card, or the card's heading
     * when the card is in its short form and the words are hidden.
     *
     * @param {Span} span
     * @returns {Place[]}
     */
    placesOf(span) {
      /** @type {Place[]} */
      const places = [];
      for (const card of this.world().querySelectorAll('gesture-card')) {
        const word = firstCovered(indexOf(card), span);
        if (!word) continue;
        let box = word.getBoundingClientRect();
        if (box.width === 0) box = (card.querySelector('.passage__heading') ?? card).getBoundingClientRect();
        places.push({ card, box });
      }
      return places;
    },

    draw() {
      const drawn = /** @type {SVGGElement} */ (this.querySelector('.table__drawn'));
      /** @type {Element[]} */
      const lines = [...this.timeLines(), ...this.placeLines(), ...this.referenceLines()];

      // The same words on several cards: a chain from each place to the next.
      for (const span of this.highlights) {
        const places = this.placesOf(span);
        for (let i = 1; i < places.length; i += 1) lines.push(line(places[i - 1].box, places[i].box, 'same'));
      }

      // Links: each place of one end to the nearest place of the other. A
      // typed link has an arrow at its far end, and every link has a label
      // in the middle of its first line.
      /** @type {{ at: Point, text: string, typed: boolean }[]} */
      const labels = [];
      for (const { a, b, type } of this.links) {
        const ends = this.placesOf(b);
        /** @type {{ at: Point, text: string, typed: boolean } | null} */
        let label = null;
        for (const start of this.placesOf(a)) {
          const near = nearest(start, ends);
          if (!near) continue;
          const drawnLine = line(start.box, near.box, type ? 'link link--typed' : 'link');
          if (type) drawnLine.setAttribute('marker-end', 'url(#link-arrow)');
          lines.push(drawnLine);
          if (!label) {
            const x1 = Number(drawnLine.getAttribute('x1'));
            const y1 = Number(drawnLine.getAttribute('y1'));
            const x2 = Number(drawnLine.getAttribute('x2'));
            const y2 = Number(drawnLine.getAttribute('y2'));
            label = { at: { x: (x1 + x2) / 2, y: (y1 + y2) / 2 }, text: type || 'link', typed: Boolean(type) };
          }
        }
        labels.push(label ?? { at: { x: NaN, y: NaN }, text: '', typed: false });
      }
      this.placeLabels(labels);

      // Where a held card lines up with others: thin lines across both.
      if (this.guides.length) {
        const world = this.world().getBoundingClientRect();
        for (const guide of this.guides) {
          const element = document.createElementNS(SVG, 'line');
          element.setAttribute('class', 'guide');
          element.setAttribute('x1', String(guide.x1 + world.left));
          element.setAttribute('y1', String(guide.y1 + world.top));
          element.setAttribute('x2', String(guide.x2 + world.left));
          element.setAttribute('y2', String(guide.y2 + world.top));
          lines.push(element);
        }
      }

      // A link being drawn follows the finger.
      if (this.pending) {
        const finger = new DOMRect(this.pending.x, this.pending.y, 0, 0);
        for (const start of this.placesOf(this.pending.span)) lines.push(line(start.box, finger, 'link'));
      }

      drawn.replaceChildren(...lines);
    },

    /**
     * Puts one button per link at the middle of its line. The buttons are
     * kept from frame to frame and only moved, so a finger on one is not
     * lost when the lines are drawn again under it.
     *
     * @param {{ at: Point, text: string, typed: boolean }[]} labels
     */
    placeLabels(labels) {
      const layer = /** @type {HTMLElement} */ (this.querySelector('.table__labels'));
      while (this.labels.length < labels.length) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'table__label';
        layer.append(button);
        this.labels.push(button);
      }
      while (this.labels.length > labels.length) this.labels.pop()?.remove();
      labels.forEach((label, i) => {
        const button = this.labels[i];
        const shown = Number.isFinite(label.at.x);
        button.hidden = !shown;
        if (!shown) return;
        button.dataset.link = String(i);
        if (button.textContent !== label.text) button.textContent = label.text;
        button.classList.toggle('is-typed', label.typed);
        button.setAttribute('aria-label', `Link: ${label.text}. Tap to change what it says.`);
        button.style.transform = `translate(${label.at.x}px, ${label.at.y}px) translate(-50%, -50%)`;
      });
    },

    /** @param {StoredCard} stored */
    async restore({ id, address, matrix, version, sync, compare, view }) {
      const card = await this.fetchCard(address, { version, id, sync, compare });
      card?.setMatrix(matrix);
      if (card && view) {
        await customElements.whenDefined('map-view');
        this.mapView(card)?.setView(view);
      }
    },

    /**
     * Fetches the card again in another version and puts it in the old one's
     * place, at the same position and on the same level.
     *
     * @param {Card} card
     * @param {string} version
     */
    async switchVersion(card, version) {
      const address = card.dataset.address;
      if (!address || card.dataset.version === version) return;
      await this.replaceCard(card, address, version);
      this.keep();
    },

    /**
     * Puts a card for `address` in the place of `card`: the same id, position,
     * level and sync.
     *
     * @param {Card} card
     * @param {string} address
     * @param {string} version
     */
    async replaceCard(card, address, version) {
      if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
      const { matrix } = card;
      const level = card.style.zIndex;
