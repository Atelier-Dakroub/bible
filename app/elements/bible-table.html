      const next = await this.fetchCard(address, {
        version,
        replacing: card,
        id: card.dataset.id,
        sync: card.dataset.sync !== undefined,
        compare: card.dataset.compare !== undefined,
      });
      if (!next) return null;
      next.setMatrix(matrix);
      next.style.zIndex = level;
      return next;
    },

    /**
     * Steps a card to another passage. When the card is synced, every other
     * synced passage card goes to the same passage, each in its own version.
     *
     * @param {Card} card
     * @param {string} address
     */
    async step(card, address) {
      const others = card.dataset.sync === undefined
        ? []
        : [...this.world().querySelectorAll('gesture-card[data-kind="passage"][data-sync]')].filter((each) => each !== card);
      await Promise.all(
        [card, ...others].map((each) => this.replaceCard(/** @type {Card} */ (each), address, /** @type {HTMLElement} */ (each).dataset.version ?? 'kjv')),
      );
      this.keep();
    },

    /**
     * The buttons on the cards, and the link labels.
     *
     * @param {MouseEvent} event
     */
    clicked(event) {
      const target = event.target instanceof Element ? event.target : null;
      const label = target?.closest('.table__label');
      if (label instanceof HTMLElement) {
        const i = Number(label.dataset.link);
        const link = this.links[i];
        if (!link) return;
        const type = nextType(link.type);
        const changed = { a: link.a, b: link.b, ...(type ? { type } : {}) };
        this.links = this.links.map((each, at) => (at === i ? changed : each));
        this.keep();
        this.drawSoon();
        return;
      }

      const button = target?.closest('button');
      const card = button?.closest('gesture-card');
      if (!(button instanceof HTMLButtonElement) || !(card instanceof HTMLElement) || !this.world().contains(card)) return;
      const cardElement = /** @type {Card} */ (card);

      // A verse's quotation mark: what it quotes, or where it is quoted.
      if (button.dataset.quotes) {
        const verse = /** @type {HTMLElement | null} */ (button.closest('[data-ref]'))?.dataset.ref;
        if (verse) /** @type {any} */ (this.querySelector('passage-search'))?.showQuotes(verse);
        return;
      }
      // A reference in an entity's text, such as "John 3:16": the passage
      // goes down beside its card.
      if (button.dataset.cite) {
        const box = card.getBoundingClientRect();
        this.place({ address: button.dataset.cite, pointer: { id: -1, x: box.right + ROW_GAP, y: button.getBoundingClientRect().top, down: false } });
        return;
      }
      // A person, place or event named on a card, such as on a picture.
      if (button.dataset.entity) {
        /** @type {any} */ (this.querySelector('passage-search'))?.showEntity(button.dataset.entity);
        return;
      }
      if (button.dataset.version) this.switchVersion(cardElement, button.dataset.version);
      else if (button.dataset.stepTo) this.step(cardElement, button.dataset.stepTo);
      else if (button.dataset.action === 'sync') {
        const on = card.dataset.sync === undefined;
        this.setSync(card, on);
        this.keep();
      } else if (button.dataset.action === 'compare') {
        this.setCompare(card, card.dataset.compare === undefined);
        this.keep();
      } else if (button.dataset.action === 'copy') this.copyCard(card, button);
      else if (button.dataset.action === 'listen') this.readAloud(card, button);
      else if (button.dataset.unquote) this.unquote(card, button.dataset.unquote);
    },

    /**
     * @param {HTMLElement} card
     * @param {boolean} on
     */
    setSync(card, on) {
      if (on) card.dataset.sync = '';
      else delete card.dataset.sync;
      card.querySelector('[data-action="sync"]')?.setAttribute('aria-pressed', String(on));
    },

    /**
     * @param {HTMLElement} card
     * @param {boolean} on
     */
    setCompare(card, on) {
      if (on) card.dataset.compare = '';
      else delete card.dataset.compare;
      card.querySelector('[data-action="compare"]')?.setAttribute('aria-pressed', String(on));
    },

    /**
     * Reads a card aloud, verse by verse, in its version. The KJV plays
     * LibriVox's recording where the app has it (data/audio.js, routes/listen);
     * otherwise, and for the BSB, the Hebrew and the Greek (Original, Word by
     * word, Syntax), the device's voice reads it. A second press stops it,
     * and the card keeps the verse it stopped in (data-read-at): the next
     * press goes on from there. A reading that ends begins again next time.
     *
     * @param {HTMLElement} card
     * @param {HTMLButtonElement} button
     * @param {string} [from] a verse to read from (a tap on its number, or on
     *   a verse while the card reads)
     */
    async readAloud(card, button, from = '') {
      const reading = Reader.current;
      const mine = Boolean(reading && reading.items.some((item) => card.contains(item.element)));
      // The button turns the mode off: the reading stops, and its place is
      // kept for the next time.
      if (!from && card.dataset.listening !== undefined) {
        delete card.dataset.listening;
        if (mine) reading?.stop();
        this.listenLook(card);
        return;
      }
      // One card in the mode at a time.
      for (const other of this.world().querySelectorAll('gesture-card[data-listening]')) {
        if (other === card) continue;
        delete /** @type {HTMLElement} */ (other).dataset.listening;
        this.listenLook(/** @type {HTMLElement} */ (other));
      }
      card.dataset.listening = '';
      if (mine) reading?.stop();
      const version = card.dataset.version ?? 'kjv';
      const start = from || card.dataset.readAt || '';
      const set = (/** @type {boolean} */ playing) => this.listenLook(card, playing);
      // Where it stopped, for the next time. A reading that ends leaves the
      // mode, and begins again next time.
      const ended = (/** @type {Element | null} */ at) => {
        const id = at?.closest('[data-ref]')?.getAttribute('data-ref') ?? '';
        if (id) card.dataset.readAt = id;
        else {
          delete card.dataset.readAt;
          delete card.dataset.listening;
        }
        set(false);
      };
      // The KJV's recording: its first chapter's file begins now, muted, in
      // the tap (a phone plays sound only from one), while the times come.
      const opening = /^([1-3A-Z]{3})\.(\d+)/.exec(start || card.dataset.address || '');
      if (version === 'kjv' && card.dataset.kind === 'passage' && opening) {
        const audio = new Audio(`/audio/${opening[1]}.${opening[2]}.m4a`);
        audio.muted = true;
        audio.play().catch(() => null);
        const found = await fetch(`/listen/${encodeURIComponent(card.dataset.address ?? '')}`)
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null);
        if (found?.chapters?.length) {
          set(true);
          this.toast(found.credit);
          new Recording(audio).play(found.chapters, (id) => card.querySelector(`kjv-verse[data-ref="${CSS.escape(id)}"]`), ended, start);
          return;
        }
        audio.pause();
        audio.removeAttribute('src');
      }
      const source = card.querySelector('[lang="hbo"], [lang="grc"], .syntax__text[lang]');
      const lang = source?.getAttribute('lang') === 'hbo' || source?.getAttribute('lang') === 'he' ? 'he' : 'el';
      /** @type {import('../lib/speech.js').Item[]} */
      let items = [];
      if (version === 'original') items = [...card.querySelectorAll('.original__verse')].map((verse) => readable(verse, '.orig', lang));
      else if (version === 'interlinear') items = [...card.querySelectorAll('.inter__verse')].map((verse) => readable(verse, '.inter__word', lang));
      else if (version === 'syntax') items = [...card.querySelectorAll('.syntax__row')].map((row) => readable(row, '.syntax__text', lang));
      else if (version === 'reverse') items = [...card.querySelectorAll('.rev__verse')].map((verse) => readable(verse, '.rev__en', 'en'));
      else if (version === 'bsb') items = [...card.querySelectorAll('.bsb-verse')].map((verse) => readable(verse, '.bsb__w', 'en'));
      else items = [...card.querySelectorAll('kjv-verse')].map((verse) => readable(verse, '.w', 'en'));
      items = items.filter((item) => item.text.trim());
      if (!items.length) return;
      set(true);
      const first = Math.max(0, items.findIndex((item) => item.element.closest('[data-ref]')?.getAttribute('data-ref') === start));
      const missing = await new Reader().read(items, ended, first);
      if (missing) {
        delete card.dataset.listening;
        set(false);
        this.toast(`This device has no ${LANGUAGE_NAMES[missing]} voice.`);
      }
    },

    /**
     * How a card's speaker button looks: pressed (lapis) while the card is
     * in the listening mode, and a stop square while it plays.
     *
     * @param {HTMLElement} card
     * @param {boolean} [playing]
     */
    listenLook(card, playing = false) {
      const button = card.querySelector('[data-action="listen"]');
      if (!(button instanceof HTMLElement)) return;
      const mode = card.dataset.listening !== undefined;
      const rest = card.dataset.readAt ?? '';
      const from = rest ? ` from verse ${rest.split('.').slice(1).join(':')}` : '';
      button.setAttribute('aria-pressed', String(mode));
      const label = mode ? (playing ? 'Pause: or tap the verse being read' : 'Stop listening; a tap on a verse plays it') : `Listen${from}`;
      button.setAttribute('aria-label', label);
      button.title = label;
      // The icon's drawing, directly: svg-icon draws once, from the page.
      button.querySelector('svg-icon use')?.setAttribute('href', `/ui.svg#${playing ? 'stop' : 'listen'}`);
    },

    /**
     * Says something for a few seconds at the foot of the screen, and to a
     * screen reader.
     *
     * @param {string} message
     */
    toast(message) {
      const toast = this.querySelector('.table__toast');
      if (!(toast instanceof HTMLElement)) return;
      toast.textContent = '';
      requestAnimationFrame(() => {
        toast.textContent = message;
        toast.classList.add('is-on');
      });
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => {
        toast.classList.remove('is-on');
        toast.textContent = '';
      }, 4000);
    },

    toastTimer: 0,

    /**
     * Copies the words on a card with the reference after them.
     *
     * @param {HTMLElement} card
     * @param {HTMLButtonElement} button
     */
    async copyCard(card, button) {
      const title = wordsOf(card.querySelector('.passage__heading') ?? card);
      const version = card.dataset.version ?? 'kjv';
      const kjv = [...card.querySelectorAll('kjv-verse')];
      const bsb = [...card.querySelectorAll('.bsb-verse')];
      // The Hebrew or the Greek: the words of each verse, as they read.
      const source = card.querySelector('[lang="hbo"], [lang="grc"]');
      const originals = [...card.querySelectorAll('.original__verse, .inter__verse')].map((verse) =>
        [...verse.querySelectorAll('.orig, .inter__text')].map((word) => word.textContent?.trim()).join(' '),
      );
      // The reverse interlinear copies its KJV, in order.
      const reversed = [...card.querySelectorAll('.rev__verse')].map((verse) =>
        [...verse.querySelectorAll('.rev__en')].map((words) => words.textContent?.trim()).join(' '),
      );
      // The syntax copies its clauses, one to a line.
      const clauses = [...card.querySelectorAll('.syntax__row')].map((row) => [...row.querySelectorAll('.syntax__text')].map((words) => words.textContent?.trim()).join(' '));
      const original = version === 'original' || version === 'interlinear' || version === 'syntax';
      const parts = version === 'syntax' ? clauses : original ? originals : version === 'reverse' ? reversed : version === 'bsb' ? bsb.map(wordsOf) : kjv.map(wordsOf);
      const name = original ? (source?.getAttribute('lang') === 'hbo' ? 'Hebrew' : 'Greek') : version === 'bsb' ? 'BSB' : 'KJV';
      const text = `${parts.join(' ')}\n— ${title} (${name})`;
      const done = await copyText(text);
      // The button is an icon: a small label beside it says what happened.
      button.dataset.done = done ? 'Copied' : 'Copy failed';
      setTimeout(() => {
        delete button.dataset.done;
      }, 1500);
    },

    /**
     * @param {HTMLElement} card a note card
     * @param {string} address the span address of the quote
     */
    async unquote(card, address) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      if (!note) return;
      note.quotes = note.quotes.filter((each) => spanAddress(each) !== address);
      await this.replaceCard(/** @type {Card} */ (card), card.dataset.address ?? '', 'kjv');
      this.paintQuoted(this.world());
      this.keep();
    },

    async newNote() {
      const id = newId('n');
      this.notes = [...this.notes, { id, text: '', quotes: [] }];
      const card = await this.fetchCard(`note:${id}`, {});
      if (!card) return;
      card.placeAt(this.openSpot());
      this.keep();
      this.editNote(id);
    },

    /** @param {string} id */
    editNote(id) {
      const note = this.notes.find((each) => each.id === id);
      if (!note) return;
      /** @type {any} */ (this.querySelector('note-editor'))?.edit(id, note.text);
    },

    /** @param {{ id: string, text: string }} detail */
    noteText({ id, text }) {
      const note = this.notes.find((each) => each.id === id);
      if (!note) return;
      note.text = text;
      const card = this.world().querySelector(`gesture-card[data-note="${CSS.escape(id)}"]`);
      const shown = card?.querySelector('.note__text');
      if (shown) shown.textContent = text;
      this.drawSoon();
    },

    /**
     * Marks the verses that a note quotes, on every card but the notes.
     *
     * @param {Element} root
     */
    paintQuoted(root) {
      const ranges = this.notes.flatMap((note) => note.quotes).map((each) => [wordKey(each.from), wordKey(each.to)]);
      for (const verse of root.querySelectorAll('kjv-verse[data-ref]')) {
        const element = /** @type {HTMLElement} */ (verse);
        if (element.closest('gesture-card[data-kind="note"]')) continue;
        const first = wordKey(`${element.dataset.ref}.w1`);
        const last = first + 999;
        element.classList.toggle('is-quoted', ranges.some(([from, to]) => from <= last && to >= first));
      }
    },

    /**
     * @param {string} address
     * @param {FetchOptions} options
     * @returns {Promise<Card | null>}
     */
    async fetchCard(address, { version = 'kjv', replacing = null, id, sync = false, compare = false }) {
      const query = new URLSearchParams({ version, fragment: 'card' });
      const note = address.startsWith('note:') ? this.notes.find((each) => `note:${each.id}` === address) : null;
      if (address.startsWith('note:') && !note) return null;
      if (note?.quotes.length) query.set('quotes', note.quotes.map(spanAddress).join(','));
      const response = await fetch(`/card/${encodeURIComponent(address)}?${query}`).catch(() => null);
      if (!response?.ok) return null;
      const holder = document.createElement('template');
      holder.setHTMLUnsafe(await response.text());
      const card = /** @type {HTMLElement | null} */ (holder.content.querySelector('gesture-card'));
      if (!card) return null;
      card.dataset.id = id ?? newId('c');
      if (replacing?.isConnected) replacing.replaceWith(card);
      else this.world().append(card);
      if (sync) this.setSync(card, true);
      if (compare && version === 'both') this.setCompare(card, true);
      if (note) {
        const text = card.querySelector('.note__text');
        if (text) text.textContent = note.text;
      }
      paintHighlights(card, this.highlights);
      this.paintStudy(card);
      this.paintQuoted(card);
      this.paintRules(card);
      this.loadEvents(card);
      await customElements.whenDefined('gesture-card');
      this.drawSoon();
      this.loadReferences(card);
      return /** @type {Card} */ (/** @type {unknown} */ (card));
    },

    /**
     * Where a tapped result goes: near the top of the free part of the screen, and
     * a step lower and further right each time, so cards placed one after
     * another do not cover each other's headings.
     *
     * @returns {Point}
     */
    openSpot() {
      const free = this.free();
      const step = (this.world().querySelectorAll('gesture-card').length - 1) % 6;
      return { x: free.left + 96 + step * 72, y: free.top + 96 + step * 72 };
    },

    /**
     * The part of the screen that the rail and its docked panels leave free
     * for the cards (table-rail).
     *
     * @returns {{ left: number, top: number, right: number, bottom: number }}
     */
    free() {
      const rail = /** @type {any} */ (this.querySelector('table-rail'));
      return rail?.freeBox?.() ?? { left: 0, top: 0, right: innerWidth, bottom: innerHeight };
    },

    /** @returns {Workspace} what is on the table now */
    current() {
      const cards = [...this.world().querySelectorAll('gesture-card')].flatMap((element) => {
        const card = /** @type {Card} */ (element);
        const address = card.dataset.address ?? '';
        if (!address || !card.matrix) return [];
        /** @type {StoredCard} */
        const stored = { id: card.dataset.id ?? newId('c'), address, matrix: card.matrix, version: card.dataset.version ?? 'kjv' };
        if (card.dataset.sync !== undefined) stored.sync = true;
        if (card.dataset.compare !== undefined && stored.version === 'both') stored.compare = true;
        const view = address === MAP ? this.mapView(card)?.view : null;
        if (view && view.w < WIDTH) stored.view = { x: round(view.x), y: round(view.y), w: round(view.w) };
        return [stored];
      });
      const panel = /** @type {any} */ (this.querySelector('passage-search'));
      const trail = this.pendingTrail ?? (typeof panel?.trail === 'function' ? panel.trail() : emptyTrail());
      return { offset: this.offset, cards, highlights: this.highlights, links: this.links, notes: this.notes, rules: this.rules, trail };
    },

    /**
     * Keeps the table in this browser, and records a step in the undo history.
     * While a change is under way, it waits for the change to finish.
     *
     * @param {boolean} [record] false for a change that is itself an undo or a redo
     */
    keep(record = true) {
      if (this.applying > 0) {
        this.later = Boolean(this.later) || record;
        return;
      }
      const workspace = this.current();
      save(workspace);
      if (record) this.history?.record(snapshot(workspace));
      this.showHistory();
    },

    /** A keep() that waited for a change. */
    finish() {
      if (this.applying > 0) return;
      const later = this.later;
      this.later = null;
      if (later !== null) this.keep(later);
      else save(this.current());
    },

    showHistory() {
      /** @type {any} */ (this.querySelector('table-rail'))?.setHistory?.(this.history?.canUndo(), this.history?.canRedo());
    },

    undo() {
      const state = this.history?.undo();
      if (state) this.apply({ ...parse(state), offset: this.offset }, false);
    },

    redo() {
      const state = this.history?.redo();
      if (state) this.apply({ ...parse(state), offset: this.offset }, false);
    },

    /**
     * Makes the table show a workspace: moves the cards that stay, fetches
     * the ones that are new or changed, and takes away the rest.
     *
     * @param {Workspace} target
     * @param {boolean} record whether this is a new step in the history
     */
    async apply(target, record) {
      this.applying += 1;
      try {
        const cards = [...this.world().querySelectorAll('gesture-card')];
        /** @type {Map<string, HTMLElement>} */
        const byId = new Map(cards.map((card) => [/** @type {HTMLElement} */ (card).dataset.id ?? '', /** @type {HTMLElement} */ (card)]));
        const { move, add, remove } = diffCards(this.current().cards, target.cards);
        this.highlights = target.highlights;
        this.links = target.links;
        this.notes = target.notes;
        this.rules = target.rules;
        // An opened workspace brings its trail, and shows its step; an undo
        // leaves the trail as it is, as it leaves the pan of the table.
        if (record) /** @type {any} */ (this.querySelector('passage-search'))?.setTrail?.(target.trail, true);
        if (target.offset.x !== this.offset.x || target.offset.y !== this.offset.y) {
          this.offset = target.offset;
          this.paint();
        }
        for (const id of remove) byId.get(id)?.remove();
        /** @type {Promise<unknown>[]} */
        const waits = add.map((stored) => this.restore(stored));
        for (const stored of move) {
          const card = /** @type {Card} */ (byId.get(stored.id));
          card.setMatrix(stored.matrix);
          this.setSync(card, Boolean(stored.sync));
          this.setCompare(card, Boolean(stored.compare));
          // A workspace that is opened brings its view of the map; an undo
          // leaves the view as it is, as it leaves the pan of the table.
          if (record) this.mapView(card)?.setView(stored.view ?? { x: 0, y: 0, w: WIDTH });
          // A note's quotes can differ between the two states.
          if (card.dataset.kind === 'note') waits.push(this.replaceCard(card, stored.address, 'kjv'));
        }
        await Promise.all(waits);
        paintHighlights(this.world(), this.highlights);
        this.paintQuoted(this.world());
        this.paintRules(this.world());
        this.showRules();
        this.paintMap();
        this.drawSoon();
        this.later = Boolean(this.later) || record;
      } finally {
        this.applying -= 1;
        this.finish();
      }
    },

    /**
     * Puts a whole workspace on the table, as one step that undo takes back.
     *
     * @param {Workspace} workspace
     * @param {string} name
     * @param {string} message
     */
    async openWorkspace(workspace, name, message) {
      await this.apply(workspace, true);
      this.setName(name);
      /** @type {any} */ (this.querySelector('table-menu'))?.refresh(message);
    },

    /** @param {string} name */
    setName(name) {
      this.name = name;
      try {
        localStorage.setItem(NAME_KEY, name);
      } catch {
        // No storage: the name lasts until the page closes.
      }
      /** @type {any} */ (this.querySelector('table-menu'))?.setName(name);
    },

    /** @param {string} name */
    saveAs(name) {
      const menu = /** @type {any} */ (this.querySelector('table-menu'));
      if (!saveNamed(name, this.current())) {
        menu?.refresh('This browser could not save it: its storage is off or full. Save to a file instead.');
        return;
      }
      this.setName(name);
      menu?.refresh(`Saved “${name}”.`);
    },

    /** @param {string} name */
    openNamed(name) {
      const workspace = loadNamed(name);
      if (!workspace) return;
      this.openWorkspace(workspace, name, `Opened “${name}”. Undo goes back to the table before it.`);
    },

    exportFile() {
      const name = this.name || 'Table';
      const blob = new Blob([toFile(name, this.current())], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${name.replace(/[^\w .-]+/g, '-')}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
      /** @type {any} */ (this.querySelector('table-menu'))?.refresh(`Saved “${link.download}” to the downloads folder.`);
    },

    /** @param {{ name: string, text: string }} detail */
    importFile({ name, text }) {
      const found = fromFile(text);
      if (!found) {
        /** @type {any} */ (this.querySelector('table-menu'))?.refresh('That file is not a saved table.');
        return;
      }
      const title = found.name || name;
      this.openWorkspace(found.workspace, title, `Opened “${title}” from the file. Undo goes back to the table before it.`);
    },
  };
</script>

<style>
  :scope {
    position: fixed;
    inset: 0;
    display: block;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    background: var(--desk);
    cursor: grab;
  }
  :scope.is-panning {
    cursor: grabbing;
  }
  /* The world is moved with left and top, not a transform. A transform would
     make it a stacking context, and then every card would stack with the
     world as one layer. Without one, each card stacks against the search
     panel on its own: a card at rest lies under the panel, so a pan slides it
     beneath, and a card that a finger holds rises above it.

     The world covers the panel too, so it lets touches through, and only the
     cards take them. A touch on an empty part reaches the table and pans. */
  .table__world {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .table__world > * {
    pointer-events: auto;
  }
  /* A short message at the foot of the screen (toast), over everything. */
  .table__toast {
    position: absolute;
    left: 50%;
    bottom: 1.5rem;
    z-index: 3000000;
    margin: 0;
    padding: 0.6rem 1rem;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--paper);
    font: var(--control-font);
    translate: -50% 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .table__toast.is-on {
    opacity: 1;
  }
  /* Above the cards at rest and the timeline (so a line reaches its event's
     tick), below the search panel, the menu and a held card. */
  .table__lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 999999;
    pointer-events: none;
    overflow: visible;
  }
  /* The lines between things on the table:
       link    a link the reader drew: ink, solid
       same    the same words on two cards: soft ink, dashed
       place   a card to a place on the map: verdigris, dashed
       time    a card to its event on the timeline: purple
       ref     a cross-reference: soft ink, dotted
       guide   a snap guide: lapis, dotted */
  .table__lines line {
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  .table__lines .link {
    stroke: var(--ink);
  }
  .table__arrow {
    fill: var(--ink);
  }
  /* A link's label: a small chip at the middle of its line, at the same level
     as the lines. A plain link says "link" softly; a typed one in lapis. */
  .table__labels {
    position: absolute;
    inset: 0;
    z-index: 999999;
    pointer-events: none;
  }
  .table__label {
    position: absolute;
    top: 0;
    left: 0;
    min-width: 2.75rem;
    min-height: 2.2rem;
    padding: 0 0.6rem;
    border: 1px solid var(--edge);
    border-radius: 1.1rem;
    background: var(--paper);
    color: var(--ink-soft);
    font: 500 max(0.6rem, 11px) var(--sans);
    pointer-events: auto;
    cursor: pointer;
  }
  .table__label.is-typed {
    border-color: var(--lapis);
    color: var(--lapis);
  }
  .table__lines .same {
    stroke: var(--ink-soft);
    stroke-dasharray: 6 6;
  }
  .table__perf {
    position: absolute;
    top: 0.5rem;
    left: 50%;
    z-index: 3000000;
    padding: 0.25rem 0.5rem;
    border: 1px solid var(--edge);
    border-radius: var(--radius-small);
    background: var(--paper);
    color: var(--ink);
    font: 0.75rem ui-monospace, monospace;
    pointer-events: none;
  }
  .table__lines .place {
    stroke: var(--verdigris);
    stroke-width: 1;
    stroke-dasharray: 3 3;
  }
  .table__lines .time {
    stroke: color-mix(in srgb, var(--purple) 70%, transparent);
    stroke-width: 1;
  }
  .table__lines .guide {
    stroke: var(--lapis);
    stroke-width: 1;
    stroke-dasharray: 2 4;
  }
  .table__lines .ref {
    stroke: var(--ink-soft);
    stroke-dasharray: 1 6;
    stroke-linecap: round;
  }
</style>
