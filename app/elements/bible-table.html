     * @param {{ doc: any, title?: string, kind?: import('../lib/note-kinds.js').Kind }} fields
     */
    addNote({ doc, title, kind }) {
      const id = newId('n');
      /** @type {import('../lib/workspace.js').Note} */
      const note = { id, text: '', doc, quotes: [], ...(title ? { title: title.slice(0, 120) } : {}), ...(kind ? { kind } : {}) };
      note.text = toText(docOf(note));
      this.notes = [...this.notes, note];
      return id;
    },

    /**
     * An assistant's note: its words (lib/note-doc.js fromOutline), on the
     * table beside the first card it links to, or in the open part; linked
     * to each card named in `link`.
     *
     * @param {{ title?: unknown, text?: unknown, kind?: unknown, link?: unknown }} command
     */
    async noteFor(command) {
      const fields = noteFields(command);
      const targets = fields.link.map((address) => this.cardEnd(address));
      const id = this.addNote(fields);
      this.applying += 1;
      try {
        const card = await this.fetchCard(`note:${id}`, {});
        if (!card) {
          this.notes = this.notes.filter((each) => each.id !== id);
          throw new Error('The note could not be put on the table.');
        }
        this.placeNote(card, targets);
        for (const end of targets) this.links = setLink(this.links, { address: `note:${id}` }, end);
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
      this.drawSoon();
      return { note: `note:${id}`, links: this.linkStates() };
    },

    /**
     * A new note beside the first card it links to, else in the open part of
     * the table.
     *
     * @param {Card} card
     * @param {End[]} targets
     */
    placeNote(card, targets) {
      const first = targets[0];
      const beside = first ? this.placesOf(first)[0]?.card : undefined;
      if (!(beside instanceof HTMLElement)) {
        card.placeAt(this.openSpot());
        return;
      }
      const box = beside.getBoundingClientRect();
      const corner = tablePoint({ x: box.right, y: box.top }, this.offset, this.zoom);
      card.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: corner.x + ROW_GAP, f: corner.y });
      this.raise(card);
    },

    /**
     * Puts passages down in a row in the open part of the table, at their
     * own size, as one step that Undo takes back; returns what it put down.
     *
     * @param {string[]} addresses
     * @param {string} version kjv, bsb, both, original, interlinear, reverse or syntax; '' for the KJV
     */
    async placeRow(addresses, version) {
      const start = tablePoint(this.openSpot(), this.offset, this.zoom);
      let x = start.x;
      const y = start.y;
      /** @type {{ address: string, title: string }[]} */
      const placed = [];
      this.applying += 1;
      try {
        for (const address of addresses) {
          const card = await this.fetchCard(address, version ? { version } : {});
          if (!card) continue;
          card.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: x, f: y });
          this.raise(card);
          x += card.offsetWidth + ROW_GAP;
          placed.push({ address, title: cardTitle(card, address) });
        }
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
      // The new row in view.
      if (placed.length) this.drawSoon();
      return placed;
    },

    /**
     * Far (the Interface setting, for a wall seen from across the room): the
     * keys of a remote. The arrow keys move the focus to the nearest card or
     * panel control that way (lib/spatial.js), and the table pans to show a
     * card that is off the screen; with nothing in focus, they go to the card
     * nearest the middle. Enter on the map steps into it, where the arrow
     * keys move the map, and Escape steps back out to the card. Fields keep
     * their arrow keys. In the other sizes the arrow keys move a card, as
     * gesture-card says.
     *
     * @param {KeyboardEvent} event
     */
    remoteKey(event) {
      if (document.documentElement.dataset.ui !== 'far') return;
      const target = htmlOf(event.target);
      if (this.remoteEscape(event, target) || this.remoteEnter(event, target)) {
        stopKey(event);
        return;
      }
      const direction = remoteDirection(event, target);
      if (!direction) return;
      stopKey(event);
      this.remoteMove(target, direction);
    },

    /**
     * Escape in the map: back to its card.
     *
     * @param {KeyboardEvent} event
     * @param {HTMLElement | null} target
     */
    remoteEscape(event, target) {
      const frame = target?.closest('map-view');
      if (event.key !== 'Escape' || !frame) return false;
      /** @type {HTMLElement | null} */ (frame.closest('gesture-card'))?.focus();
      return true;
    },

    /**
     * Enter on the map's card: into the map, where the arrows move it.
     *
     * @param {KeyboardEvent} event
     * @param {HTMLElement | null} target
     */
    remoteEnter(event, target) {
      if (event.key !== 'Enter' || !target?.matches('gesture-card') || target.dataset.address !== MAP) return false;
      /** @type {HTMLElement | null} */ (target.querySelector('map-view'))?.focus();
      return true;
    },

    /**
     * Moves the focus to the next card or control that way; with nothing in
     * focus, to the card nearest the middle.
     *
     * @param {HTMLElement | null} target
     * @param {'left' | 'right' | 'up' | 'down'} direction
     */
    remoteMove(target, direction) {
      const from = this.focusedBox(target);
      const targets = this.remoteTargets(Boolean(from));
      const boxes = targets.map((each) => each.getBoundingClientRect());
      const next = targets[from ? nearestIn(from, boxes, direction) : nearestTo({ x: innerWidth / 2, y: innerHeight / 2 }, boxes)];
      next?.focus({ preventScroll: true });
      if (next?.matches('gesture-card')) this.reveal(next);
    },

    /**
     * Where the focus is, if on a card or a control (not the page or the table).
     *
     * @param {HTMLElement | null} target
     */
    focusedBox(target) {
      return target && target !== document.body && target !== this ? target.getBoundingClientRect() : null;
    },

    /**
     * What an arrow key can go to: from a card or a control, every card and
     * control; from nothing, the cards (or the controls, with no card).
     *
     * @param {boolean} fromSomething
     * @returns {HTMLElement[]}
     */
    remoteTargets(fromSomething) {
      const cards = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]);
      return fromSomething || !cards.length ? this.navigable() : cards;
    },

    /**
     * What the remote's arrow keys go to: the cards, and the controls of the
     * panels that show.
     *
     * @returns {HTMLElement[]}
     */
    navigable() {
      const cards = /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]);
      const controls = /** @type {HTMLElement[]} */ (
        [...this.querySelectorAll(':is(table-rail, passage-search, table-menu, time-line, note-editor) :is(button, input, textarea, select)')]
      ).filter((each) => !(/** @type {HTMLButtonElement} */ (each).disabled) && (each.checkVisibility?.() ?? each.getClientRects().length > 0));
      return [...cards, ...controls];
    },

    /**
     * Pans the table so a card that is not wholly on the screen is in its
     * middle.
     *
     * @param {Element} card
     */
    reveal(card) {
      const box = card.getBoundingClientRect();
      const inside = box.left >= 0 && box.top >= 0 && box.right <= innerWidth && box.bottom <= innerHeight;
      if (inside) return;
      this.offset = {
        x: this.offset.x + innerWidth / 2 - (box.left + box.right) / 2,
        y: this.offset.y + innerHeight / 2 - (box.top + box.bottom) / 2,
      };
      this.paint();
      this.keepSoon();
    },

    /**
     * Arrow keys pan the table when nothing has the focus.
     *
     * @param {KeyboardEvent} event
     */
    panKey(event) {
      const move = freeKey(event, this) ? keyPan(event) : null;
      if (!move) return;
      event.preventDefault();
      this.stopGlide();
      this.offset = { x: this.offset.x + move[0], y: this.offset.y + move[1] };
      this.paint();
      this.keepSoon();
    },

    /**
     * Keeps the table once a run of wheel or key pans stops. A pan is not a
     * step to undo, and while a note is written it would cut the note's
     * steps in two.
     */
    keepSoon() {
      clearTimeout(this.keepTimer);
      this.keepTimer = setTimeout(() => this.keep(false), 400);
    },

    /** @returns {HTMLElement} */
    world() {
      return /** @type {HTMLElement} */ (this.querySelector('.table__world'));
    },

    /** @param {PointerEvent} event */
    press(event) {
      // Only the empty table pans. A card or the search panel has its own gestures.
      if (event.target !== this && event.target !== this.world()) return;
      this.stopGlide();
      this.setPointerCapture(event.pointerId);
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      fingers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      this.classList.add('is-panning');
      // One finger may tap (in the overview); two may pinch.
      this.tapFrom = fingers.size === 1 ? { x: event.clientX, y: event.clientY, moved: false } : null;
      this.pinchFrom = fingers.size === 2 ? spread([...fingers.values()]) : 0;
      this.pinch = null;
    },

    /**
     * Two fingers that came down on a card: the table takes them, to zoom.
     *
     * @param {{ id: number, x: number, y: number }[]} pointers on the screen
     */
    takePinch(pointers) {
      if (this.overview) return;
      this.stopGlide();
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      for (const { id, x, y } of pointers) {
        try {
          this.setPointerCapture(id);
        } catch {
          continue;
        }
        fingers.set(id, { x, y });
      }
      this.classList.add('is-panning');
      this.tapFrom = null;
      this.pinchFrom = 0;
      this.pinch = null;
    },

    /** @param {PointerEvent} event */
    drag(event) {
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      if (!fingers.has(event.pointerId)) return;
      const after = new Map(fingers);
      after.set(event.pointerId, { x: event.clientX, y: event.clientY });
      this.untap(event);
      // Two fingers at full size or near it zoom; in the overview, a spread
      // leaves it.
      if (after.size >= 2 && !this.overview) {
        this.fingers = after;
        this.pinchMove([...after.values()].slice(0, 2));
        return;
      }
      const moved = pan(fingers, after);
      this.offset = { x: this.offset.x + moved.x, y: this.offset.y + moved.y };
      this.fingers = after;
      if (after.size === 2) this.pinchTo(spread([...after.values()]), centre([...after.values()]));
      cancelAnimationFrame(this.frame);
      this.frame = requestAnimationFrame(() => this.paint());
    },

    /**
     * Two fingers move: the table zooms by how far they spread, and the place
     * that was between them stays between them, so they pan it too. Past the
     * least zoom, the overview shows.
     *
     * @param {Point[]} points the two fingers, on the screen
     */
    pinchMove(points) {
      const middle = centre(points);
      const now = Math.max(1, spread(points));
      this.pinch ??= { zoom: this.zoom, at: tablePoint(middle, this.offset, this.zoom), spread: now };
      const { zoom, overview } = pinchZoom(this.pinch.zoom, now / this.pinch.spread);
      if (overview) {
        this.pinch = null;
        this.pinchFrom = 0;
        this.enterOverview();
        return;
      }
      this.setView(offsetFor(this.pinch.at, middle, zoom), zoom);
    },

    /** @param {PointerEvent} event */
    release(event) {
      const fingers = /** @type {Map<number, Point>} */ (this.fingers);
      // One finger fewer: a pinch begins again from the fingers that are left.
      if (fingers.has(event.pointerId)) this.pinch = null;
      if (fingers.delete(event.pointerId) && fingers.size === 0) {
        this.classList.remove('is-panning');
        if (event.type === 'pointerup') this.tapUp(event);
        this.keep();
      }
    },

    /**
     * A finger that moves from where it came down does not tap.
     *
     * @param {PointerEvent} event
     */
    untap(event) {
      const tap = this.tapFrom;
      if (tap && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) > TAP_SLOP) tap.moved = true;
    },

    /**
     * A tap on the table in the overview goes there.
     *
     * @param {PointerEvent} event
     */
    tapUp(event) {
      const tap = this.tapFrom;
      this.tapFrom = null;
      if (this.overview && tap && !tap.moved) this.overviewTap({ x: event.clientX, y: event.clientY });
    },

    /**
     * A pinch on the empty table, once it has gone far enough: in, to the
     * overview; out, back to full size about its middle. Once a gesture.
     *
     * @param {number} now the fingers' spread now (or a trackpad's scale)
     * @param {Point} point their middle
     */
    pinchTo(now, point) {
      const asks = pinchAsks(this.pinchFrom, now, this.overview);
      if (!asks) return;
      this.pinchFrom = 0;
      this.zoomAsked(asks, point);
    },

    /** @returns {Card[]} the cards on the table */
    tableCards() {
      return /** @type {Card[]} */ (/** @type {unknown} */ ([...this.world().querySelectorAll('gesture-card')]));
    },

    toggleOverview() {
      if (this.overview) this.leaveOverview(null, null);
      else this.enterOverview();
    },

    /**
     * O shows the overview or leaves it; Escape leaves it. Only when nothing
     * has the focus, as for the arrow keys.
     *
     * @param {KeyboardEvent} event
     */
    overviewKey(event) {
      const asks = keyAsks(event.key, this.overview);
      if (!asks || !freeKey(event, this)) return;
      event.preventDefault();
      if (asks === 'toggle') this.toggleOverview();
      else this.leaveOverview(null, null);
    },

    /**
     * Shows the whole table, small, each card as it is with a label, spread
     * out so that none overlaps (lib/overview.js).
     */
    enterOverview() {
      if (this.overview) return;
      const cards = this.tableCards();
      const boxes = cards.map((card) => onTable(card.getBoundingClientRect(), this.offset, this.zoom));
      const first = this.overviewView(boxes);
      if (!first) {
        this.toast('The table is empty: there is nothing to see in an overview.');
        return;
      }
      // Spread for the scale of the table as it is; spread out, it may show
      // smaller, so spread once more for that scale.
      const once = this.spreadFor(cards, boxes, first);
      const { shifts, view } = once.view.scale < first.scale ? this.spreadFor(cards, boxes, once.view) : once;
      this.writing?.end();
      this.zoomBefore = this.zoom;
      this.overview = true;
      this.tiles(cards, true);
      this.classList.add('is-overview');
      this.zoomTo(view.offset, view.scale);
      this.spreadCards(cards, shifts);
      this.showOverview();
      this.toast(view.whole ? 'The whole table. Tap a card or a place to go there.' : 'The table, small. Pan to see the rest; tap a card or a place to go there.');
    },

    /**
     * How far each card moves so that no two cards or labels overlap at a
     * scale, and the overview's view of the cards so moved.
     *
     * @param {Card[]} cards
     * @param {{ left: number, top: number, right: number, bottom: number }[]} boxes the cards, on the table
     * @param {{ scale: number, offset: Point, whole: boolean }} at the view to spread for
     */
    spreadFor(cards, boxes, at) {
      const room = boxes.map((box, i) => {
        const label = labelSize(tileName(cards[i]));
        return labelled(box, label.width / at.scale, label.height / at.scale);
      });
      const shifts = spreadOut(room, SPREAD_GAP / at.scale);
      const view = this.overviewView(room.map((box, i) => shifted(box, shifts[i])), boxes.map((box) => box.right - box.left)) ?? at;
      return { shifts, view };
    },

    /**
     * Where the overview shows the table: whole, or the part about the middle
     * of the screen now, at a scale where the cards can be found.
     *
     * @param {{ left: number, top: number, right: number, bottom: number }[]} boxes the cards, on the table
     * @param {number[]} [widths] the cards' own widths, when the boxes have room for labels too
     */
    overviewView(boxes, widths = boxes.map((box) => box.right - box.left)) {
      const table = around(boxes);
      if (!table) return null;
      const free = this.free();
      const middle = middleOf(free);
      const now = { x: (middle.x - this.offset.x) / this.zoom, y: (middle.y - this.offset.y) / this.zoom };
      return overviewOf(table, free, widths, now);
    },

    /**
     * The free part of the screen, less the search panel where it lies across
     * the top of it (on a phone, a sheet over the table), so that a card
     * brought to the top shows its heading.
     *
     * @param {{ left: number, top: number, right: number, bottom: number }} free
     */
    clearOfSearch(free) {
      const panel = this.querySelector('passage-search');
      const box = panel?.getClientRects().length ? panel.getBoundingClientRect() : null;
      const across = box && box.top <= free.top + 1 && box.width >= 0.8 * (free.right - free.left);
      return across ? { ...free, top: Math.min(box.bottom, free.bottom - 1) } : free;
    },

    /** The screen turned, or changed size: the overview fits it again. */
    refitOverview() {
      const view = this.overview ? this.overviewView(this.tableCards().map((card) => onTable(card.getBoundingClientRect(), this.offset, this.zoom))) : null;
      if (!view) return;
      this.zoomTo(view.offset, view.scale, false);
    },

    /**
     * Back to full size: with a card in the middle, or the place under a
     * point where it is, or else the middle where it is.
     *
     * @param {Point | null} point
     * @param {Element | null} card
     * @param {boolean} [animate] false at once, as before a change to the cards
     */
    leaveOverview(point, card, animate = true) {
      if (!this.overview) return;
      const free = this.clearOfSearch(this.free());
      // To a card: at full size. Else to the zoom before the overview.
      const zoom = card ? 1 : this.zoomBefore;
      const offset = card ? centring(this.placeOf(card), free) : keeping(point ?? middleOf(free), this.offset, this.zoom, zoom);
      const cards = this.tableCards();
      this.overview = false;
      this.classList.remove('is-overview');
      this.tiles(cards, false);
      this.zoomTo(offset, zoom, animate);
      this.spreadCards(cards, null);
      this.showOverview();
      this.keepSoon();
    },

    /**
     * Moves each card by its shift for the overview, or back to its place
     * (null). While the table zooms, the cards glide (CSS, .is-zooming).
     *
     * @param {Card[]} cards
     * @param {{ x: number, y: number }[] | null} shifts
     */
    spreadCards(cards, shifts) {
      cards.forEach((card, i) => spreadCard(card, shifts?.[i] ?? null));
    },

    /**
     * A card's box on the table where it really is, not where the overview
     * moved it.
     *
     * @param {Element} card
     */
    placeOf(card) {
      const shift = spreadOf.get(card) ?? { x: 0, y: 0 };
      return shifted(onTable(card.getBoundingClientRect(), this.offset, this.zoom), { x: -shift.x, y: -shift.y });
    },

    /**
     * A tap in the overview: back to the card it is on, or to the place.
     *
     * @param {Point} point
     */
    overviewTap(point) {
      const cards = this.tableCards();
      const at = tappedIn(cards.map((card) => ({ box: card.getBoundingClientRect(), z: Number(card.style.zIndex) || 0 })), point);
      this.leaveOverview(point, cards[at] ?? null);
    },

    /**
     * Names each card's tile in the overview, or takes the names away.
     *
     * @param {Card[]} cards
     * @param {boolean} on
     */
    tiles(cards, on) {
      for (const card of cards) {
        if (!(card instanceof HTMLElement)) continue;
        if (on) {
          card.dataset.tile = tileName(card);
          // The chip is the card's, outside its sheet: it takes the sheet's pigment.
          const sheet = card.querySelector(':scope > article');
          if (sheet) card.style.setProperty('--tile-kind', getComputedStyle(sheet).getPropertyValue('--kind'));
        } else {
          delete card.dataset.tile;
          card.style.removeProperty('--tile-kind');
        }
      }
    },

    /**
     * Moves and scales the table, in a short zoom (none for a reader who asks
     * for less motion). The lines hide while it moves, and are drawn again
     * where it rests.
     *
     * @param {Point} offset
     * @param {number} scale
     * @param {boolean} [animate]
     */
    zoomTo(offset, scale, animate = true) {
      const world = this.world();
      const from = { x: this.offset.x - offset.x, y: this.offset.y - offset.y, scale: this.zoom };
      this.offset = offset;
      this.zoom = scale;
      this.scaleWorld();
      world.style.left = `${offset.x}px`;
      world.style.top = `${offset.y}px`;
      if (!animate || lessMotion()) return this.drawSoon();
      this.classList.add('is-zooming');
      const motion = world.animate([{ translate: `${from.x}px ${from.y}px`, scale: String(from.scale) }, { translate: '0px 0px', scale: String(scale) }], { duration: ZOOM_MS, easing: ZOOM_EASE });
      motion.finished
        .catch(() => {})
        .finally(() => {
          this.classList.remove('is-zooming');
          this.drawSoon();
        });
    },

    /** Tells the rail whether the overview shows. */
    showOverview() {
      /** @type {any} */ (this.querySelector('table-rail'))?.setOverview?.(this.overview);
    },

    paint() {
      const { x, y } = this.offset;
      const world = this.world();
      world.style.left = `${x}px`;
      world.style.top = `${y}px`;
      // A pan moves every line and label by the same amount: they move with
      // it, and are drawn again only once the pan rests. On a table of many
      // cards and cross-references, drawing every frame drops frames.
      const at = this.drawnAt;
      if (!at) {
        this.drawSoon();
        return;
      }
      const dx = x - at.x;
      const dy = y - at.y;
      /** @type {SVGGElement | null} */ (this.querySelector('.table__drawn'))?.setAttribute('transform', `translate(${dx} ${dy})`);
      /** @type {SVGGElement | null} */ (this.querySelector('.table__links-drawn'))?.setAttribute('transform', `translate(${dx} ${dy})`);
      const labels = /** @type {HTMLElement | null} */ (this.querySelector('.table__labels'));
      if (labels) labels.style.translate = `${dx}px ${dy}px`;
      this.drawTimeLines();
      clearTimeout(this.restTimer);
      this.restTimer = setTimeout(() => this.drawSoon(), 120);
    },

    /** @type {{ x: number, y: number } | null} the pan at the last drawing of the lines */
    drawnAt: null,
    /** @type {any} */
    restTimer: 0,
    /** @type {any} the zoom at rest, when the lines come back */
    scaleTimer: 0,

    /**
     * @param {{ address: string, pointer: Pull | null, version?: string }} detail
     */
    async place({ address, pointer, version }) {
      const card = await this.fetchCard(address, version ? { version } : {});
      if (!card) return;
      // A long passage comes in its short form.
      if (Number(card.dataset.verses) > LONG) this.setShort(card, true);
      this.putDown(card, pointer);
      this.keep();
    },

    /**
     * Where a new card goes: in the finger that pulled it out, where it was
     * let go, in a phone's free spot, or in the open part of the table.
     *
     * @param {Card} card
     * @param {Pull | null} pointer
     */
    putDown(card, pointer) {
      if (pointer?.down) card.hold(pointer.id, pointer);
      else if (pointer) card.placeAt(pointer);
      else if (isPhone()) card.placeAt(this.phoneSpot(card));
      else card.placeAt(this.openSpot());
    },

    /**
     * Where a new card goes on a phone: at the left edge, near the top, and
     * a little lower for each card after it. A card wider than the screen at
     * the zoom now zooms the table out until it fits.
     *
     * @param {Element} card
     */
    phoneSpot(card) {
      const EDGE = 8;
      const width = card instanceof HTMLElement ? card.offsetWidth : 0;
      const fit = width ? clampZoom((innerWidth - 2 * EDGE) / width) : this.zoom;
      if (fit < this.zoom) this.zoomTo(keeping({ x: EDGE, y: this.free().top }, this.offset, this.zoom, fit), fit, false);
      const step = (this.world().querySelectorAll('gesture-card').length - 1) % 6;
      // Below the notch: the free part of the screen begins under it.
      const top = Math.max(EDGE, this.free().top) + step * 24;
      // The grip is GRIP (gesture-card) from the card's corner, at the zoom.
      return { x: EDGE + 48 * this.zoom, y: top + 32 * this.zoom };
    },

    /** @param {{ from: string, to: string }} detail */
    mark({ from, to }) {
      const before = this.highlights;
      this.highlights = toggle(before, from, to, this.pen);
      this.links = dropLinksTo(this.links, removed(before, this.highlights));
      paintHighlights(this.world(), this.highlights);
      this.keep();
      this.drawSoon();
    },

    /** @param {LinkDrag} detail */
    linking({ span, card, x, y }) {
      const end = card ? wholeOf(card) : span;
      if (end) this.pending = { end, card: card ?? null, x, y };
      this.drawSoon();
    },

    /** @param {LinkDrag} detail */
    link({ span, card: from, x, y }) {
      this.pending = null;
      this.drawSoon();
      if (!Number.isFinite(x)) return;
      if (from) this.linkCard(from, x, y);
      else if (span) this.linkWords(span, x, y);
    },

    /**
     * Words let go of somewhere: what that does depends on what is there.
     *
     * @param {Span} span
     * @param {number} x
     * @param {number} y
     */
    linkWords(span, x, y) {
      const source = this.sourceOf(span);
      const under = document.elementFromPoint(x, y);
      const card = this.tableCard(under);
      // On a note: the words are quoted in it. On another card: a link. On
      // the empty table: the words become a card of their own.
      if (card?.dataset.kind === 'note') this.dropOnNote(card, source, x, y);
      else if (card) this.linkTo(source, x, y);
      else this.dropOnTable(source, under, x, y);
    },

    /**
     * A card moved with its group (gesture-card's card-group): the cards
     * linked to it, step by step, lift with it and move as far as it moves.
     *
     * @param {Card} card
     * @param {{ phase: string, dx: number, dy: number }} detail
     */
    moveGroup(card, { phase, dx, dy }) {
      if (phase === 'start') this.liftGroup(card);
      else if (phase === 'move') this.grouped.forEach(({ card: each, from }) => each.setMatrix({ ...from, e: from.e + dx, f: from.f + dy }));
      else this.dropGroup();
    },

    /** @param {Card} card */
    liftGroup(card) {
      const joins = this.links.map(({ a, b }) => /** @type {[Element[], Element[]]} */ ([this.placesOf(a).map((place) => place.card), this.placesOf(b).map((place) => place.card)]));
      const others = /** @type {Card[]} */ ([...cluster(/** @type {Element} */ (card), joins)].filter((each) => each !== card));
      this.grouped = others.map((each) => ({ card: each, from: { ...each.matrix } }));
      if (!others.length) return;
      // Above the other cards while they move, as the held card is.
      for (const each of others) this.raise(each);
      for (const each of [card, ...others]) each.classList.add('is-grouped');
    },

    dropGroup() {
      for (const each of this.world().querySelectorAll('.is-grouped')) each.classList.remove('is-grouped');
      this.grouped = [];
    },

    /**
     * A line from a card's link button let go on another card: the two
     * whole cards are linked, or the link between them taken away.
     *
     * @param {HTMLElement} card
     * @param {number} x
     * @param {number} y
     */
    linkCard(card, x, y) {
      const target = this.tableCard(document.elementFromPoint(x, y));
      if (!target || target === card) return;
      if (this.joinCards(card, target) === 'removed') this.toast(`The link to ${tileName(target)} is removed.`);
    },

    /**
     * Links two whole cards, or takes away the link between them.
     *
     * @param {HTMLElement} card
     * @param {HTMLElement} target
     * @returns {'added' | 'removed' | ''} '' when they are the same passage
     */
    joinCards(card, target) {
      const before = this.links.length;
      this.links = toggleLink(this.links, wholeOf(card), wholeOf(target));
      if (this.links.length === before) return '';
      this.keep();
      this.drawSoon();
      return this.links.length > before ? 'added' : 'removed';
    },

    /**
     * The link button, clicked or pressed with a key: a list of the other
     * cards on the table, to link this one to (or to take a link away). It
     * also reaches a card that is off the screen.
     *
     * @param {HTMLElement} card
     * @param {HTMLElement} button
     */
    chooseLink(card, button) {
      const chooser = /** @type {HTMLElement} */ (this.querySelector('.table__chooser'));
      const from = wholeOf(card);
      /** @type {End[]} */
      const seen = [from];
      /** @type {HTMLElement[]} */
      const items = [];
      for (const other of /** @type {NodeListOf<HTMLElement>} */ (this.world().querySelectorAll('gesture-card'))) {
        const end = wholeOf(other);
        if (seen.some((each) => sameEnd(each, end))) continue;
        seen.push(end);
        items.push(this.chooserItem(card, other, linked(this.links, from, end), chooser));
      }
      const title = /** @type {HTMLElement} */ (chooser.querySelector('.chooser__title'));
      title.textContent = `Link ${tileName(card)} to`;
      const list = /** @type {HTMLElement} */ (chooser.querySelector('.chooser__list'));
      list.replaceChildren(...items);
      /** @type {HTMLElement} */ (chooser.querySelector('.chooser__empty')).hidden = items.length > 0;
      if (chooser.matches(':popover-open')) chooser.hidePopover();
      this.offerGather(chooser, /** @type {Card} */ (/** @type {unknown} */ (card)));
      chooser.showPopover();
      placeBelow(chooser, button.getBoundingClientRect());
      (items[0] ?? chooser).focus();
      // Escape, a tap outside, or a choice: the focus goes back to the button,
      // unless the tap gave it to something else.
      const done = new AbortController();
      chooser.addEventListener('toggle', (event) => {
        if (/** @type {ToggleEvent} */ (event).newState !== 'closed') return;
        done.abort();
        if (chooser.contains(document.activeElement) || document.activeElement === document.body) button.focus();
      }, { signal: done.signal });
    },

    /**
     * One card in the list of the link button.
     *
     * @param {HTMLElement} card the card the link starts from
     * @param {HTMLElement} other
     * @param {boolean} on whether they are linked already
     * @param {HTMLElement} chooser
     */
    chooserItem(card, other, on, chooser) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'chooser__card';
      item.setAttribute('aria-pressed', String(on));
      const name = document.createElement('span');
      name.textContent = tileName(other);
      const state = document.createElement('span');
      state.className = 'chooser__state';
      state.textContent = on ? 'Linked' : '';
      item.append(name, state);
      item.addEventListener('click', () => {
        const done = this.joinCards(card, other);
        chooser.hidePopover();
        if (done) this.toast(done === 'added' ? `Linked to ${tileName(other)}.` : `The link to ${tileName(other)} is removed.`);
      });
      return item;
    },

    /**
     * Words let go on a note: highlighted, and quoted in it.
     *
     * @param {HTMLElement} card
     * @param {Span} source
     * @param {number} x
     * @param {number} y
     */
    dropOnNote(card, source, x, y) {
      this.highlight(source);
      this.quote(card, source, { x, y });
    },

    /**
     * The card on the table that an element is in, if any.
     *
     * @param {Element | null} element
     * @returns {HTMLElement | null}
     */
    tableCard(element) {
      const card = element?.closest('gesture-card');
      return card instanceof HTMLElement && this.world().contains(card) ? card : null;
    },

    /**
     * A link from the words to what is under the finger, or the link taken
     * away if there is one.
     *
     * @param {Span} source
     * @param {number} x
     * @param {number} y
     */
    linkTo(source, x, y) {
      const target = this.endAt(x, y);
      if (!target) return;
      this.highlight(source);
      this.links = toggleLink(this.links, source, target);
      this.keep();
    },

    /**
     * Words lifted on the empty table become a card of their own.
     *
     * @param {Span} source
     * @param {Element | null} under
     * @param {number} x
     * @param {number} y
     */
    dropOnTable(source, under, x, y) {
      if (under !== this && under !== this.world()) return;
      this.highlight(source);
      this.place({ address: spanAddress(source), pointer: { id: -1, x, y, down: false } });
    },

    /**
     * Makes a span a highlight, in the current style, unless it is one.
     *
     * @param {Span} span
     */
    highlight(span) {
      if (this.highlights.some((each) => each.from === span.from && each.to === span.to)) return;
      this.highlights = [...this.highlights, this.pen === STYLES[0] ? span : { ...span, style: this.pen }];
      paintHighlights(this.world(), this.highlights);
    },

    /**
     * Adds a span to a note's quotes: where it was dropped among the note's
     * words, or at the caret's line if the note is being written.
     *
     * @param {HTMLElement} card
     * @param {Span} span
     * @param {{ x: number, y: number } | null} [point] where it was dropped
     */
    async quote(card, span, point = null) {
      const note = this.notes.find((each) => each.id === card.dataset.note);
      const address = spanAddress(span);
      if (!note || hasQuote(note, address)) return;
      const drawn = await this.loadQuote(address);
      // The same words dropped again while they loaded: one quote is enough.
      if (hasQuote(note, address)) return;
      this.rememberQuote(card, address, drawn);
      const quote = quoteNode(address, drawn);
      // Being written: the quote goes in at the caret's line; else where it
      // was dropped.
      if (this.writing?.id === note.id) quoteAtCaret(this.writing.view, quote);
      else this.quoteAtDrop(card, note, span, quote, point);
    },

    /**
     * Keeps a quote's words as the server drew them, for its card.
     *
     * @param {HTMLElement} card
     * @param {string} address
     * @param {HTMLElement | null} drawn
     */
    rememberQuote(card, address, drawn) {
      if (drawn) this.quotesOf(card).set(address, drawn);
    },

    /**
     * Puts a quote in a note where it was dropped: before the first block
     * under the drop, else at the end.
     *
     * @param {HTMLElement} card
     * @param {{ doc?: any, text: string, quotes: Span[] }} note
     * @param {Span} span
     * @param {object} quote the quote node, as JSON
     * @param {{ x: number, y: number } | null} point
     */
    quoteAtDrop(card, note, span, quote, point) {
      const doc = docOf(note).toJSON();
      doc.content.splice(dropIndex(card.querySelector('.note__text'), point, doc.content.length), 0, quote);
      note.doc = doc;
      note.quotes = [...note.quotes, { from: span.from, to: span.to }];
      this.redrawNote(card, note);
      this.paintQuoted(this.world());
      this.keep();
    },

    /** @type {WeakMap<Element, Map<string, HTMLElement>>} each note card's quotes, drawn */
    drawnQuotes: new WeakMap(),

    /** @param {Element} card */
    quotesOf(card) {
      let quotes = this.drawnQuotes.get(card);
      if (!quotes) {
        quotes = new Map();
        this.drawnQuotes.set(card, quotes);
      }
      return quotes;
    },

    /**
     * A quote's words as the card's server draws them.
     *
     * @param {string} address a span address
     * @returns {Promise<HTMLElement | null>}
     */
    async loadQuote(address) {
      const response = await fetch(`/card/note%3Aq?${new URLSearchParams({ fragment: 'card', quotes: address })}`).catch(() => null);
      if (!response?.ok) return null;
      const holder = document.createElement('template');
      holder.setHTMLUnsafe(await response.text());
      const section = holder.content.querySelector('.note__quote[data-quote]');
      if (!(section instanceof HTMLElement)) return null;
      document.adoptNode(section);
      paintHighlights(section, this.highlights);
      return section;
    },

    /**
     * Shows a note's words on its card again, with its quotes in place.
     *
     * @param {Element} card
     * @param {{ doc?: any, text: string, quotes: Span[] }} note
     */
    redrawNote(card, note) {
      const host = card.querySelector('.note__text');
      if (host instanceof HTMLElement) showNoteText(host, docOf(note), this.quotesOf(card));
      card.querySelector('.note__hint')?.toggleAttribute('hidden', note.quotes.length > 0);
      this.drawSoon();
    },

    /**
     * The words a link starts from. A finger that left the card from a single
     * highlighted word takes the whole highlight with it.
     *
     * @param {Span} span
     * @returns {Span}
     */
    sourceOf(span) {
      if (span.from !== span.to) return span;
      return this.highlights.find((each) => covers(each, span.from)) ?? span;
    },

    /**
     * What a link lands on at a point on the screen: the highlight under the
     * finger, or else the whole card under it, or nothing.
     *
     * @param {number} x
     * @param {number} y
     * @returns {End | null}
     */
    endAt(x, y) {
      const under = document.elementFromPoint(x, y);
      const card = this.tableCard(under);
      if (!under || !card) return null;
      return this.highlightAt(under) ?? wholeOf(card);
    },

    /**
     * The highlight a word is in, if any.
     *
     * @param {Element} element
     */
    highlightAt(element) {
      const word = wordAt(element);
      return word ? this.highlights.find((each) => covers(each, word)) : undefined;
    },

    /** @param {{ target: EventTarget | null, x?: number, y?: number }} detail */
    tapped({ target, x, y }) {
      if (!(target instanceof Element)) return;
      /** @type {Tap} */
      const tap = { element: target, x, y };
      // The first that knows the tap takes it, in this order.
      const handlers = [
        this.tapLink, this.tapFootnote, this.tapSaid, this.tapListening, this.tapMore, this.tapTitle, this.tapNote,
        this.tapForm, this.tapStudy, this.tapPlace, this.tapChapter, this.tapHeading, this.tapWord, this.tapVerse,
      ];
      for (const handle of handlers) if (handle.call(this, tap)) return;
    },

    /** The search panel. @returns {any} */
    panel() {
      return this.querySelector('passage-search');
    },

    /**
     * A link on a card (Watch on The Chosen): the card holds the finger, so
     * the link never hears its click; open it here, in a new tab.
     *
     * @param {Tap} tap
     */
    tapLink({ element }) {
      const link = element.closest('a[href]');
      if (!(link instanceof HTMLAnchorElement) || !link.closest('gesture-card')) return false;
      window.open(link.href, '_blank', 'noopener,noreferrer');
      return true;
    },

    /**
     * The transliteration of a word of the Hebrew or the Greek: say it.
     *
     * @param {Tap} tap
     */
    tapSaid({ element }) {
      const said = element.closest('.inter__translit');
      if (!said) return false;
      const word = said.closest('.inter__word')?.querySelector('.inter__text')?.textContent ?? '';
      const lang = said.closest('[lang="hbo"]') ? 'he' : 'el';
      sayWord(word, lang).then((ok) => {
        if (!ok) this.toast(`This device has no ${LANGUAGE_NAMES[lang]} voice.`);
      });
      return true;
    },

    /**
     * In the listening mode (the speaker button pressed), a tap on a verse
     * plays from it, and a tap on the verse being read pauses. Out of the
     * mode, a tap does what it always does.
     *
     * @param {Tap} tap
     */
    tapListening({ element }) {
      const target = this.listeningAt(element);
      if (!target) return false;
      const { card, listen, ref } = target;
      if (this.verseBeingRead(card) === ref) Reader.current?.stop();
      else this.readAloud(card, listen, ref);
      return true;
    },

    /**
     * The verse tapped on a card in the listening mode, with the card and its
     * speaker button; null out of the mode.
     *
     * @param {Element} element
     */
    listeningAt(element) {
      const verse = element.closest('[data-ref]');
      const card = element.closest('gesture-card[data-listening]');
      const listen = card?.querySelector('button[data-action="listen"]');
      if (!verse || !(card instanceof HTMLElement) || !(listen instanceof HTMLButtonElement)) return null;
      return { card, listen, ref: verse.getAttribute('data-ref') ?? '' };
    },

    /**
     * The verse a card is reading aloud now, if any.
     *
     * @param {HTMLElement} card
     * @returns {string | null}
     */
    verseBeingRead(card) {
      const reading = Reader.current?.items.some((item) => card.contains(item.element));
      return reading ? card.querySelector('.is-read')?.closest('[data-ref]')?.getAttribute('data-ref') ?? null : null;
    },

    /**
     * Read more on an entry's card: the card holds the press, so the
     * details do not open by themselves.
     *
     * @param {Tap} tap
     */
    tapMore({ element }) {
      const more = element.closest('.entity__more > summary')?.parentElement;
      if (!(more instanceof HTMLDetailsElement)) return false;
      more.open = !more.open;
      return true;
    },

    /**
     * A note's title: write it, in place.
     *
     * @param {Tap} tap
     */
    tapTitle({ element }) {
      const titled = element.closest('.passage__heading')?.closest('gesture-card[data-kind="note"]');
      if (!(titled instanceof HTMLElement)) return false;
      this.writeTitle(titled);
      return true;
    },

    /**
     * A note, anywhere but on the words it quotes or a button: write in it,
     * with the caret where it touched.
     *
     * @param {Tap} tap
     */
    tapNote({ element, x, y }) {
      const note = element.closest('gesture-card[data-kind="note"]');
      if (!(note instanceof HTMLElement) || wordAt(element) || element.closest('button')) return false;
      this.writeNote(note, element.closest('.note__text') ? pointOf(x, y) : null);
      return true;
    },

    /**
     * The grammar of a word of the Hebrew or the Greek: find every word in
     * the same form (lib/grammar.js).
     *
     * @param {Tap} tap
     */
    tapForm({ element }) {
      const form = element.closest('[data-grammar]');
      if (!(form instanceof HTMLElement) || !form.dataset.grammar) return false;
      this.panel()?.searchFor(form.dataset.grammar);
      return true;
    },

    /**
     * A word of the Hebrew or the Greek: study its Strong's number. The
     * study underlines the KJV words that render it on every card.
     *
     * @param {Tap} tap
     */
    tapStudy({ element }) {
      const orig = element.closest('[data-orig-s]');
      if (!(orig instanceof HTMLElement) || !orig.dataset.origS) return false;
      this.panel()?.searchFor(orig.dataset.origS);
      return true;
    },

    /** @param {Tap} tap */
    tapPlace({ element }) {
      const place = element.closest('[data-place]');
      if (!place) return false;
      this.panel()?.showEntity(place.getAttribute('data-place'));
      return true;
    },

    /**
     * A chapter on a landscape: the chapter goes down beside it.
     *
     * @param {Tap} tap
     */
    tapChapter({ element }) {
      const chapter = element.closest('[data-chapter]');
      if (!chapter) return false;
      const box = chapter.getBoundingClientRect();
      const address = chapter.getAttribute('data-chapter') ?? '';
      this.place({ address, pointer: { id: -1, x: box.right + ROW_GAP, y: box.top, down: false } });
      return true;
    },

    /** @param {Tap} tap */
    tapHeading({ element }) {
      const card = element.closest('.passage__heading')?.closest('gesture-card');
      if (!(card instanceof HTMLElement)) return false;
      this.headingTapped(card);
      return true;
    },

    /**
     * A footnote's letter on a BSB card (lib/footnotes.js): its words show
     * beside it. The card holds the finger, so the button never hears its
     * click; a key's click comes through the table's click listener.
     *
     * @param {Tap} tap
     */
    tapFootnote({ element }) {
      const mark = element.closest('.fn');
      if (!(mark instanceof HTMLElement) || !mark.closest('gesture-card')) return false;
      this.showFootnote(mark);
      return true;
    },

    /**
     * Shows a footnote in the table's popover, under its letter. Escape or a
     * tap outside closes it, and the focus stays where it was.
     *
     * @param {HTMLElement} mark
     */
    showFootnote(mark) {
      const popover = /** @type {HTMLElement} */ (this.querySelector('.table__footnote'));
      const verse = /** @type {HTMLElement} */ (mark.closest('[data-ref], [data-bsb-ref]'));
      /** @type {HTMLElement} */ (popover.querySelector('.footnote__label')).textContent = footnoteTitle(verse.dataset, String(mark.textContent));
      /** @type {HTMLElement} */ (popover.querySelector('.footnote__text')).textContent = mark.getAttribute('data-note');
      // Open, or kept open for the next letter.
      popover.togglePopover(true);
      placeBelow(popover, mark.getBoundingClientRect());
    },

    /** @type {Promise<import('../lib/reference.js').BookEntry[] | null> | null} the books, for references in pasted text */
    books: null,

    /**
     * The books and the verses of their chapters, fetched once (routes/books).
     * A failed fetch is tried again at the next paste.
     */
    bookList() {
      this.books ??= fetch('/books').then((response) => (response.ok ? response.json() : null), () => null);
      this.books.then((books) => {
        if (!books) this.books = null;
      });
      return this.books;
    },

    /**
     * Text pasted on the table, not in a field: a card for each reference in
     * it (lib/citations.js, pastedReferences), each where a tapped result goes.
     * The text stays in the browser: only the list of books is fetched.
     *
     * @param {ClipboardEvent} event
     */
    async pasted(event) {
      const text = pastedText(event);
      if (!text) return;
      event.preventDefault();
      const books = await this.bookList();
      const found = books ? pastedReferences(text, books, PASTE_LIMIT + 1) : [];
      this.toast(pastedMessage(found.length, Boolean(books)));
      await this.placeEach(found.slice(0, PASTE_LIMIT));
    },

    /** @param {Tap} tap */
    tapWord({ element }) {
      const word = wordAt(element);
      // A word's study reads the KJV's Strong's numbers: the BSB has none.
      if (!word || inBsb(word)) return false;
      this.panel()?.showWord(word);
      return true;
    },

    /** @param {Tap} tap */
    tapVerse({ element }) {
      const verse = element.closest('kjv-verse[data-ref]');
      if (!(verse instanceof HTMLElement) || !verse.dataset.ref) return false;
      this.panel()?.showReferences(verse.dataset.ref);
      return true;
    },

    /**
     * A tap on a card's heading: a passage or a phrase shows its guide, an
     * entity shows itself, and a landscape shows its subject.
     *
     * @param {HTMLElement} card
     */
    headingTapped(card) {
      const panel = this.panel();
      const address = card.dataset.address ?? '';
      /** @type {Record<string, () => void>} */
      const byKind = {
        passage: () => this.showGuideOf(card),
        phrase: () => this.showGuideOf(card),
        entity: () => panel?.showEntity(address),
        landscape: () => showSubject(panel, card.dataset.subject ?? ''),
      };
      byKind[card.dataset.kind ?? '']?.();
    },

    /**
     * A passage's or a phrase's guide, in the search panel; the table puts
     * what the guide places beside this card.
     *
     * @param {HTMLElement} card
     */
    showGuideOf(card) {
      this.guideCard = card;
      this.panel()?.showGuide(card.dataset.address ?? '', this.notesOn(card));
    },

    /**
     * The notes on a passage of a card on the table, by the card's address.
     *
     * @param {string} address
     */
    notesAt(address) {
      const card = this.world().querySelector(`gesture-card[data-address="${CSS.escape(address)}"]`);
      return card instanceof HTMLElement ? this.notesOn(card) : [];
    },

    /**
     * The notes that quote any verse of a card.
     *
     * @param {HTMLElement} card
     * @returns {{ id: string, title: string, text: string, kind?: string, answered: boolean }[]}
     */
    notesOn(card) {
      const ranges = [...card.querySelectorAll('kjv-verse[data-ref], .bsb-verse[data-ref]')].flatMap((verse) => verseRanges(/** @type {HTMLElement} */ (verse).dataset.ref ?? ''));
      return this.notes
        .filter((note) => note.quotes.some((quote) => {
          const from = wordKey(quote.from);
          const to = wordKey(quote.to);
          return ranges.some(([first, last]) => from <= last && to >= first);
        }))
        .map((note) => ({ id: note.id, title: note.title ?? '', text: note.text, kind: note.kind, answered: Boolean(note.answered) }));
    },

    /**
     * Brings a note's card into view and opens it.
     *
     * @param {string} id
     */
    showNote(id) {
      const card = this.world().querySelector(`gesture-card[data-note="${CSS.escape(id)}"]`);
      if (!(card instanceof HTMLElement)) return;
      this.raise(card);
      this.glideTo(card.getBoundingClientRect());
    },

    /**
     * Puts cards down in a row to the right of the card whose guide is on
     * show, as one step that undo takes back.
     *
     * @param {string[]} addresses
     */
    /**
     * Puts cards down one after another, each where a tapped result goes.
     *
     * @param {string[]} addresses
     */
    async placeEach(addresses) {
      for (const address of addresses) await this.place({ address, pointer: null });
    },

    /** @param {string[]} addresses */
    async placeBeside(addresses) {
      const anchor = this.guideCard?.isConnected ? /** @type {Card} */ (/** @type {unknown} */ (this.guideCard)) : null;
      if (!anchor) return this.placeEach(addresses);
      const box = anchor.getBoundingClientRect();
      const corner = tablePoint({ x: box.right, y: box.top }, this.offset, this.zoom);
      let x = corner.x + ROW_GAP;
      const y = corner.y;
      this.applying += 1;
      try {
        for (const address of addresses) {
          const card = await this.fetchCard(address, {});
          if (!card) continue;
          card.setMatrix({ a: 1, b: 0, c: 0, d: 1, e: x, f: y });
          this.raise(card);
          x += card.offsetWidth + ROW_GAP;
        }
        this.later = true;
      } finally {
        this.applying -= 1;
        this.finish();
      }
    },

    /**
     * Puts a card above the other cards at rest.
     *
     * @param {HTMLElement} card
     */
    raise(card) {
      const levels = [...this.world().querySelectorAll('gesture-card')]
        .filter((each) => each !== card)
        .map((each) => Number(/** @type {HTMLElement} */ (each).style.zIndex) || 0);
      card.style.zIndex = String(Math.max(0, ...levels.filter((level) => level < 1000000)) + 1);
    },

    /**
     * Pans the table so a box on the screen is in the middle of its open
     * part: the part the rail and its docked panels leave free.
     *
     * @param {DOMRect} box
     */
    glideTo(box) {
      const free = this.free();
      const target = { x: (free.left + free.right) / 2, y: (free.top + free.bottom) / 2 };
      this.glide(target.x - (box.left + box.width / 2), target.y - (box.top + box.height / 2));
    },

    /** @param {Rule[]} rules */
    setRules(rules) {
      this.rules = rules;
      this.paintRules(this.world());
      this.showRules();
      this.keep();
    },

    /** Tells the menu and the panel which rules are on. */
    showRules() {
      /** @type {any} */ (this.querySelector('table-menu'))?.setRules?.(this.rules);
      /** @type {any} */ (this.querySelector('passage-search'))?.showRules?.(this.rules);
    },

    /**
     * Marks every word under `root` that a rule marks: data-rule holds the
     * styles, which global.css draws.
     *
     * @param {Element} root
     */
    paintRules(root) {
      for (const element of root.querySelectorAll('.w')) setRule(/** @type {HTMLElement} */ (element), ruleOf(/** @type {HTMLElement} */ (element), this.rules));
    },

    /** @param {{ code: string, entity: string }} detail */
    study({ code, entity }) {
      this.studied = code;
      this.shown = entity;
      this.shownPlaces = new Set();
      this.showRules();
      this.paintStudy(this.world());
      const strip = this.querySelector('time-line');
      for (const tick of strip?.querySelectorAll('.is-shown') ?? []) tick.classList.remove('is-shown');
      if (entity.startsWith('event:')) /** @type {any} */ (strip)?.tickFor(entity)?.classList.add('is-shown');
      if (entity.startsWith('world:')) /** @type {any} */ (strip)?.tickFor(entity)?.classList.add('is-shown');
      this.paintMap();
    },

    /** The map card on the table, or null. */
    mapCard() {
      return this.world().querySelector(`gesture-card[data-address="${MAP}"]`);
    },

    /**
     * The frame of the map card, or null.
     *
     * @param {Element | null} [card]
     * @returns {MapView | null}
     */
    mapView(card = this.mapCard()) {
      const view = card?.querySelector('map-view');
      return view && typeof (/** @type {any} */ (view).fit) === 'function' ? /** @type {MapView} */ (view) : null;
    },

    /**
     * Puts a card down, or takes it away when it is on the table: the map,
     * or the landscape of the books.
     *
     * @param {string} address
     */
    async toggleCard(address) {
      const card = this.world().querySelector(`gesture-card[data-address="${CSS.escape(address)}"]`);
      if (card) {
        card.remove();
        this.keep();
        this.drawSoon();
        return;
      }
      if (address === MAP) {
        await this.openMap();
        return;
      }
      const placed = await this.fetchCard(address, {});
      if (!placed) return;
      placed.placeAt(this.openSpot());
      this.keep();
    },

    /** Puts the map on the table, unless it is there already. */
    async openMap() {
      if (this.mapCard()) {
        this.paintMap();
        return;
      }
      const card = await this.fetchCard(MAP, {});
      if (!card) return;
      const free = this.free();
      card.placeAt({ x: free.left + 80, y: free.top + 80 });
      this.keep();
    },

    /**
     * Puts the map on the table if it is not there, brings it to the top,
     * marks the places, and pans the table so they are in the open part of
     * the screen: the part the rail and its docked panels leave free.
     *
     * @param {string} ids place ids, with commas between, such as place:damascus_310
     * @param {{ x: number, y: number }[]} [more] other points the map's view takes in, in map units
     */
    async showOnMap(ids, more = []) {
      const list = String(ids).split(',').filter(Boolean);
      await this.openMap();
      const map = this.mapCard();
      if (!(map instanceof HTMLElement)) return;
      this.shownPlaces = new Set(list);
      this.paintMap();
      this.raise(map);
      await customElements.whenDefined('map-view');
      await this.mapView()?.fit(list, more);

      const boxes = list
        .map((id) => map.querySelector(`[data-place="${CSS.escape(id)}"] circle`)?.getBoundingClientRect())
        .filter((box) => box && box.width > 0);
      if (!boxes.length) {
        this.glideTo(map.getBoundingClientRect());
        return;
      }
      const left = Math.min(...boxes.map((box) => /** @type {DOMRect} */ (box).left));
      const top = Math.min(...boxes.map((box) => /** @type {DOMRect} */ (box).top));
      const right = Math.max(...boxes.map((box) => /** @type {DOMRect} */ (box).right));
      const bottom = Math.max(...boxes.map((box) => /** @type {DOMRect} */ (box).bottom));
      this.glideTo(new DOMRect(left, top, right - left, bottom - top));
    },

    /**
     * Draws a journey on the map: the map comes onto the table if it is not
     * there, its stops are named, and the view fits the route.
     *
     * @param {import('../data/journeys.js').JourneyView} journey
     */
    async showJourney(journey) {
      await this.openMap();
      const map = this.mapCard();
      if (!(map instanceof HTMLElement)) return;
      await customElements.whenDefined('map-view');
      const frame = /** @type {any} */ (this.mapView(map));
      frame?.showJourney(journey);
      // The stops that are places are marked; a proposed site has none, so
      // map-view draws it with the route, and the view takes it in too.
      const proposed = journey.stops.filter((stop) => stop.proposed).map(({ x, y }) => ({ x, y }));
      await this.showOnMap(journey.stops.map((stop) => stop.place).filter(Boolean).join(','), proposed);
    },

    /**
     * Pans the table by (dx, dy) over a third of a second, easing out.
     *
     * @param {number} dx
     * @param {number} dy
     */
    glide(dx, dy) {
      this.stopGlide();
      const from = { ...this.offset };
      const start = performance.now();
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const length = reduced ? 0 : 320;
      const frame = (/** @type {number} */ now) => {
        const t = length ? Math.min(1, (now - start) / length) : 1;
        const eased = 1 - (1 - t) ** 3;
        this.offset = { x: from.x + dx * eased, y: from.y + dy * eased };
        this.paint();
        if (t < 1) this.glideFrame = requestAnimationFrame(frame);
        else this.keep(false);
      };
      this.glideFrame = requestAnimationFrame(frame);
    },

    /** Stops a glide under way, where it is: a hand, the wheel or a key takes the table. */
    stopGlide() {
      cancelAnimationFrame(this.glideFrame);
    },

    /**
     * Labels the map's places that the cards on the table name, and marks the
     * place on show.
     */
    paintMap() {
      const map = this.mapCard();
      if (!map) return;
      markPlaces(map, namedPlaces([...this.world().querySelectorAll('gesture-card')]), new Set([this.shown, ...this.shownPlaces]));
      this.mapView(map)?.relabel();
      this.drawSoon();
    },

    /**
     * A curve from each card to the places on the map that it names: under
     * the cards, and again over the map, where it ends at the dots.
     *
     * @returns {{ lines: Element[], over: Element[] }}
     */
    placeLines() {
      const map = this.mapCard();
      if (!map) return { lines: [], over: [] };
      const frame = this.mapView(map);
      const cards = [...this.world().querySelectorAll('gesture-card')];
      const lines = cards.filter((card) => card !== map).flatMap((card) => placeLinesOf(card, map, frame));
      const above = cards.filter((card) => levelOf(card) > levelOf(map)).map((card) => card.getBoundingClientRect());
      return { lines, over: overBox(lines, 'table-map-clip', map.getBoundingClientRect(), above) };
    },

    /** @param {Element} root */
    paintStudy(root) {
      for (const element of root.querySelectorAll('.w')) {
        element.classList.toggle('is-studied', studiedWord(/** @type {HTMLElement} */ (element), this.studied, this.shown));
      }
      // The Hebrew and Greek words with the Strong's number being studied.
      for (const element of root.querySelectorAll('[data-orig-s]')) {
        element.classList.toggle('is-studied', Boolean(this.studied) && /** @type {HTMLElement} */ (element).dataset.origS === this.studied);
      }
    },

    /** @param {Element} card */
    async loadEvents(card) {
      const address = addressOf(card);
      if (!address) return;
      if (address === MAP) {
        this.paintMap();
        return;
      }
      if (address.includes(':')) return;
      const response = await fetch(`/entities/${encodeURIComponent(address)}`).catch(() => null);
      if (!response?.ok) return;
      /** @type {Record<string, string[]>} */
      const named = await response.json().catch(() => ({}));
      cardNamed.set(card, [...new Set(Object.values(named).flat())]);
      this.paintMap();
      this.drawSoon();
    },

    /**
     * A curve from each card to the ticks of the events it tells, and the
     * ticks marked: under the cards, and again over the strip, where it ends
     * at the ticks. Nothing while the strip is collapsed.
     *
     * @returns {{ lines: Element[], over: Element[] }}
     */
    timeLines() {
      const strip = /** @type {any} */ (this.querySelector('time-line'));
      if (!strip) return { lines: [], over: [] };
      const cards = [...this.world().querySelectorAll('gesture-card')];
      // Every class change first, then every measurement: a measurement after
      // a change forces the browser to work out the styles again.
      const told = toldEvents(cards);
      markTicks(strip, told);
      const ticks = tickBoxes(strip, told);
      const lines = cards.flatMap((card) => eventLines(card, ticks));
      return { lines, over: overBox(lines, 'table-strip-clip', strip.getBoundingClientRect()) };
    },

    /**
     * The curves to the timeline, which does not pan: a layer of their own,
     * under the cards and over the strip, drawn again on every pan frame
     * (they are few).
     */
    drawTimeLines() {
      const { lines, over } = this.timeLines();
      /** @type {SVGGElement | null} */ (this.querySelector('.table__links-fixed'))?.replaceChildren(...lines);
      /** @type {SVGGElement | null} */ (this.querySelector('.table__fixed'))?.replaceChildren(...over);
    },

    /** @param {Element} card */
    async loadReferences(card) {
      const address = card instanceof HTMLElement ? card.dataset.address : null;
      if (!address) return;
      const response = await fetch(`/xrefs/${encodeURIComponent(address)}`).catch(() => null);
      if (!response?.ok) return;
      const found = await response.json().catch(() => null);
      if (!found) return;
      references.set(card, found);
      this.drawSoon();
    },

    /**
     * The box a line to a verse on a card starts from: the verse, or the
     * card's heading when the card is in its short form.
     *
     * @param {Element} card
     * @param {Element} verse
     */
    verseBox(card, verse) {
      const box = verse.getBoundingClientRect();
      if (box.width > 0) return box;
      return (card.querySelector('.passage__heading') ?? card).getBoundingClientRect();
    },

    /**
     * A curve for each cross-reference from a verse on one card to a verse
     * on another, once per pair of verses whichever way the reference runs:
     * from each card's edge at the verse, under the cards.
     *
     * @param {DOMRect[]} panels the panels on show
     */
    referenceLines(panels) {
      const cards = [...this.world().querySelectorAll('gesture-card')];
      const verses = cards.map(versesOfCard);
      const pairs = referencePairs(cards.map((card, at) => ({ verses: [...verses[at].keys()], refs: references.get(card) ?? null })));
      // Each verse is measured once per frame, however many lines it has.
      /** @type {Map<Element, DOMRect>} */
      const boxes = new Map();
      /** @param {{ card: number, id: string }} end */
      const boxOf = ({ card, id }) => {
        const verse = /** @type {Element} */ (verses[card].get(id));
        if (!boxes.has(verse)) boxes.set(verse, this.verseBox(cards[card], verse));
        return /** @type {DOMRect} */ (boxes.get(verse));
      };
      /** @param {{ card: number, id: string }} end */
      const placeOf = (end) => ({ card: cards[end.card], box: boxOf(end) });
      return softCurves(pairs.map(({ from, to }) => linkEnds(placeOf(from), placeOf(to))), 'ref', cards, panels);
    },

    /**
     * The boxes of the panels on show (the rail, the search panel, Tools, the
     * note editor, the timeline strip): the lines' labels and dots keep off
     * them.
     *
     * @returns {DOMRect[]}
     */
    panelBoxes() {
      return [...this.querySelectorAll('table-rail, passage-search, table-menu, note-editor, time-line')]
        .map((panel) => panel.getBoundingClientRect())
        .filter((box) => box.width > 0 && box.height > 0);
    },

    drawSoon() {
      if (this.lineFrame) return;
      this.lineFrame = requestAnimationFrame(() => {
        this.lineFrame = 0;
        this.draw();
      });
    },

    /**
     * The cards on the table with an address.
     *
     * @param {string} address
     * @returns {HTMLElement[]}
     */
    cardsAt(address) {
      return /** @type {HTMLElement[]} */ ([...this.world().querySelectorAll('gesture-card')]).filter((card) => card.dataset.address === address);
    },

    /**
     * Where a link's end shows. A whole card: the box of each card with its
     * address. Words: one box per card that holds any of them, the first
     * word of the span on that card, or the card's heading when the card is
     * in its short form and the words are hidden.
     *
     * @param {End} span
     * @returns {Place[]}
     */
    placesOf(span) {
      const places = isWhole(span) ? this.cardsAt(span.address).map((card) => ({ card, box: card.getBoundingClientRect() })) : this.wordPlaces(span);
      return places.length ? places : this.listPlaces(span);
    },

    /**
     * Where an end shows when its card is in a list: the list card. So the
     * link is drawn to it, and the list moves with the link's group.
     *
     * @param {End} span
     * @returns {Place[]}
     */
    listPlaces(span) {
      const list = listHolding(this.lists, span);
      const card = list ? this.cardsAt(`list:${list.id}`)[0] : null;
      return card ? [{ card, box: card.getBoundingClientRect() }] : [];
    },

    /**
     * @param {Span} span
     * @returns {Place[]}
     */
    wordPlaces(span) {
      /** @type {Place[]} */
      const places = [];
      for (const card of this.world().querySelectorAll('gesture-card')) {
        const word = firstCovered(indexOf(card), span);
        if (!word) continue;
        let box = word.getBoundingClientRect();
        if (box.width === 0) box = (card.querySelector('.passage__heading') ?? card).getBoundingClientRect();
        places.push({ card, box });
      }
      return places;
    },

    draw() {
      const drawn = /** @type {SVGGElement} */ (this.querySelector('.table__drawn'));
      // Drawn where they are now: the pan's shift is in the boxes again.
      this.drawnAt = { ...this.offset };
      drawn.removeAttribute('transform');
      /** @type {HTMLElement | null} */ (this.querySelector('.table__labels'))?.style.removeProperty('translate');
      this.drawTimeLines();
      // Every line between cards is a curve from their edges, under the
      // cards (lib/link-lines.js), so none covers the text: the links on top
      // of the others. Their marks, and the ends on the map, go over them.
      const under = /** @type {SVGGElement} */ (this.querySelector('.table__links-drawn'));
      under.removeAttribute('transform');
      const panels = this.panelBoxes();
      const links = this.linkLines(panels);
      const places = this.placeLines();
      const refs = this.referenceLines(panels);
      const same = this.sameLines(panels);
      this.placeLabels(links.labels);
      under.replaceChildren(...places.lines, ...refs.lines, ...same.lines, ...links.lines);
      drawn.replaceChildren(...places.over, ...refs.marks, ...same.marks, ...links.marks, ...this.guideLines(), ...this.pendingLines());
    },

    /**
     * The same words on several cards: a chain of curves from each place to
     * the next, under the cards.
     *
     * @param {DOMRect[]} panels the panels on show
     */
    sameLines(panels) {
      const cards = [...this.world().querySelectorAll('gesture-card')];
      const ends = this.highlights.flatMap((span) => {
        const places = this.placesOf(span);
        return places.slice(1).map((place, at) => linkEnds(places[at], place));
      });
      return softCurves(ends, 'same', cards, panels);
    },

    /**
     * Links (lib/link-lines.js): each place of one end to the nearest place
     * of the other, a curve from port to port under the cards, with the
     * ports marked over them. A typed link has an arrow at its far end. Every
     * link has a label, beside a port or along its first curve where no card
     * or panel is (one with no place where there is none).
     *
     * @param {DOMRect[]} panels the panels on show
     */
    linkLines(panels) {
      const cards = [...this.world().querySelectorAll('gesture-card')];
      /** @type {LabelRoom} */
      const room = { boxes: [...cards.map((card) => card.getBoundingClientRect()), ...panels], panels, top: topCard(cards) };
      const drawn = this.links.map((link) => this.drawLink(link, cards, room));
      return { lines: drawn.flatMap((each) => each.lines), marks: drawn.flatMap((each) => each.marks), labels: drawn.map((each) => each.label) };
    },

    /**
     * One link's curves, marks and label.
     *
     * @param {Link} link
     * @param {Element[]} cards
     * @param {LabelRoom} room
     */
    drawLink(link, cards, room) {
      const ends = this.placesOf(link.b);
      const curves = this.placesOf(link.a).flatMap((start) => {
        const near = nearest(start, ends);
        return near ? [linkEnds(start, near)] : [];
      });
      return {
        lines: curves.map((each) => linkCurve(each.a, each.b, link.type)),
        marks: curves.flatMap((each) => endMarks(each, cards, portMarks, room.panels)),
        label: linkLabel(link, curves[0], room),
      };
    },

    /**
     * Where a held card lines up with others: thin lines across both.
     *
     * @returns {Element[]}
     */
    guideLines() {
      if (!this.guides.length) return [];
      const world = this.world().getBoundingClientRect();
      return this.guides.map((guide) => guideLine(guide, world, this.zoom));
    },

    /**
     * A link being drawn follows the finger.
     *
     * @returns {Element[]}
     */
    pendingLines() {
      const pending = this.pending;
      if (!pending) return [];
      const finger = new DOMRect(pending.x, pending.y, 0, 0);
      // From the card the line is drawn from, not from its copies.
      const starts = pending.card ? [{ box: pending.card.getBoundingClientRect() }] : this.placesOf(pending.end);
      return starts.map((start) => line(start.box, finger, 'link'));
    },

    /**
     * Puts one button per link at the middle of its line. The buttons are
     * kept from frame to frame and only moved, so a finger on one is not
     * lost when the lines are drawn again under it.
     *
     * @param {{ at: Point, text: string, typed: boolean }[]} labels
     */
    placeLabels(labels) {
      const layer = /** @type {HTMLElement} */ (this.querySelector('.table__labels'));
      while (this.labels.length < labels.length) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'table__label';
        layer.append(button);
        this.labels.push(button);
      }
      while (this.labels.length > labels.length) this.labels.pop()?.remove();
      labels.forEach((label, i) => {
        const button = this.labels[i];
        const shown = Number.isFinite(label.at.x);
        button.hidden = !shown;
        if (!shown) return;
        button.dataset.link = String(i);
        if (button.textContent !== label.text) button.textContent = label.text;
        button.classList.toggle('is-typed', label.typed);
        button.setAttribute('aria-label', `Link: ${label.text}. Tap to change what it says.`);
        button.style.transform = `translate(${label.at.x}px, ${label.at.y}px) translate(-50%, -50%)`;
      });
    },

    /** @param {StoredCard} stored */
    /** @type {StoredCard[]} cards of the saved table that did not load */
    unloaded: [],

    /** @param {StoredCard} stored */
    async restore(stored) {
      const { id, address, matrix, version, sync, compare, short, view } = stored;
      const card = await this.fetchCard(address, { version, id, sync, compare, short });
      // A card that does not load (offline, a server error) stays in the
      // saved table, so the next visit tries it again.
      if (!card) {
        this.unloaded = [...this.unloaded.filter((each) => each.id !== id), stored];
        return;
      }
      card.setMatrix(matrix);
      if (card && view) {
        await customElements.whenDefined('map-view');
        this.mapView(card)?.setView(view);
      }
    },

    /**
     * Fetches the card again in another version and puts it in the old one's
     * place, at the same position and on the same level.
     *
     * @param {Card} card
     * @param {string} version
     */
    async switchVersion(card, version) {
      const address = card.dataset.address;
      // A second tap while the first version loads waits for nothing: the
      // card is being replaced already.
      if (!address || card.dataset.version === version || card.dataset.loading !== undefined) return;
      card.dataset.loading = '';
      await this.replaceCard(card, address, version);
      delete card.dataset.loading;
      this.keep();
    },

    /**
     * Puts a card for `address` in the place of `card`: the same id, position,
     * level and sync.
     *
     * @param {Card} card
     * @param {string} address
     * @param {string} version
     */
    async replaceCard(card, address, version) {
      if (Reader.current?.items.some((item) => card.contains(item.element))) Reader.current.stop();
      const { matrix } = card;
      const level = card.style.zIndex;
      const next = await this.fetchCard(address, {
        version,
        replacing: card,
        id: card.dataset.id,
        sync: card.dataset.sync !== undefined,
        compare: card.dataset.compare !== undefined,
        short: card.dataset.form === 'short',
      });
      if (!next) return null;
      next.setMatrix(matrix);
      next.style.zIndex = level;
      return next;
    },

    /**
     * Steps a card to another passage. When the card is synced, every other
     * synced passage card goes to the same passage, each in its own version.
     *
     * @param {Card} card
     * @param {string} address
     */
    async step(card, address) {
      const others = card.dataset.sync === undefined
        ? []
        : [...this.world().querySelectorAll('gesture-card:is([data-kind="passage"], [data-kind="commentary"])[data-sync]')].filter((each) => each !== card);
      // A synced commentary goes to the same passage, and a passage to the
      // commentary's (lib/commentary-address.js).
      const moves = others
        .map((each) => ({ each: /** @type {Card} */ (each), to: syncedAddress(/** @type {HTMLElement} */ (each).dataset.address ?? '', address) }))
        // A commentary's next page leaves a synced passage where it is.
        .filter(({ each, to }) => to !== each.dataset.address);
      await Promise.all([this.replaceCard(card, address, versionOf(card)), ...moves.map(({ each, to }) => this.replaceCard(each, to, versionOf(each)))]);
      this.keep();
    },

    /**
     * The buttons on the cards, and the link labels.
     *
     * @param {MouseEvent} event
     */
    clicked(event) {
      const target = elementOf(event.target);
      if (this.clickLabel(target)) return;
      const button = target?.closest('button');
      const card = button?.closest('gesture-card');
      if (!(button instanceof HTMLButtonElement) || !(card instanceof HTMLElement) || !this.world().contains(card)) return;
      this.cardButton(/** @type {Card} */ (/** @type {unknown} */ (card)), button);
    },

    /**
     * A link's label: a click gives the link its next type.
     *
     * @param {Element | null} target
     */
    clickLabel(target) {
      const label = target?.closest('.table__label');
      if (!(label instanceof HTMLElement)) return false;
      const at = Number(label.dataset.link);
      const link = this.links[at];
      if (!link) return true;
      const type = nextType(link.type);
      const changed = { a: link.a, b: link.b, ...(type ? { type } : {}) };
      this.links = this.links.map((each, index) => (index === at ? changed : each));
      this.keep();
      this.drawSoon();
      return true;
    },

    /**
     * A button on a card: what its data says it does. A button names what it
     * acts on (data-cite="JHN.3.16"), or its action (data-action="copy").
     *
     * @param {Card} card
     * @param {HTMLButtonElement} button
     */
    cardButton(card, button) {
      const panel = this.panel();
      /** @type {Record<string, (value: string) => void>} by what the button names, in this order */
      const named = {
        // A word of the original named in a note (@H430): its study.
        study: (code) => panel?.searchFor(code),
        // A verse's quotation mark: what it quotes, or where it is quoted.
        quotes: () => {
          const verse = /** @type {HTMLElement | null} */ (button.closest('[data-ref]'))?.dataset.ref;
          if (verse) panel?.showQuotes(verse);
        },
        // A reference in a card's text, such as "John 3:16": the passage goes
        // down beside the card.
        cite: (address) => {
          const box = card.getBoundingClientRect();
          this.place({ address, pointer: { id: -1, x: box.right + ROW_GAP, y: button.getBoundingClientRect().top, down: false } });
        },
        // A person, place or event named on a card, such as on a picture.
        entity: (id) => panel?.showEntity(id),
        version: (version) => this.switchVersion(card, version),
        stepTo: (address) => this.step(card, address),
        unquote: (span) => this.unquote(card, span),
        fold: (span) => this.fold(card, span),
        // A list's row: its card out beside the list, or the row moved.
        listOpen: (id) => this.spreadList(card, [id]),
        listUp: (id) => this.moveRow(card, id, -1),
        listDown: (id) => this.moveRow(card, id, 1),
      };
      /** @type {Record<string, () => void>} by its action */
      const actions = {
        sync: () => {
          this.setSync(card, card.dataset.sync === undefined);
          this.keep();
        },
        compare: () => {
          this.setCompare(card, card.dataset.compare === undefined);
          this.keep();
        },
        copy: () => this.copyCard(card, button),
        short: () => {
