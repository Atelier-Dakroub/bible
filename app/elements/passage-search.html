<!-- The search panel at the edge of the table.

     It works as a plain form: with no script, a search opens /search. With the
     script, the results arrive in place as the reader types, from the same
     page's `results` fragment.

     A result goes onto the table two ways. A tap places it beside the panel.
     A drag out to the side pulls a card out under the finger, and the finger
     keeps the card. A drag up or down scrolls the list instead.

     It sends `place` (bubbling) with { address, pointer }. The pointer object
     goes on changing until the card takes the finger, so the table always
     reads where the finger is now.

     The rail (table-rail) opens and closes the panel, and places it: docked
     beside the rail or floating. Its grip, float and close buttons are the
     rail's to handle. Open, the panel grows with use: at rest it is only its
     field; an answer, or a tap on the field when there is one, shows the
     trail and the results under it; Escape in the field, or a tap on the
     empty table (the rail's fold), folds it to the field again. "/" anywhere
     opens it and puts the cursor in the field. It remembers whether it is
     open in this browser.

     A finger on the field opens the app's on-screen keyboard (touch-keys)
     where the screen has no keyboard of its own (lib/keyboard.js): not on a
     phone or a tablet, nor once a real key has been pressed. Its Hide key,
     Escape, or a tap away from the field closes it.

     showReferences(address) lists the cross-references of one verse in place
     of search results, from the same `results` fragment. showWord(address)
     shows a word study: the word's Strong's entry and the verses that use it.

     showEntity(id) shows a person, place, group or event, with its relations
     as buttons that show those in turn. Its heading pulls out as a card.

     showGuide(address, notes) shows the passage guide (data/study.js) and
     the notes the table found on the passage. searchFor(text) searches.
     Above a search's results go the reader's notes that match it, on the
     table and in the saved tables (notesFound, from the table; the search
     of them is in the browser, lib/note-search.js).

     The buttons in an answer send, all bubbling:
       show-on-map   detail { ids }, place ids with commas between
       rule-add      detail { kind, value, label }: mark it on every card, or
                     stop (app/lib/rules.js)
       place-beside  detail { addresses }: the guide's parallels, beside the card
       start-study   detail { address }: lay out a study of the guide's passage
       show-note     detail { id }: a note on the passage, or on the table
       note-open     detail { name, id }: a note in a saved table, which opens it
       show-journey  detail { journey }: draw a journey on the map
                     (data/journeys.js JourneyView)
     showRules(rules) shows which offers to mark are on.

     After each answer it sends `study` (bubbling) with { code, entity }: the
     Strong's number and the entity on show, or "" for none, so the table can
     mark the words on every card that render that word or name that entity.

     The trail (lib/trail.js): a row of chips under the field, one for each
     thing looked at, with ‹ and › to step back and forward (also Alt and the
     arrow keys). A tap on a chip goes to it; "…" shows the whole trail. Going
     to a step asks for its view again, through the same run(), so the table's
     marks, the map and the timeline follow it as they did the first time; the
     list comes back where it was scrolled to. A guide's notes come from the
     table (notesFor). Each change sends `trail-change` (bubbling), and the
     table keeps the trail with the workspace: trail() reads it, and
     setTrail(trail, show) puts one back and shows its step. -->

<script element>
  import { isPhone } from '../lib/screen.js';
  import { wantKeys } from '../lib/keyboard.js';
  import { LANGUAGE_NAMES, sayWord } from '../lib/speech.js';
  import { slideIn, slideOut } from '../lib/motion.js';
  import { dropCurrent, emptyTrail, record, windowOf } from '../lib/trail.js';
  import { labelOf } from '../lib/note-kinds.js';
  import { typing } from '../lib/keyboard.js';

  /**
   * A note in a list: its title, if it has one, over the first of its words.
   *
   * @param {HTMLElement} button
   * @param {{ title?: string, text: string }} note
   * @param {number} limit
   */
  function writeNote(button, note, limit) {
    const words = wordsOfNote(note, limit);
    button.replaceChildren();
    if (note.title) button.append(Object.assign(document.createElement('strong'), { className: 'result__title', textContent: note.title }));
    if (words) button.append(Object.assign(document.createElement('span'), { className: 'result__words', textContent: words }));
  }

  /** @param {EventTarget | null} target the target, if it is an element */
  const elementOf = (target) => (target instanceof Element ? target : null);

  /** @param {KeyboardEvent} event whether Option (Alt) alone is held */
  const altOnly = (event) => event.altKey && !event.metaKey && !event.ctrlKey;

  /** @param {boolean} collapsed whether the panel is folded, kept for the next visit */
  function keepCollapsed(collapsed) {
    try {
      localStorage.setItem(COLLAPSED_KEY, String(collapsed));
    } catch {
      // No storage: the state lasts until the page closes.
    }
  }

  /**
   * The field loses the focus as the panel closes, and takes it as it opens.
   *
   * @param {HTMLInputElement} input
   * @param {boolean} collapsed
   */
  function focusField(input, collapsed) {
    if (collapsed) input.blur();
    else requestAnimationFrame(() => input.focus());
  }

  /** @param {Element} child it, in a list item */
  function listItem(child) {
    const li = document.createElement('li');
    li.append(child);
    return li;
  }

  /**
   * The "…" that opens the whole trail.
   *
   * @param {boolean} open
   * @param {number} count
   */
  function moreButton(open, count) {
    const all = Object.assign(document.createElement('button'), { type: 'button', className: 'trail__chip trail__more', title: 'The whole trail', textContent: '…' });
    all.dataset.trail = 'all';
    all.setAttribute('aria-expanded', String(open));
    all.setAttribute('aria-label', `The whole trail: ${count} steps`);
    return all;
  }

  /** @param {string} kind a trail step's kind, as its pictogram */
  function pictogram(kind) {
    const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('class', 'trail__icon');
    icon.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `/kinds.svg#${PICTOGRAMS[kind] ?? 'search'}`);
    icon.append(use);
    return icon;
  }

  /**
   * A note in the list of a guide's notes: a button that shows it.
   *
   * @param {{ id: string, title?: string, text: string, kind?: string, answered?: boolean }} note
   */
  function noteItem(note) {
    const button = Object.assign(document.createElement('button'), { type: 'button', className: 'result' });
    button.dataset.noteShow = note.id;
    writeNote(button, note, 120);
    if (note.kind) button.prepend(kindLabel(note));
    return listItem(button);
  }

  /**
   * A note in a saved table, in a search's list: a button that opens the
   * table and shows the note.
   *
   * @param {string} table its name
   * @param {{ id: string, title?: string, text: string, kind?: string, answered?: boolean }} note
   */
  function savedNoteItem(table, note) {
    const item = noteItem(note);
    const button = /** @type {HTMLElement} */ (item.firstElementChild);
    delete button.dataset.noteShow;
    button.dataset.noteOpen = note.id;
    button.dataset.noteTable = table;
    return item;
  }

  /**
   * A heading and a list, for the notes in a search.
   *
   * @param {string} title
   * @param {HTMLElement[]} items
   */
  function noteGroup(title, items) {
    const heading = Object.assign(document.createElement('h3'), { className: 'guide__heading', textContent: title });
    const list = Object.assign(document.createElement('ol'), { className: 'results__list' });
    list.append(...items);
    return [heading, list];
  }

  /**
   * The headings and lists of the notes that match a search: those on the
   * table, then those in each saved table.
   *
   * @param {{ here: any[], saved: { name: string, notes: any[] }[] }} found
   */
  function noteGroups(found) {
    const here = found.here.length ? noteGroup('In your notes', found.here.map(noteItem)) : [];
    return [...here, ...found.saved.flatMap((table) => noteGroup(`In your saved table “${table.name}”`, table.notes.map((note) => savedNoteItem(table.name, note))))];
  }

  /**
   * The ? button's count of open questions, and its name.
   *
   * @param {HTMLElement} button
   * @param {number} open
   */
  function paintQuestionCount(button, open) {
    const count = button.querySelector('.trail__count');
    if (count) count.textContent = open ? String(open) : '';
    button.setAttribute('aria-label', open === 1 ? '1 open question' : `${open} open questions`);
  }

  /**
   * The words of a note in a list: its first words, up to a limit.
   *
   * @param {{ title?: string, text: string }} note
   * @param {number} limit
   */
  function wordsOfNote(note, limit) {
    const text = note.text.trim();
    if (!text) return note.title ? '' : 'A note with no words yet';
    return text.length > limit ? `${text.slice(0, limit)} …` : text;
  }

  /**
   * A note's kind, as a small label before its words: "Question · open".
   *
   * @param {{ kind?: string, answered?: boolean }} note
   */
  function kindLabel(note) {
    const label = document.createElement('span');
    label.className = `note-kind note-kind--${note.kind}`;
    label.textContent = note.kind === 'question' ? `${labelOf(note.kind)} · ${note.answered ? 'answered' : 'open'}` : labelOf(note.kind);
    return label;
  }

  /** @typedef {{ id: number, x: number, y: number, down: boolean }} Pull */
  /** @typedef {import('../lib/trail.js').Trail} Trail */
  /** @typedef {'typed' | 'submit' | 'open' | 'trail'} How how a view was asked for: typed in the field, sent with Enter, opened from something, or gone to on the trail */

  // How many chips of the trail show at a time: three, and "…" for the rest,
  // fit the panel with their names.
  const CHIPS = 3;

  // The pictogram of each kind of step (app/icons/kinds).
  /** @type {Record<string, string>} */
  const PICTOGRAMS = {
    search: 'search',
    grammar: 'word',
    topic: 'search',
    passage: 'passage',
    refs: 'passage',
    word: 'word',
    person: 'person',
    place: 'place',
    group: 'group',
    event: 'event',
    world: 'era',
  };

  // How far a finger moves before a press on a result is a drag, in CSS pixels.
  const SLOP = 16;
  const COLLAPSED_KEY = 'bible.search.collapsed';


  export const state = {
    collapsed: false,
    keys: false,
    /** whether the trail and the results show under the field */
    expanded: false,
  };

  export const prototype = {
    /** a count of the openings and closings, so a late slide knows it is late */
    moves: 0,
    timer: 0,
    /** @type {AbortController | null} */
    request: null,
    /** @type {{ address: string, version: string, start: { x: number, y: number }, pull: Pull, out: boolean } | null} */
    press: null,
    /** @type {Trail} */
    path: emptyTrail(),
    /** whether the step on show is a search still being typed */
    typing: false,
    /** whether the whole trail is on show, not only the chips around the step */
    wholeTrail: false,
    /** whether a "Did you know?" is on show, not the trail's step */
    away: false,
    /** @type {((address: string) => { id: string, text: string }[]) | null} the notes on a passage, from the table */
    notesFor: null,

    /** @type {((query: string) => { here: any[], saved: { name: string, notes: any[] }[] }) | null} the reader's notes that match a search, from the table */
    notesFound: null,

    connected({ signal }) {
      const form = /** @type {HTMLFormElement} */ (this.querySelector('form'));
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));

      try {
        this.collapsed = localStorage.getItem(COLLAPSED_KEY) === 'true';
      } catch {
        // No storage: the panel starts open.
      }

      this.addEventListener('click', (event) => this.clicked(event, input), { signal });
      // Alt and the arrow keys step through the trail, as in a browser.
      document.addEventListener('keydown', (event) => this.trailKey(event), { signal });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (this.keys) this.keys = false;
          else if (this.expanded) this.fold();
          else this.setCollapsed(true);
        }
      }, { signal });
      input.addEventListener('pointerdown', (event) => {
        this.keys = wantKeys({ pointer: event.pointerType });
        // The answer folded away comes back.
        if (this.querySelector('.search__results')?.childElementCount) this.setExpanded(true);
      }, { signal });
      input.addEventListener('blur', () => {
        this.keys = false;
      }, { signal });
      this.addEventListener('keys-done', () => {
        this.keys = false;
      }, { signal });
      document.addEventListener('keydown', (event) => {
        if (event.key !== '/' || event.defaultPrevented || typing(event.target)) return;
        event.preventDefault();
        if (this.collapsed) this.setCollapsed(false);
        else input.focus();
      }, { signal });

      input.addEventListener('input', () => this.queueSearch(), { signal });
      this.querySelector('.search__clear')?.addEventListener('click', () => {
        input.value = '';
        input.focus();
        this.queueSearch();
      }, { signal });
      form.addEventListener(
        'submit',
        (event) => {
          event.preventDefault();
          clearTimeout(this.timer);
          this.run(undefined, 'submit');
        },
        { signal },
      );
      this.addEventListener('pointerdown', (event) => this.down(event), { signal });
      this.addEventListener('pointermove', (event) => this.move(event), { signal });
      this.addEventListener('pointerup', (event) => this.up(event), { signal });
      this.addEventListener('pointercancel', (event) => this.cancel(event), { signal });

      return () => clearTimeout(this.timer);
    },

    /**
     * Says what an answer found, in the status region: its summary, or its
     * heading. The region is emptied first, so the same words are said
     * again for a new answer.
     *
     * @param {HTMLElement} results
     */
    announce(results) {
      const status = this.querySelector('.search__status');
      if (!status) return;
      // What the answer is, in order of what says it best: its own words
      // (data-announce), its summary, its title; not the first heading that
      // happens to come first (a word study's "Senses").
      const said = ['[data-announce]', '.stats__summary', '.results__summary', 'h2', '.discover p', 'h3']
        .map((selector) => results.querySelector(selector))
        .find(Boolean);
      status.textContent = '';
      const text = (said?.textContent ?? '').replace(/\s+/g, ' ').trim();
      if (text) setTimeout(() => (status.textContent = text), 100);
    },

    /** whether an answer arrives without opening the panel (setTrail) */
    quiet: false,

    /** Opens the panel, with its trail and results, for an answer. */
    reveal() {
      if (this.quiet) return;
      if (this.collapsed) this.setCollapsed(false);
      this.setExpanded(true);
    },

    /** Folds the panel to its field, if it is open with an answer. */
    fold() {
      if (!this.collapsed && this.expanded) this.setExpanded(false);
    },

    /** @param {boolean} expanded */
    setExpanded(expanded) {
      if (expanded === this.expanded) return;
      this.expanded = expanded;
      if (expanded) {
        const results = this.querySelector('.search__results');
        if (results) slideIn(results, { y: -8 });
      }
      this.dispatchEvent(new Event('panel-change', { bubbles: true }));
    },

    /**
     * Opens or closes the panel, with a short fade.
     *
     * @param {boolean} collapsed
     */
    async setCollapsed(collapsed) {
      // A call during a closing slide cancels it: the closing sees the count
      // has moved on.
      const step = ++this.moves;
      if (collapsed === this.collapsed) return;
      // The focus, inside the panel as it closes, goes to its button.
      const inside = collapsed && this.contains(document.activeElement);
      // Opened again during the slide: the later call holds.
      if (collapsed && !(await this.slidOut(step))) return;
      this.collapsed = collapsed;
      this.afterCollapse(collapsed, inside);
    },

    /**
     * Slides the panel out; false if it was opened again meanwhile.
     *
     * @param {number} step
     */
    async slidOut(step) {
      await slideOut(this, { y: -8 });
      return step === this.moves;
    },

    /**
     * After the panel opens or closes: the focus, its slide, its state kept,
     * and on a phone, the other panels closed.
     *
     * @param {boolean} collapsed
     * @param {boolean} inside whether the focus was in it as it closed
     */
    afterCollapse(collapsed, inside) {
      if (inside) requestAnimationFrame(() => /** @type {HTMLElement | null} */ (document.querySelector('table-rail [data-action="search"]'))?.focus());
      slideIn(this, collapsed ? {} : { y: -8 });
      this.dispatchEvent(new Event('panel-change', { bubbles: true }));
      keepCollapsed(collapsed);
      // On a phone, one panel is open at a time (bible-table closes the
      // others).
      if (!collapsed && isPhone()) this.dispatchEvent(new CustomEvent('panel-open', { bubbles: true, detail: { panel: 'search' } }));
      focusField(/** @type {HTMLInputElement} */ (this.querySelector('input')), collapsed);
    },

    /**
     * A click in the panel: Enter or Space on a result puts it on the table;
     * else each thing the click is on does what it says.
     *
     * @param {MouseEvent} event
     * @param {HTMLInputElement} input
     */
    clicked(event, input) {
      const target = elementOf(event.target);
      if (this.placeByKey(event, target)) return;
      for (const [selector, act] of this.clickActions(input)) {
        const found = target?.closest(selector);
        if (found instanceof HTMLElement) act(found);
      }
    },

    /**
     * Enter or Space on a result (a click with no pointer) puts it on the
     * table, as a tap does; a tap is placed on its pointerup instead.
     *
     * @param {MouseEvent} event
     * @param {Element | null} target
     */
    placeByKey(event, target) {
      const placed = target?.closest('[data-address]:not([data-address=""])');
      if (event.detail !== 0 || !(placed instanceof HTMLElement)) return false;
      this.send(placed.dataset.address ?? '', null, placed.dataset.version ?? '');
      return true;
    },

    /**
     * What a click does on each kind of thing in the panel.
     *
     * @param {HTMLInputElement} input
     * @returns {[string, (element: HTMLElement) => void][]}
     */
    clickActions(input) {
      const data = (/** @type {HTMLElement} */ element, /** @type {string} */ name) => element.dataset[name] ?? '';
      return [
        ['[data-refs]:not([data-refs=""])', (element) => this.showReferences(data(element, 'refs'))],
        ['button[data-entity]:not([data-entity=""])', (element) => this.showEntity(data(element, 'entity'))],
        ['button[data-topic]:not([data-topic=""])', (element) => this.showTopic(data(element, 'topic'))],
        ['[data-show-map]:not([data-show-map=""])', (element) => this.tell('show-on-map', { ids: data(element, 'showMap') })],
        ['[data-rule-kind]', (element) => this.tell('rule-add', { kind: element.dataset.ruleKind, value: element.dataset.ruleValue, label: element.dataset.ruleLabel })],
        ['[data-beside]:not([data-beside=""])', (element) => this.tell('place-beside', { addresses: data(element, 'beside').split(',') })],
        ['[data-study]:not([data-study=""])', (element) => this.tell('start-study', { address: data(element, 'study') })],
        ['[data-questions]', () => this.showQuestions()],
        ['[data-note-show]:not([data-note-show=""])', (element) => this.tell('show-note', { id: data(element, 'noteShow') })],
        ['[data-note-open]:not([data-note-open=""])', (element) => this.tell('note-open', { name: data(element, 'noteTable'), id: data(element, 'noteOpen') })],
        ['[data-strongs]:not([data-strongs=""])', (element) => {
          input.value = data(element, 'strongs');
          this.run(undefined, 'open');
        }],
        ['[data-say]:not([data-say=""])', (element) => this.say(element)],
        ['[data-search]:not([data-search=""])', (element) => this.searchFor(data(element, 'search'))],
        ['[data-discover]', (element) => this.discover(element.dataset.discover)],
        ['[data-journey]:not([data-journey=""])', (element) => this.tell('show-journey', { journey: JSON.parse(data(element, 'journey')) })],
        ['[data-trail]', (element) => this.trailStep(data(element, 'trail'))],
      ];
    },

    /**
     * Sends an event to the table (bubbling).
     *
     * @param {string} type
     * @param {object} detail
     */
    tell(type, detail) {
      this.dispatchEvent(new CustomEvent(type, { bubbles: true, detail }));
    },

    /**
     * Says a word of the original in the device's voice; with none, says so.
     *
     * @param {HTMLElement} element its data-say, and data-say-lang (he or el)
     */
    say(element) {
      const lang = element.dataset.sayLang === 'he' ? 'he' : 'el';
      sayWord(element.dataset.say ?? '', lang).then((ok) => {
        if (ok) return;
        const missing = `This device has no ${LANGUAGE_NAMES[lang]} voice.`;
        const status = this.querySelector('.search__status');
        if (status) status.textContent = missing;
        element.setAttribute('title', missing);
      });
    },

    /**
     * A button of the trail: Back, Forward, the whole trail, or a step.
     *
     * @param {string} where
     */
    trailStep(where) {
      /** @type {Record<string, () => void>} */
      const steps = {
        back: () => this.goBack(),
        forward: () => this.go(this.path.index + 1),
        all: () => {
          this.wholeTrail = !this.wholeTrail;
          this.paintTrail();
        },
      };
      (steps[where] ?? (() => this.go(Number(where))))();
    },

    /** Back on the trail; away on a "Did you know?", to the step that was left. */
    goBack() {
      this.go(this.away ? this.path.index : this.path.index - 1);
    },

    /**
     * Option (Alt) and the arrow keys step through the trail, as in a
     * browser; in a field or a note, they move by a word (on a Mac).
     *
     * @param {KeyboardEvent} event
     */
    trailKey(event) {
      if (!altOnly(event) || event.defaultPrevented || typing(event.target)) return;
      /** @type {Record<string, () => void>} */
      const keys = { ArrowLeft: () => this.goBack(), ArrowRight: () => this.go(this.path.index + 1) };
      const act = keys[event.key];
      if (!act) return;
      act();
      event.preventDefault();
    },

    queueSearch() {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.run(), 150);
    },

    /** @param {string} address a verse address */
    showReferences(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ refs: address, fragment: 'results' }), 'open');
    },

    /**
     * Lists the quotations of a verse: what it quotes of the Old Testament,
     * or where the New Testament quotes it (data/quotations.js).
     *
     * @param {string} address a verse address
     */
    showQuotes(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ quotes: address, fragment: 'results' }), 'open');
    },

    /** @param {string} id an entity id, such as person:david_994 */
    showEntity(id) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ entity: id, fragment: 'results' }), 'open');
    },

    /** @param {string} key a topic of Nave's Topical Bible, such as PRAYER */
    showTopic(key) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ topic: key, fragment: 'results' }), 'open');
    },

    /** @param {string} address a word address */
    showWord(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ word: address, fragment: 'results' }), 'open');
    },

    /**
     * @param {string} address a passage or a phrase
     * @param {{ id: string, title?: string, text: string, kind?: string, answered?: boolean }[]} notes the notes that quote it
     * @param {How} [how]
     */
    async showGuide(address, notes, how = 'open') {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      if (await this.run(new URLSearchParams({ guide: address, fragment: 'results' }), how)) this.showNotesOn(notes);
    },

    /**
     * The table's notes on the passage of a guide, under it.
     *
     * @param {{ id: string, title?: string, text: string, kind?: string, answered?: boolean }[]} notes
     */
    showNotesOn(notes) {
      const holder = this.querySelector('.guide__notes');
      if (!(holder instanceof HTMLElement) || !notes.length) return;
      const heading = Object.assign(document.createElement('h3'), { className: 'guide__heading', textContent: notes.length === 1 ? 'A note on it' : `${notes.length} notes on it` });
      const list = Object.assign(document.createElement('ol'), { className: 'results__list' });
      list.append(...notes.map(noteItem));
      holder.replaceChildren(heading, list);
      holder.hidden = false;
    },

    /** @type {{ id: string, title?: string, text: string, answered: boolean }[]} the table's questions */
    questionList: [],

    /**
     * The table's questions (bible-table questions): the ? in the trail's
     * row shows how many are open, and is there only when there are any.
     *
     * @param {{ id: string, title?: string, text: string, answered: boolean }[]} list
     */
    setQuestions(list) {
      this.questionList = list;
      const button = this.querySelector('[data-questions]');
      if (!(button instanceof HTMLElement)) return;
      button.hidden = !list.length;
      paintQuestionCount(button, list.filter((each) => !each.answered).length);
      // The list, if it is the one on show, changes with them: in place,
      // without opening the panel.
      if (this.querySelector('.questions')) this.showQuestions(false);
    },

    /**
     * Lists the table's questions, the open ones first; a tap on one brings
     * its note into view. It is not a step on the trail.
     *
     * @param {boolean} [opening] whether to open the panel on it: false to
     *   only redraw the list where it is
     */
    showQuestions(opening = true) {
      if (opening) this.reveal();
      const results = /** @type {HTMLElement} */ (this.querySelector('.search__results'));
      const section = document.createElement('section');
      section.className = 'questions';
      const list = (/** @type {string} */ title, /** @type {{ id: string, title?: string, text: string, answered: boolean }[]} */ items) => {
        if (!items.length) return [];
        const heading = document.createElement('h3');
        heading.className = 'guide__heading';
        heading.textContent = title;
        const ol = document.createElement('ol');
        ol.className = 'results__list';
        for (const each of items) {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'result';
          button.dataset.noteShow = each.id;
          writeNote(button, each, 140);
          item.append(button);
          ol.append(item);
        }
        return [heading, ol];
      };
      const open = this.questionList.filter((each) => !each.answered);
      const answered = this.questionList.filter((each) => each.answered);
      const none = Object.assign(document.createElement('p'), {
        className: 'guide__none',
        textContent: 'No questions on this table. A note becomes a question by a tap on its label.',
      });
      section.replaceChildren(
        ...(this.questionList.length ? [] : [none]),
        ...list(open.length === 1 ? '1 open question' : `${open.length} open questions`, open),
        ...list('Answered', answered),
      );
      results.replaceChildren(section);
      if (!opening) return;
      this.setExpanded(true);
      this.announce(results);
      // The list is on show: its ? is pressed, a fact's ✦ is not.
      this.querySelector('[data-questions]')?.setAttribute('aria-pressed', 'true');
      this.querySelector('.trail__discover')?.setAttribute('aria-pressed', 'false');
    },

    /**
     * Shows a "Did you know?" (data/facts.js): that one, or a random one. It
     * is not a step on the trail.
     *
     * @param {string} [which] the number of the fact
     */
    discover(which = 'random') {
      this.reveal();
      /** @type {HTMLInputElement} */ (this.querySelector('input')).value = '';
      this.typing = false;
      // The trail's step is not on show while the fact is: no chip is lapis,
      // and a tap on any chip, the last one too, goes back to it.
      this.away = true;
      this.paintTrail();
      return this.run(new URLSearchParams({ discover: which, fragment: 'results' }), 'trail');
    },

    /** @param {string} text */
    searchFor(text) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = text;
      this.reveal();
      this.run(undefined, 'open');
    },

    /**
     * Shows which offers to mark a word on every card are on.
     *
     * @param {{ kind: string, value: string }[]} rules
     */
    showRules(rules) {
      for (const button of this.querySelectorAll('[data-rule-kind]')) {
        const element = /** @type {HTMLElement} */ (button);
        const on = rules.some((rule) => rule.kind === element.dataset.ruleKind && rule.value === element.dataset.ruleValue);
        element.setAttribute('aria-pressed', String(on));
        element.textContent = on ? 'Marked on every card: tap to stop' : 'Mark it on every card';
      }
    },

    /**
     * Asks for a view and shows it, and records it on the trail.
     *
     * @param {URLSearchParams} [query] what to ask for; the typed search by default
     * @param {How} [how] how it was asked for; typing by default
     * @param {number} [scroll] where to scroll the list to once it is in
     * @returns {Promise<boolean>} false when a newer request took its place
     */
    async run(query, how = 'typed', scroll = 0) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      const asked = query ?? new URLSearchParams({ q: input.value, fragment: 'results' });
      const text = await this.fetchAnswer(asked);
      if (text === null) return false;
      const answer = this.showAnswer(text, how, scroll);
      this.showNotesFound(asked);
      this.announceStudy(answer);
      if (how !== 'trail') this.remember(asked, answer, how, input.value);
      return true;
    },

    /**
     * The answer to a search, as HTML; null if it fails, or a later search
     * took its place.
     *
     * @param {URLSearchParams} query
     * @returns {Promise<string | null>}
     */
    async fetchAnswer(query) {
      this.request?.abort();
      const request = new AbortController();
      this.request = request;
      const response = await fetch(`/search?${query}`, { signal: request.signal }).catch(() => null);
      if (request.signal.aborted) return null;
      const text = response?.ok ? await response.text().catch(() => null) : null;
      if (request.signal.aborted) return null;
      return text ?? this.failed();
    },

    /** The answer did not come (offline, or the server failed): the panel says so. */
    failed() {
      const status = this.querySelector('.search__status');
      if (status) status.textContent = 'This could not load. Check the connection and try again.';
      return null;
    },

    /**
     * Shows an answer in the results, where it was scrolled to.
     *
     * @param {string} text
     * @param {How} how
     * @param {number} scroll
     */
    showAnswer(text, how, scroll) {
      const results = /** @type {HTMLElement} */ (this.querySelector('.search__results'));
      this.querySelector('[data-questions]')?.setAttribute('aria-pressed', 'false');
      // The step being left keeps where its list was scrolled to.
      if (how !== 'typed') this.keepScroll();
      results.setHTMLUnsafe(text);
      if (results.childElementCount && !this.quiet) this.setExpanded(true);
      results.scrollTop = scroll;
      this.announce(results);
      return /** @type {HTMLElement | null} */ (results.querySelector('[data-code]'));
    },

    /**
     * The reader's notes that match a typed search, above its results.
     *
     * @param {URLSearchParams} asked
     */
    showNotesFound(asked) {
      const query = asked.get('q');
      const groups = query && this.notesFound ? noteGroups(this.notesFound(query)) : [];
      if (!groups.length) return;
      const section = Object.assign(document.createElement('section'), { className: 'search__notes' });
      section.append(...groups);
      this.querySelector('.search__results')?.prepend(section);
    },

    /**
     * Tells the table what the answer studies: a Strong's number, a person or
     * a place (their words are marked on every card).
     *
     * @param {HTMLElement | null} answer
     */
    announceStudy(answer) {
      const detail = { code: answer?.dataset.code ?? '', entity: answer?.dataset.entity ?? '' };
      this.dispatchEvent(new CustomEvent('study', { bubbles: true, detail }));
    },

    /** The trail's step on show keeps where its list was scrolled to. */
    keepScroll() {
      const results = this.querySelector('.search__results');
      const leaving = this.path.steps[this.path.index];
      if (leaving && results) leaving.scroll = results.scrollTop;
    },

    /**
     * Records a view on the trail.
     *
     * @param {URLSearchParams} query
     * @param {HTMLElement | null} answer the results, which say what they are
     * @param {How} how
     * @param {string} typed the text in the field
     */
    remember(query, answer, how, typed) {
      const typing = how === 'typed' || how === 'submit';
      const before = this.path;
      const wasAway = this.away;
      this.away = false;
      if (answer?.dataset.trailKind) this.recordStep(query, /** @type {HTMLElement} */ (answer), how, typed, typing);
      else this.dropTyped(typing);
      this.trailChanged(before, wasAway);
    },

    /**
     * An answer becomes a step of the trail. Typing goes on in the same step
     * until Enter, or until something else is opened.
     *
     * @param {URLSearchParams} query
     * @param {HTMLElement} answer
     * @param {How} how
     * @param {string} typed
     * @param {boolean} typing
     */
    recordStep(query, answer, how, typed, typing) {
      const asked = new URLSearchParams(query);
      asked.delete('fragment');
      /** @type {import('../lib/trail.js').Step} */
      const step = { query: asked.toString(), label: answer.dataset.trailLabel ?? '', kind: answer.dataset.trailKind ?? '' };
      if (asked.has('q')) step.typed = typed;
      this.path = record(this.path, step, typing && this.typing);
      this.typing = how === 'typed';
    },

    /**
     * An empty search: a search being typed that was cleared goes.
     *
     * @param {boolean} typing
     */
    dropTyped(typing) {
      if (typing && this.typing) this.path = dropCurrent(this.path);
      this.typing = false;
    },

    /**
     * Draws the trail again, and tells the table, if it changed.
     *
     * @param {import('../lib/trail.js').Trail} before
     * @param {boolean} wasAway
     */
    trailChanged(before, wasAway) {
      if (this.path === before && !wasAway) return;
      this.paintTrail();
      this.dispatchEvent(new CustomEvent('trail-change', { bubbles: true }));
    },

    /**
     * Goes to a step of the trail.
     *
     * @param {number} index
     */
    async go(index) {
      const step = this.path.steps[index];
      if (!step || (index === this.path.index && !this.away)) return;
      this.keepScroll();
      this.path = { ...this.path, index };
      this.typing = false;
      this.wholeTrail = false;
      this.away = false;
      this.paintTrail();
      this.dispatchEvent(new CustomEvent('trail-change', { bubbles: true }));
      await this.show(step);
    },

    /**
     * Shows a step's view again: its search text in the field, its list where
     * it was scrolled to, and for a guide, the table's notes on the passage.
     *
     * @param {import('../lib/trail.js').Step} step
     */
    async show(step) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      this.reveal();
      const query = new URLSearchParams(step.query);
      const guide = query.get('guide');
      if (guide) {
        await this.showGuideStep(guide, step);
        return;
      }
      input.value = step.typed ?? '';
      query.set('fragment', 'results');
      await this.run(query, 'trail', step.scroll ?? 0);
    },

    /**
     * A guide's step again: with the table's notes on the passage, where its
     * list was scrolled to.
     *
     * @param {string} guide
     * @param {import('../lib/trail.js').Step} step
     */
    async showGuideStep(guide, step) {
      await this.showGuide(guide, this.notesFor?.(guide) ?? [], 'trail');
      const results = this.querySelector('.search__results');
      if (results) results.scrollTop = step.scroll ?? 0;
    },

    /** The trail, to keep with the workspace. */
    trail() {
      return {
        steps: this.path.steps.map(({ query, label, kind, typed }) => (typed ? { query, label, kind, typed } : { query, label, kind })),
        index: this.path.index,
      };
    },

    /**
     * Puts a trail back, such as a workspace's, and shows its step.
     *
     * @param {Trail} trail
     * @param {boolean} [showStep]
     */
    setTrail(trail, showStep = true) {
      this.path = { steps: trail.steps.map((step) => ({ ...step })), index: trail.index };
      this.typing = false;
      this.wholeTrail = false;
      this.paintTrail();
      const step = this.path.steps[this.path.index];
      // The step comes back folded under the field: a table that opens does
      // not cover itself with its last answer.
      this.quiet = true;
      const done = () => {
        this.quiet = false;
      };
      if (showStep && step) this.show(step).finally(done);
      // With nothing to go back to, the panel has a "Did you know?" ready.
      else if (showStep) this.discover().finally(done);
      else done();
    },

    /**
     * Draws Back and Forward, the chips of the steps around the one on show,
     * and "…" when there are more. "…" opens the whole trail as a list under
     * the row, newest first, as a browser's history list.
     */
    paintTrail() {
      const parts = this.trailParts();
      if (!parts) return;
      // The row is always there: it holds the ✦ for "Did you know?".
      parts.nav.hidden = false;
      this.paintTrailButtons();
      // A few chips around the step on show; "…" lists them all.
      const shown = windowOf(this.path, CHIPS);
      const more = shown.before || shown.after;
      if (!more) this.wholeTrail = false;
      parts.list.replaceChildren(...this.trailChips(shown, more));
      parts.list.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      this.paintWholeTrail(parts.whole);
    },

    /** The trail's row, its chips and its whole list, if they are there. */
    trailParts() {
      const nav = /** @type {HTMLElement | null} */ (this.querySelector('.search__trail'));
      const list = this.querySelector('.trail__chips');
      const whole = /** @type {HTMLElement | null} */ (this.querySelector('.trail__all'));
      return nav && list && whole ? { nav, list, whole } : null;
    },

    /** Back, Forward and the ✦, each as it stands on the trail. */
    paintTrailButtons() {
      const { steps, index } = this.path;
      /** @type {HTMLButtonElement | null} */ (this.querySelector('[data-trail="back"]'))?.toggleAttribute('disabled', this.away ? index < 0 : index <= 0);
      this.querySelector('.trail__discover')?.setAttribute('aria-pressed', String(this.away));
      /** @type {HTMLButtonElement | null} */ (this.querySelector('[data-trail="forward"]'))?.toggleAttribute('disabled', index >= steps.length - 1);
    },

    /**
     * The chips of the steps around the one on show, and "…" when there are
     * more.
     *
     * @param {{ start: number, end: number }} shown
     * @param {boolean} more
     */
    trailChips(shown, more) {
      const chips = [];
      for (let i = shown.start; i < shown.end; i += 1) chips.push(listItem(this.stepButton(i, 'trail__chip')));
      if (more) chips.push(listItem(moreButton(this.wholeTrail, this.path.steps.length)));
      return chips;
    },

    /**
     * The whole trail, newest first, when it is open.
     *
     * @param {HTMLElement} whole
     */
    paintWholeTrail(whole) {
      whole.hidden = !this.wholeTrail;
      if (!this.wholeTrail) {
        whole.replaceChildren();
        return;
      }
      const rows = this.path.steps.map((_, i) => listItem(this.stepButton(i, 'trail__row'))).reverse();
      whole.replaceChildren(...rows);
      whole.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
    },

    /**
     * A step of the trail as a button: its pictogram and its label.
     *
     * @param {number} i
     * @param {string} className
     */
    stepButton(i, className) {
      const step = this.path.steps[i];
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `${className} trail__chip--${step.kind}`;
      button.dataset.trail = String(i);
      button.title = step.label;
      if (i === this.path.index && !this.away) button.setAttribute('aria-current', 'step');
      button.append(pictogram(step.kind), Object.assign(document.createElement('span'), { className: 'trail__label', textContent: step.label }));
      return button;
    },

    /** @param {PointerEvent} event */
    down(event) {
      // The main button only: a right-click opens the browser's menu.
      if (event.button !== 0) return;
      const item = elementOf(event.target)?.closest('[data-address]');
      if (!(item instanceof HTMLElement)) return;
      this.press = {
        address: item.dataset.address ?? '',
        version: item.dataset.version ?? '',
        start: { x: event.clientX, y: event.clientY },
        pull: { id: event.pointerId, x: event.clientX, y: event.clientY, down: true },
        out: false,
      };
    },

    /** @param {PointerEvent} event */
    move(event) {
      const press = this.pressOf(event);
      if (!press) return;
      press.pull.x = event.clientX;
      press.pull.y = event.clientY;
      if (press.out) return;
      const dx = event.clientX - press.start.x;
      const dy = event.clientY - press.start.y;
      if (Math.hypot(dx, dy) < SLOP) return;
      // Sideways pulls a card out. Up or down is the list scrolling, and the
      // browser takes that gesture and cancels the pointer.
      if (Math.abs(dx) < Math.abs(dy)) {
        this.press = null;
        return;
      }
      press.out = true;
      this.send(press.address, press.pull, press.version);
    },

    /**
     * The press under way, if it is this pointer's.
     *
     * @param {PointerEvent} event
     */
    pressOf(event) {
      const press = this.press;
      return press && press.pull.id === event.pointerId ? press : null;
    },

    /** @param {PointerEvent} event */
    up(event) {
      const press = this.press;
      if (!press || press.pull.id !== event.pointerId) return;
      press.pull.down = false;
      if (!press.out) this.send(press.address, null, press.version);
      this.press = null;
    },

    /** @param {PointerEvent} event */
    cancel(event) {
      if (this.press?.pull.id !== event.pointerId) return;
      this.press.pull.down = false;
      this.press = null;
    },

    /**
     * @param {string} address
     * @param {Pull | null} pointer
     * @param {string} [version] the version to open it in, such as original
     */
    send(address, pointer, version = '') {
      this.dispatchEvent(new CustomEvent('place', { bubbles: true, detail: { address, pointer, version } }));
      // On a phone the panel covers the table: it steps aside, so the card
      // it put there shows.
      if (isPhone()) this.setCollapsed(true);
    },
  };
</script>

<style>

    /* Above every card at rest, below a card a finger holds (gesture-card). */

    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    zoom: var(--chrome-zoom, 1);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 2px 12px var(--shade-far);
    overflow: hidden;
  }
  form {
    display: flex;
    gap: var(--bar-gap);
    padding: var(--bar-padding);
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
  }
  /* The field, with its own clear button at the end. The browser's clear
     button shows only in some browsers, and on a phone only while the field
     has the focus, so this one takes its place. */
  .search__field {
    position: relative;
    display: flex;
    flex: 1;
    min-width: 0;
  }
  /* The field's look is the reading room's (input[type='search']); here only
     its place in the row, and room at its end for the clear button. */
  input {
    flex: 1;
    min-width: 0;
    padding-inline-end: 2.4rem;
    user-select: text;
    -webkit-user-select: text;
  }
  input::placeholder {
    color: var(--muted);
  }
  input::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
  }
  .search__clear {
    position: absolute;
    inset-block: 0;
    inset-inline-end: 0;
    display: grid;
    place-items: center;
    min-width: 2.4rem;
    padding: 0;
    border: 0;
    border-radius: 0 var(--radius-small) var(--radius-small) 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.1rem;
  }
  @media (hover: hover) {
    .search__clear:hover {
      background: var(--tint);
    }
  }
  /* An empty field has nothing to clear. */
  input:placeholder-shown + .search__clear {
    display: none;
  }
  button[type='submit'] {
    min-height: var(--control-height);

    font: var(--control-font);
  }
  :scope:state(collapsed),
  :scope:not(:state(keys)) touch-keys {

  }

  :scope:not(:state(expanded)) :is(.search__trail, .trail__all, .search__results) {

  }
  :scope:not(:state(expanded)) form {
    border-bottom: 0;
  }
  /* The trail: Back, Forward, and the chips of the steps around the one on

  .search__trail {

    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
  }
  .search__trail[hidden] {
    display: none;
  }
  .trail__discover {
    color: var(--ochre);
  }
  /* Pressed, the ✦ takes the light ink of the pressed lapis: the ochre is
     dull on it. */

    color: var(--on-pigment);
  }
  .trail__step {
    flex: none;
    width: 2.2rem;

  }
  /* The table's open questions: a ? with their count. */
  .trail__questions {
    position: relative;
    color: var(--ochre);
  }
  .trail__questions[aria-pressed='true'] {
    background: var(--ochre);
    color: var(--on-pigment);
  }
  .trail__questions[hidden] {
    display: none;
  }
  .trail__count:not(:empty) {
    position: absolute;
    top: -0.2rem;
    right: -0.25rem;
    min-width: 1rem;
    padding: 0.05rem 0.25rem;
    border-radius: 999px;
    background: var(--ochre);
    color: var(--on-pigment);
    font: 700 max(0.55rem, 10px)/1.2 var(--sans);
  }
  .trail__chips {
    display: flex;
    flex: 1;
    gap: 0.25rem;
    min-width: 0;
    margin: 0;
    padding: 0;
    overflow: hidden;
    list-style: none;
  }
  /* The step on show keeps its whole name; the others share what is left,
     down to their pictogram alone, and their names show on hover. */

    display: flex;
    flex: 0 1 auto;

  }
  .trail__chips li:has([aria-current]) {

  }
  .trail__chip {
