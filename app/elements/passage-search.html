<!-- The search panel at the edge of the table.

     It works as a plain form: with no script, a search opens /search. With the
     script, the results arrive in place as the reader types, from the same
     page's `results` fragment.

     A result goes onto the table two ways. A tap places it beside the panel.
     A drag out to the side pulls a card out under the finger, and the finger
     keeps the card. A drag up or down scrolls the list instead.

     It sends `place` (bubbling) with { address, pointer }. The pointer object
     goes on changing until the card takes the finger, so the table always
     reads where the finger is now.

     The rail (table-rail) opens and closes the panel, and places it: docked
     beside the rail or floating. Its grip, float and close buttons are the
     rail's to handle. Open, the panel grows with use: at rest it is only its
     field; an answer, or a tap on the field when there is one, shows the
     trail and the results under it; Escape in the field, or a tap on the
     empty table (the rail's fold), folds it to the field again. "/" anywhere
     opens it and puts the cursor in the field. It remembers whether it is
     open in this browser.

     A finger on the field opens the app's on-screen keyboard (touch-keys)
     where the screen has no keyboard of its own (lib/keyboard.js): not on a
     phone or a tablet, nor once a real key has been pressed. Its Hide key,
     Escape, or a tap away from the field closes it.

     showReferences(address) lists the cross-references of one verse in place
     of search results, from the same `results` fragment. showWord(address)
     shows a word study: the word's Strong's entry and the verses that use it.

     showEntity(id) shows a person, place, group or event, with its relations
     as buttons that show those in turn. Its heading pulls out as a card.

     showGuide(address, notes) shows the passage guide (data/study.js) and
     the notes the table found on the passage. searchFor(text) searches.

     The buttons in an answer send, all bubbling:
       show-on-map   detail { ids }, place ids with commas between
       rule-add      detail { kind, value, label }: mark it on every card, or
                     stop (app/lib/rules.js)
       place-beside  detail { addresses }: the guide's parallels, beside the card
       show-note     detail { id }: a note on the passage
       show-journey  detail { journey }: draw a journey on the map
                     (data/journeys.js JourneyView)
     showRules(rules) shows which offers to mark are on.

     After each answer it sends `study` (bubbling) with { code, entity }: the
     Strong's number and the entity on show, or "" for none, so the table can
     mark the words on every card that render that word or name that entity.

     The trail (lib/trail.js): a row of chips under the field, one for each
     thing looked at, with ‹ and › to step back and forward (also Alt and the
     arrow keys). A tap on a chip goes to it; "…" shows the whole trail. Going
     to a step asks for its view again, through the same run(), so the table's
     marks, the map and the timeline follow it as they did the first time; the
     list comes back where it was scrolled to. A guide's notes come from the
     table (notesFor). Each change sends `trail-change` (bubbling), and the
     table keeps the trail with the workspace: trail() reads it, and
     setTrail(trail, show) puts one back and shows its step. -->

<script element>
  import { isPhone } from '../lib/screen.js';
  import { wantKeys } from '../lib/keyboard.js';
  import { LANGUAGE_NAMES, sayWord } from '../lib/speech.js';
  import { slideIn, slideOut } from '../lib/motion.js';
  import { dropCurrent, emptyTrail, record, windowOf } from '../lib/trail.js';

  /** @typedef {{ id: number, x: number, y: number, down: boolean }} Pull */
  /** @typedef {import('../lib/trail.js').Trail} Trail */
  /** @typedef {'typed' | 'submit' | 'open' | 'trail'} How how a view was asked for: typed in the field, sent with Enter, opened from something, or gone to on the trail */

  // How many chips of the trail show at a time: three, and "…" for the rest,
  // fit the panel with their names.
  const CHIPS = 3;

  // The pictogram of each kind of step (app/icons/kinds).
  /** @type {Record<string, string>} */
  const PICTOGRAMS = {
    search: 'search',
    grammar: 'word',
    topic: 'search',
    passage: 'passage',
    refs: 'passage',
    word: 'word',
    person: 'person',
    place: 'place',
    group: 'group',
    event: 'event',
    world: 'era',
  };

  // How far a finger moves before a press on a result is a drag, in CSS pixels.
  const SLOP = 16;
  const COLLAPSED_KEY = 'bible.search.collapsed';


  export const state = {
    collapsed: false,
    keys: false,
    /** whether the trail and the results show under the field */
    expanded: false,
  };

  export const prototype = {
    /** a count of the openings and closings, so a late slide knows it is late */
    moves: 0,
    timer: 0,
    /** @type {AbortController | null} */
    request: null,
    /** @type {{ address: string, version: string, start: { x: number, y: number }, pull: Pull, out: boolean } | null} */
    press: null,
    /** @type {Trail} */
    path: emptyTrail(),
    /** whether the step on show is a search still being typed */
    typing: false,
    /** whether the whole trail is on show, not only the chips around the step */
    wholeTrail: false,
    /** whether a "Did you know?" is on show, not the trail's step */
    away: false,
    /** @type {((address: string) => { id: string, text: string }[]) | null} the notes on a passage, from the table */
    notesFor: null,

    connected({ signal }) {
      const form = /** @type {HTMLFormElement} */ (this.querySelector('form'));
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));

      try {
        this.collapsed = localStorage.getItem(COLLAPSED_KEY) === 'true';
      } catch {
        // No storage: the panel starts open.
      }

      this.addEventListener('click', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const refs = target?.closest('[data-refs]');
        if (refs instanceof HTMLElement && refs.dataset.refs) this.showReferences(refs.dataset.refs);
        const link = target?.closest('button[data-entity]');
        if (link instanceof HTMLElement && link.dataset.entity) this.showEntity(link.dataset.entity);
        const topic = target?.closest('button[data-topic]');
        if (topic instanceof HTMLElement && topic.dataset.topic) this.showTopic(topic.dataset.topic);
        const onMap = target?.closest('[data-show-map]');
        if (onMap instanceof HTMLElement && onMap.dataset.showMap) {
          this.dispatchEvent(new CustomEvent('show-on-map', { bubbles: true, detail: { ids: onMap.dataset.showMap } }));
        }
        const rule = target?.closest('[data-rule-kind]');
        if (rule instanceof HTMLElement) {
          const { ruleKind: kind, ruleValue: value, ruleLabel: label } = rule.dataset;
          this.dispatchEvent(new CustomEvent('rule-add', { bubbles: true, detail: { kind, value, label } }));
        }
        const beside = target?.closest('[data-beside]');
        if (beside instanceof HTMLElement && beside.dataset.beside) {
          this.dispatchEvent(new CustomEvent('place-beside', { bubbles: true, detail: { addresses: beside.dataset.beside.split(',') } }));
        }
        const note = target?.closest('[data-note-show]');
        if (note instanceof HTMLElement && note.dataset.noteShow) {
          this.dispatchEvent(new CustomEvent('show-note', { bubbles: true, detail: { id: note.dataset.noteShow } }));
        }
        const strongs = target?.closest('[data-strongs]');
        if (strongs instanceof HTMLElement && strongs.dataset.strongs) {
          input.value = strongs.dataset.strongs;
          this.run(undefined, 'open');
        }
        const say = target?.closest('[data-say]');
        if (say instanceof HTMLElement && say.dataset.say) {
          const lang = say.dataset.sayLang === 'he' ? 'he' : 'el';
          sayWord(say.dataset.say, lang).then((ok) => {
            const status = this.querySelector('.search__status');
            if (!ok && status) status.textContent = `This device has no ${LANGUAGE_NAMES[lang]} voice.`;
            if (!ok) say.setAttribute('title', `This device has no ${LANGUAGE_NAMES[lang]} voice.`);
          });
        }
        const search = target?.closest('[data-search]');
        if (search instanceof HTMLElement && search.dataset.search) this.searchFor(search.dataset.search);
        const discover = target?.closest('[data-discover]');
        if (discover instanceof HTMLElement) this.discover(discover.dataset.discover);
        const journey = target?.closest('[data-journey]');
        if (journey instanceof HTMLElement && journey.dataset.journey) {
          this.dispatchEvent(new CustomEvent('show-journey', { bubbles: true, detail: { journey: JSON.parse(journey.dataset.journey) } }));
        }
        const step = target?.closest('[data-trail]');
        if (step instanceof HTMLElement) {
          const where = step.dataset.trail;
          // Away on a "Did you know?", Back returns to the step that was left.
          if (where === 'back') this.go(this.away ? this.path.index : this.path.index - 1);
          else if (where === 'forward') this.go(this.path.index + 1);
          else if (where === 'all') {
            this.wholeTrail = !this.wholeTrail;
            this.paintTrail();
          } else this.go(Number(where));
        }
      }, { signal });
      // Alt and the arrow keys step through the trail, as in a browser.
      document.addEventListener('keydown', (event) => {
        if (!event.altKey || event.metaKey || event.ctrlKey) return;
        if (event.target instanceof HTMLTextAreaElement) return;
        if (event.key === 'ArrowLeft') this.go(this.away ? this.path.index : this.path.index - 1);
        else if (event.key === 'ArrowRight') this.go(this.path.index + 1);
        else return;
        event.preventDefault();
      }, { signal });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (this.keys) this.keys = false;
          else if (this.expanded) this.fold();
          else this.setCollapsed(true);
        }
      }, { signal });
      input.addEventListener('pointerdown', (event) => {
        this.keys = wantKeys({ pointer: event.pointerType });
        // The answer folded away comes back.
        if (this.querySelector('.search__results')?.childElementCount) this.setExpanded(true);
      }, { signal });
      input.addEventListener('blur', () => {
        this.keys = false;
      }, { signal });
      this.addEventListener('keys-done', () => {
        this.keys = false;
      }, { signal });
      document.addEventListener('keydown', (event) => {
        if (event.key !== '/' || event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
        event.preventDefault();
        if (this.collapsed) this.setCollapsed(false);
        else input.focus();
      }, { signal });

      input.addEventListener('input', () => this.queueSearch(), { signal });
      form.addEventListener(
        'submit',
        (event) => {
          event.preventDefault();
          clearTimeout(this.timer);
          this.run(undefined, 'submit');
        },
        { signal },
      );
      this.addEventListener('pointerdown', (event) => this.down(event), { signal });
      this.addEventListener('pointermove', (event) => this.move(event), { signal });
      this.addEventListener('pointerup', (event) => this.up(event), { signal });
      this.addEventListener('pointercancel', (event) => this.cancel(event), { signal });

      return () => clearTimeout(this.timer);
    },

    /**
     * Says what an answer found, in the status region: its summary, or its
     * heading. The region is emptied first, so the same words are said
     * again for a new answer.
     *
     * @param {HTMLElement} results
     */
    announce(results) {
      const status = this.querySelector('.search__status');
      if (!status) return;
      const said = results.querySelector('.stats__summary, .results__summary, h2, h3, .discover p');
      status.textContent = '';
      const text = (said?.textContent ?? '').replace(/\s+/g, ' ').trim();
      if (text) setTimeout(() => (status.textContent = text), 100);
    },

    /** whether an answer arrives without opening the panel (setTrail) */
    quiet: false,

    /** Opens the panel, with its trail and results, for an answer. */
    reveal() {
      if (this.quiet) return;
      if (this.collapsed) this.setCollapsed(false);
      this.setExpanded(true);
    },

    /** Folds the panel to its field, if it is open with an answer. */
    fold() {
      if (!this.collapsed && this.expanded) this.setExpanded(false);
    },

    /** @param {boolean} expanded */
    setExpanded(expanded) {
      if (expanded === this.expanded) return;
      this.expanded = expanded;
      if (expanded) {
        const results = this.querySelector('.search__results');
        if (results) slideIn(results, { y: -8 });
      }
      this.dispatchEvent(new Event('panel-change', { bubbles: true }));
    },

    /**
     * Opens or closes the panel, with a short fade.
     *
     * @param {boolean} collapsed
     */
    async setCollapsed(collapsed) {
      // A call during a closing slide cancels it: the closing sees the count
      // has moved on.
      const step = ++this.moves;
      if (collapsed === this.collapsed) return;
      // The focus, inside the panel as it closes, goes to its button.
      const inside = collapsed && this.contains(document.activeElement);
      if (collapsed) {
        await slideOut(this, { y: -8 });
        // Opened again during the slide: the later call holds.
        if (step !== this.moves) return;
      }
      this.collapsed = collapsed;
      if (inside) requestAnimationFrame(() => /** @type {HTMLElement | null} */ (document.querySelector('table-rail [data-action="search"]'))?.focus());
      slideIn(this, collapsed ? {} : { y: -8 });
      this.dispatchEvent(new Event('panel-change', { bubbles: true }));
      try {
        localStorage.setItem(COLLAPSED_KEY, String(collapsed));
      } catch {
        // No storage: the state lasts until the page closes.
      }
      // On a phone, one panel is open at a time (bible-table closes the
      // others).
      if (!collapsed && isPhone()) this.dispatchEvent(new CustomEvent('panel-open', { bubbles: true, detail: { panel: 'search' } }));
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      if (collapsed) input.blur();
      else requestAnimationFrame(() => input.focus());
    },

    queueSearch() {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.run(), 150);
    },

    /** @param {string} address a verse address */
    showReferences(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ refs: address, fragment: 'results' }), 'open');
    },

    /**
     * Lists the quotations of a verse: what it quotes of the Old Testament,
     * or where the New Testament quotes it (data/quotations.js).
     *
     * @param {string} address a verse address
     */
    showQuotes(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ quotes: address, fragment: 'results' }), 'open');
    },

    /** @param {string} id an entity id, such as person:david_994 */
    showEntity(id) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ entity: id, fragment: 'results' }), 'open');
    },

    /** @param {string} key a topic of Nave's Topical Bible, such as PRAYER */
    showTopic(key) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ topic: key, fragment: 'results' }), 'open');
    },

    /** @param {string} address a word address */
    showWord(address) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      this.run(new URLSearchParams({ word: address, fragment: 'results' }), 'open');
    },

    /**
     * @param {string} address a passage or a phrase
     * @param {{ id: string, text: string }[]} notes the notes that quote it
     * @param {How} [how]
     */
    async showGuide(address, notes, how = 'open') {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = '';
      this.reveal();
      if (!(await this.run(new URLSearchParams({ guide: address, fragment: 'results' }), how))) return;
      const holder = this.querySelector('.guide__notes');
      if (!(holder instanceof HTMLElement) || !notes.length) return;
      const heading = document.createElement('h3');
      heading.className = 'guide__heading';
      heading.textContent = notes.length === 1 ? 'A note on it' : `${notes.length} notes on it`;
      const list = document.createElement('ol');
      list.className = 'results__list';
      for (const note of notes) {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'result';
        button.dataset.noteShow = note.id;
        const text = note.text.trim();
        button.textContent = text ? (text.length > 120 ? `${text.slice(0, 120)} …` : text) : 'A note with no text yet';
        item.append(button);
        list.append(item);
      }
      holder.replaceChildren(heading, list);
      holder.hidden = false;
    },

    /**
     * Shows a "Did you know?" (data/facts.js): that one, or a random one. It
     * is not a step on the trail.
     *
     * @param {string} [which] the number of the fact
     */
    discover(which = 'random') {
      this.reveal();
      /** @type {HTMLInputElement} */ (this.querySelector('input')).value = '';
      this.typing = false;
      // The trail's step is not on show while the fact is: no chip is lapis,
      // and a tap on any chip, the last one too, goes back to it.
      this.away = true;
      this.paintTrail();
      return this.run(new URLSearchParams({ discover: which, fragment: 'results' }), 'trail');
    },

    /** @param {string} text */
    searchFor(text) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      input.value = text;
      this.reveal();
      this.run(undefined, 'open');
    },

    /**
     * Shows which offers to mark a word on every card are on.
     *
     * @param {{ kind: string, value: string }[]} rules
     */
    showRules(rules) {
      for (const button of this.querySelectorAll('[data-rule-kind]')) {
        const element = /** @type {HTMLElement} */ (button);
        const on = rules.some((rule) => rule.kind === element.dataset.ruleKind && rule.value === element.dataset.ruleValue);
        element.setAttribute('aria-pressed', String(on));
        element.textContent = on ? 'Marked on every card: tap to stop' : 'Mark it on every card';
      }
    },

    /**
     * Asks for a view and shows it, and records it on the trail.
     *
     * @param {URLSearchParams} [query] what to ask for; the typed search by default
     * @param {How} [how] how it was asked for; typing by default
     * @param {number} [scroll] where to scroll the list to once it is in
     * @returns {Promise<boolean>} false when a newer request took its place
     */
    async run(query, how = 'typed', scroll = 0) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      this.request?.abort();
      const request = new AbortController();
      this.request = request;

      query ??= new URLSearchParams({ q: input.value, fragment: 'results' });
      const response = await fetch(`/search?${query}`, { signal: request.signal }).catch(() => null);
      if (!response?.ok || request.signal.aborted) return false;
      const text = await response.text();
      if (request.signal.aborted) return false;
      const results = /** @type {HTMLElement} */ (this.querySelector('.search__results'));
      // The step being left keeps where its list was scrolled to.
      const leaving = this.path.steps[this.path.index];
      if (leaving && how !== 'typed') leaving.scroll = results.scrollTop;
      results.setHTMLUnsafe(text);
      if (results.childElementCount && !this.quiet) this.setExpanded(true);
      results.scrollTop = scroll;
      this.announce(results);
      const answer = /** @type {HTMLElement | null} */ (results.querySelector('[data-code]'));
      const code = answer?.dataset.code ?? '';
      const entity = answer?.dataset.entity ?? '';
      this.dispatchEvent(new CustomEvent('study', { bubbles: true, detail: { code, entity } }));
      if (how !== 'trail') this.remember(query, answer, how, input.value);
      return true;
    },

    /**
     * Records a view on the trail.
     *
     * @param {URLSearchParams} query
     * @param {HTMLElement | null} answer the results, which say what they are
     * @param {How} how
     * @param {string} typed the text in the field
     */
    remember(query, answer, how, typed) {
      const kind = answer?.dataset.trailKind ?? '';
      const label = answer?.dataset.trailLabel ?? '';
      const asked = new URLSearchParams(query);
      asked.delete('fragment');
      const typing = how === 'typed' || how === 'submit';
      const before = this.path;
      const wasAway = this.away;
      this.away = false;
      if (!kind) {
        // An empty search: a search being typed that was cleared goes.
        if (typing && this.typing) this.path = dropCurrent(this.path);
        this.typing = false;
      } else {
        /** @type {import('../lib/trail.js').Step} */
        const step = { query: asked.toString(), label, kind };
        if (asked.has('q')) step.typed = typed;
        this.path = record(this.path, step, typing && this.typing);
        // Typing goes on in the same step until Enter, or until something
        // else is opened.
        this.typing = how === 'typed';
      }
      if (this.path !== before || wasAway) {
        this.paintTrail();
        this.dispatchEvent(new CustomEvent('trail-change', { bubbles: true }));
      }
    },

    /**
     * Goes to a step of the trail.
     *
     * @param {number} index
     */
    async go(index) {
      const step = this.path.steps[index];
      if (!step || (index === this.path.index && !this.away)) return;
      const results = /** @type {HTMLElement | null} */ (this.querySelector('.search__results'));
      const leaving = this.path.steps[this.path.index];
      if (leaving && results) leaving.scroll = results.scrollTop;
      this.path = { ...this.path, index };
      this.typing = false;
      this.wholeTrail = false;
      this.away = false;
      this.paintTrail();
      this.dispatchEvent(new CustomEvent('trail-change', { bubbles: true }));
      await this.show(step);
    },

    /**
     * Shows a step's view again: its search text in the field, its list where
     * it was scrolled to, and for a guide, the table's notes on the passage.
     *
     * @param {import('../lib/trail.js').Step} step
     */
    async show(step) {
      const input = /** @type {HTMLInputElement} */ (this.querySelector('input'));
      this.reveal();
      const query = new URLSearchParams(step.query);
      const guide = query.get('guide');
      if (guide) {
        await this.showGuide(guide, this.notesFor?.(guide) ?? [], 'trail');
        const results = this.querySelector('.search__results');
        if (results) results.scrollTop = step.scroll ?? 0;
        return;
      }
      input.value = step.typed ?? '';
      query.set('fragment', 'results');
      await this.run(query, 'trail', step.scroll ?? 0);
    },

    /** The trail, to keep with the workspace. */
    trail() {
      return {
        steps: this.path.steps.map(({ query, label, kind, typed }) => (typed ? { query, label, kind, typed } : { query, label, kind })),
        index: this.path.index,
      };
    },

    /**
     * Puts a trail back, such as a workspace's, and shows its step.
     *
     * @param {Trail} trail
     * @param {boolean} [showStep]
     */
    setTrail(trail, showStep = true) {
      this.path = { steps: trail.steps.map((step) => ({ ...step })), index: trail.index };
      this.typing = false;
      this.wholeTrail = false;
      this.paintTrail();
      const step = this.path.steps[this.path.index];
      // The step comes back folded under the field: a table that opens does
      // not cover itself with its last answer.
      this.quiet = true;
      const done = () => {
        this.quiet = false;
      };
      if (showStep && step) this.show(step).finally(done);
      // With nothing to go back to, the panel has a "Did you know?" ready.
      else if (showStep) this.discover().finally(done);
      else done();
    },

    /**
     * Draws Back and Forward, the chips of the steps around the one on show,
     * and "…" when there are more. "…" opens the whole trail as a list under
     * the row, newest first, as a browser's history list.
     */
    paintTrail() {
      const nav = /** @type {HTMLElement | null} */ (this.querySelector('.search__trail'));
      const list = this.querySelector('.trail__chips');
      const whole = /** @type {HTMLElement | null} */ (this.querySelector('.trail__all'));
      if (!nav || !list || !whole) return;
      const { steps, index } = this.path;
      // The row is always there: it holds the ✦ for "Did you know?".
      nav.hidden = false;
      /** @type {HTMLButtonElement | null} */ (this.querySelector('[data-trail="back"]'))?.toggleAttribute('disabled', this.away ? index < 0 : index <= 0);
      this.querySelector('.trail__discover')?.setAttribute('aria-pressed', String(this.away));
      /** @type {HTMLButtonElement | null} */ (this.querySelector('[data-trail="forward"]'))?.toggleAttribute('disabled', index >= steps.length - 1);
      // A few chips around the step on show; "…" lists them all.
      const shown = windowOf(this.path, CHIPS);
      const more = shown.before || shown.after;
      if (!more) this.wholeTrail = false;

      /** @param {number} i @param {string} className */
      const stepButton = (i, className) => {
        const step = steps[i];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `${className} trail__chip--${step.kind}`;
        button.dataset.trail = String(i);
        button.title = step.label;
        if (i === index && !this.away) button.setAttribute('aria-current', 'step');
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('class', 'trail__icon');
        icon.setAttribute('aria-hidden', 'true');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', `/kinds.svg#${PICTOGRAMS[step.kind] ?? 'search'}`);
        icon.append(use);
        const text = document.createElement('span');
        text.className = 'trail__label';
        text.textContent = step.label;
        button.append(icon, text);
        return button;
      };
      /** @param {Element} child */
      const item = (child) => {
        const li = document.createElement('li');
        li.append(child);
        return li;
      };

      const chips = [];
      for (let i = shown.start; i < shown.end; i += 1) chips.push(item(stepButton(i, 'trail__chip')));
      if (more) {
        const all = document.createElement('button');
        all.type = 'button';
        all.className = 'trail__chip trail__more';
        all.dataset.trail = 'all';
        all.setAttribute('aria-expanded', String(this.wholeTrail));
        all.setAttribute('aria-label', `The whole trail: ${steps.length} steps`);
        all.title = 'The whole trail';
        all.textContent = '…';
        chips.push(item(all));
      }
      list.replaceChildren(...chips);
      list.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

      whole.hidden = !this.wholeTrail;
      if (this.wholeTrail) {
        const rows = [];
        for (let i = steps.length - 1; i >= 0; i -= 1) rows.push(item(stepButton(i, 'trail__row')));
        whole.replaceChildren(...rows);
        whole.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
      } else whole.replaceChildren();
    },

    /** @param {PointerEvent} event */
    down(event) {
      const item = event.target instanceof Element ? event.target.closest('[data-address]') : null;
      if (!(item instanceof HTMLElement)) return;
      this.press = {
        address: item.dataset.address ?? '',
        version: item.dataset.version ?? '',
        start: { x: event.clientX, y: event.clientY },
        pull: { id: event.pointerId, x: event.clientX, y: event.clientY, down: true },
        out: false,
      };
    },

    /** @param {PointerEvent} event */
    move(event) {
      const press = this.press;
      if (!press || press.pull.id !== event.pointerId) return;
      press.pull.x = event.clientX;
      press.pull.y = event.clientY;
      if (press.out) return;

      const dx = event.clientX - press.start.x;
      const dy = event.clientY - press.start.y;
      if (Math.hypot(dx, dy) < SLOP) return;
      // Sideways pulls a card out. Up or down is the list scrolling, and the
      // browser takes that gesture and cancels the pointer.
      if (Math.abs(dx) < Math.abs(dy)) {
        this.press = null;
        return;
      }
      press.out = true;
      this.send(press.address, press.pull, press.version);
    },

    /** @param {PointerEvent} event */
    up(event) {
      const press = this.press;
      if (!press || press.pull.id !== event.pointerId) return;
      press.pull.down = false;
      if (!press.out) this.send(press.address, null, press.version);
      this.press = null;
    },

    /** @param {PointerEvent} event */
    cancel(event) {
      if (this.press?.pull.id !== event.pointerId) return;
      this.press.pull.down = false;
      this.press = null;
    },

    /**
     * @param {string} address
     * @param {Pull | null} pointer
     * @param {string} [version] the version to open it in, such as original
     */
    send(address, pointer, version = '') {
      this.dispatchEvent(new CustomEvent('place', { bubbles: true, detail: { address, pointer, version } }));
      // On a phone the panel covers the table: it steps aside, so the card
      // it put there shows.
      if (isPhone()) this.setCollapsed(true);
    },
  };
</script>

<style>
  /* Placed by the rail (table-rail), which sets its box. */
  :scope {
    position: absolute;
    /* Above every card at rest, below a card a finger holds (gesture-card). */
    z-index: 1000000;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    zoom: var(--chrome-zoom, 1);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 2px 12px var(--shade-far);
    overflow: hidden;
  }
  form {
    display: flex;
    gap: var(--bar-gap);
    padding: var(--bar-padding);
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
  }
  input {
    flex: 1;
    min-width: 0;
    min-height: var(--control-height);
    padding: 0 0.75rem;
    border: 1px solid var(--edge);
    border-radius: var(--radius-small);
    background: var(--paper);
    color: inherit;
    font: inherit;
    user-select: text;
    -webkit-user-select: text;
  }
  input::placeholder {
    color: var(--muted);
  }
  button[type='submit'] {
    min-height: var(--control-height);
    padding: var(--control-padding);
    font: var(--control-font);
  }
  :scope:state(collapsed),
  :scope:not(:state(keys)) touch-keys {
    display: none;
  }
  /* At rest, only the field: the trail and the results fold away. */
  :scope:not(:state(expanded)) :is(.search__trail, .trail__all, .search__results) {
    display: none;
  }
  :scope:not(:state(expanded)) form {
    border-bottom: 0;
  }
  /* The trail: Back, Forward, and the chips of the steps around the one on
     show, each with the pictogram of its kind. The step on show is lapis. */
  .search__trail {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.35rem var(--bar-padding);
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
  }
  .search__trail[hidden] {
    display: none;
  }
  .trail__discover {
    color: var(--ochre);
  }
  .trail__step {
    flex: none;
    width: 2.2rem;
    height: 2.2rem;
    padding: 0;
    font: 500 1.2rem/1 var(--sans);
  }
  .trail__chips {
    display: flex;
    flex: 1;
    gap: 0.25rem;
    min-width: 0;
    margin: 0;
    padding: 0;
    overflow: hidden;
    list-style: none;
  }
  /* The step on show keeps its whole name; the others share what is left,
     down to their pictogram alone, and their names show on hover. */
  .trail__chips li {
    display: flex;
    flex: 0 1 auto;
    min-width: 2.2rem;
  }
  .trail__chips li:has([aria-current]) {
    flex: none;
    max-width: 60%;
  }
  .trail__chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    min-width: 0;
    max-width: 10rem;
    height: 2.2rem;
    padding: 0 0.65rem;
    border: 0;
    border-radius: 1.1rem;
    background: var(--tint);
    color: var(--ink);
    font: 500 max(0.55rem, 11px)/1 var(--sans);
  }
  .trail__chip:hover {
    background: color-mix(in srgb, var(--lapis) 14%, var(--tint));
  }
  .trail__more[aria-expanded='true'] {
    background: var(--ink-soft);
    color: var(--paper);
  }
  /* The whole trail: a list under the row, newest first, that scrolls. */
  .trail__all {
    display: grid;
    gap: 0.15rem;
    max-height: 40%;
    margin: 0;
    padding: 0.35rem var(--bar-padding) 0.5rem;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
    list-style: none;
  }
  .trail__all[hidden] {
    display: none;
  }
  .trail__row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    min-height: 2.2rem;
    padding: 0 0.7rem;
    border: 0;
    border-radius: var(--radius-small);
    background: transparent;
    color: var(--ink);
    font: 500 max(0.6rem, 11px)/1.2 var(--sans);
    text-align: start;
  }
  .trail__row:hover {
    background: var(--tint);
  }
  .trail__row[aria-current='step'] {
    background: var(--lapis);
    color: var(--on-pigment);
  }
  .trail__row[aria-current='step'] .trail__icon {
    color: inherit;
  }
  .trail__chip[aria-current='step'] {
    background: var(--lapis);
    color: var(--on-pigment);
  }
  .trail__label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trail__icon {
    flex: none;
    width: 1em;
    height: 1em;
    fill: currentColor;
  }
  .trail__chip--person .trail__icon { color: var(--ochre); }
  .trail__chip--place .trail__icon { color: var(--verdigris); }
  .trail__chip--group .trail__icon { color: var(--slate); }
  .trail__chip--event .trail__icon,
  .trail__chip--world .trail__icon { color: var(--purple); }
  .trail__chip--passage .trail__icon,
  .trail__chip--refs .trail__icon,
  .trail__chip--word .trail__icon { color: var(--lapis); }
  .trail__chip--search .trail__icon { color: var(--ink-soft); }
  .trail__chip[aria-current='step'] .trail__icon {
    color: inherit;
  }
  .search__results {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    /* Vertical swipes scroll the list. Sideways moves reach the script, which
       pulls a card out. */
    touch-action: pan-y;
  }
</style>
