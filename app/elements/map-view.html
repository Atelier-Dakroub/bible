<!-- The map's frame. The map moves and zooms inside it, and the card stays
     where it is. Outside the frame (the heading, the credit), a hand still
     moves the card.

     Inside the frame:
       one finger, or the mouse   moves the map
       two fingers                zoom the map, about their middle
       the wheel, or two fingers on a trackpad   move the map
       a pinch on the trackpad, or Control (or Command) and the wheel
                                  zoom the map, about the pointer
       a tap on a place           shows it (the table hears `card-tap`)
       + and -, Whole map         the buttons in the corner
     With the focus on the frame (Tab): the arrow keys move the map, + and -
     zoom it, and 0 shows the whole map.

     Names by level (lib/map.js nameLevels): at the whole map, only the most
     named places have their names on show. Each closer level shows more, as
     far as there is room. Places that a card on the table names, and the one
     on show, always have their names. The dots, names and lines keep their
     size at every zoom; only the distances grow. The scale bar in the corner
     gives the distance.

     The card first draws a light map: the coast simplified to about 2 km,
     and coarse relief bands. The detail (the coast and lakes at about 150 m,
     the fine bands, and the Levant's own sharper relief) is fetched a little
     after the card shows, and goes into the map closer than DETAIL_ZOOM: the
     frame then sets data-detail, and the card shows the detail in place of
     what it replaces. The sea is drawn over the relief, cut to the coast, so
     nothing is clipped to the coast.

     Speed: the relief is heavy to draw, so while a hand, the wheel or a glide
     moves the map, the frame moves a picture of it (a CSS transform of the
     map as last drawn, which the browser does not draw again), and draws it
     again, sharp and with its names placed, when the movement stops. During
     the movement the names grow and shrink with the picture.

     The map is two layers (svg() and over()): the base, heavy to draw, and
     the places and names over it, so a name that comes or goes does not
     draw the land again. On a phone's dense screen the base is drawn at a
     lower density and scaled up (shrink).

     The picture is larger than the frame: the map is drawn with a MARGIN of
     half the frame on each side, outside the frame, and is always a layer
     of its own, so the browser draws the margin while nothing moves. A pan
     or a zoom out then shows the map around the view at once, not a blank
     edge that fills in when the movement stops.

     A place shows its dot from one level before its name (lib/map.js
     nameLevels), so the whole map is not covered in dots; at the closest
     level every place shows, to be tapped.

     A journey (showJourney, data/journeys.js): its route drawn over the
     relief, a line from stop to stop, solid by land and dashed by sea, with
     an arrow on each leg that points the way, and a ring at the start. A
     label in the corner names it, with a × that takes it away.

     The view is { x, y, w } in map units (lib/map.js). The table keeps it
     with the workspace. Events, all bubbling:
       card-paint   the view changed, so the lines to the places move too
       card-tap     a tap: detail { target }
       map-change   a change of the view is done, so the table keeps it -->

<script element>
  import { dropLost } from '../lib/gesture.js';
  import { HEIGHT, KM_PER_UNIT, LEVELS, MAX_ZOOM, WIDTH, fitView, levelOf, moveView, nameLevels, scaleBar, wholeMap, zoomOf } from '../lib/map.js';

  /** @typedef {import('../lib/map.js').View} View */
  /** @typedef {{ x: number, y: number }} Point */

  // A tap is short and still, as on a card.
  const TAP_MS = 350;
  const STILL_PX = 10;
  // How far one press of a key or a button zooms, and how far a key moves.
  const KEY_ZOOM = 1.5;
  const BUTTON_ZOOM = 2;
  const KEY_MOVE = 0.2;
  // How long a glide to a new view takes.
  const GLIDE_MS = 280;
  // How long after the last wheel or key the change counts as done.
  const SETTLE_MS = 400;
  // The gap from a dot to its name, in pixels.
  const GAP = 8;
  // From this zoom on, the close coast.
  const DETAIL_ZOOM = 2.5;
  const ANCIENT_KEY = 'bible.map.ancient';
  // The map drawn outside the frame on each side, as a fraction of the frame
  // (the styles below make the drawing 1 + 2 × MARGIN times the frame).
  const MARGIN = 0.5;
  // The density the base is drawn at, at most, in device pixels to the CSS
  // pixel (shrink).
  const BASE_DENSITY = 1.5;
  // How long after the card shows the detail is fetched, so the card's own
  // first drawing goes first.
  const DETAIL_WAIT_MS = 1500;
  // How long after a detail that did not come it is asked for again.
  const DETAIL_RETRY_MS = 15000;
  // How long after the last wheel event the map is drawn again.
  const WHEEL_DRAW_MS = 160;

  /**
   * The middle of the first two points, and how far apart they are.
   *
   * @param {Map<number, Point>} points
   * @param {number[]} ids
   */
  function spanOf(points, ids) {
    const list = ids.map((id) => /** @type {Point} */ (points.get(id)));
    const middle = {
      x: list.reduce((sum, point) => sum + point.x, 0) / list.length,
      y: list.reduce((sum, point) => sum + point.y, 0) / list.length,
    };
    const apart = list.length === 2 ? Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y) : 0;
    return { middle, apart };
  }

  /** @param {EventTarget | null} target the target, if it is an element */
  const elementOf = (target) => (target instanceof Element ? target : null);

  /** @param {KeyboardEvent} event whether Command, Control or Option is held */
  const modified = (event) => event.metaKey || event.ctrlKey || event.altKey;

  /** @param {PointerEvent} event a mouse's other buttons do not move the map */
  const otherButton = (event) => event.pointerType === 'mouse' && event.button !== 0;

  /** @param {PointerEvent} event a mouse or a pen that moves with no button down is not holding the map */
  const heldUp = (event) => event.pointerType !== 'touch' && event.buttons === 0;

  /**
   * Whether a lift ends a tap: the same pointer, short and still.
   *
   * @param {{ id: number, t: number } | null} tap
   * @param {PointerEvent} event
   */
  const isTap = (tap, event) => tap?.id === event.pointerId && event.type === 'pointerup' && event.timeStamp - tap.t < TAP_MS;

  /**
   * How much two fingers zoom: the change in how far apart they are.
   *
   * @param {{ apart: number }} before
   * @param {{ apart: number }} now
   */
  const pinchFactor = (before, now) => (before.apart > 0 && now.apart > 0 ? now.apart / before.apart : 1);

  /**
   * Whether a point, in map units, is in the view.
   *
   * @param {number} x
   * @param {number} y
   * @param {View} view
   */
  const within = (x, y, view) => x >= view.x && x <= view.x + view.w && y >= view.y && y <= view.y + (view.w * HEIGHT) / WIDTH;

  /** The ancient world on show, as kept on this device. */
  function storedAncient() {
    try {
      return localStorage.getItem(ANCIENT_KEY) ?? '';
    } catch {
      return '';
    }
  }

  /** @param {string} id the ancient world on show, kept for the next visit */
  function keepAncient(id) {
    try {
      localStorage.setItem(ANCIENT_KEY, id);
    } catch {
      // No storage: the choice lasts until the page closes.
    }
  }

  /**
   * The size of a name, from the first place's: 18 pixels if there is none.
   *
   * @param {SVGGElement[]} places
   */
  function fontOf(places) {
    const sample = places[0]?.querySelector('text');
    return (sample && parseFloat(getComputedStyle(sample).fontSize)) || 18;
  }

  /**
   * Puts each group of the detail into the .map__detail group of its slot.
   *
   * @param {SVGSVGElement} svg
   * @param {Element} detail
   */
  function placeDetail(svg, detail) {
    for (const part of detail.querySelectorAll('[data-slot]')) {
      const slot = part.getAttribute('data-slot');
      svg.querySelector(`.map__detail[data-slot="${slot}"]`)?.append(...part.childNodes);
    }
  }

  /**
   * The view, and MARGIN of it on each side, as a viewBox.
   *
   * @param {View} view
   */
  function viewBoxOf(view) {
    const h = (view.w * HEIGHT) / WIDTH;
    return `${view.x - MARGIN * view.w} ${view.y - MARGIN * h} ${view.w * (1 + 2 * MARGIN)} ${h * (1 + 2 * MARGIN)}`;
  }

  /** @typedef {{ left: number, right: number, top: number, bottom: number }} Box */

  /**
   * The room a place's dot and name take, in map units, at a size of a map
   * unit in pixels. A name on show is bold, and wider.
   *
   * @param {SVGGElement} place
   * @param {number} unit
   * @param {number} font
   * @returns {Box}
   */
  function nameBox(place, unit, font) {
    const x = Number(place.dataset.x);
    const y = Number(place.dataset.y);
    const chars = (place.textContent ?? '').trim().length;
    return {
      left: x - GAP / unit,
      right: x + (GAP + chars * font * 0.62 + GAP) / unit,
      top: y - (font * 0.8) / unit,
      bottom: y + (font * 0.5) / unit,
    };
  }

  /** @param {Box} a @param {Box} b whether the two do not overlap */
  const apart = (a, b) => a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom;

  /** @param {SVGGElement} place whether it always has its name: a card names it, or it is on show */
  const alwaysNamed = (place) => place.classList.contains('is-on-table') || place.classList.contains('is-shown');

  /**
   * Shows a place's dot and name, or not, at a level. The dot shows from one
   * level before the name, and at the closest level every dot shows; a name
   * that one always named would cover waits for a closer level.
   *
   * @param {SVGGElement} place
   * @param {{ level: number, closest: boolean, always: SVGGElement[], taken: Box[], box: (place: SVGGElement) => Box }} at
   */
  function labelPlace(place, at) {
    const level = Number(place.dataset.level);
    const kept = at.always.includes(place);
    place.classList.toggle('is-far', !at.closest && level > at.level + 1 && !kept);
    const named = level <= at.level && !kept && at.taken.every((other) => apart(at.box(place), other));
    place.classList.toggle('is-named', named);
  }

  /**
   * An SVG element with its attributes.
   *
   * @param {string} name
   * @param {Record<string, string | number>} attributes
   */
  function svgNode(name, attributes) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
    return element;
  }

  /**
   * A mark at a point: a group in pixels (the map scales it back), holding
   * the shapes.
   *
   * @param {string} transform
   * @param {Element[]} shapes
   * @param {string} [className]
   */
  function markAt(transform, shapes, className) {
    const at = svgNode('g', className ? { transform, class: className } : { transform });
    const mark = svgNode('g', { class: 'map__mark' });
    mark.append(...shapes);
    at.append(mark);
    return at;
  }

  /**
   * A journey's legs: a line from stop to stop, and an arrow at the middle
   * of each, pointing the way.
   *
   * @param {import('../data/journeys.js').JourneyView['stops']} stops
   */
  function legsOf(stops) {
    const legs = [];
    for (let i = 1; i < stops.length; i += 1) {
      const a = stops[i - 1];
      const b = stops[i];
      if (a.x === b.x && a.y === b.y) continue;
      legs.push(svgNode('path', { d: `M${a.x} ${a.y}L${b.x} ${b.y}`, class: `map__leg map__leg--${b.by || 'land'}`, 'data-length': Math.hypot(b.x - a.x, b.y - a.y) }));
      const turn = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
      legs.push(markAt(`translate(${(a.x + b.x) / 2} ${(a.y + b.y) / 2}) rotate(${turn})`, [svgNode('path', { d: 'M-5 -4.5L5 0L-5 4.5z', class: 'map__arrow' })]));
    }
    return legs;
  }

  /**
   * A journey's proposed sites, which are not the map's places: each its own
   * dot and name, in italics, as the legend says it is placed roughly.
   *
   * @param {import('../data/journeys.js').JourneyView['stops']} stops
   */
  function proposedSites(stops) {
    return stops.filter((stop) => stop.proposed).map((stop) => {
      const name = svgNode('text', { x: 9, y: 5 });
      name.textContent = stop.name;
      return markAt(`translate(${stop.x} ${stop.y})`, [svgNode('circle', { r: 5 }), name], 'map__proposed');
    });
  }

  /**
   * The label in the corner that names a journey, with a × that takes it
   * off the map.
   *
   * @param {import('../data/journeys.js').JourneyView} journey
   */
  function journeyLegend(journey) {
    const legend = Object.assign(document.createElement('p'), { className: 'map__legend' });
    const proposed = journey.stops.some((stop) => stop.proposed) ? '; names in italics are proposed sites, placed roughly' : '';
    const route = journey.route ? ` · ${journey.route}` : '';
    const name = Object.assign(document.createElement('span'), { textContent: `${journey.title}${route} · about ${journey.km.toLocaleString('en')} km, in straight legs${proposed}` });
    const close = Object.assign(document.createElement('button'), { type: 'button', textContent: '×' });
    close.dataset.map = 'journey-off';
    close.setAttribute('aria-label', `Take ${journey.title} off the map`);
    legend.append(name, close);
    return legend;
  }

  export const prototype = {
    /** @type {View | null} */
    view: null,
    /** @type {Map<number, Point> | null} pointer id to position, on screen */
    points: null,
    /** @type {{ id: number, x: number, y: number, t: number, target: EventTarget | null } | null} */
    tap: null,
    /** how many pixels a map unit is at a zoom of 1, at the card's own size */
    pixels: 0,
    /** the size of a name, in pixels */
    font: 18,
    level: -1,
    settleTimer: 0,
    glideFrame: 0,
    /** @type {(() => void) | null} the end of the glide under way, for whoever waits on it */
    glideDone: null,
    /** @type {View | null} the view the map was last drawn at */
    drawn: null,
    /** whether the map is moving, and shown as a picture until it stops */
    quick: false,
    drawTimer: 0,
    /** @type {Promise<Element | null> | null} the map's detail, once asked for */
    detail: null,
    /** whether the detail is in the map */
    detailIn: false,
    /** when a detail that did not come may be asked for again */
    retryAt: 0,

    connected({ signal }) {
      this.view ??= wholeMap();
      this.points = new Map();
      this.describe();
      this.addProbe();
      this.addEventListener('pointerdown', (event) => this.press(event), { signal });
      this.addEventListener('pointermove', (event) => this.drag(event), { signal });
      this.addEventListener('pointerup', (event) => this.release(event), { signal });
      this.addEventListener('pointercancel', (event) => this.release(event), { signal });
      // A pointer the map lost ends as if cancelled (see gesture-card).
      this.addEventListener('lostpointercapture', (event) => this.release(event), { signal });
      this.addEventListener('wheel', (event) => this.wheel(event), { signal, passive: false });
      this.addEventListener('keydown', (event) => this.key(event), { signal });
      this.addEventListener('click', (event) => this.act(event), { signal });
      this.trackpad(signal);
      // The ancient world on show (the Show choice), kept on this device.
      this.showAncient(storedAncient());
      this.addEventListener('change', (event) => {
        const select = event.target instanceof HTMLSelectElement ? event.target : null;
        if (select?.dataset.map !== 'ancient') return;
        this.showAncient(select.value);
        keepAncient(select.value);
      }, { signal });
      const observer = new ResizeObserver(() => this.measure());
      observer.observe(this);
      const wait = setTimeout(() => this.fetchDetail(), DETAIL_WAIT_MS);
      signal.addEventListener('abort', () => {
        observer.disconnect();
        clearTimeout(wait);
      });
    },

    /**
     * For the keyboard and a screen reader: the frame takes the focus, is a
     * map, and names the keys it takes (the page's #map-keys, where it has
     * one).
     */
    describe() {
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      this.setAttribute('role', 'group');
      this.setAttribute('aria-roledescription', 'map');
      this.setAttribute('aria-label', 'Map of the biblical world');
      if (document.getElementById('map-keys')) this.setAttribute('aria-describedby', 'map-keys');
    },

    /**
     * A frame of the frame's own: an empty SVG over it whose units are
     * fractions of its width, so a point on the screen converts to the frame
     * however the card is turned or scaled, and whatever the map's transform
     * is.
     */
    addProbe() {
      if (this.querySelector('.map__probe')) return;
      const probe = svgNode('svg', { class: 'map__probe', viewBox: `0 0 1 ${HEIGHT / WIDTH}`, 'aria-hidden': 'true' });
      this.prepend(probe);
    },

    /**
     * Shows one layer of the ancient world (an extent, the provinces, or an
     * age's shores), or none.
     *
     * @param {string} id
     */
    showAncient(id) {
      const select = /** @type {HTMLSelectElement | null} */ (this.querySelector('select[data-map="ancient"]'));
      const known = [...this.querySelectorAll('.map__ancient')].some((each) => each.getAttribute('data-layer') === id);
      const chosen = known ? id : '';
      for (const layer of this.querySelectorAll('.map__ancient')) layer.classList.toggle('is-on', layer.getAttribute('data-layer') === chosen);
      if (select) select.value = chosen;
    },

    /**
     * The map's detail, fetched once: the card route's `detail` fragment.
     *
     * @returns {Promise<Element | null>}
     */
    fetchDetail() {
      if (!this.detail && Date.now() < this.retryAt) return Promise.resolve(null);
      this.detail ??= fetch('/card/map:near-east?part=detail&fragment=detail')
        .then((response) => (response.ok ? response.text() : ''))
        .then((text) => new DOMParser().parseFromString(text, 'text/html').querySelector('#detail'))
        .catch(() => null)
        .then((detail) => this.fetched(detail));
      return this.detail;
    },

    /**
     * A detail that did not come is asked for again, a while later.
     *
     * @param {Element | null} detail
     */
    fetched(detail) {
      if (detail) return detail;
      this.detail = null;
      this.retryAt = Date.now() + DETAIL_RETRY_MS;
      return null;
    },

    /**
     * Puts the detail into the map, each group into the .map__detail group
     * of its slot, then draws the map again.
     */
    async loadDetail() {
      if (this.detailIn) return;
      const detail = await this.fetchDetail();
      const svg = this.svg();
      if (!detail || !svg || this.detailIn) return;
      this.detailIn = true;
      placeDetail(svg, detail);
      this.paint();
    },

    disconnected() {
      this.stopGlide();
      clearTimeout(this.settleTimer);
      clearTimeout(this.drawTimer);
    },

    /** @returns {SVGSVGElement | null} the base: the land, the sea and the rivers */
    svg() {
      return this.querySelector('svg.map__base');
    },

    /** @returns {SVGSVGElement | null} the overlay: the ranges' names, the places and a journey */
    over() {
      return this.querySelector('svg.map__over');
    },

    /**
     * How much smaller the base is drawn than it shows, on a screen of more
     * than 2 device pixels to the CSS pixel: drawn at BASE_DENSITY and
     * scaled up by the browser as a picture. A phone at 3 draws a quarter of
     * the pixels, which matters most there, where the page is drawn by the
     * processor, not the graphics chip. The base has no text; the overlay,
     * with the names, keeps the screen's own density.
     */
    shrink() {
      const density = globalThis.devicePixelRatio || 1;
      return density > 2 ? density / BASE_DENSITY : 1;
    },

    /** The map starts to move: show it as a picture until it stops. */
    begin() {
      clearTimeout(this.drawTimer);
      if (this.quick) return;
      this.quick = true;
      this.classList.add('is-quick');
    },

    /** The map stops: draw it again, sharp. */
    end() {
      clearTimeout(this.drawTimer);
      if (!this.quick) return;
      this.quick = false;
      this.classList.remove('is-quick');
      this.paint();
    },

    /** The places, the most named first. */
    places() {
      // A water's own dot is left out: its name is on the water.
      return /** @type {SVGGElement[]} */ ([...this.querySelectorAll('.map__place:not(.map__place--water)')]).reverse();
    },

    /**
     * Reads the frame's size and works out at which level each place is
     * named. The size changes only when the page's type size does.
     */
    measure() {
      const svg = this.svg();
      if (!svg || !this.clientWidth) return;
      const pixels = this.clientWidth / WIDTH;
      if (pixels === this.pixels) return;
      this.pixels = pixels;
      const places = this.places();
      const font = fontOf(places);
      this.font = font;
      const levels = nameLevels(
        places.map((place) => ({
          x: Number(place.dataset.x),
          y: Number(place.dataset.y),
          chars: (place.textContent ?? '').trim().length,
        })),
        pixels,
        { font, gap: GAP },
      );
      places.forEach((place, i) => {
        place.dataset.level = String(levels[i]);
      });
      this.level = -1;
      this.paint();
    },

    /**
     * Names the places of the level. The places that a card names, and the
     * one on show, always have their names (the table marks them); a name of
     * the level that one of those would cover waits for a closer level.
     */
    relabel() {
      const unit = (this.pixels || 1) * LEVELS[Math.max(0, this.level)];
      /** @param {SVGGElement} place */
      const box = (place) => nameBox(place, unit, this.font);
      this.nameWaters();
      const places = this.places();
      const always = places.filter(alwaysNamed);
      const at = { level: this.level, closest: this.level >= LEVELS.length - 1, always, taken: always.map(box), box };
      for (const place of places) labelPlace(place, at);
    },

    /** Names the waters of this level (data/map/waters.js). */
    nameWaters() {
      for (const water of /** @type {NodeListOf<SVGGElement>} */ (this.querySelectorAll('.map__water'))) {
        water.classList.toggle('is-named', this.level >= Number(water.dataset.from) && this.level <= Number(water.dataset.to));
      }
    },

    /**
     * Shows a view, kept inside the map.
     *
     * @param {View} view
     */
    setView(view) {
      this.stopGlide();
      this.view = moveView(view, { x: 0, y: 0 }, { x: 0, y: 0 }, 1);
      this.quick = false;
      this.classList.remove('is-quick');
      this.paint();
    },

    /**
     * Stops a glide under way, where it is. Whoever waits on it goes on: an
     * interrupted glide is over, not lost.
     */
    stopGlide() {
      cancelAnimationFrame(this.glideFrame);
      const done = this.glideDone;
      this.glideDone = null;
      done?.();
    },

    /**
     * Glides to a view.
     *
     * @param {View} target
     * @returns {Promise<void>}
     */
    glideTo(target) {
      this.stopGlide();
      const from = /** @type {View} */ (this.view);
      const to = moveView(target, { x: 0, y: 0 }, { x: 0, y: 0 }, 1);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const start = performance.now();
      this.begin();
      return new Promise((resolve) => {
        this.glideDone = resolve;
        const frame = (/** @type {number} */ now) => {
          const t = reduced ? 1 : Math.min(1, (now - start) / GLIDE_MS);
          const eased = 1 - (1 - t) ** 3;
          // The width changes by a constant factor each frame, so the zoom
          // looks even; the middle moves in a line.
          const w = from.w * (to.w / from.w) ** eased;
          const ratio = HEIGHT / WIDTH;
          const a = { x: from.x + from.w / 2, y: from.y + (from.w * ratio) / 2 };
          const b = { x: to.x + to.w / 2, y: to.y + (to.w * ratio) / 2 };
          const middle = { x: a.x + (b.x - a.x) * eased, y: a.y + (b.y - a.y) * eased };
          this.view = { x: middle.x - w / 2, y: middle.y - (w * ratio) / 2, w };
          this.paint();
          if (t < 1) this.glideFrame = requestAnimationFrame(frame);
          else {
            this.view = to;
            this.glideDone = null;
            this.end();
            this.settle(0);
            resolve();
          }
        };
        this.glideFrame = requestAnimationFrame(frame);
      });
    },

    /**
     * Glides to a view that shows the places, and any other points (in map
     * units), such as a journey's proposed sites.
     *
     * @param {string[]} ids
     * @param {{ x: number, y: number }[]} [more]
     */
    fit(ids, more = []) {
      const points = ids.flatMap((id) => {
        const place = this.querySelector(`[data-place="${CSS.escape(id)}"]`);
        return place instanceof SVGElement ? [{ x: Number(place.dataset.x), y: Number(place.dataset.y) }] : [];
      });
      points.push(...more);
      return points.length ? this.glideTo(fitView(points)) : Promise.resolve();
    },

    /**
     * True when the place is inside the view.
     *
     * @param {string} id
     */
    shows(id) {
      const place = this.querySelector(`[data-place="${CSS.escape(id)}"]`);
      const view = this.view;
      if (!(place instanceof SVGElement) || !view) return false;
      return within(Number(place.dataset.x), Number(place.dataset.y), view);
    },

    /**
     * A point on the screen as a fraction of the frame's width, from the
     * frame's top left corner. It holds however the card is turned or
     * scaled.
     *
     * @param {Point} at
     */
    fraction(at) {
      const probe = /** @type {SVGSVGElement | null} */ (this.querySelector('.map__probe'));
      const matrix = probe?.getScreenCTM();
      if (!matrix) return { x: 0, y: 0 };
      const point = new DOMPoint(at.x, at.y).matrixTransform(matrix.inverse());
      return { x: point.x, y: point.y };
    },

    /**
     * Shows the view: while the map moves, as a picture of the map as last
     * drawn, moved and scaled to the view; when it stops, drawn again.
     */
    paint() {
      const svg = this.svg();
      if (!svg) return;
      const view = /** @type {View} */ (this.view);
      if (this.quick && this.drawn) this.paintQuick(svg, view, this.drawn);
      else this.paintDrawn(svg, view);
      this.dispatchEvent(new Event('card-paint', { bubbles: true }));
    },

    /** How many pixels a map unit is at a zoom of 1, measured or not yet. */
    unitNow() {
      return this.pixels || this.clientWidth / WIDTH || 1;
    },

    /**
     * While the map moves: the map as last drawn, moved and scaled to the
     * view. A map point p is at (p - drawn) * W / drawn.w in the frame, and
     * should be at (p - view) * W / view.w. The drawing's corner is MARGIN of
     * the frame outside it, and the transform turns about that corner.
     *
     * @param {SVGSVGElement} svg
     * @param {View} view
     * @param {View} drawn
     */
    paintQuick(svg, view, drawn) {
      const width = this.clientWidth;
      const height = this.clientHeight;
      const scale = drawn.w / view.w;
      const dx = ((drawn.x - view.x) * width) / view.w + MARGIN * width * (1 - scale);
      const dy = ((drawn.y - view.y) * width) / view.w + MARGIN * height * (1 - scale);
      svg.style.transform = `translate(${dx}px, ${dy}px) scale(${scale * this.shrink()})`;
      this.over()?.style.setProperty('transform', `translate(${dx}px, ${dy}px) scale(${scale})`);
      this.paintControls(this.unitNow() * zoomOf(view));
    },

    /**
     * When the map stops: drawn again at the view, sharp, with its names.
     *
     * @param {SVGSVGElement} svg
     * @param {View} view
     */
    paintDrawn(svg, view) {
      this.drawn = { ...view };
      const shrink = this.shrink();
      svg.style.width = svg.style.height = `${(100 * (1 + 2 * MARGIN)) / shrink}%`;
      svg.style.transform = shrink === 1 ? '' : `scale(${shrink})`;
      const over = this.over();
      over?.style.removeProperty('transform');
      const box = viewBoxOf(view);
      svg.setAttribute('viewBox', box);
      over?.setAttribute('viewBox', box);
      // The dots and names are drawn in pixels, inside a group scaled back by
      // the size of a map unit.
      const zoom = zoomOf(view);
      const unit = this.unitNow() * zoom;
      this.style.setProperty('--map-unit', String(unit));
      this.dashLegs(unit);
      this.showDetail(zoom);
      this.setLevel(levelOf(zoom));
      this.paintControls(unit);
    },

    /**
     * The detail, closer in: once it is in the map; until then the light map
     * holds, and the detail is asked for.
     *
     * @param {number} zoom
     */
    showDetail(zoom) {
      const close = zoom >= DETAIL_ZOOM;
      if (close && !this.detailIn) this.loadDetail();
      this.toggleAttribute('data-detail', close && this.detailIn);
    },

    /**
     * The level of names, and the names of it, when it changes.
     *
     * @param {number} level
     */
    setLevel(level) {
      if (level === this.level) return;
      this.level = level;
      this.dataset.level = String(level);
      this.relabel();
    },

    /**
     * The scale bar and the zoom buttons, for the view.
     *
     * @param {number} unit how many pixels a map unit is now
     */
    paintControls(unit) {
      const view = /** @type {View} */ (this.view);
      const bar = scaleBar(unit / KM_PER_UNIT);
      const line = /** @type {HTMLElement | null} */ (this.querySelector('.map__bar'));
      const label = this.querySelector('.map__km');
      if (line) line.style.width = `${bar.px}px`;
      if (label) label.textContent = bar.label;
      this.querySelector('[data-map="in"]')?.toggleAttribute('disabled', view.w <= WIDTH / MAX_ZOOM + 0.01);
      this.querySelector('[data-map="out"]')?.toggleAttribute('disabled', view.w >= WIDTH - 0.01);
      this.querySelector('[data-map="all"]')?.toggleAttribute('disabled', view.w >= WIDTH - 0.01);
    },

    /**
     * Tells the table, a moment after the last change, that the view is worth
     * keeping.
     *
     * @param {number} [wait]
     */
    settle(wait = SETTLE_MS) {
      clearTimeout(this.settleTimer);
      this.settleTimer = setTimeout(() => this.dispatchEvent(new Event('map-change', { bubbles: true })), wait);
    },

    /** @param {PointerEvent} event */
    press(event) {
      // A button in the frame is pressed, not dragged; the card leaves it too.
      if (elementOf(event.target)?.closest('button, select')) return;
      // The frame's gestures are the map's, not the card's.
      event.stopPropagation();
      if (otherButton(event)) return;
      this.forgetLost();
      if (!this.capture(event.pointerId)) return;
      this.stopGlide();
      const points = /** @type {Map<number, Point>} */ (this.points);
      this.tap = points.size === 0
        ? { id: event.pointerId, x: event.clientX, y: event.clientY, t: event.timeStamp, target: event.target }
        : null;
      points.set(event.pointerId, { x: event.clientX, y: event.clientY });
      this.classList.add('is-moving');
      this.begin();
    },

    /**
     * Holds a pointer; false if it cannot be held (it is gone).
     *
     * @param {number} id
     */
    capture(id) {
      try {
        this.setPointerCapture(id);
        return true;
      } catch {
        return false;
      }
    },

    /** @param {PointerEvent} event */
    drag(event) {
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (!points.has(event.pointerId)) return;
      event.stopPropagation();
      if (heldUp(event)) {
        this.release(event);
        return;
      }
      this.forgetLost(event.pointerId);
      this.dropMovedTap(event);
      const after = new Map(points);
      after.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const ids = [...after.keys()].slice(0, 2);
      const before = spanOf(points, ids);
      const now = spanOf(after, ids);
      this.view = moveView(/** @type {View} */ (this.view), this.fraction(before.middle), this.fraction(now.middle), pinchFactor(before, now));
      this.points = after;
      this.paint();
    },

    /**
     * A tap that moves is not a tap.
     *
     * @param {PointerEvent} event
     */
    dropMovedTap(event) {
      const tap = this.tap;
      if (tap && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) > STILL_PX) this.tap = null;
    },

    /**
     * Forgets the pointers whose lift never reached the map (lib/gesture.js
     * dropLost): kept, one would make the next finger a pinch about a point
     * no finger holds.
     *
     * @param {number} [keep] the pointer of the event being handled
     */
    forgetLost(keep) {
      const points = /** @type {Map<number, Point>} */ (this.points);
      const held = (/** @type {number} */ id) => {
        try {
          return this.hasPointerCapture(id);
        } catch {
          return false;
        }
      };
      if (!dropLost(points, held, keep)) return;
      if (this.tap && !points.has(this.tap.id)) this.tap = null;
      if (points.size === 0) {
        this.classList.remove('is-moving');
        this.end();
        this.settle(0);
      }
    },

    /** @param {PointerEvent} event */
    release(event) {
      const points = /** @type {Map<number, Point>} */ (this.points);
      if (!points.delete(event.pointerId)) return;
      event.stopPropagation();
      const tap = this.tap;
      this.tap = null;
      if (isTap(tap, event)) this.dispatchEvent(new CustomEvent('card-tap', { bubbles: true, detail: { target: tap?.target } }));
      if (points.size > 0) return;
      this.classList.remove('is-moving');
      this.end();
      this.settle(0);
    },

    /** @param {WheelEvent} event */
    wheel(event) {
      event.stopPropagation();
      event.preventDefault();
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
      const at = { x: event.clientX, y: event.clientY };
      const view = /** @type {View} */ (this.view);
      this.stopGlide();
      this.begin();
      this.drawTimer = setTimeout(() => this.end(), WHEEL_DRAW_MS);
      if (event.ctrlKey || event.metaKey) {
        const here = this.fraction(at);
        this.view = moveView(view, here, here, Math.exp((-event.deltaY * unit) / 200));
      } else {
        const to = this.fraction({ x: at.x - event.deltaX * unit, y: at.y - event.deltaY * unit });
        this.view = moveView(view, this.fraction(at), to, 1);
      }
      this.paint();
      this.settle();
    },

    /**
     * Safari's pinch on the trackpad, as on the table, but for the map.
     *
     * @param {AbortSignal} signal
     */
    trackpad(signal) {
      /** @type {{ at: Point, scale: number } | null} */
      let gesture = null;
      /** @param {any} event */
      const start = (event) => {
        event.stopPropagation();
        event.preventDefault();
        gesture = { at: { x: event.clientX, y: event.clientY }, scale: 1 };
        this.begin();
      };
      /** @param {any} event */
      const change = (event) => {
        event.stopPropagation();
        event.preventDefault();
        if (!gesture) return;
        const here = this.fraction(gesture.at);
        this.view = moveView(/** @type {View} */ (this.view), here, here, event.scale / gesture.scale);
        gesture.scale = event.scale;
        this.paint();
      };
      /** @param {any} event */
      const end = (event) => {
        event.stopPropagation();
        event.preventDefault();
        gesture = null;
        this.end();
        this.settle(0);
      };
      this.addEventListener('gesturestart', start, { signal });
      this.addEventListener('gesturechange', change, { signal });
      this.addEventListener('gestureend', end, { signal });
    },

    /**
     * Zooms about the middle of the frame.
     *
     * @param {number} factor
     */
    zoomBy(factor) {
      const middle = { x: 0.5, y: HEIGHT / WIDTH / 2 };
      return this.glideTo(moveView(/** @type {View} */ (this.view), middle, middle, factor));
    },

    /** @param {KeyboardEvent} event */
    key(event) {
      if (event.target !== this || modified(event)) return;
      const act = this.keyActions()[event.key];
      if (!act) return;
      act();
      event.preventDefault();
      event.stopPropagation();
    },

    /**
     * What each key does: the arrows move the map, + and - zoom it, and 0
     * shows the whole map.
     *
     * @returns {Record<string, () => void>}
     */
    keyActions() {
      const middle = { x: 0.5, y: HEIGHT / WIDTH / 2 };
      const step = KEY_MOVE * (HEIGHT / WIDTH);
      const pan = (/** @type {number} */ dx, /** @type {number} */ dy) => () => {
        this.glideTo(moveView(/** @type {View} */ (this.view), middle, { x: middle.x + dx, y: middle.y + dy }, 1));
      };
      const zoomIn = () => this.zoomBy(KEY_ZOOM);
      const zoomOut = () => this.zoomBy(1 / KEY_ZOOM);
      return {
        ArrowLeft: pan(step, 0),
        ArrowRight: pan(-step, 0),
        ArrowUp: pan(0, step),
        ArrowDown: pan(0, -step),
        '+': zoomIn,
        '=': zoomIn,
        '-': zoomOut,
        _: zoomOut,
        0: () => this.glideTo(wholeMap()),
      };
    },

    /**
     * Draws a journey's route, and names it in the corner.
     *
     * @param {import('../data/journeys.js').JourneyView} journey
     */
    showJourney(journey) {
      this.clearJourney();
      const svg = this.over();
      if (!svg) return;
      const layer = svgNode('g', { class: 'map__journey', 'aria-hidden': 'true' });
      const { stops } = journey;
      layer.append(...legsOf(stops), ...proposedSites(stops));
      // A ring at the start.
      if (stops[0]) layer.append(markAt(`translate(${stops[0].x} ${stops[0].y})`, [svgNode('circle', { r: 9, class: 'map__start' })]));
      svg.querySelector('.map__place')?.before(layer);
      this.dashLegs(Number(this.style.getPropertyValue('--map-unit')) || 1);
      this.append(journeyLegend(journey));
    },

    /**
     * Fits the dashes of each leg by sea to its length on screen, so that
     * the leg starts with a dash at the edge of one stop's dot and ends with
     * one at the edge of the next: a pattern that is not fitted can start
     * under the dot and end in a gap, and the leg then seems to miss its
     * stop. Drawn again at each zoom, as the dashes are in pixels.
     *
     * @param {number} unit how many pixels a map unit is now
     */
    dashLegs(unit) {
      const DASH = 7;
      const GAP = 5;
      // The radius of a stop's dot (styles: .map__place.is-shown circle).
      const DOT = 6;
      for (const leg of /** @type {NodeListOf<SVGPathElement>} */ (this.querySelectorAll('.map__leg--sea'))) {
        const shown = Number(leg.dataset.length) * unit - 2 * DOT;
        const dashes = Math.round((shown + GAP) / (DASH + GAP));
        if (dashes < 2) {
          leg.style.strokeDasharray = 'none';
          continue;
        }
        const gap = (shown - dashes * DASH) / (dashes - 1);
        leg.style.strokeDasharray = `${DASH} ${gap.toFixed(2)}`;
        leg.style.strokeDashoffset = String(-DOT);
      }
    },

    /** Takes the journey off the map. */
    clearJourney() {
      this.querySelector('.map__journey')?.remove();
      this.querySelector('.map__legend')?.remove();
    },

    /** @param {MouseEvent} event */
    act(event) {
      const button = elementOf(event.target)?.closest('[data-map]');
      if (!(button instanceof HTMLElement)) return;
      /** @type {Record<string, () => void>} */
      const actions = {
        'journey-off': () => {
          this.clearJourney();
          this.dispatchEvent(new CustomEvent('journey-off', { bubbles: true }));
        },
        in: () => this.zoomBy(BUTTON_ZOOM),
        out: () => this.zoomBy(1 / BUTTON_ZOOM),
        all: () => this.glideTo(wholeMap()),
      };
      actions[button.dataset.map ?? '']?.();
    },
  };
</script>

<style>
  :scope {
    position: relative;
    display: block;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  :scope.is-moving {
    cursor: grabbing;
  }
  /* The frame has the map's proportions. The map is drawn larger than it,
     MARGIN of the frame on each side (the script), and moves as a picture
     about its corner. It is always a layer of its own, so the browser draws
     the margin while nothing moves, and moves the picture without drawing
     it again. Only the map's two layers: an icon in the frame keeps its
     own size. */
  :scope {
    aspect-ratio: 1600 / 978;
  }
  .map__svg {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    transform-origin: 0 0;
    will-change: transform;
  }
  .map__probe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }
</style>

<slot></slot>
