<!-- The reader's settings: theme, paper, text size, line spacing, and what
     the text shows. Each is an attribute on <html> that the stylesheet reads
     (styles/reading-room.css), and the browser keeps them for the next visit.
     A page that uses them also applies them in a small inline script before
     it paints (see routes/design.html), so the page does not flash the
     default first; this element applies them again.

     The controls are tiles that show what they do: a theme or a paper as its
     own colors, a text size as a letter of that size, a line spacing as
     lines, and each thing the text shows as a sample. A chosen tile has a
     lapis ring. The theme tiles take their colors from the tokens with the
     tile's own color scheme, so Night shows night's colors in the day.

     Theme: Day, Night, or As the computer, which follows the computer's own
     light or dark setting and changes with it.

     It sends `reading-change` (bubbling) after each change, with the
     settings as detail, so a view that measures text can measure again. -->

<script element>
  const KEY = 'bible.reading';

  // Each setting, its values, and its default. The default is left off
  // <html>, so the stylesheet's plain rules are the default look.
  /** @type {Record<string, string[]>} */
  const SETTINGS = {
    theme: ['day', 'night', 'system'],
    paper: ['bright', 'soft', 'lamp'],
    size: ['3', '1', '2', '4', '5'],
    leading: ['normal', 'compact', 'loose'],
    red: ['on', 'off'],
    numbers: ['on', 'off'],
    initials: ['on', 'off'],
    layout: ['paragraphs', 'verses'],
  };

  /** @returns {Record<string, string>} */
  function load() {
    try {
      const value = JSON.parse(localStorage.getItem(KEY) ?? '{}');
      return value && typeof value === 'object' ? value : {};
    } catch {
      return {};
    }
  }

  /** @param {Record<string, string>} settings */
  function apply(settings) {
    const root = document.documentElement;
    for (const [name, values] of Object.entries(SETTINGS)) {
      const value = settings[name];
      if (values.includes(value) && value !== values[0]) root.dataset[name] = value;
      else delete root.dataset[name];
    }
  }

  export const prototype = {
    connected({ signal }) {
      apply(load());
      this.paint();
      this.addEventListener('click', (event) => this.act(event), { signal });
      // A change in another tab or window is a change here too.
      addEventListener('storage', (event) => {
        if (event.key !== KEY) return;
        apply(load());
        this.paint();
        this.dispatchEvent(new CustomEvent('reading-change', { bubbles: true, detail: this.current() }));
      }, { signal });
      // As the computer: the page follows by itself (CSS), but the colors
      // that are measured, such as the contrast chart's, need to hear it.
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (document.documentElement.dataset.theme !== 'system') return;
        this.dispatchEvent(new CustomEvent('reading-change', { bubbles: true, detail: this.current() }));
      }, { signal });
    },

    /** The settings now, each with its value or its default. */
    current() {
      const root = document.documentElement;
      return Object.fromEntries(Object.entries(SETTINGS).map(([name, values]) => [name, root.dataset[name] ?? values[0]]));
    },

    /** @param {MouseEvent} event */
    act(event) {
      const button = event.target instanceof Element ? event.target.closest('button[data-set], button[data-toggle]') : null;
      if (!(button instanceof HTMLElement)) return;
      const settings = this.current();
      // A tile that is one of several sets its value; a tile on its own
      // turns its setting on or off.
      const name = button.dataset.set ?? button.dataset.toggle ?? '';
      const values = SETTINGS[name];
      if (!values) return;
      if (button.dataset.toggle) settings[name] = settings[name] === 'on' ? 'off' : 'on';
      else settings[name] = button.dataset.value ?? values[0];
      apply(settings);
      try {
        localStorage.setItem(KEY, JSON.stringify(settings));
      } catch {
        // A private window keeps nothing; the setting holds for this visit.
      }
      this.paint();
      this.dispatchEvent(new CustomEvent('reading-change', { bubbles: true, detail: settings }));
    },

    paint() {
      const settings = this.current();
      for (const button of this.querySelectorAll('button[data-set]')) {
        const element = /** @type {HTMLElement} */ (button);
        element.setAttribute('aria-pressed', String(settings[element.dataset.set ?? ''] === element.dataset.value));
      }
      for (const button of this.querySelectorAll('button[data-toggle]')) {
        const element = /** @type {HTMLElement} */ (button);
        element.setAttribute('aria-pressed', String(settings[element.dataset.toggle ?? ''] === 'on'));
      }
    },
  };
</script>

<style>
  /* The element is its own size container: two groups to a row when there
     is room, one when there is not. */
  :scope {
    display: block;
    container-type: inline-size;
  }
  .reading__grid {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 0.8rem 1.4rem;
  }
  @container (max-width: 25rem) {
    .reading__grid {
      grid-template-columns: max-content;
    }
  }
  .reading__group {
    margin: 0;
    padding: 0;
    border: 0;
  }
  .reading__name {
    margin: 0 0 0.3rem;
    padding: 0;
    color: var(--ink-soft);
    font: 600 0.5rem/1.4 var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .reading__tiles {
    display: flex;
    gap: 0.3rem;
  }
  /* A tile: a picture of the choice, and its name under it. The class chain
     outweighs a panel's own rule for its buttons. */
  .reading__grid .reading__tile {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 0.2rem;
    min-width: 3rem;
    min-height: 0;
    padding: 0.3rem 0.25rem 0.25rem;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font: 500 0.45rem/1.2 var(--sans);
  }
  .reading__grid .reading__tile:hover {
    background: var(--tint);
  }
  .reading__grid .reading__tile[aria-pressed='true'] {
    border-color: var(--lapis);
    background: var(--paper);
    color: var(--lapis);
    box-shadow: inset 0 0 0 1px var(--lapis);
    font-weight: 700;
  }
  /* The picture in a tile. */
  .reading__swatch {
    display: grid;
    place-items: center;
    width: 2.4rem;
    height: 1.6rem;
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--edge) 70%, transparent);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    font: 600 0.75rem/1 var(--serif);
  }
  /* Theme: each tile in its own scheme, so it shows that theme's colors. */
  .reading__swatch--day {
    color-scheme: light;
  }
  .reading__swatch--night {
    color-scheme: dark;
  }
  .reading__swatch--system {
    grid-template-columns: 1fr 1fr;
    place-items: stretch;
  }
  .reading__swatch--system span {
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
  }
  .reading__swatch--system span:first-child {
    color-scheme: light;
    justify-items: end;
  }
  .reading__swatch--system span:last-child {
    color-scheme: dark;
    justify-items: start;
  }
  /* Paper: each of the three papers, in the theme now chosen. */
  .reading__swatch--bright { background: var(--paper-bright); }
  .reading__swatch--soft { background: var(--paper-soft); }
  .reading__swatch--lamp { background: var(--paper-lamp); }
  /* Text size: the letter at a size for each step. */
  .reading__grid .reading__tile--size {
    min-width: 2.2rem;
  }
  .reading__letter {
    display: grid;
    place-items: end center;
    height: 1.6rem;
    font: 500 1rem/1 var(--serif);
  }
  .reading__letter--1 { font-size: 0.6rem; }
  .reading__letter--2 { font-size: 0.75rem; }
  .reading__letter--3 { font-size: 0.9rem; }
  .reading__letter--4 { font-size: 1.1rem; }
  .reading__letter--5 { font-size: 1.35rem; }
  /* Line spacing and layout: lines, drawn. */
  .reading__lines {
    width: 2.4rem;
    height: 1.6rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
  }
  /* What the text shows: a sample of each. */
  .reading__sample {
    display: grid;
    place-items: center;
    width: 2.4rem;
    height: 1.6rem;
    font: 500 0.75rem/1 var(--serif);
  }
  .reading__sample--red {
    color: var(--rubric);
  }
  .reading__sample--numbers sup {
    margin-right: 0.05em;
    color: var(--ink-soft);
    font: 600 0.45rem var(--sans);
  }
  .reading__sample--initials {
    grid-auto-flow: column;
    gap: 0.05rem;
    align-items: start;
  }
  .reading__sample--initials b {
    color: var(--lapis);
    font: 600 1.3rem/1 var(--serif);
  }
  .reading__sample--initials span {
    font-size: 0.6rem;
    line-height: 1.6;
  }
  /* An off tile shows its sample faded, so on and off read at a glance. */
  .reading__tile[data-toggle][aria-pressed='false'] :is(.reading__sample) {
    opacity: 0.45;
  }
</style>

<div class="reading__grid">
  <fieldset class="reading__group">
    <legend class="reading__name">Theme</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile" data-set="theme" data-value="day"><span class="reading__swatch reading__swatch--day">Aa</span>Day</button>
      <button type="button" class="reading__tile" data-set="theme" data-value="night"><span class="reading__swatch reading__swatch--night">Aa</span>Night</button>
      <button type="button" class="reading__tile" data-set="theme" data-value="system"><span class="reading__swatch reading__swatch--system"><span>A</span><span>a</span></span>Computer</button>
    </div>
  </fieldset>

  <fieldset class="reading__group">
    <legend class="reading__name">Paper</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile" data-set="paper" data-value="bright"><span class="reading__swatch reading__swatch--bright">Aa</span>Bright</button>
      <button type="button" class="reading__tile" data-set="paper" data-value="soft"><span class="reading__swatch reading__swatch--soft">Aa</span>Soft</button>
      <button type="button" class="reading__tile" data-set="paper" data-value="lamp"><span class="reading__swatch reading__swatch--lamp">Aa</span>Lamp</button>
    </div>
  </fieldset>

  <fieldset class="reading__group">
    <legend class="reading__name">Text size</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile reading__tile--size" data-set="size" data-value="1" aria-label="Text size 1, the smallest"><span class="reading__letter reading__letter--1">A</span>1</button>
      <button type="button" class="reading__tile reading__tile--size" data-set="size" data-value="2" aria-label="Text size 2"><span class="reading__letter reading__letter--2">A</span>2</button>
      <button type="button" class="reading__tile reading__tile--size" data-set="size" data-value="3" aria-label="Text size 3"><span class="reading__letter reading__letter--3">A</span>3</button>
      <button type="button" class="reading__tile reading__tile--size" data-set="size" data-value="4" aria-label="Text size 4"><span class="reading__letter reading__letter--4">A</span>4</button>
      <button type="button" class="reading__tile reading__tile--size" data-set="size" data-value="5" aria-label="Text size 5, the largest"><span class="reading__letter reading__letter--5">A</span>5</button>
    </div>
  </fieldset>

  <fieldset class="reading__group">
    <legend class="reading__name">Line spacing</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile" data-set="leading" data-value="compact"><svg class="reading__lines" viewBox="0 0 24 16" aria-hidden="true"><path d="M3 4.5h18M3 8h18M3 11.5h12"></path></svg>Compact</button>
      <button type="button" class="reading__tile" data-set="leading" data-value="normal"><svg class="reading__lines" viewBox="0 0 24 16" aria-hidden="true"><path d="M3 3h18M3 8h18M3 13h12"></path></svg>Normal</button>
      <button type="button" class="reading__tile" data-set="leading" data-value="loose"><svg class="reading__lines" viewBox="0 0 24 16" aria-hidden="true"><path d="M3 1.5h18M3 8h18M3 14.5h12"></path></svg>Loose</button>
    </div>
  </fieldset>

  <fieldset class="reading__group">
    <legend class="reading__name">The text shows</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile" data-toggle="red" aria-label="Words of Christ in red"><span class="reading__sample reading__sample--red">Aa</span>Red letters</button>
      <button type="button" class="reading__tile" data-toggle="numbers" aria-label="Verse numbers"><span class="reading__sample reading__sample--numbers"><span><sup>1</sup>In</span></span>Numbers</button>
      <button type="button" class="reading__tile" data-toggle="initials" aria-label="An initial at a chapter's start"><span class="reading__sample reading__sample--initials"><b>I</b><span>n</span></span>Initials</button>
    </div>
  </fieldset>

  <fieldset class="reading__group">
    <legend class="reading__name">Layout</legend>
    <div class="reading__tiles">
      <button type="button" class="reading__tile" data-set="layout" data-value="paragraphs"><svg class="reading__lines" viewBox="0 0 24 16" aria-hidden="true"><path d="M6 3h15M3 7h18M3 11h18M3 15h9"></path></svg>Paragraphs</button>
      <button type="button" class="reading__tile" data-set="layout" data-value="verses"><svg class="reading__lines" viewBox="0 0 24 16" aria-hidden="true"><path d="M3 3h1M7 3h14M3 8h1M7 8h10M3 13h1M7 13h12"></path></svg>Verses</button>
    </div>
  </fieldset>
</div>
