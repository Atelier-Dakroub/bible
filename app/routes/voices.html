<title>Voices</title>

<!-- A listening test: the same passages read by each voice, for choosing
     the voice of the app's own recordings. The samples are made in the
     scratchpad (open text-to-speech models) and the LibriVox reference cut
     from the KJV's recording; they live in app/public/voices, outside git,
     with samples.json and librivox.json listing them. A choice per passage
     is kept in this browser and summed up at the top. Not linked from the
     app. -->

<style>
  .voices {
    max-width: 52rem;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }
  .voices h1 {
    margin: 0 0 0.25rem;
    font: 600 1.6rem/1.2 var(--serif);
  }
  .voices__intro {
    margin: 0 0 1rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .voices__filter {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .voices__filter button {
    min-height: 2.4rem;
    padding: 0 0.9rem;
  }
  .voices__picks {
    margin: 0 0 1.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    background: var(--paper);
    font-size: 0.9rem;
  }
  .voices__picks:empty {
    display: none;
  }
  .passage-test {
    margin: 0 0 2rem;
  }
  .passage-test h2 {
    margin: 0 0 0.5rem;
    font: 600 1.2rem/1.3 var(--serif);
  }
  .passage-test__text {
    margin: 0 0 0.75rem;
    color: var(--ink-soft);
    font: italic 0.95rem/1.5 var(--serif);
  }
  .sample {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.35rem 0.75rem;
    align-items: center;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--edge);
    border-radius: var(--radius-small);
    background: var(--paper);
    margin-bottom: 0.4rem;
  }
  .sample[hidden] {
    display: none;
  }
  .sample__name {
    font-weight: 600;
  }
  .sample__meta {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .sample audio {
    grid-column: 1 / -1;
    width: 100%;
  }
  .sample label {
    display: inline-flex;
    gap: 0.35rem;
    align-items: center;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .sample:has(input:checked) {
    border-color: var(--lapis);
    box-shadow: inset 0 0 0 1px var(--lapis);
  }
</style>

<main class="voices">
  <h1>Voices</h1>
  <p class="voices__intro">The same passages in each voice. Mark the one you like best for each passage; the marks are kept in this browser and listed at the top.</p>
  <div class="voices__filter" role="group" aria-label="Show">
    <button type="button" data-show="all" aria-pressed="true">All voices</button>
    <button type="button" data-show="male" aria-pressed="false">Men</button>
    <button type="button" data-show="female" aria-pressed="false">Women</button>
  </div>
  <div class="voices__picks" aria-live="polite"></div>
  <div class="voices__list"><p>Loading the samples…</p></div>
</main>

<script>
  const KEY = 'bible.voices.picks';
  /** @type {Record<string, string>} */
  let picks = {};
  try {
    picks = JSON.parse(localStorage.getItem(KEY) ?? '{}');
  } catch {
    picks = {};
  }
  const list = /** @type {HTMLElement} */ (document.querySelector('.voices__list'));
  const summary = /** @type {HTMLElement} */ (document.querySelector('.voices__picks'));

  /** @param {any} sample */
  const gender = (sample) => (/female|af_|bf_/i.test(`${sample.voice} ${sample.voiceLabel}`) ? 'female' : 'male');

  // The text of each passage, from the app's own search, for reading along.
  /** @param {string} passage such as "Psalm 23:1–4" */
  const textOf = async (passage) => {
    const response = await fetch(`/search?q=${encodeURIComponent(passage.replace('–', '-'))}&fragment=results`).catch(() => null);
    if (!response?.ok) return '';
    const holder = document.createElement('div');
    holder.innerHTML = await response.text();
    return [...holder.querySelectorAll('.result__text')].map((each) => each.textContent?.trim()).filter(Boolean).slice(0, 8).join(' ');
  };

  const paintPicks = () => {
    const chosen = Object.entries(picks);
    summary.textContent = chosen.length ? `Your picks: ${chosen.map(([passage, label]) => `${passage}: ${label}`).join(' · ')}` : '';
  };

  /** The samples: the people's recordings first, then the made voices. */
  const fetchSamples = async () => {
    const [made, human] = await Promise.all(
      ['/voices/samples.json', '/voices/librivox.json'].map((url) => fetch(url).then((response) => (response.ok ? response.json() : [])).catch(() => [])),
    );
    return [...human, ...made];
  };

  /** @param {any[]} all the samples, by passage and version */
  const byPassage = (all) => {
    /** @type {Map<string, any[]>} */
    const groups = new Map();
    for (const sample of all) {
      const key = `${sample.passage} (${sample.version})`;
      groups.set(key, [...(groups.get(key) ?? []), sample]);
    }
    return groups;
  };

  /**
   * A pick kept in this browser.
   *
   * @param {string} passage
   * @param {string} label
   */
  const pick = (passage, label) => {
    picks[passage] = label;
    try {
      localStorage.setItem(KEY, JSON.stringify(picks));
    } catch {
      // No storage: the pick lasts until the page closes.
    }
    paintPicks();
  };

  /** @param {any} sample what is known of it: its description, its length, and whisper's misheard words */
  const metaOf = (sample) =>
    [sample.description, sample.seconds ? `${sample.seconds} s` : '', typeof sample.wer === 'number' ? `${Math.round(sample.wer * 100)}% words misheard by whisper` : ''].filter(Boolean).join(' · ');

  /**
   * A sample's player, with its name, a radio to pick it, and what is
   * known of it. One plays at a time.
   *
   * @param {any} sample
   * @param {string} passage
   */
  const sampleRow = (sample, passage) => {
    const row = Object.assign(document.createElement('div'), { className: 'sample' });
    row.dataset.gender = gender(sample);
    const name = Object.assign(document.createElement('span'), { className: 'sample__name', textContent: sample.voiceLabel ?? `${sample.engine} ${sample.voice}` });
    const label = document.createElement('label');
    const radio = Object.assign(document.createElement('input'), { type: 'radio', name: passage, checked: picks[passage] === name.textContent });
    radio.addEventListener('change', () => pick(passage, name.textContent ?? ''));
    label.append(radio, 'Best');
    const audio = Object.assign(document.createElement('audio'), { controls: true, preload: 'none', src: sample.file });
    audio.addEventListener('play', () => {
      for (const other of document.querySelectorAll('audio')) if (other !== audio) other.pause();
    });
    row.append(name, label, audio, Object.assign(document.createElement('span'), { className: 'sample__meta', textContent: metaOf(sample) }));
    return row;
  };

  /**
   * A passage's samples, and its text to read along once it comes.
   *
   * @param {string} passage
   * @param {any[]} samples
   */
  const passageSection = (passage, samples) => {
    const section = Object.assign(document.createElement('section'), { className: 'passage-test' });
    const heading = Object.assign(document.createElement('h2'), { textContent: passage });
    section.append(heading, ...samples.map((sample) => sampleRow(sample, passage)));
    textOf(samples[0].passage).then((text) => {
      if (text) heading.after(Object.assign(document.createElement('p'), { className: 'passage-test__text', textContent: text }));
    });
    return section;
  };

  const load = async () => {
    const all = await fetchSamples();
    if (!all.length) {
      list.innerHTML = '<p>No samples yet.</p>';
      return;
    }
    list.replaceChildren(...[...byPassage(all)].map(([passage, samples]) => passageSection(passage, samples)));
    paintPicks();
  };

  for (const button of document.querySelectorAll('[data-show]')) {
    button.addEventListener('click', () => {
      const show = /** @type {HTMLElement} */ (button).dataset.show;
      for (const each of document.querySelectorAll('[data-show]')) each.setAttribute('aria-pressed', String(each === button));
      for (const row of /** @type {NodeListOf<HTMLElement>} */ (document.querySelectorAll('.sample'))) row.hidden = show !== 'all' && row.dataset.gender !== show;
    });
  }
  load();
</script>
