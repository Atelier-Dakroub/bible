<script server>
  import { timeline, world } from '../data/entities.js';
  import { ERAS, packLanes, positionOf, yearLabel } from '../lib/timeline.js';

  // The timeline strip's ticks and era marks, placed on the axis here so the
  // strip arrives drawn.
  export default async () => ({
    events: timeline.map((event) => ({
      id: event.id,
      title: event.title,
      label: `${event.approx ? 'about ' : ''}${yearLabel(event.start)}`,
      at: positionOf(event.start),
    })),
    eras: ERAS.map((era) => ({ name: era.name, label: yearLabel(era.from), at: positionOf(era.from) })),
    regions: packLanes(
      world.map((each) => ({
        id: `world:${each.id}`,
        name: each.name,
        label: `${yearLabel(each.start)} to ${yearLabel(each.end)}`,
        region: each.region,
        start: each.start,
        end: each.end,
      })),
    ),
  });
</script>

<title>Table</title>

<!-- The panel is 32 inches at 4K and one device pixel per CSS pixel, so text at
     the browser's 16px is about 3 mm tall. The table reads at arm's length. -->
<style>
  html {
    font-size: 24px;
  }
</style>

<main>
  <!-- The reader's settings (reading-settings, on /design), applied before the
       page paints. They reach the parts of the table that are in the reading
       room so far: the map card. The same script is in routes/design.html. -->
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem('bible.reading') || '{}');
      const keys = ['theme', 'paper', 'size', 'leading', 'red', 'numbers', 'initials', 'layout'];
      for (const key of keys) {
        const value = settings[key];
        if (typeof value === 'string' && /^[a-z0-9-]{1,20}$/.test(value)) document.documentElement.dataset[key] = value;
      }
    } catch {
      // No storage: the defaults hold.
    }
  </script>
  <h1 class="visually-hidden">Table</h1>
  <bible-table>
    <passage-search></passage-search>
    <table-menu></table-menu>
    <note-editor></note-editor>
    <time-line>
      <div class="timeline__axis">
        <div each="era of eras" class="timeline__era" style="--at: ${era.at}">
          <span>${era.name}</span>
          <span>${era.label}</span>
        </div>
        <button
          each="event of events"
          type="button"
          class="timeline__tick"
          data-entity="${event.id}"
          style="--at: ${event.at}"
          aria-label="${event.title}, ${event.label}"
          title="${event.title}, ${event.label}"
        ></button>
      </div>
      <div class="timeline__world" aria-label="World history">
        <div each="region of regions" class="world__region">
          <span class="world__name">${region.name}</span>
          <div each="lane of region.lanes" class="world__lane">
            <button
              each="span of lane"
              type="button"
              class="world__span"
              data-entity="${span.id}"
              style="--at: ${span.at}; --width: ${span.width}"
              title="${span.name}, ${span.label}"
            >${span.name}</button>
          </div>
        </div>
      </div>
    </time-line>
  </bible-table>
</main>
