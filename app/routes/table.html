<script server>
  import { timeline, world } from '../data/entities.js';
  import { ERAS, packLanes, positionOf, yearLabel } from '../lib/timeline.js';

  // The timeline strip's ticks and era marks, placed on the axis here so the
  // strip arrives drawn.
  export default async () => ({
    events: timeline.map((event) => ({
      id: event.id,
      title: event.title,
      label: `${event.approx ? 'about ' : ''}${yearLabel(event.start)}`,
      at: positionOf(event.start),
    })),
    eras: ERAS.map((era) => ({ name: era.name, label: yearLabel(era.from), at: positionOf(era.from) })),
    regions: packLanes(
      world.map((each) => ({
        id: `world:${each.id}`,
        name: each.name,
        label: `${yearLabel(each.start)} to ${yearLabel(each.end)}`,
        region: each.region,
        start: each.start,
        end: each.end,
      })),
    ),
  });
</script>

<title>Table</title>

<!-- The rem is set for the screen before the page paints (the script below):
     24px on the 32-inch 4K panel, read at arm's length, 18px on a laptop,
     16px on a phone. The text of the controls is two thirds of a rem. -->
<style>
  :root {
    --ui-text: calc(2rem / 3);
  }
  /* On a phone, held close, the controls' text is the rem itself: 16px,
     which is also the size below which a phone zooms in on a field. */
  @media (max-width: 700px), (max-height: 500px) {
    :root {
      --ui-text: 1rem;
    }
  }
</style>

<main>
  <!-- The reader's settings (reading-settings, on /design) and the size of
       the interface, applied before the page paints. The same script is in
       routes/design.html (a test keeps the two the same). -->
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem('bible.reading') || '{}');
      const keys = ['theme', 'paper', 'size', 'leading', 'red', 'numbers', 'initials', 'layout', 'ui'];
      for (const key of keys) {
        const value = settings[key];
        if (typeof value === 'string' && /^[a-z0-9-]{1,20}$/.test(value)) document.documentElement.dataset[key] = value;
      }
    } catch {
      // No storage: the defaults hold.
    }
    // The size of the interface: the rem, from the kind of screen, made
    // smaller or larger by the Interface setting (reading-settings, which
    // calls this again). A page knows a screen's size in CSS pixels only,
    // not in inches, so the kind is a guess: a phone is narrow; a screen
    // 2560 or more across at one device pixel to the CSS pixel is a large
    // touch panel or wall, read at arm's length (the 32-inch panel); the
    // rest are laptops, desktops and tablets.
    globalThis.applyInterfaceSize = () => {
      const short = Math.min(screen.width, screen.height);
      const long = Math.max(screen.width, screen.height);
      const base = short < 600 ? 16 : long >= 2560 ? 24 : 18;
      const scale = { s: 0.85, l: 1.2, xl: 1.5 }[document.documentElement.dataset.ui ?? ''] ?? 1;
      document.documentElement.style.fontSize = Math.round(base * scale) + 'px';
    };
    globalThis.applyInterfaceSize();
  </script>
  <h1 class="visually-hidden">Table</h1>
  <bible-table>
    <passage-search></passage-search>
    <table-menu></table-menu>
    <note-editor></note-editor>
    <time-line>
      <div class="timeline__axis">
        <div each="era of eras" class="timeline__era" style="--at: ${era.at}">
          <span>${era.name}</span>
          <span>${era.label}</span>
        </div>
        <button
          each="event of events"
          type="button"
          class="timeline__tick"
          data-entity="${event.id}"
          style="--at: ${event.at}"
          aria-label="${event.title}, ${event.label}"
          title="${event.title}, ${event.label}"
        ></button>
      </div>
      <div class="timeline__world" aria-label="World history">
        <div each="region of regions" class="world__region">
          <span class="world__name">${region.name}</span>
          <div each="lane of region.lanes" class="world__lane">
            <button
              each="span of lane"
              type="button"
              class="world__span ${span.outside ? 'is-outside' : ''}"
              data-entity="${span.id}"
              data-name="${span.name}"
              style="--at: ${span.at}; --width: ${span.width}"
              title="${span.name}, ${span.label}"
            >${span.outside ? '' : span.name}</button>
          </div>
        </div>
      </div>
    </time-line>
  </bible-table>
</main>
